<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino a la Rosada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Fundá tu partido, ganá la elección y gobernás la Argentina mes a mes.">
<meta name="theme-color" content="#bfe0f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Camino a la Rosada — un solo look, a propósito: figuritas pegadas sobre el cielo celeste.
   Tarjetas blancas con borde azul marino y sombra sólida; el dorado del Sol de Mayo marca lo importante. */
:root {
  --cielo: #bfe0f7;
  --cielo-claro: #e4f2fc;
  --celeste: #6cb4ea;
  --tinta: #13284a;
  --tinta-suave: #4b5f80;
  --papel: #ffffff;
  --papel-2: #f2f7fc;
  --sol: #f6b40e;
  --sol-claro: #ffe08a;
  --sol-osc: #a87800;
  --bien: #1c9a50;
  --bien-claro: #d5f5e1;
  --mal: #d5383a;
  --mal-claro: #fde0df;
  --meh: #8796ad;
  --noche: #0f1d38;
  --f-titulo: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-texto: 'Nunito', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --borde: 3px solid var(--tinta);
  --sombra: 0 4px 0 var(--tinta);
  --sombra-chica: 0 3px 0 var(--tinta);
  --radio: 18px;
  --radio-chico: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--f-texto);
  font-weight: 700;
  font-size: 16px;
  line-height: 1.35;
  color: var(--tinta);
  background: var(--cielo);
  background-image:
    radial-gradient(circle at 50% -8%, rgba(255, 224, 138, 0.9) 0, rgba(255, 224, 138, 0) 32%),
    repeating-conic-gradient(from 0deg at 50% -8%, rgba(255, 255, 255, 0.22) 0deg 6deg, rgba(255, 255, 255, 0) 6deg 18deg),
    linear-gradient(180deg, var(--cielo-claro) 0%, var(--cielo) 55%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--cielo-claro);
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
p { margin: 0; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 150px;
}
.app.ancha { max-width: 1120px; }

/* ── Piezas básicas ── */
.tarjeta {
  background: var(--papel);
  border: var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 14px;
}
.tarjeta.plana { box-shadow: none; }
.tarjeta.suave { background: var(--papel-2); }
.pila { display: flex; flex-direction: column; gap: 12px; }
.fila { display: flex; align-items: center; gap: 10px; }
.fila.envolver { flex-wrap: wrap; }
.fila.entre { justify-content: space-between; }
.centro { text-align: center; }
.chico { font-size: 13px; }
.suave { color: var(--tinta-suave); }
.titulo-seccion { font-family: var(--f-titulo); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.etiqueta { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-suave); font-weight: 900; }
.numero { font-variant-numeric: tabular-nums; }

.boton {
  appearance: none;
  border: var(--borde);
  border-radius: 14px;
  background: var(--sol);
  box-shadow: var(--sombra);
  padding: 12px 18px;
  min-height: 48px;
  font-family: var(--f-titulo);
  font-size: 19px;
  letter-spacing: 0.02em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s;
  user-select: none;
  text-align: center;
}
.boton:hover { filter: brightness(1.04); }
.boton:active, .boton.apretado { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.boton:focus-visible, .toque:focus-visible { outline: 3px solid var(--celeste); outline-offset: 3px; }
.boton.sec { background: var(--papel); }
.boton.celeste { background: var(--celeste); }
.boton.verde { background: #5bd38c; }
.boton.rojo { background: #ff8a80; }
.boton.grande { font-size: 22px; padding: 14px 22px; min-height: 58px; }
.boton.ancho { width: 100%; }
.boton.mini { font-size: 15px; min-height: 38px; padding: 6px 12px; border-radius: 11px; box-shadow: var(--sombra-chica); }
.boton[disabled] { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.6); }
.boton[disabled]:active { transform: none; box-shadow: var(--sombra); }

.toque { cursor: pointer; transition: transform 0.08s ease; }
.toque:active { transform: scale(0.97); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 2px solid var(--tinta);
  background: var(--papel);
  font-size: 14px;
  font-weight: 900;
  white-space: nowrap;
}
.chip.sol { background: var(--sol-claro); }
.chip.bien { background: var(--bien-claro); color: #0d5c2f; }
.chip.mal { background: var(--mal-claro); color: #8b1517; }
.chip.oscuro { background: var(--tinta); color: var(--papel); }

/* Efectos: icono + flechitas (sin números) */
.efectos { display: flex; flex-wrap: wrap; gap: 6px; }
.ef {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px 2px 6px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 900;
  border: 2px solid currentColor;
  background: var(--papel);
  white-space: nowrap;
}
.ef .fl { letter-spacing: -2px; font-size: 12px; }
.ef.bien { color: var(--bien); background: var(--bien-claro); }
.ef.mal { color: var(--mal); background: var(--mal-claro); }
.ef .em { filter: saturate(1.1); }
.ef .nom { color: var(--tinta); font-weight: 800; font-size: 13px; }

/* Barras */
.barra { height: 14px; border: 2px solid var(--tinta); border-radius: 999px; background: var(--papel-2); overflow: hidden; position: relative; }
.barra > i { display: block; height: 100%; background: var(--celeste); border-radius: 999px; transition: width 0.7s cubic-bezier(.2,.9,.2,1); }
.barra.gorda { height: 22px; }

/* ── Barra superior ── */
.barra-sup {
  flex-wrap: nowrap;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin: 0 -4px 12px;
  background: var(--papel);
  border: var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.barra-sup .quien { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.barra-sup .quien b { font-family: var(--f-titulo); font-weight: 400; font-size: 18px; display: block; white-space: nowrap; }
.barra-sup .quien small { display: block; color: var(--tinta-suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recurso { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; padding: 4px 8px; white-space: nowrap; border-radius: 12px; background: var(--papel-2); border: 2px solid var(--tinta); font-size: 15px; }
.recurso.pulso { animation: pulso 0.6s ease; }
.agenda-puntos { display: inline-flex; gap: 3px; }
.agenda-puntos i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--tinta); background: var(--sol); }
.agenda-puntos i.usado { background: var(--papel-2); }

.escudo {
  width: 40px; height: 40px; flex: none;
  border-radius: 50%;
  border: var(--borde);
  display: grid; place-items: center;
  font-size: 20px;
  box-shadow: var(--sombra-chica);
  position: relative;
}
.escudo.grande { width: 92px; height: 92px; font-size: 44px; border-width: 4px; }
.escudo .sig {
  position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
  background: var(--tinta); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 8px; white-space: nowrap;
}
.escudo.grande .sig { font-size: 15px; bottom: -14px; padding: 2px 10px; }

.avatar { display: block; border-radius: 50%; border: var(--borde); background: var(--papel-2); flex: none; overflow: hidden; }

/* ── Navegación inferior ── */
.nav-inf {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 25;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(191, 224, 247, 0) 0%, var(--cielo) 30%);
  pointer-events: none;
}
.nav-inf > .dentro { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.nav-inf .boton.grande { min-height: 50px; padding: 8px 16px; font-size: 20px; }
.app.ancha ~ .nav-inf > .dentro, .nav-inf.ancha > .dentro { max-width: 1120px; }
.pestanas { display: flex; gap: 4px; background: var(--papel); border: var(--borde); border-radius: 16px; padding: 4px; box-shadow: var(--sombra); }
.pestanas button {
  flex: 1; border: 0; background: transparent; border-radius: 11px; padding: 6px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; font-weight: 900; color: var(--tinta-suave);
}
.pestanas button .ic { font-size: 19px; line-height: 1.1; }
.pestanas button.activa { background: var(--sol-claro); color: var(--tinta); box-shadow: inset 0 0 0 2px var(--tinta); }

/* ── Capa (ventanas encima) ── */
.capa {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(15, 29, 56, 0.55);
  display: flex; align-items: flex-end; justify-content: center;
  padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
  animation: aparecer 0.18s ease;
}
.capa.oscura { background: var(--noche); display: block; overflow-y: auto; overscroll-behavior: contain; }
.hoja {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--papel);
  border: var(--borde); border-bottom: 0;
  border-radius: 24px 24px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: subir 0.28s cubic-bezier(.2,.9,.3,1.2);
  overscroll-behavior: contain;
}
.hoja .cerrar { position: sticky; top: 0; float: right; z-index: 2; }
@media (min-width: 700px) {
  .capa { align-items: center; padding: 20px; }
  .hoja { border-bottom: var(--borde); border-radius: 24px; box-shadow: 0 8px 0 var(--tinta); max-height: 88vh; }
}

/* ── Avisos (resultado de acciones) ── */
.avisos {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  top: calc(10px + env(safe-area-inset-top, 0px));
  width: min(520px, calc(100% - 24px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.aviso {
  pointer-events: auto;
  background: var(--papel); border: var(--borde); border-radius: 16px; box-shadow: var(--sombra);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
  animation: caer 0.35s cubic-bezier(.2,.9,.3,1.3);
}
.aviso.bien { background: #effbf3; }
.aviso.mal { background: #fff1f0; }
.aviso.especial { background: var(--sol-claro); }
.aviso .txt { font-weight: 900; font-size: 16px; }
.aviso.saliendo { animation: irse 0.3s ease forwards; }

/* ── Portada ── */
.portada { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 18px; text-align: center; }
.sol-mayo { width: 132px; height: 132px; animation: girar 40s linear infinite; filter: drop-shadow(0 4px 0 var(--tinta)); }
.logo {
  font-family: var(--f-titulo); font-size: clamp(40px, 11vw, 64px); line-height: 0.95; color: var(--papel);
  -webkit-text-stroke: 3px var(--tinta); paint-order: stroke fill; text-shadow: 0 5px 0 var(--tinta);
}
.logo span { color: var(--sol); display: block; }
.lema { font-size: 18px; max-width: 30ch; }
.portada .botones { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); }
.pasos-portada { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 460px; }
.pasos-portada .tarjeta { padding: 10px 6px; font-size: 13px; }
.pasos-portada .tarjeta div { font-size: 28px; }

/* ── Crear partido ── */
.progreso-pasos { display: flex; gap: 6px; justify-content: center; }
.progreso-pasos i { width: 34px; height: 8px; border-radius: 4px; background: var(--papel); border: 2px solid var(--tinta); }
.progreso-pasos i.hecho { background: var(--sol); }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo input[type=text] {
  font: inherit; font-weight: 800; font-size: 18px; padding: 12px 14px; border: var(--borde); border-radius: 14px; background: var(--papel); color: var(--tinta); width: 100%; min-width: 0;
}
.campo input[type=text]:focus { outline: 3px solid var(--celeste); outline-offset: 1px; }
.grilla-opciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.opcion-redonda {
  aspect-ratio: 1; border: var(--borde); border-radius: 14px; background: var(--papel); cursor: pointer; font-size: 24px;
  display: grid; place-items: center; box-shadow: var(--sombra-chica); padding: 0; max-width: 100%;
}
.opcion-redonda.elegida { outline: 4px solid var(--sol); outline-offset: 2px; transform: translateY(-2px); }
.deslizador { display: flex; flex-direction: column; gap: 6px; }
.deslizador .extremos { display: flex; justify-content: space-between; font-size: 14px; font-weight: 900; }
.deslizador input[type=range] { width: 100%; accent-color: var(--sol-osc); height: 32px; }
.caritas { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
.carita { text-align: center; font-size: 12px; font-weight: 900; padding: 6px 2px; border-radius: 12px; background: var(--papel-2); border: 2px solid var(--tinta); }
.carita .cara { font-size: 26px; display: block; transition: transform 0.3s; }
.dificultades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dificultades .opcion { padding: 10px 4px; text-align: center; border: var(--borde); border-radius: 14px; background: var(--papel); cursor: pointer; box-shadow: var(--sombra-chica); }
.dificultades .opcion.elegida { background: var(--sol-claro); outline: 3px solid var(--sol); }
.dificultades .opcion div { font-size: 28px; }
.editor-avatar { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; }
.editor-avatar .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* ── Campaña ── */
.encuesta { display: flex; flex-direction: column; gap: 8px; }
.encuesta .linea { display: grid; grid-template-columns: 34px minmax(0, 1fr) 60px; gap: 8px; align-items: center; }
.encuesta .linea .nombre { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.encuesta .linea .pct { font-family: var(--f-titulo); font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.encuesta .linea.yo .nombre { color: var(--tinta); }
.encuesta .linea.yo { background: var(--sol-claro); border-radius: 12px; padding: 4px; margin: -4px; }
.mini-escudo { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--tinta); display: grid; place-items: center; font-size: 15px; }

.cuenta-regresiva { display: flex; align-items: center; gap: 12px; }
.cuenta-regresiva .num { font-family: var(--f-titulo); font-size: 40px; line-height: 1; min-width: 44px; text-align: center; }

.mis-numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mi-numero { text-align: center; padding: 8px 4px; border-radius: 14px; background: var(--papel-2); border: 2px solid var(--tinta); }
.mi-numero .em { font-size: 24px; }
.mi-numero .val { font-family: var(--f-titulo); font-size: 22px; }
.mi-numero .nom { font-size: 12px; font-weight: 900; color: var(--tinta-suave); }

.acciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.accion {
  text-align: left; border: var(--borde); border-radius: 16px; background: var(--papel); box-shadow: var(--sombra);
  padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative;
}
.accion:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.accion .cab { display: flex; align-items: center; gap: 8px; }
.accion .ic { font-size: 28px; line-height: 1; }
.accion .nom { font-family: var(--f-titulo); font-size: 17px; line-height: 1.05; }
.accion .desc { font-size: 13px; color: var(--tinta-suave); }
.accion[disabled] { opacity: 0.5; cursor: not-allowed; }
.accion[disabled]:active { transform: none; box-shadow: var(--sombra); }
.accion .bloq { font-size: 12px; color: var(--mal); font-weight: 900; }

.lista-elegir { display: flex; flex-direction: column; gap: 8px; }
.item-elegir {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  border: var(--borde); border-radius: 14px; background: var(--papel); padding: 8px 10px; cursor: pointer; box-shadow: var(--sombra-chica);
}
.item-elegir:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
.item-elegir .ic { font-size: 28px; text-align: center; }
.item-elegir[disabled] { opacity: 0.45; cursor: not-allowed; }

/* ── Mapa ── */
.mapa { width: 100%; max-width: 420px; display: block; margin: 0 auto; }
.mapa .hex { stroke: var(--tinta); stroke-width: 2.5; cursor: pointer; transition: fill 0.4s; }
.mapa .hex:hover { stroke-width: 3.5; }
.mapa .hex.sel { stroke: var(--sol-osc); stroke-width: 5; }
.mapa text { font-family: var(--f-texto); font-weight: 900; pointer-events: none; fill: var(--tinta); }
.mapa .nom { font-size: 10.5px; }
.mapa .val { font-size: 10px; }
.mapa .mar { fill: none; stroke: rgba(19, 40, 74, 0.25); stroke-dasharray: 3 4; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: 13px; }

/* ── Noticia ── */
.diario-hoja { background: #fffdf6; }
.diario-cab { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double var(--tinta); padding-bottom: 6px; margin-bottom: 12px; }
.diario-cab .marca { font-family: var(--f-titulo); font-size: 22px; letter-spacing: 0.04em; }
.dibujo-noticia { font-size: 54px; text-align: center; letter-spacing: 6px; padding: 10px 0 6px; animation: rebote 0.6s ease; }
.titular { font-family: var(--f-titulo); font-size: 27px; line-height: 1.08; text-align: center; }
.bajada { text-align: center; color: var(--tinta-suave); margin-top: 6px; }
.opciones-noticia { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.opcion-noticia {
  border: var(--borde); border-radius: 16px; background: var(--papel); box-shadow: var(--sombra); padding: 10px 12px;
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px;
}
.opcion-noticia:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.opcion-noticia .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.opcion-noticia .txt { font-family: var(--f-titulo); font-size: 19px; }
.opcion-noticia[disabled] { opacity: 0.5; cursor: not-allowed; }
.opcion-noticia .tecla { font-size: 11px; color: var(--tinta-suave); border: 2px solid var(--meh); border-radius: 6px; padding: 0 5px; }
.resultado-grande { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 8px 0; }
.resultado-grande > .em { font-size: 54px; animation: rebote 0.6s ease; }
.resultado-grande .txt { font-family: var(--f-titulo); font-size: 24px; }

/* ── Noche de elecciones ── */
.noche { width: 100%; max-width: 860px; margin: 0 auto; color: #fff; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.noche-cuerpo { display: grid; gap: 14px; align-items: center; }

<script>
// ── js/nucleo/util.js ──
// Utilidades comunes: azar con semilla (guardado en el estado), formato y fechas.
// Todos los archivos del juego cuelgan del objeto global R (funciona en navegador y en Node).
(function (R) {
  'use strict';

  R.VERSION = 1;

  R.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  R.lerp = (a, b, t) => a + (b - a) * t;
  R.round = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
  R.sum = (arr) => arr.reduce((a, b) => a + b, 0);

  // Azar Mulberry32: el estado de la semilla vive en s.rng, así guardar/cargar es reproducible.
  R.rand = function (s) {
    let t = (s.rng = (s.rng + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  R.randRange = (s, a, b) => a + R.rand(s) * (b - a);
  R.randInt = (s, a, b) => a + Math.floor(R.rand(s) * (b - a + 1));
  R.chance = (s, p) => R.rand(s) < p;
  R.pick = (s, arr) => arr[Math.floor(R.rand(s) * arr.length)];
  // Ruido aproximadamente normal (media 0, desvío ~1).
  R.gauss = (s) => (R.rand(s) + R.rand(s) + R.rand(s) + R.rand(s) - 2) * 1.73;
  R.weighted = function (s, items, wfn) {
    const ws = items.map(wfn);
    const total = R.sum(ws);
    if (total <= 0) return null;
    let r = R.rand(s) * total;
    for (let i = 0; i < items.length; i++) {
      r -= ws[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  };
  R.shuffle = function (s, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(R.rand(s) * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // Fechas: el mes 0 es enero de 2027.
  R.MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  R.MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  R.mesDelAnio = (mes) => ((mes % 12) + 12) % 12;
  R.anio = (mes) => 2027 + Math.floor(mes / 12);
  R.fechaTxt = (mes) => R.cap(R.MESES[R.mesDelAnio(mes)]) + ' ' + R.anio(mes);
  R.fechaCorta = (mes) => R.MESES_CORTOS[R.mesDelAnio(mes)] + ' ' + String(R.anio(mes)).slice(2);
  R.mesNum = (anio, mesDelAnio) => (anio - 2027) * 12 + mesDelAnio;

  R.cap = (t) => (t ? t[0].toUpperCase() + t.slice(1) : t);

  // Números con coma decimal, a la argentina.
  R.fmt = function (x, dec = 0) {
    if (!isFinite(x)) return '–';
    const s = Math.abs(x).toFixed(dec).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (x < 0 ? '−' : '') + s.join(',');
  };
  R.pct = (x, dec = 1) => R.fmt(x, dec) + ' %';
  R.signo = (x, dec = 1) => (x > 0 ? '+' : x < 0 ? '−' : '') + R.fmt(Math.abs(x), dec);
})(globalThis.R = globalThis.R || {});

</script>

// hex = [columna, fila] en el mapa de fichas (las filas impares se corren media ficha a la derecha).
(function (R) {
  'use strict';

  R.PROVINCIAS = [

// Estado de la partida: creación, guardado y carga.
(function (R) {
  'use strict';

  const CLAVE = 'rosada_partida_v1';

  R.DIFICULTADES = {
    facil: { nombre: 'Fácil', emoji: '😊', fondos: 140, agenda: 4, rival: 0.9, mult: 1.15 },
    normal: { nombre: 'Normal', emoji: '😐', fondos: 100, agenda: 3, rival: 1, mult: 1 },
    dificil: { nombre: 'Difícil', emoji: '😈', fondos: 70, agenda: 3, rival: 1.1, mult: 0.88 },
  };

  // cfg: { partido: {nombre, sigla, color, simbolo, ideo, estilo}, lider: {nombre, avatar}, dificultad, semilla? }
  R.nuevaPartida = function (cfg) {
    const dif = R.DIFICULTADES[cfg.dificultad] ? cfg.dificultad : 'normal';
    const D = R.DIFICULTADES[dif];
    const semilla = (cfg.semilla ?? Math.floor(Math.random() * 2 ** 31)) | 0;
    const s = {
      v: R.VERSION,
      semilla,
      rng: semilla,
      fase: 'campana',
      mes: 0,
      dif,
      partido: {
        nombre: cfg.partido.nombre,
        sigla: cfg.partido.sigla,
        color: cfg.partido.color,
        simbolo: cfg.partido.simbolo,
        ideo: R.clamp(cfg.partido.ideo ?? 0, -1, 1),
        estilo: R.clamp(cfg.partido.estilo ?? 0, -1, 1),
      },
      lider: { nombre: cfg.lider.nombre, avatar: cfg.lider.avatar },
      camp: {
        fondos: D.fondos,
        agenda: D.agenda,
        agendaMax: D.agenda,
        conocen: 6,
        simpatia: 52,
        militancia: 8,
        presencia: {},
        visitas: {},
        figuras: [],
        alianza: null,
        sucio: 0,
        usadasMes: {},
        bonusVotos: 0,
      },
      rivales: Object.fromEntries(R.RIVALES.map((id) => [id, 0])),
      encuestas: [],
      elecciones: {},
      congreso: null,
      diario: [],
      cola: [], // momentos pendientes de mostrar (noticias por decidir, resultados…)
      vistos: {},
      flags: {},
      stats: { acciones: 0, noticias: 0 },
    };
    R.PROVINCIAS.forEach((p) => {
      s.camp.presencia[p.id] = 0;
      s.camp.visitas[p.id] = 0;
    });
    s.congreso = R.congresoInicial();
    s.encuestas.push(R.camp.encuesta(s));
    R.diario(s, '🎉', 'Nace ' + s.partido.nombre);
    return s;
  };

  R.diario = function (s, emoji, txt, tipo) {
    s.diario.unshift({ mes: s.mes, emoji, txt, tipo: tipo || 'info' });
    if (s.diario.length > 120) s.diario.length = 120;
  };

  // ── Guardado (el navegador puede no tener localStorage: todo con try/catch) ──
  R.guardar = function (s) {
    try {
      globalThis.localStorage && globalThis.localStorage.setItem(CLAVE, JSON.stringify(s));
      return true;
    } catch (e) {
      return false;
    }
  };
  R.cargar = function () {
    try {
      const txt = globalThis.localStorage && globalThis.localStorage.getItem(CLAVE);
      if (!txt) return null;
      const s = JSON.parse(txt);
      if (!s || s.v !== R.VERSION) return null;
      return s;
    } catch (e) {
      return null;
    }
  };
  R.borrarPartida = function () {
    try {
      globalThis.localStorage && globalThis.localStorage.removeItem(CLAVE);
    } catch (e) {
      /* nada */
    }
  };

  // Preferencias (sonido, tutorial visto…) aparte de la partida.
  R.pref = function (clave, valor) {
    const K = 'rosada_pref_' + clave;
    try {
      if (valor === undefined) {
        const v = globalThis.localStorage && globalThis.localStorage.getItem(K);
        return v === null || v === undefined ? undefined : JSON.parse(v);
      }
      globalThis.localStorage && globalThis.localStorage.setItem(K, JSON.stringify(valor));
    } catch (e) {
      return undefined;
    }
    return valor;
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/motor/efectos.js ──
// Efectos: cómo se aplican y cómo se muestran (icono + flechas, sin números raros).
// Un objeto de efectos es plano: { conocen: +5, simpatia: -2, fondos: 20, presencia: { BUE: 10 }, rival: { MNP: -2 } }.
(function (R) {
  'use strict';

  // paso = cuánto vale una flecha. inverso = subir es malo para vos.
  R.EF_META = {
    conocen: { emoji: '👁️', nombre: 'Te conocen', paso: 3 },
    simpatia: { emoji: '❤️', nombre: 'Les caés bien', paso: 2 },
    militancia: { emoji: '🏴', nombre: 'Militancia', paso: 4 },
    fondos: { emoji: '💰', nombre: 'Fondos', paso: 15, numero: true },
    sucio: { emoji: '⚠️', nombre: 'Riesgo de escándalo', paso: 1, inverso: true },
    agenda: { emoji: '⏱️', nombre: 'Agenda', paso: 1, numero: true },
    presencia: { emoji: '📍', nombre: 'Apoyo local', paso: 8 },
    rival: { emoji: '🗡️', nombre: 'Rival', paso: 1.5, inverso: true },
    votos: { emoji: '🗳️', nombre: 'Votos', paso: 1.5 },
    aprobRival: { emoji: '🏛️', nombre: 'Gobierno rival', paso: 3, inverso: true },
  };

  function flechas(meta, v) {
    return Math.min(3, Math.max(1, Math.ceil(Math.abs(v) / meta.paso - 0.15)));
  }

  // Convierte efectos que dependen de la ideología del jugador en simpatía concreta.
  // ideoDer: n → +n si sos de derecha, −n si sos de izquierda (proporcional a cuánto).
  function simpatiaIdeologica(s, ef) {
    let d = 0;
    if (ef.ideoDer) d += ef.ideoDer * s.partido.ideo;
    if (ef.ideoIzq) d += ef.ideoIzq * -s.partido.ideo;
    if (ef.confrontativo) d += ef.confrontativo * s.partido.estilo;
    if (ef.dialoguista) d += ef.dialoguista * -s.partido.estilo;
    return d;
  }

  // Expande un efecto a sus deltas concretos (sin aplicarlos). Devuelve una lista [{k, v, sub}].
  R.expandirEfectos = function (s, ef) {
    const out = [];
    if (!ef) return out;
    let simp = (ef.simpatia || 0) + simpatiaIdeologica(s, ef);
    // Rendimientos decrecientes: cuanto más alto estás, más cuesta seguir subiendo.
    if (simp > 0 && s.camp) simp *= R.clamp(1 - (s.camp.simpatia - 50) / 40, 0.2, 1);
    for (const k of ['conocen', 'militancia', 'fondos', 'sucio', 'agenda']) {
      if (!ef[k]) continue;
      let v = ef[k];
      if (k === 'conocen' && v > 0 && s.camp) v *= R.clamp(1 - (s.camp.conocen - 40) / 80, 0.3, 1);
      out.push({ k, v: R.round(v, 2) });
    }
    if (Math.abs(simp) >= 0.05) out.push({ k: 'simpatia', v: R.round(simp, 2) });
    if (ef.presencia) {
      for (const [where, v] of Object.entries(ef.presencia)) {
        out.push({ k: 'presencia', v, sub: where });
      }
    }
    if (ef.rival) {
      for (const [id, v] of Object.entries(ef.rival)) out.push({ k: 'rival', v, sub: id });
    }
    if (ef.votos) out.push({ k: 'votos', v: ef.votos });
    if (ef.aprobRival && s.gobRival) out.push({ k: 'aprobRival', v: ef.aprobRival });
    return out;
  };

  function provinciasDe(where) {
    if (where === 'todas') return R.PROVINCIAS.map((p) => p.id);
    if (R.REGIONES[where]) return R.PROVINCIAS.filter((p) => p.region === where).map((p) => p.id);
    if (R.PROV[where]) return [where];
    return [];
  }

  R.aplicarEfectos = function (s, ef) {
    const lista = R.expandirEfectos(s, ef);
    const c = s.camp;
    for (const { k, v, sub } of lista) {
      switch (k) {
        case 'conocen': c.conocen = R.clamp(c.conocen + v, 0, 100); break;
        case 'simpatia': c.simpatia = R.clamp(c.simpatia + v, 0, 100); break;
        case 'militancia': c.militancia = R.clamp(c.militancia + v, 0, 100); break;
        case 'fondos': c.fondos = Math.max(0, c.fondos + v); break;
        case 'sucio': c.sucio = Math.max(0, c.sucio + v); break;
        case 'agenda': c.agenda = Math.max(0, c.agenda + v); break;
        case 'presencia':
          provinciasDe(sub).forEach((id) => { c.presencia[id] = R.clamp(c.presencia[id] + v, 0, 100); });
          break;
        case 'rival': if (s.rivales[sub] !== undefined) s.rivales[sub] += v; break;
        case 'votos': c.bonusVotos += v; break;
        case 'aprobRival': if (s.gobRival) s.gobRival.aprob = R.clamp(s.gobRival.aprob + v, 10, 85); break;
      }
    }
    return lista;
  };

  // Para dibujar: [{emoji, nombre, flechas, sube, bueno, sub}]
  R.describirEfectos = function (s, ef) {
    return R.expandirEfectos(s, ef).map(({ k, v, sub }) => {
      const meta = R.EF_META[k] || { emoji: '•', nombre: k, paso: 1 };
      let nombre = meta.nombre;
      let emoji = meta.emoji;
      if (k === 'presencia') nombre = (R.PROV[sub] ? R.PROV[sub].corto : R.REGIONES[sub] ? R.REGIONES[sub].nombre : 'Todo el país');
      if (k === 'rival') {
        const p = R.PARTIDOS[sub];
        nombre = p ? p.sigla : sub;
        emoji = p ? p.simbolo : emoji;
      }
      const sube = v > 0;
      const bueno = meta.inverso ? !sube : sube;
      return { k, emoji, nombre, v, sube, bueno, flechas: flechas(meta, v), numero: meta.numero, sub };
    });
  };

  // Describe una lista ya aplicada [{k, v, sub}] (sin volver a escalar los valores).
  R.describirAplicado = function (s, lista) {
    if (s.fase === 'gobierno' && R.gob && R.gob.describirAplicado) return R.gob.describirAplicado(s, lista);
    return lista.map(({ k, v, sub }) => {
      const out = R.describirEfectos({ partido: s.partido, camp: null }, sub ? { [k]: { [sub]: v } } : { [k]: v });
      return out[0];
    }).filter(Boolean);
  };

  // Suma dos objetos de efectos (para combinar costo + resultado).
  R.sumarEfectos = function (a, b) {
    const out = JSON.parse(JSON.stringify(a || {}));
    for (const [k, v] of Object.entries(b || {})) {
      if (v && typeof v === 'object') {
        out[k] = out[k] || {};
        for (const [k2, v2] of Object.entries(v)) out[k][k2] = (out[k][k2] || 0) + v2;
      } else out[k] = (out[k] || 0) + v;

    return out;

<script>
// ── js/motor/campana.js ──
// Campaña: acciones del mes, paso del tiempo y cálculo de la intención de voto por provincia.
(function (R) {
  'use strict';

  const camp = (R.camp = {});

  // Afinidad entre tus ideas y la provincia: 0,6 (nada que ver) … 1,35 (calcado).
  camp.afinidad = (s, prov) => R.clamp(1 + 0.6 * (0.55 - Math.abs(prov.lean - s.partido.ideo)), 0.6, 1.35);
  const cercania = (a, b) => 1 - Math.abs(a - b) / 2; // 0 … 1

  // ── Acciones ──
  // Cada acción: costo (fondos), elegir (qué hay que elegir antes), max por mes, preview y hacer.
  camp.ACCIONES = [
    {
      id: 'acto', emoji: '🎤', nombre: 'Acto', desc: 'Subís fuerte en una provincia', costo: 10, elegir: 'provincia',
      calc(s, provId) {
        const p = R.PROV[provId];
        const vis = s.camp.visitas[provId] || 0;
        const af = camp.afinidad(s, p);
        const rinde = Math.pow(0.62, vis);
        return {
          presencia: { [provId]: Math.round(30 * af * rinde) },
          conocen: R.round((0.5 + p.padron * 0.07) * rinde + 0.3, 1),
          simpatia: R.round(0.6 * af * rinde, 1),
          militancia: 1,
        };
      },
      hacer(s, provId) {
        const ef = this.calc(s, provId);
        s.camp.visitas[provId] = (s.camp.visitas[provId] || 0) + 1;
        const lleno = R.chance(s, 0.15);
        if (lleno) ef.presencia[provId] += 8;
        return { ef, txt: lleno ? '¡Plaza llena en ' + R.PROV[provId].corto + '! 🙌' : 'Acto en ' + R.PROV[provId].corto, bueno: true };
      },
    },
    {
      id: 'tv', emoji: '📺', nombre: 'Publicidad en TV', desc: 'Que te conozca todo el país', costo: 25, max: 1,
      calc(s) {
        return { conocen: R.round(10 * (1 - s.camp.conocen / 115), 1), simpatia: 0.5 };
      },
      hacer(s) {
        return { ef: this.calc(s), txt: 'Tu spot sale en todos los canales', bueno: true };
      },
    },
    {
      id: 'redes', emoji: '📱', nombre: 'Redes', desc: 'Barato, a veces explota', costo: 5, max: 2, azar: true,
      calc(s) {
        return { conocen: R.round(4 * (1 - s.camp.conocen / 125), 1) };
      },
      hacer(s) {
        const ef = this.calc(s);
        const r = R.rand(s);
        const pBien = 0.14 + 0.05 * s.partido.estilo;
        const pMal = 0.1 + 0.05 * s.partido.estilo;
        if (r < pBien) {
          ef.conocen += 8;
          ef.simpatia = 2;
          return { ef, txt: '¡Se hizo viral! 🔥', bueno: true, especial: true };
        }
        if (r > 1 - pMal) {
          ef.simpatia = -3;
          return { ef, txt: 'Un posteo tuyo cae mal 😬', bueno: false };
        }
        return { ef, txt: 'Buen alcance en redes', bueno: true };
      },
    },
    {
      id: 'entrevista', emoji: '🎙️', nombre: 'Entrevista', desc: 'Gratis, pero arriesgada', costo: 0, max: 1, azar: true,
      calc() {
        return { conocen: 1.5, simpatia: 1.5 };
      },
      hacer(s) {
        const r = R.rand(s);
        const pMal = 0.2 + 0.1 * s.partido.estilo;
        const pBien = 0.35 - 0.05 * s.partido.estilo;
        if (r < pMal) return { ef: { conocen: 2, simpatia: -3 }, txt: 'Te comieron en la entrevista 😓', bueno: false };
        if (r > 1 - pBien) return { ef: { conocen: 2.5, simpatia: 4 }, txt: '¡La rompiste en la entrevista! 👏', bueno: true, especial: true };
        return { ef: this.calc(s), txt: 'Entrevista correcta', bueno: true };
      },
    },
    {
      id: 'estructura', emoji: '🏴', nombre: 'Militancia', desc: 'Fiscales y sedes', costo: 15,
      calc(s) {
        return { militancia: R.round(12 * (1 - s.camp.militancia / 120) + 1, 1) };
      },
      hacer(s) {
        return { ef: this.calc(s), txt: 'Abrís sedes y sumás fiscales', bueno: true };
      },
    },
    {
      id: 'plata', emoji: '💵', nombre: 'Juntar plata', desc: 'Rifas o empresarios', costo: 0, elegir: 'plata',
      opciones: [
        { id: 'rifa', emoji: '🎟️', nombre: 'Rifas y aportes chicos', ef: { fondos: 18 } },
        { id: 'empresas', emoji: '💼', nombre: 'Cena con empresarios', ef: { fondos: 45, sucio: 1, ideoIzq: 1.5 }, riesgo: true },
      ],
      calc(s, op) {
        const o = this.opciones.find((x) => x.id === op) || this.opciones[0];
        return o.ef;
      },
      hacer(s, op) {
        const o = this.opciones.find((x) => x.id === op) || this.opciones[0];
        if (o.id === 'empresas') s.flags.plataEmpresas = s.mes;
        return { ef: JSON.parse(JSON.stringify(o.ef)), txt: o.id === 'rifa' ? 'La militancia junta plata' : 'Los empresarios ponen la plata 💼', bueno: true };
      },
    },
    {
      id: 'figura', emoji: '⭐', nombre: 'Sumar una figura', desc: 'Un famoso te banca', costo: 0, elegir: 'figura',
      costoDe: (s, id) => (R.FIGURAS.find((f) => f.id === id) || { costo: 0 }).costo,
      calc(s, id) {
        const f = R.FIGURAS.find((x) => x.id === id);
        if (!f) return {};
        const ajuste = 1 - 0.55 * Math.abs(f.ideo - s.partido.ideo);
        const ef = { conocen: f.conocen, simpatia: R.round(f.simpatia * ajuste, 1) };
        if (f.militancia) ef.militancia = f.militancia;
        if (f.region) ef.presencia = { [f.region]: 10 };
        return ef;
      },
      hacer(s, id) {
        const f = R.FIGURAS.find((x) => x.id === id);
        s.camp.figuras.push(id);
        const ef = this.calc(s, id);
        if (f.riesgo && R.chance(s, 0.25)) {
          ef.simpatia -= 5;
          return { ef, txt: f.emoji + ' Se suma… y arma polémica 🙃', bueno: false };
        }
        return { ef, txt: f.emoji + ' ' + f.nombre + ' te apoya', bueno: true, especial: true };
      },
    },
    {
      id: 'ataque', emoji: '🗡️', nombre: 'Pegarle a un rival', desc: 'Le bajás votos', costo: 5, elegir: 'rival', max: 1, azar: true,
      calc(s, id) {
        return { rival: { [id]: -R.round(2 * (1 + 0.3 * s.partido.estilo), 1) }, simpatia: -0.5 };
      },
      hacer(s, id) {
        const pMal = 0.25 - 0.08 * s.partido.estilo;
        if (R.chance(s, pMal)) {
          return { ef: { rival: { [id]: -0.5 }, simpatia: -4 }, txt: 'Te salió el tiro por la culata 🤦', bueno: false };
        }
        return { ef: this.calc(s, id), txt: 'Golpe certero contra ' + R.PARTIDOS[id].sigla + ' 🥊', bueno: true };
      },
    },
    {
      id: 'alianza', emoji: '🤝', nombre: 'Alianza', desc: 'Un partido chico se suma', costo: 0, elegir: 'aliado',
      disponible: (s) => !s.camp.alianza,
      calc(s, id) {
        const a = R.ALIADOS.find((x) => x.id === id);
        if (!a) return {};
        return { votos: a.votos, simpatia: -R.round(3 * Math.abs(a.ideo - s.partido.ideo), 1), presencia: { [a.region]: 10 } };
      },
      hacer(s, id) {
        s.camp.alianza = id;
        const a = R.ALIADOS.find((x) => x.id === id);
        return { ef: this.calc(s, id), txt: a.emoji + ' ' + a.nombre + ' se suma a tu frente', bueno: true, especial: true };
      },
    },
  ];
  camp.ACC = Object.fromEntries(camp.ACCIONES.map((a) => [a.id, a]));

  camp.costo = (s, acc, arg) => (acc.costoDe ? acc.costoDe(s, arg) : acc.costo);

  // ¿Se puede hacer? Devuelve null si sí, o un motivo corto si no.
  camp.bloqueo = function (s, acc, arg) {
    if (s.fase !== 'campana') return 'No es momento';
    if (s.camp.agenda <= 0) return 'Sin agenda este mes';
    if (acc.disponible && !acc.disponible(s)) return 'Ya lo hiciste';
    if (acc.max && (s.camp.usadasMes[acc.id] || 0) >= acc.max) return 'Ya lo hiciste este mes';
    if (arg !== undefined && camp.costo(s, acc, arg) > s.camp.fondos) return 'No te alcanza la plata';
    if (arg === undefined && !acc.elegir && acc.costo > s.camp.fondos) return 'No te alcanza la plata';
    return null;
  };

  camp.hacer = function (s, accId, arg) {
    const acc = camp.ACC[accId];
    if (!acc) throw new Error('Acción desconocida ' + accId);
    const motivo = camp.bloqueo(s, acc, arg);
    if (motivo) return { error: motivo };
    const costo = camp.costo(s, acc, arg);
    const res = acc.hacer(s, arg);
    s.camp.fondos -= costo;
    s.camp.agenda -= 1;
    s.camp.usadasMes[accId] = (s.camp.usadasMes[accId] || 0) + 1;
    s.stats.acciones++;
    const antes = camp.votos(s).nac.YO;
    res.aplicado = R.aplicarEfectos(s, res.ef);
    res.costo = costo;
    res.votosAntes = antes;
    res.votosDespues = camp.votos(s).nac.YO;
    return res;
  };

  // ── Votos ──
  // Devuelve { nac: {YO, MNP, …}, prov: {BUE: {YO, MNP, …}} } en % de votos válidos.
  camp.votos = function (s, opts) {
    opts = opts || {};
    const c = s.camp;
    const ideoP = s.partido.ideo;
    const dif = R.DIFICULTADES[s.dif] || R.DIFICULTADES.normal;
    const ali = c.alianza ? R.ALIADOS.find((a) => a.id === c.alianza) : null;
    const nac = { YO: 0 };
    R.RIVALES.forEach((id) => (nac[id] = 0));
    const prov = {};
    for (const p of R.PROVINCIAS) {
      const pres = c.presencia[p.id] || 0;
      const know = R.clamp(c.conocen + pres * 0.45, 0, 100) / 100;
      const like = R.clamp(c.simpatia + pres * 0.12, 0, 100) / 100;
      const af = camp.afinidad(s, p);
      let yo = 100 * know * Math.pow(like, 1.6) * af * 0.58 * dif.mult;
      yo += c.bonusVotos;
      if (ali) yo += ali.votos * (ali.region === p.region ? 2.2 : 0.75);
      if (opts.extraYo) yo += opts.extraYo;
      yo = R.clamp(yo, 0.2, 78);
      const ws = {};
      let tot = 0;
      for (const id of R.RIVALES) {
        const r = R.PARTIDOS[id];
        let w = Math.max(0.3, (r.base * dif.rival + s.rivales[id]));
        w *= 1 + (r.fuerte[p.id] || 0);
        w *= R.clamp(1 + 0.7 * (0.5 - Math.abs(p.lean - r.ideo)), 0.45, 1.4);
        if (s.gobRival && R.oposicion) w *= R.oposicion.factor(s, id);
        w *= 1 - 0.5 * (yo / 100) * cercania(r.ideo, ideoP);
        if (opts.ruido) w *= Math.max(0.2, 1 + opts.ruido[p.id + id] * 0.06);
        ws[id] = Math.max(0.05, w);
        tot += ws[id];
      }
      const res = { YO: yo };
      for (const id of R.RIVALES) res[id] = ((100 - yo) * ws[id]) / tot;
      prov[p.id] = res;
      for (const k in res) nac[k] += (res[k] * p.padron) / 100;
    }
    return { nac, prov };
  };

  // Encuesta: tus números con un poquito de error (como en la vida real), ordenados.
  camp.encuesta = function (s) {
    const v = camp.votos(s).nac;
    const e = { mes: s.mes };
    for (const k in v) e[k] = R.round(v[k], 1);
    return e;
  };

  // ── Paso del mes ──
  camp.finDeMes = function (s) {
    const c = s.camp;
    const dif = R.DIFICULTADES[s.dif] || R.DIFICULTADES.normal;
    c.fondos += Math.round((7 + c.militancia * 0.12) * (dif.mult > 1 ? 1.2 : 1));
    if (c.conocen > 5) c.conocen = Math.max(5, c.conocen - 0.5);
    c.simpatia += (50 - c.simpatia) * 0.06;
    for (const id in c.presencia) c.presencia[id] *= 0.96;
    for (const id of R.RIVALES) {
      s.rivales[id] = s.rivales[id] * 0.94 + R.gauss(s) * 0.45;
    }
    c.agenda = c.agendaMax;
    c.usadasMes = {};
  };
})(globalThis.R = globalThis.R || {});

<script>
// ── js/motor/elecciones.js ──
// Elecciones: PASO, generales, ballotage y legislativas. Reparto de bancas (D'Hondt y Senado).
(function (R) {
  'use strict';

  const elec = (R.elec = {});

  // ── Congreso por «tandas» (año en que se eligió cada grupo de bancas) ──
  R.congresoInicial = function () {
    return {
      dip: { 2025: Object.assign({}, R.CONGRESO_INICIAL.diputados) },
      sen: {
        2023: { MNP: 10, PL: 6, AR: 2, UCF: 4, PROV: 2 },
        2025: { MNP: 10, PL: 7, AR: 2, UCF: 3, PROV: 2 },
      },
    };
  };
  R.composicion = function (s, camara) {
    const out = {};
    const tandas = s.congreso[camara === 'senado' ? 'sen' : 'dip'];
    for (const t of Object.values(tandas)) for (const [p, n] of Object.entries(t)) out[p] = (out[p] || 0) + n;
    return out;
  };
  R.TOTAL_BANCAS = { diputados: 257, senado: 72 };

  // Diputados que renueva cada provincia: en años «A» (2027, 2031…) se usa renovA, en los otros el resto.
  const impares = R.PROVINCIAS.filter((p) => p.dip % 2 === 1).sort((a, b) => b.padron - a.padron).slice(0, 11).map((p) => p.id);
  elec.renuevaDip = function (prov, anio) {
    const a = Math.floor(prov.dip / 2) + (impares.includes(prov.id) ? 1 : 0);
    return ((anio - 2027) / 2) % 2 === 0 ? a : prov.dip - a;
  };

  // D'Hondt con piso (en % de votos).
  elec.dhondt = function (votos, bancas, piso) {
    const partidos = Object.keys(votos).filter((k) => votos[k] >= (piso ?? 3));
    const out = Object.fromEntries(partidos.map((k) => [k, 0]));
    for (let i = 0; i < bancas; i++) {
      let mejor = null;
      let mejorQ = -1;
      for (const k of partidos) {
        const q = votos[k] / (out[k] + 1);
        if (q > mejorQ) {
          mejorQ = q;
          mejor = k;
        }
      }
      if (mejor === null) break;
      out[mejor]++;
    }
    return out;
  };

  const ordenar = (nac) => Object.entries(nac).map(([id, v]) => ({ id, v })).sort((a, b) => b.v - a.v);

  // Calcula votos reales: encuesta + ruido + efecto de los fiscales.
  elec.contar = function (s) {
    const ruido = {};
    for (const p of R.PROVINCIAS) for (const id of R.RIVALES) ruido[p.id + id] = R.gauss(s);
    const swing = R.gauss(s) * 1.2;
    const gobierno = s.fase === 'gobierno' && R.elec.votosGobierno;
    const r = (gobierno ? R.elec.votosGobierno : R.camp.votos)(s, { ruido, extraYo: swing });
    // Fiscales: con poca militancia «te roban» parte de los votos en las mesas (gobernando tenés el aparato).
    const mil = s.camp.militancia;
    const perdida = !gobierno && mil < 45 ? ((45 - mil) / 45) * 0.08 : 0;
    let perdidos = 0;
    for (const p of R.PROVINCIAS) {
      const v = r.prov[p.id];
      const quita = v.YO * perdida;
      if (quita > 0) {
        const top = R.RIVALES.reduce((a, b) => (v[a] > v[b] ? a : b));
        v.YO -= quita;
        v[top] += quita;
        perdidos += (quita * p.padron) / 100;
      }
    }
    const nac = { YO: 0 };
    R.RIVALES.forEach((id) => (nac[id] = 0));
    for (const p of R.PROVINCIAS) for (const k in r.prov[p.id]) nac[k] += (r.prov[p.id][k] * p.padron) / 100;
    return { nac, prov: r.prov, perdidos };
  };

  function ganadoresPorProvincia(prov) {
    const out = {};
    for (const id in prov) {
      const v = prov[id];
      out[id] = Object.keys(v).reduce((a, b) => (v[a] > v[b] ? a : b));
    }
    return out;
  }

  // Bancas legislativas que se eligen este año.
  elec.bancas = function (s, prov, anio) {
    const dip = {};
    const sen = {};
    const tuyos = { dip: {}, sen: {} };
    const grupo = R.SENADO_GRUPO[anio];
    for (const p of R.PROVINCIAS) {
      const d = elec.dhondt(prov[p.id], elec.renuevaDip(p, anio), 3);
      for (const [k, n] of Object.entries(d)) {
        dip[k] = (dip[k] || 0) + n;
        if (k === 'YO' && n) tuyos.dip[p.id] = n;
      }
      if (p.sen === grupo) {
        const o = ordenar(prov[p.id]);
        sen[o[0].id] = (sen[o[0].id] || 0) + 2;
        sen[o[1].id] = (sen[o[1].id] || 0) + 1;
        if (o[0].id === 'YO') tuyos.sen[p.id] = 2;
        else if (o[1].id === 'YO') tuyos.sen[p.id] = 1;
      }
    }
    return { dip, sen, tuyos };
  };

  elec.renovarCongreso = function (s, anio, bancas) {
    delete s.congreso.dip[anio - 4];
    delete s.congreso.sen[anio - 6];
    s.congreso.dip[anio] = bancas.dip;
    s.congreso.sen[anio] = bancas.sen;
  };

  // PASO: los que no llegan al 1,5 % quedan afuera.
  elec.paso = function (s) {
    const c = elec.contar(s);
    const lista = ordenar(c.nac);
    const res = {
      tipo: 'paso', titulo: 'PASO 2027', anio: R.anio(s.mes), lista, prov: c.prov,
      ganadores: ganadoresPorProvincia(c.prov), pasa: c.nac.YO >= 1.5, perdidos: c.perdidos,
    };
    s.elecciones.paso = res;
    return res;
  };

  // Generales: presidente + Congreso.
  elec.general = function (s) {
    const anio = R.anio(s.mes);
    const c = elec.contar(s);
    const lista = ordenar(c.nac);
    const [a, b] = lista;
    const directo = a.v >= 45 || (a.v >= 40 && a.v - b.v >= 10);
    const bancas = elec.bancas(s, c.prov, anio);
    elec.renovarCongreso(s, anio, bancas);
    const res = {
      tipo: 'general', titulo: 'Elecciones generales ' + anio, anio, lista, prov: c.prov,
      ganadores: ganadoresPorProvincia(c.prov), perdidos: c.perdidos, bancas,
      ganador: directo ? a.id : null, ballotage: directo ? null : [a.id, b.id],
    };
    s.elecciones.general = res;
    return res;
  };

  // Ballotage: los votos de los demás se reparten por cercanía de ideas (y cuánto les caés vos).
  elec.ballotage = function (s, pares) {
    const [A, B] = pares;
    const c = elec.contar(s);
    const ideo = (id) => (id === 'YO' ? s.partido.ideo : R.PARTIDOS[id].ideo);
    const prov = {};
    const nac = { [A]: 0, [B]: 0 };
    for (const p of R.PROVINCIAS) {
      const v = c.prov[p.id];
      // El partido tradicional tiene aparato: micros, punteros y fiscales en todas las mesas.
      let va = v[A] + (A !== 'YO' ? 3 : 0);
      let vb = v[B] + (B !== 'YO' ? 3 : 0);
      for (const k in v) {
        if (k === A || k === B) continue;
        const da = Math.abs(ideo(k) - ideo(A));
        const db = Math.abs(ideo(k) - ideo(B));
        let wa = Math.exp(-1.6 * da);
        let wb = Math.exp(-1.6 * db);
        // Al que no conocen mucho le tienen miedo; al que cae bien, lo votan.
        const simp = s.fase === 'gobierno' && s.gob ? s.gob.aprob : s.camp.simpatia;
        if (A === 'YO') wa *= 0.45 + 0.6 * (simp / 100);
        if (B === 'YO') wb *= 0.45 + 0.6 * (simp / 100);
        // Si ninguno de los dos se parece a lo que votaron, muchos votan en blanco.
        const vota = 0.92 - 0.25 * Math.min(da, db);
        va += (v[k] * vota * wa) / (wa + wb);
        vb += (v[k] * vota * wb) / (wa + wb);
      }
      const t = va + vb;
      prov[p.id] = { [A]: (va / t) * 100, [B]: (vb / t) * 100 };
      nac[A] += (prov[p.id][A] * p.padron) / 100;
      nac[B] += (prov[p.id][B] * p.padron) / 100;
    }
    const lista = ordenar(nac);
    const res = {
      tipo: 'ballotage', titulo: 'Ballotage ' + R.anio(s.mes), anio: R.anio(s.mes), lista, prov,
      ganadores: ganadoresPorProvincia(prov), ganador: lista[0].id, perdidos: c.perdidos,
    };
    s.elecciones.ballotage = res;
    return res;
  };

  // Elección de medio término: solo Congreso.
  elec.legislativa = function (s) {
    const anio = R.anio(s.mes);
    const c = elec.contar(s);
    const lista = ordenar(c.nac);
    const bancas = elec.bancas(s, c.prov, anio);
    elec.renovarCongreso(s, anio, bancas);
    const res = {
      tipo: 'legislativa', titulo: 'Medio término ' + anio, anio, lista, prov: c.prov,
      ganadores: ganadoresPorProvincia(c.prov), perdidos: 0, bancas, ganador: lista[0].id,
    };
    s.elecciones.legislativa = res;
    R.diario(s, '🗳️', 'Medio término: ' + (res.ganador === 'YO' ? 'ganaste con ' : 'sacaste ') + R.pct(lista.find((x) => x.id === 'YO').v), 'eleccion');
    return res;
  };

  // Nombre lindo de un competidor.
  elec.nombre = function (s, id) {
    if (id === 'YO') return s.lider.nombre;
    return R.PARTIDOS[id].candidato.nombre;
  };
  elec.color = (s, id) => (id === 'YO' ? s.partido.color : R.PARTIDOS[id].color);
  elec.sigla = (s, id) => (id === 'YO' ? s.partido.sigla : R.PARTIDOS[id].sigla);
})(globalThis.R = globalThis.R || {});

// ── js/motor/eventos.js ──
// Motor de noticias: elige una noticia que cumpla su condición, arma el texto y aplica la opción elegida.
(function (R) {
  'use strict';

  const ev = (R.ev = {});
  R.EVENTOS = R.EVENTOS || [];
  ev.registrar = (lista) => lista.forEach((e) => R.EVENTOS.push(e));
  ev.porId = (id) => R.EVENTOS.find((e) => e.id === id);

  // Elige una noticia para esta fase (o null). Cada una sale una sola vez salvo que diga «repite: meses».
  ev.elegir = function (s, fase) {
    const posibles = R.EVENTOS.filter((e) => {
      if (e.fase !== fase) return false;
      const visto = s.vistos[e.id];
      if (visto !== undefined && (!e.repite || s.mes - visto < e.repite)) return false;
      if (e.desde !== undefined && s.mes < e.desde) return false;
      if (e.hasta !== undefined && s.mes > e.hasta) return false;
      try {
        return !e.cuando || e.cuando(s);
      } catch (err) {
        return false;
      }
    });
    const e = R.weighted(s, posibles, (x) => (typeof x.peso === 'function' ? x.peso(s) : x.peso ?? 1));
    if (!e) return null;
    return ev.instanciar(s, e);
  };

  ev.instanciar = function (s, e) {
    s.vistos[e.id] = s.mes;
    return { tipo: 'noticia', id: e.id, vars: e.vars ? e.vars(s) : {}, mes: s.mes };
  };

  function texto(s, t, vars) {
    if (!t) return t;
    return t.replace(/\{(\w+)\}/g, (m, k) => {
      if (k === 'rival' && vars.rival) return R.elec.nombre(s, vars.rival);
      if (k === 'rivalSigla' && vars.rival) return R.elec.sigla(s, vars.rival);
      if (k === 'prov' && vars.prov) return R.PROV[vars.prov].corto;
      if (k === 'lider') return s.lider.nombre;
      if (k === 'partido') return s.partido.sigla;
      return vars[k] !== undefined ? vars[k] : m;
    });
  }

  function resolverValor(s, v, vars) {
    return typeof v === 'function' ? v(s, vars) : v;
  }

  // Noticia lista para dibujar: textos con variables y cada opción con su costo, efectos y si se puede.
  ev.datos = function (s, inst) {
    const e = ev.porId(inst.id);
    if (!e) return null;
    const vars = inst.vars || {};
    return {
      id: e.id,
      dibujo: resolverValor(s, e.dibujo, vars),
      titular: texto(s, resolverValor(s, e.titular, vars), vars),
      bajada: texto(s, resolverValor(s, e.bajada, vars), vars),
      opciones: e.opciones.map((o, i) => {
        const ef = resolverValor(s, o.ef, vars) || {};
        const costo = resolverValor(s, o.costo, vars) || {};
        return {
          i,
          txt: texto(s, o.txt, vars),
          costo,
          ef,
          azar: o.azar ? { p: resolverValor(s, o.azar.p, vars), bueno: !!o.azar.bueno } : null,
          bloqueo: ev.bloqueoOpcion(s, costo, o, vars),
        };
      }),
    };
  };

  ev.bloqueoOpcion = function (s, costo, o, vars) {
    if (o.si && !o.si(s, vars)) return o.siTxt || 'No se puede';
    if (costo.fondos && s.camp && costo.fondos > s.camp.fondos) return 'Falta plata';
    if (costo.agenda && s.camp && costo.agenda > s.camp.agenda) return 'Sin agenda';
    if (R.gob && R.gob.bloqueoCosto) return R.gob.bloqueoCosto(s, costo);
    return null;
  };

  // Aplica la opción i. Devuelve { txt, bueno, aplicado: [...] }.
  ev.resolver = function (s, inst, i) {
    const e = ev.porId(inst.id);
    const o = e.opciones[i];
    const vars = inst.vars || {};
    const costo = resolverValor(s, o.costo, vars) || {};
    let ef = JSON.parse(JSON.stringify(resolverValor(s, o.ef, vars) || {}));
    let txt = texto(s, o.res, vars) || null;
    let bueno = o.bueno ?? true;
    if (o.azar && R.chance(s, resolverValor(s, o.azar.p, vars))) {
      ef = R.sumarEfectos(ef, resolverValor(s, o.azar.ef, vars));
      txt = texto(s, o.azar.txt, vars) || txt;
      bueno = o.azar.bueno ?? false;
      if (o.azar.flag) s.flags[o.azar.flag] = s.mes;
    }
    const total = R.sumarEfectos(ef, costoComoEfecto(costo));
    const aplicado = R.aplicarEfectosFase(s, total);
    if (o.flag) s.flags[o.flag] = s.mes;
    if (o.despues) o.despues(s, vars);
    s.stats.noticias++;
    const d = ev.datos(s, inst);
    R.diario(s, (d.dibujo || '📰').split(' ')[0], d.titular + ' → ' + d.opciones[i].txt, 'noticia');
    return { txt, bueno, aplicado, ef: total };
  };

  function costoComoEfecto(costo) {
    const out = {};
    if (costo.fondos) out.fondos = -costo.fondos;
    if (costo.agenda) out.agenda = -costo.agenda;
    if (costo.pc) out.pc = -costo.pc;
    if (costo.gasto) out.gastoExtra = costo.gasto;
    return out;
  }

  // Aplica efectos según la fase (en campaña los de campaña; en gobierno se agregan los del gobierno).
  R.aplicarEfectosFase = function (s, ef) {
    if (s.fase === 'gobierno' && R.gob && R.gob.aplicarEfectos) return R.gob.aplicarEfectos(s, ef);
    return R.aplicarEfectos(s, ef);
  };
  R.describirEfectosFase = function (s, ef) {
    if (s.fase === 'gobierno' && R.gob && R.gob.describirEfectos) return R.gob.describirEfectos(s, ef);
    return R.describirEfectos(s, ef);
  };
})(globalThis.R = globalThis.R || {});

<script>
// ── js/motor/turno.js ──
// El paso del tiempo: qué pasa cuando apretás «Pasar el mes» y el debate presidencial.
(function (R) {
  'use strict';

  const turno = (R.turno = {});

  // Calendario de 2027 (mes 0 = enero). En la oposición se usa s.calendario (2029 y 2031).
  turno.MES_PASO = 7; // agosto: se ven los resultados de las PASO
  turno.MES_GENERAL = 9; // octubre: se vota al final del mes
  turno.MES_BALLOTAGE = 10; // noviembre
  turno.cal = (s) => s.calendario || { paso: turno.MES_PASO, general: turno.MES_GENERAL, ballotage: turno.MES_BALLOTAGE };

  // Texto del botón grande y aviso de la próxima elección.
  turno.botonPasar = function (s) {
    const c = turno.cal(s);
    if (s.fase === 'campana' && s.mes === c.general) return { txt: 'Ir a votar', emoji: '🗳️' };
    if (s.fase === 'campana' && s.mes === c.ballotage && s.ballotage) return { txt: 'Votar en el ballotage', emoji: '🗳️' };
    if (s.fase === 'campana' && s.gobRival && turno.pasosOposicion(s) > 1) return { txt: 'Pasar 3 meses', emoji: '⏩' };
    return { txt: 'Pasar el mes', emoji: '▶' };
  };
  turno.proximaEleccion = function (s) {
    if (s.fase !== 'campana') return null;
    const c = turno.cal(s);
    if (c.medio && s.mes <= c.medio) return { nombre: 'Medio término', art: 'el', emoji: '🗳️', faltan: c.medio - s.mes };
    if (s.mes < c.paso) return { nombre: 'PASO', emoji: '🗳️', faltan: c.paso - s.mes };
    if (s.mes < c.general) return { nombre: 'Generales', emoji: '🗳️', faltan: c.general - s.mes };
    if (s.mes === c.general) return { nombre: 'Generales', emoji: '🗳️', faltan: 0 };
    return { nombre: 'Ballotage', art: 'el', emoji: '⚔️', faltan: 0 };
  };
  // En la oposición, lejos de las elecciones, cada turno son 3 meses.
  turno.pasosOposicion = function (s) {
    const c = turno.cal(s);
    const objetivos = [c.medio, c.paso].filter((m) => m !== undefined && m > s.mes);
    if (!objetivos.length) return 1;
    return Math.max(1, Math.min(3, Math.min(...objetivos) - s.mes));
  };

  // Devuelve la lista de «momentos» nuevos (también quedan en s.cola para sobrevivir a una recarga).
  turno.pasar = function (s) {
    if (s.cola.length) return [];
    const momentos = [];
    if (s.fase === 'campana') turno.pasarCampana(s, momentos);
    else if (s.fase === 'gobierno' && R.gob) R.gob.pasarMes(s, momentos);
    s.cola.push(...momentos);
    return momentos;
  };

  turno.pasarCampana = function (s, momentos) {
    const c = turno.cal(s);
    if (s.mes === c.general) {
      const res = R.elec.general(s);
      momentos.push({ tipo: 'eleccion', clave: 'general' });
      if (res.ganador === 'YO') {
        turno.ganaste(s, momentos, 'primera');
      } else if (res.ballotage && res.ballotage.includes('YO')) {
        s.ballotage = res.ballotage;
        R.diario(s, '⚔️', 'Vamos al ballotage contra ' + R.elec.nombre(s, res.ballotage.find((x) => x !== 'YO')), 'eleccion');
        R.camp.finDeMes(s);
        s.mes++;
        s.camp.agenda = 2; // un mes cortito de campaña
        momentos.push({ tipo: 'debate', rival: res.ballotage.find((x) => x !== 'YO'), etapa: 'ballotage' });
      } else {
        turno.perdiste(s, momentos, 'general');
      }
      return;
    }
    if (s.mes === c.ballotage && s.ballotage) {
      const res = R.elec.ballotage(s, s.ballotage);
      momentos.push({ tipo: 'eleccion', clave: 'ballotage' });
      if (res.ganador === 'YO') turno.ganaste(s, momentos, 'ballotage');
      else turno.perdiste(s, momentos, 'ballotage');
      return;
    }

    const pasos = s.gobRival ? turno.pasosOposicion(s) : 1;
    for (let i = 0; i < pasos; i++) {
      R.camp.finDeMes(s);
      s.mes++;
      if (s.gobRival) R.oposicion.mes(s);
    }
    if (c.medio && s.mes === c.medio) {
      const res = R.elec.legislativa(s);
      momentos.push({ tipo: 'eleccion', clave: 'legislativa' });
      if (s.gobRival) s.gobRival.aprob = R.clamp(s.gobRival.aprob + (res.ganador === s.gobRival.partido ? 4 : -4), 10, 80);
    }
    if (s.mes === c.paso) {
      const res = R.elec.paso(s);
      momentos.push({ tipo: 'eleccion', clave: 'paso' });
      R.diario(s, '🗳️', 'PASO: sacaste ' + R.pct(res.lista.find((x) => x.id === 'YO').v), 'eleccion');
      if (!res.pasa) {
        turno.perdiste(s, momentos, 'paso');
        return;
      }
    }
    if (s.mes === c.general) {
      const e = R.camp.votos(s).nac;
      const rivales = R.RIVALES.slice().sort((a, b) => e[b] - e[a]);
      momentos.push({ tipo: 'debate', rival: rivales[0], etapa: 'general' });
    }
    if (R.chance(s, s.mes === c.general ? 0.5 : 0.75)) {
      const n = R.ev.elegir(s, 'campana');
      if (n) momentos.push(n);
    }
    s.encuestas.push(R.camp.encuesta(s));
  };

  turno.ganaste = function (s, momentos, como) {
    s.fase = 'electo';
    s.flags.ganoEn = como;
    R.diario(s, '🏆', '¡' + s.lider.nombre + ' es presidente electo!', 'eleccion');
    momentos.push({ tipo: 'asuncion' });
  };
  turno.perdiste = function (s, momentos, donde) {
    s.fase = 'fin';
    s.fin = { motivo: donde, mes: s.mes };
    R.diario(s, '😞', donde === 'paso' ? 'Quedaste afuera en las PASO' : 'Perdiste la elección', 'eleccion');
    momentos.push({ tipo: 'fin' });
  };

  // ── Debate presidencial (minijuego) ──
  const deb = (R.debate = {});
  deb.ESTILOS = {
    ataque: { emoji: '🔥', nombre: 'Atacar' },
    datos: { emoji: '📊', nombre: 'Datos' },
    emocion: { emoji: '❤️', nombre: 'Emoción' },
    humor: { emoji: '😂', nombre: 'Humor' },
  };
  // A le gana a B: los datos desarman el ataque, el ataque ridiculiza la emoción,
  // la emoción le gana al chiste y el humor vuelve aburridos los datos.
  deb.GANA = { datos: 'ataque', ataque: 'emocion', emocion: 'humor', humor: 'datos' };
  deb.TEMAS = [
    { id: 'economia', emoji: '💰', nombre: 'Economía', fuerte: 'datos' },
    { id: 'seguridad', emoji: '👮', nombre: 'Seguridad', fuerte: 'ataque' },
    { id: 'salud', emoji: '🏥', nombre: 'Salud y escuelas', fuerte: 'emocion' },
    { id: 'corrupcion', emoji: '🕵️', nombre: 'Corrupción', fuerte: 'ataque' },
    { id: 'futuro', emoji: '🚀', nombre: 'El futuro', fuerte: 'emocion' },
    { id: 'campo', emoji: '🌾', nombre: 'Campo e industria', fuerte: 'datos' },
    { id: 'jovenes', emoji: '🎮', nombre: 'Jóvenes', fuerte: 'humor' },
    { id: 'jubilados', emoji: '👵', nombre: 'Jubilados', fuerte: 'emocion' },
  ];

  deb.nuevo = function (s, rival, etapa) {
    return { rival, etapa, temas: R.shuffle(s, deb.TEMAS).slice(0, 3), ronda: 0, puntos: 0, historia: [] };
  };

  deb.resultado = function (yo, el) {
    if (yo === el) return 'empate';
    if (deb.GANA[yo] === el) return 'gana';
    if (deb.GANA[el] === yo) return 'pierde';
    return 'empate';
  };

  deb.jugar = function (s, d, estilo) {
    const tema = d.temas[d.ronda];
    const pref = R.PARTIDOS[d.rival].debate;
    const el = R.chance(s, 0.5) ? pref : R.pick(s, Object.keys(deb.ESTILOS));
    const r = deb.resultado(estilo, el);
    let pts = r === 'gana' ? 1 : r === 'pierde' ? -1 : 0;
    if (tema.fuerte === estilo) pts += 0.5;
    d.puntos += pts;
    d.historia.push({ tema: tema.id, yo: estilo, el, r, pts });
    d.ronda++;
    return { el, r, pts, tema };
  };

  deb.terminar = function (s, d) {
    const p = d.puntos;
    const ef = { simpatia: R.round(p * 2.6, 1), conocen: 3, rival: { [d.rival]: -R.round(Math.max(0, p) * 1.1, 1) } };
    if (p < 0) ef.rival[d.rival] = R.round(-p * 0.6, 1);
    const aplicado = R.aplicarEfectos(s, ef);
    const veredicto = p >= 2 ? '¡Ganaste el debate por paliza!' : p > 0 ? 'Ganaste el debate' : p === 0 ? 'Empate técnico' : 'Perdiste el debate';
    R.diario(s, '🎙️', 'Debate: ' + veredicto.toLowerCase().replace('¡', '').replace('!', ''), 'debate');
    return { veredicto, aplicado, bueno: p >= 0 };
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/motor/economia.js ──
// Economía: presupuesto por áreas (en % del gasto), impuestos, déficit y la simulación mensual.
// Cada indicador guarda sus «causas» (cuánto aportó cada cosa) para el botón «¿Por qué?».
(function (R) {
  'use strict';

  const eco = (R.eco = {});

  // base = gasto inicial en % del PBI. El jugador mueve un «nivel» (0,5 = la mitad … 1,6 = 60 % más).
  R.AREAS = [
    { id: 'jubilaciones', emoji: '👵', nombre: 'Jubilaciones', base: 7.5,
      gana: [['👵', 'Jubilados', 3], ['🏚️', 'Pobreza', -1]] },
    { id: 'social', emoji: '🤲', nombre: 'Ayuda social', base: 1.5,
      gana: [['🏘️', 'Barrios humildes', 3], ['🏚️', 'Pobreza', -2], ['🏙️', 'Clase media', -1]] },
    { id: 'salud', emoji: '🏥', nombre: 'Salud', base: 0.7, calidad: 'salud',
      gana: [['🏥', 'Hospitales', 2], ['👵', 'Jubilados', 1], ['🏘️', 'Humildes', 1]] },
    { id: 'educacion', emoji: '🎓', nombre: 'Educación', base: 1.1, calidad: 'educacion',
      gana: [['🎓', 'Escuelas', 2], ['🏙️', 'Clase media', 2], ['🚀', 'Crecimiento futuro', 1]] },
    { id: 'seguridad', emoji: '👮', nombre: 'Seguridad', base: 0.7, calidad: 'seguridad',
      gana: [['👮', 'Menos delito', 2], ['🏙️', 'Clase media', 2]] },
    { id: 'defensa', emoji: '🪖', nombre: 'Defensa', base: 0.5, calidad: 'defensa',
      gana: [['🪖', 'Poder militar', 3]] },
    { id: 'obras', emoji: '🏗️', nombre: 'Obra pública', base: 0.8, calidad: 'infra',
      gana: [['📈', 'Crecimiento', 2], ['👷', 'Trabajadores', 2], ['🛣️', 'Rutas', 1]] },
    { id: 'subsidios', emoji: '⚡', nombre: 'Subsidios a tarifas', base: 1.5,
      gana: [['💡', 'Tarifas baratas', 3], ['🏘️', 'Humildes', 1], ['👵', 'Jubilados', 1]] },
    { id: 'ciencia', emoji: '🔬', nombre: 'Ciencia', base: 0.3, calidad: 'ciencia',
      gana: [['🔬', 'Inventos', 2], ['🚀', 'Crecimiento futuro', 1]] },
  ];
  R.AREA = Object.fromEntries(R.AREAS.map((a) => [a.id, a]));
  eco.NIVEL_MIN = 0.5;
  eco.NIVEL_MAX = 1.6;
  eco.nivelTxt = (m) => (m < 0.75 ? 'Recorte fuerte' : m < 0.95 ? 'Recorte' : m <= 1.05 ? 'Como estaba' : m <= 1.25 ? 'Más plata' : 'Mucha más plata');

  eco.IMPUESTOS = [
    { nombre: 'Muy bajos', recauda: 12.6 },
    { nombre: 'Bajos', recauda: 13.8 },
    { nombre: 'Normales', recauda: 15.0 },
    { nombre: 'Altos', recauda: 16.2 },
    { nombre: 'Muy altos', recauda: 17.4 },
  ];
  eco.RETENCIONES = [
    { nombre: 'Sin retenciones', pct: 0, recauda: 0 },
    { nombre: '10 %', pct: 10, recauda: 0.5 },
    { nombre: '20 %', pct: 20, recauda: 1.0 },
    { nombre: '30 %', pct: 30, recauda: 1.5 },
  ];
  eco.FINANCIAMIENTO = [
    { emoji: '🖨️', nombre: 'Emitir', desc: 'Más inflación', emision: 1 },
    { emoji: '⚖️', nombre: 'Mitad y mitad', desc: 'Un poco de cada', emision: 0.5 },
    { emoji: '🏦', nombre: 'Pedir prestado', desc: 'Más deuda', emision: 0 },
  ];

  eco.inicial = function () {
    const e = {
      pbi: 100,
      crec: 1.0,
      inflMes: 2.0,
      inflAnual: 27,
      inflHist: [2.1, 2.1, 2.0, 2.0, 2.1, 2.0, 2.0, 1.9, 2.0, 2.1, 2.0, 2.0],
      desempleo: 7.8,
      pobreza: 34,
      salarioReal: 100,
      reservas: 28,
      deuda: 78,
      riesgo: 750,
      dolar: 1550,
      brecha: 0,
      cepo: false,
      changuito: 120000,
      niveles: Object.fromEntries(R.AREAS.map((a) => [a.id, 1])),
      nivelesInicioMes: Object.fromEntries(R.AREAS.map((a) => [a.id, 1])),
      impuestos: 2,
      retenciones: 2,
      financiamiento: 1,
      impuestosInicioMes: 2,
      retencionesInicioMes: 2,
      calidad: { salud: 48, educacion: 50, seguridad: 42, defensa: 30, infra: 44, ciencia: 45 },
      gastoExtraAnio: 0, // gastos puntuales del año (en % del PBI)
      gastoExtraMes: 0,
      shocks: [], // [{k: 'crec'|'expo'|'infl', v, meses}]
      deficitAcumAnio: 0,
      causas: {},
      historia: [],
    };
    return e;
  };

  // ── Cuentas del presupuesto ──
  eco.gastoArea = (e, id) => R.AREA[id].base * e.niveles[id];
  eco.gastoPrimario = (e) => R.sum(R.AREAS.map((a) => eco.gastoArea(e, a.id)));
  eco.tasa = (e) => 1.6 + e.riesgo / 1000; // % anual que se paga por la deuda
  eco.intereses = (e) => (e.deuda * eco.tasa(e)) / 100;
  eco.gastoTotal = (e) => eco.gastoPrimario(e) + eco.intereses(e);
  eco.factorExpo = (s) => {
    const e = s.eco;
    let f = 1 + (2 - e.retenciones) * 0.06;
    if (e.cepo) f -= 0.05;
    if (s.gob) f += ((s.gob.grupos.campo.humor - 50) / 50) * 0.05;
    for (const sh of e.shocks) if (sh.k === 'expo') f += sh.v;
    if (s.gob && s.gob.bonusExpo) f += s.gob.bonusExpo;
    return Math.max(0.5, f);
  };
  eco.recaudacion = (s) => {
    const e = s.eco;
    const evasion = 1 - 0.012 * Math.max(0, e.desempleo - 8) - 0.002 * Math.max(0, e.inflAnual - 60) / 10;
    const extra = s.gob && s.gob.bonusRecauda ? s.gob.bonusRecauda : 0;
    return eco.IMPUESTOS[e.impuestos].recauda * Math.max(0.8, evasion) + extra + eco.RETENCIONES[e.retenciones].recauda * eco.factorExpo(s);
  };
  eco.resultado = (s) => eco.recaudacion(s) - eco.gastoTotal(s.eco); // + superávit, − déficit (% PBI anual)
  eco.participacion = (e, id) => (eco.gastoArea(e, id) / eco.gastoPrimario(e)) * 100; // % del presupuesto

  // Gasto puntual en «% del presupuesto anual» → % del PBI.
  eco.gastoComoPBI = (s, pctPresupuesto) => (pctPresupuesto / 100) * eco.gastoTotal(s.eco);

  eco.inflAnualDe = (hist) => (hist.reduce((a, m) => a * (1 + m / 100), 1) - 1) * 100;

  // ── Un mes de economía ──
  eco.mes = function (s) {
    const e = s.eco;
    const g = s.gob;
    const m = e.niveles;
    const shock = (k) => R.sum(e.shocks.filter((x) => x.k === k).map((x) => x.v));
    const min = g ? R.MINISTROS[g.ministro] : null;
    const ley = (id) => !!(g && g.leyes && g.leyes[id]);
    const C = {}; // causas

    // 1) Cuentas fiscales del mes
    const rec = eco.recaudacion(s);
    const gasto = eco.gastoTotal(e);
    const deficitMes = (gasto - rec) / 12 + e.gastoExtraMes; // % del PBI de este mes
    e.gastoExtraMes = 0;
    e.deficitAcumAnio += deficitMes;
    const dolarizado = ley('dolarizacion');
    const emision = dolarizado ? 0 : eco.FINANCIAMIENTO[e.financiamiento].emision;
    const emitido = Math.max(0, deficitMes) * emision;
    const prestado = deficitMes > 0 ? deficitMes * (1 - emision) : deficitMes; // superávit = paga deuda

    // 2) Inflación
    const inercia = 0.55 * e.inflMes;
    let base = 0.45 * 0.8;
    let ancla = 0;
    if (min && min.ancla) ancla -= min.ancla;
    if (ley('bcra')) ancla -= 0.12;
    if (dolarizado) { base = 0.45 * 0.25; ancla = 0; }
    const pEmision = emitido * 18;
    const subsidiosAntes = e.nivelesInicioMes.subsidios;
    const pTarifas = m.subsidios < subsidiosAntes ? (subsidiosAntes - m.subsidios) * R.AREA.subsidios.base * 2.6 : 0;
    // Dólar: se mueve con la inflación más presión si faltan reservas.
    let presion = 0;
    if (e.reservas < 15) presion += (15 - e.reservas) * 0.18;
    if (!e.cepo && e.riesgo > 1200) presion += (e.riesgo - 1200) / 900;
    presion += shock('dolar');
    const pDolar = dolarizado ? 0 : presion * 0.38;
    const pShock = shock('infl');
    const pParitarias = g && g.grupos.trabajadores.humor < 30 ? 0.15 : 0;
    let infl = inercia + base + ancla + pEmision + pTarifas + pDolar + pShock + pParitarias + R.gauss(s) * 0.12;
    infl = R.clamp(infl, -0.5, 60);
    C.inflacion = [
      { k: 'inercia', v: inercia + base },
      { k: 'emision', v: pEmision },
      { k: 'tarifas', v: pTarifas },
      { k: 'dolar', v: pDolar },
      { k: 'ancla', v: ancla },
      { k: 'shock', v: pShock + pParitarias },
    ];
    const inflAntes = e.inflMes;
    e.inflMes = infl;
    e.inflHist.push(infl);
    if (e.inflHist.length > 12) e.inflHist.shift();
    e.inflAnual = eco.inflAnualDe(e.inflHist);
    e.changuito *= 1 + infl / 100;

    // 3) Dólar y brecha
    if (!dolarizado) {
      const devalMes = Math.max(0, inflAntes * 0.95 + presion);
      e.dolar *= 1 + devalMes / 100;
      if (e.cepo) e.brecha = R.clamp(e.brecha * 0.9 + 3 + Math.max(0, e.inflAnual - 30) * 0.1 + Math.max(0, 15 - e.reservas), 5, 250);
      else e.brecha = Math.max(0, e.brecha * 0.5);
    }

    // 4) Crecimiento (anualizado)
    const pPot = 1.4;
    const pObras = 2.2 * (m.obras - 1) + (e.calidad.infra - 50) / 30;
    const pFuturo = (e.calidad.educacion - 50) / 45 + (e.calidad.ciencia - 50) / 45;
    const pConfianza = -(e.riesgo - 650) / 420;
    const pImpuestos = -0.7 * (e.impuestos - 2) - 0.3 * (e.retenciones - 2);
    const pInflacion = -Math.max(0, e.inflAnual - 35) / 25;
    const pCepo = e.cepo ? -0.7 : 0;
    const pExpo = (eco.factorExpo(s) - 1) * 6;
    const pGasto = 0.5 * (eco.gastoPrimario(e) - 14.6);
    const pShockCrec = shock('crec');
    const pMin = min && min.crec ? min.crec : 0;
    const pLeyes = g && g.bonusCrec ? g.bonusCrec : 0;
    let crecMes = pPot + pObras + pFuturo + pConfianza + pImpuestos + pInflacion + pCepo + pExpo + pGasto + pShockCrec + pMin + pLeyes + R.gauss(s) * 0.6;
    crecMes = R.clamp(crecMes, -15, 12);
    e.pbi *= 1 + crecMes / 1200;
    e.crec = e.crec * 0.82 + crecMes * 0.18;
    C.crecimiento = [
      { k: 'obras', v: pObras }, { k: 'futuro', v: pFuturo }, { k: 'confianza', v: pConfianza }, { k: 'impuestos', v: pImpuestos },
      { k: 'inflacion', v: pInflacion }, { k: 'cepo', v: pCepo }, { k: 'expo', v: pExpo }, { k: 'gasto', v: pGasto },
      { k: 'shock', v: pShockCrec }, { k: 'ministro', v: pMin + pLeyes },
    ];

    // 5) Empleo
    const desObj = R.clamp(7.5 - 0.5 * (e.crec - 1.5) - (g && g.bonusEmpleo ? g.bonusEmpleo : 0), 2.5, 30);
    const desAntes = e.desempleo;
    e.desempleo = R.clamp(e.desempleo + (desObj - e.desempleo) * 0.09 + shock('desempleo'), 2, 35);
    C.desempleo = [{ k: 'crecimiento', v: (e.desempleo - desAntes) }];

    // 6) Salario real: las paritarias corren detrás de la inflación.
    const paritaria = 0.75 * inflAntes + 0.25 * Math.min(infl, inflAntes * 1.5) + 0.12 + (g && g.grupos.trabajadores.humor < 35 ? 0.1 : 0) + shock('salario');
    const salAntes = e.salarioReal;
    e.salarioReal = R.clamp(e.salarioReal * (1 + (paritaria - infl) / 100) + (e.crec - 1) * 0.02, 45, 160);
    C.salario = [{ k: 'inflacion', v: e.salarioReal - salAntes }];

    // 7) Pobreza
    const pDes = 1.0 * (e.desempleo - 7.5);
    const pSal = 0.4 * (100 - e.salarioReal);
    const pInf = 0.12 * Math.max(0, e.inflAnual - 15);
    const pSocial = -6 * (m.social - 1) - 3 * (m.jubilaciones - 1);
    const pobObj = R.clamp(29 + pDes + pSal + pInf + pSocial, 3, 75);
    e.pobreza = R.clamp(e.pobreza + (pobObj - e.pobreza) * 0.1, 3, 75);
    C.pobreza = [{ k: 'desempleo', v: pDes }, { k: 'salario', v: pSal }, { k: 'inflacion', v: pInf }, { k: 'social', v: pSocial }];

    // 8) Reservas (miles de millones de dólares)
    const expo = 6.6 * eco.factorExpo(s);
    const impo = 6.0 * (1 + (e.crec - 1.5) / 40) * (e.cepo ? 0.92 : 1);
    const pagos = 0.55 + (e.deuda / 100) * 0.15;
    const fuga = e.cepo ? 0 : Math.max(0, (e.riesgo - 900) / 1000) * 0.6 + Math.max(0, e.inflAnual - 60) / 200;
    const prestamos = shock('reservas');
    const dRes = expo - impo - pagos - fuga + prestamos;
    e.reservas = R.clamp(e.reservas + dRes, -5, 250);
    C.reservas = [{ k: 'comercio', v: expo - impo }, { k: 'pagos', v: -pagos }, { k: 'fuga', v: -fuga }, { k: 'prestamos', v: prestamos }];

    // 9) Deuda y riesgo país
    e.deuda = R.clamp(e.deuda + prestado * 1.0 - e.deuda * (crecMes / 1200) + shock('deuda'), 5, 300);
    const defAnual = -eco.resultado(s);
    const riesgoObj = R.clamp(320 + 7 * Math.max(0, e.deuda - 45) + 70 * Math.max(0, defAnual) + 3.5 * Math.max(0, e.inflAnual - 20)
      - 5 * (e.reservas - 25) + (e.cepo ? 120 : 0) + shock('riesgo') + (min && min.riesgo ? min.riesgo : 0) - (ley('bcra') ? 80 : 0), 150, 5000);
    e.riesgo = R.clamp(e.riesgo + (riesgoObj - e.riesgo) * 0.2, 150, 5000);

    // 10) Calidad de cada área: va lento hacia lo que le das.
    for (const a of R.AREAS) {
      if (!a.calidad) continue;
      const obj = R.clamp(50 + 48 * (m[a.id] - 1) - Math.max(0, e.inflAnual - 40) * 0.08 + (g && g.bonusCalidad && g.bonusCalidad[a.calidad] ? g.bonusCalidad[a.calidad] : 0), 5, 97);
      e.calidad[a.calidad] = R.clamp(e.calidad[a.calidad] + (obj - e.calidad[a.calidad]) * 0.06, 0, 100);
    }

    // 11) Los shocks se gastan
    e.shocks.forEach((x) => x.meses--);
    e.shocks = e.shocks.filter((x) => x.meses > 0);
    e.causas = C;
    e.ultimoDeficitMes = deficitMes;
    return C;
  };

  // Foto del mes (para gráficos y para comparar).
  eco.foto = function (s) {
    const e = s.eco;
    return {
      mes: s.mes, aprob: s.gob ? s.gob.aprob : null, inflMes: e.inflMes, inflAnual: e.inflAnual, crec: e.crec, desempleo: e.desempleo,
      pobreza: e.pobreza, salarioReal: e.salarioReal, reservas: e.reservas, deuda: e.deuda, riesgo: e.riesgo, dolar: e.dolar,
      changuito: e.changuito, resultado: eco.resultado(s),
    };
  };

  // Textos de causas para «¿Por qué?».
  R.CAUSAS = {
    inflacion: {
      inercia: ['🔁', 'Los precios vienen subiendo'], emision: ['🖨️', 'Emitiste para pagar el déficit'], tarifas: ['⚡', 'Subieron las tarifas'],

    },
    crecimiento: {
      obras: ['🏗️', 'Obra pública y rutas'], futuro: ['🎓', 'Educación y ciencia'], confianza: ['📊', 'Riesgo país'],
      impuestos: ['🧾', 'Impuestos y retenciones'], inflacion: ['🛒', 'La inflación frena todo'], cepo: ['🔒', 'El cepo'],
      expo: ['🚢', 'Exportaciones'], gasto: ['💸', 'Gasto del Estado'], shock: ['💥', 'Clima y sorpresas'], ministro: ['🧑‍💼', 'Tu ministro y tus leyes'],
    },
    pobreza: {
      desempleo: ['👷', 'Falta de trabajo'], salario: ['💰', 'Sueldos que no alcanzan'], inflacion: ['🛒', 'Precios altos'], social: ['🤲', 'Ayuda social y jubilaciones'],
    },
    reservas: {
      comercio: ['🚢', 'Exportaciones menos importaciones'], pagos: ['🏦', 'Pago de deuda'], fuga: ['✈️', 'Gente que se lleva los dólares'], prestamos: ['🤝', 'Préstamos'],
    },
  };
})(globalThis.R = globalThis.R || {});
