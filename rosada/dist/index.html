<script>
// ── js/motor/gobierno.js ──
// Gobierno: la gente (humor de cada grupo), aprobación, capital político, crisis y el paso del mes.
(function (R) {
  'use strict';

  const gob = (R.gob = {});

  R.MINISTROS = {
    ortodoxo: {
      emoji: '📉', tipo: 'Ortodoxo', nombre: 'Bruno Lagos', desc: 'Baja la inflación, pero enfría la economía',
      ancla: 0.22, riesgo: -90, crec: -0.4, impacto: { trabajadores: -6, humildes: -4, empresarios: 7 },
      avatar: { piel: 0, pelo: 1, colorPelo: 4, anteojos: 2, barba: 0, ropa: 1 },
    },
    heterodoxo: {
      emoji: '📈', tipo: 'Heterodoxo', nombre: 'Marina Paz', desc: 'Empuja el consumo, pero sube la inflación',
      ancla: -0.15, riesgo: 80, crec: 0.6, impacto: { trabajadores: 6, humildes: 5, empresarios: -6 },
      avatar: { piel: 2, pelo: 2, colorPelo: 0, anteojos: 1, barba: 0, ropa: 2 },
    },
    pragmatico: {
      emoji: '🤝', tipo: 'Pragmático', nombre: 'Jorge Ibarra', desc: 'Ni frío ni calor: negocia bien (+1 ⭐ por mes)',
      pcExtra: 1, impacto: {},
      avatar: { piel: 1, pelo: 5, colorPelo: 1, anteojos: 0, barba: 1, ropa: 0 },
    },
  };

  // Elecciones del mandato (mes 0 = enero 2027).
  gob.MES_MEDIO_TERMINO = R.mesNum(2029, 9);
  gob.MES_PRESIDENCIAL = R.mesNum(2031, 9);

  gob.iniciar = function (s) {
    s.fase = 'gobierno';
    s.mes = R.mesNum(R.anio(s.mes), 11);
    s.eco = R.eco.inicial();
    const grupos = {};
    for (const g of R.GRUPOS) {
      const h = R.simpatiaInicialGrupo(g, s.partido.ideo) + 6;
      grupos[g.id] = { humor: h, antes: h, partes: [], partesAntes: [] };
    }
    s.gob = {
      inicio: s.mes, mandato: 1, pc: 8, pcMax: 20, aprob: 55, lunaMiel: 12, ministro: null, grupos,
      leyes: {}, enfr: {}, meses: 0, crisisMeses: 0, escandalo: 0, historia: [], llamas: [],
    };
    gob.actualizarAprob(s);
    if (R.congreso) R.congreso.iniciar(s);
    if (R.mundo) R.mundo.iniciar(s);
    s.gob.historia.push(R.eco.foto(s));
    R.diario(s, '🎖️', 'Asumís la Presidencia', 'gobierno');
    s.cola.push({ tipo: 'ministro' });
  };

  gob.elegirMinistro = function (s, id) {
    const antes = s.gob.ministro;
    s.gob.ministro = id;
    const imp = R.MINISTROS[id].impacto || {};
    const aplicado = gob.aplicarEfectos(s, imp);
    R.diario(s, R.MINISTROS[id].emoji, 'Ministro/a de Economía: ' + R.MINISTROS[id].nombre + (antes ? ' (cambio de gabinete)' : ''), 'gobierno');
    return aplicado;
  };

  // ── Lo que quiere cada grupo ──
  // Devuelve { obj, partes: [{k, v}] } — cada parte es una razón de su humor (sirve para las frases y el «¿por qué?»).
  gob.objetivoGrupo = function (s, id) {
    const e = s.eco;
    const m = e.niveles;
    const g = R.GRUPO[id];
    const ideoGob = s.partido.ideo;
    const Pinf = R.clamp((e.inflAnual - 15) / 2, 0, 45);
    const Pdes = (e.desempleo - 7.5) * 2.2;
    const S = (e.salarioReal - 100) * 0.7;
    const Gr = (e.crec - 1.5) * 2;
    const q = e.calidad;
    const p = [];
    const add = (k, v) => p.push({ k, v });
    add('ideas', 12 * (0.45 - Math.abs(g.ideo - ideoGob)));
    switch (id) {
      case 'trabajadores':
        add('salario', S * 1.2); add('empleo', -Pdes * 1.3); add('inflacion', -Pinf * 0.5); add('obras', 12 * (m.obras - 1));
        break;
      case 'campo':
        add('retenciones', -10 * (e.retenciones - 1.5)); add('cepo', e.cepo ? -10 : 0); add('crecimiento', Gr * 0.6);
        add('inflacion', -Pinf * 0.25); add('rutas', (q.infra - 50) * 0.25);
        break;
      case 'empresarios':
        add('impuestos', -7 * (e.impuestos - 2)); add('riesgo', -(e.riesgo - 650) / 35); add('cepo', e.cepo ? -10 : 0);
        add('crecimiento', Gr * 1.3); add('inflacion', -Pinf * 0.35);
        break;
      case 'media':
        add('inflacion', -Pinf * 0.85); add('seguridad', (q.seguridad - 50) * 0.3); add('educacion', (q.educacion - 50) * 0.2);
        add('salud', (q.salud - 50) * 0.15); add('impuestos', -5 * (e.impuestos - 2)); add('crecimiento', Gr * 0.7);
        add('social', -12 * Math.max(0, m.social - 1.2));
        break;
      case 'humildes':
        add('inflacion', -Pinf * 0.7); add('empleo', -Pdes * 0.8); add('social', 25 * (m.social - 1)); add('subsidios', 10 * (m.subsidios - 1));
        add('salud', (q.salud - 50) * 0.2); add('pobreza', -(e.pobreza - 30) * 0.4);
        break;
      case 'jubilados':
        add('jubilaciones', 35 * (m.jubilaciones - 1)); add('inflacion', -Pinf * 0.95); add('salud', (q.salud - 50) * 0.3); add('subsidios', 6 * (m.subsidios - 1));
        break;
    }
    const bonus = s.gob && s.gob.bonusGrupo ? s.gob.bonusGrupo[id] || 0 : 0;
    if (bonus) add('leyes', bonus);
    const obj = R.clamp(50 + R.sum(p.map((x) => x.v)), 3, 97);

    const dr = e.retenciones - e.retencionesInicioMes;

    const e = s.eco;
    const antes = R.eco.foto(s);
    const humorAntes = Object.fromEntries(R.GRUPOS.map((g) => [g.id, G.grupos[g.id].humor]));

    // Reacción a los cambios de presupuesto e impuestos del mes

    if (Object.keys(reaccion).length) gob.aplicarEfectos(s, reaccion);

    R.eco.mes(s);

    // La gente se acomoda de a poco a cómo le va
    for (const g of R.GRUPOS) {
      const st = G.grupos[g.id];
      const { obj, partes } = gob.objetivoGrupo(s, g.id);
      st.partesAntes = st.partes;
      st.partes = partes;
      st.objetivo = obj;

      return;

      if (ev) momentos.push(R.ev.instanciar(s, ev));
    }

    // El mundo (guerra, resistencia) y las elecciones del mandato
    if (R.mundo && R.mundo.mes) R.mundo.mes(s, momentos);
    if (R.gob.elecciones && R.gob.elecciones(s, momentos)) return;

    // Noticia del mes

      let mejor = null;

// ── js/motor/congreso.js ──
// Congreso (leyes, porotos, negociación, decretos), gobernadores y elecciones durante el gobierno.
(function (R) {
  'use strict';

  const con = (R.congreso = {});
  const BLOQUES = ['MNP', 'PL', 'AR', 'UCF', 'FT', 'PROV'];
  con.BLOQUES = BLOQUES;
  const ideoDe = (s, id) => (id === 'YO' ? s.partido.ideo : R.PARTIDOS[id].ideo);

  con.iniciar = function (s) {
    const G = s.gob;
    G.rel = {};
    for (const b of BLOQUES) G.rel[b] = R.clamp(Math.round(68 - 45 * Math.abs(ideoDe(s, b) - s.partido.ideo) - 8 * s.partido.estilo), 10, 85);
    G.negocia = {}; // ley → { bloque: puntos }
    G.leyesEstado = {}; // ley → { estado: 'aprobada'|'rechazada'|'dnu', mes }
    G.gobernadores = {};
    const v = s.elecciones.general ? s.elecciones.general.prov : null;
    for (const p of R.PROVINCIAS) {
      let partido = R.GOBERNADORES_INICIALES[p.id];
      if (v && v[p.id] && v[p.id].YO >= 36 && Object.keys(v[p.id]).every((k) => k === 'YO' || v[p.id][k] <= v[p.id].YO)) partido = 'YO';
      G.gobernadores[p.id] = con.nuevoGobernador(s, p.id, partido);
    }
  };

  const NOMBRES = ['Héctor', 'Miriam', 'Oscar', 'Gladys', 'Raúl', 'Silvia', 'Walter', 'Norma', 'Daniel', 'Liliana', 'Jorge', 'Beatriz', 'Ricardo', 'Graciela', 'Sergio', 'Adriana'];
  const APELLIDOS = ['Zamora', 'Insaurralde', 'Bustos', 'Saá', 'Herrera', 'Lescano', 'Bordón', 'Cáceres', 'Funes', 'Gómez', 'Orellana', 'Vera', 'Ponce', 'Albornoz', 'Lucero', 'Arce'];
  con.nuevoGobernador = function (s, prov, partido) {
    const nombre = R.pick(s, NOMBRES) + ' ' + R.pick(s, APELLIDOS);
    const rel = partido === 'YO' ? 90 : R.clamp(Math.round(70 - 35 * Math.abs(ideoDe(s, partido) - s.partido.ideo)), 25, 80);
    return {
      partido, nombre, rel, pide: R.pick(s, Object.keys(R.PEDIDOS)), enfr: -99,
      avatar: { piel: R.randInt(s, 0, 4), pelo: R.randInt(s, 0, 5), colorPelo: R.randInt(s, 0, 5), anteojos: R.randInt(s, 0, 2), barba: R.randInt(s, 0, 2), ropa: R.randInt(s, 0, 4) },
    };
  };

  // Cuánto te bancan los gobernadores de cada partido (promedio ponderado por población).
  con.relGobernadores = function (s, partido) {
    let tot = 0;
    let w = 0;
    for (const p of R.PROVINCIAS) {
      const g = s.gob.gobernadores[p.id];
      if (g.partido !== partido) continue;
      tot += g.rel * p.dip;
      w += p.dip;
    }
    return w ? tot / w : 50;
  };

  con.mayoria = function (s) {
    if (!s.gob || !s.gob.rel) return false;
    const d = R.composicion(s, 'diputados');
    const se = R.composicion(s, 'senado');
    return (d.YO || 0) >= 129 && (se.YO || 0) >= 37;
  };

  con.necesarios = (ley, camara) => {
    const total = R.TOTAL_BANCAS[camara];
    return ley && ley.mayoria === 'dos_tercios' ? Math.ceil((total * 2) / 3) : Math.floor(total / 2) + 1;
  };

  // Probabilidad de que un bloque vote a favor (0 … 1).
  con.apoyo = function (s, ley, bloque) {
    if (bloque === 'YO') return 0.98;
    const G = s.gob;
    const ideo = ideoDe(s, bloque);
    const neg = (G.negocia[ley.id] && G.negocia[ley.id][bloque]) || 0;
    const relGob = con.relGobernadores(s, bloque);
    let x = 1.7 * (0.5 - Math.abs(ley.ideo - ideo)) + (G.rel[bloque] - 50) / 35 + (G.aprob - 45) / 45 - ley.polemica * 0.7 + neg;
    x += (relGob - 50) / (bloque === 'PROV' ? 30 : 70);
    if (ley.mayoria === 'dos_tercios') x -= 0.5;
    return 1 / (1 + Math.exp(-x * 2.2));
  };

  // Porotos esperados por cámara: { camara: { si, no, necesarios, bloques: [{id, n, p, postura}] } }
  con.porotos = function (s, ley) {
    const out = {};
    for (const camara of ['diputados', 'senado']) {
      const comp = R.composicion(s, camara);
      let si = 0;
      const bloques = [];
      for (const [id, n] of Object.entries(comp)) {
        if (!n) continue;
        const p = con.apoyo(s, ley, id);
        si += n * p;
        bloques.push({ id, n, p, postura: p > 0.7 ? 'si' : p < 0.3 ? 'no' : 'duda' });
      }
      bloques.sort((a, b) => b.n - a.n);
      out[camara] = { si: Math.round(si), total: R.TOTAL_BANCAS[camara], necesarios: con.necesarios(ley, camara), bloques };
    }
    return out;
  };

  con.bloqueoLey = function (s, ley) {
    const st = s.gob.leyesEstado[ley.id];
    if (st && (st.estado === 'aprobada' || st.estado === 'dnu')) return 'Ya es ley';
    if (st && st.estado === 'rechazada' && s.mes - st.mes < 6) return 'Rechazada: de nuevo en ' + (6 - (s.mes - st.mes)) + ' meses';
    if (ley.requiere && !ley.requiere(s)) return ley.requiereTxt || 'No se puede todavía';
    return null;
  };

  // Negociar con un bloque: cuesta ⭐ según su tamaño.
  con.costoNegociar = (s, bloque) => {
    const n = (R.composicion(s, 'diputados')[bloque] || 0) + (R.composicion(s, 'senado')[bloque] || 0) * 2;

  con.negociar = function (s, ley, bloque) {

    G.pc -= c;
    G.negocia[ley.id] = G.negocia[ley.id] || {};
    G.negocia[ley.id][bloque] = (G.negocia[ley.id][bloque] || 0) + 0.9;
    G.rel[bloque] = R.clamp(G.rel[bloque] + 3, 0, 100);
    return { ok: true, costo: c };
  };
  // Fondos a las provincias: sube la relación con todos los gobernadores.
  con.fondosGobernadores = function (s, ley) {
    const G = s.gob;
    R.gob.aplicarEfectos(s, { gastoExtra: 1.5 });
    G.negocia[ley.id] = G.negocia[ley.id] || {};
    for (const b of BLOQUES) G.negocia[ley.id][b] = (G.negocia[ley.id][b] || 0) + (b === 'PROV' ? 1.0 : 0.3);
    for (const p of R.PROVINCIAS) G.gobernadores[p.id].rel = R.clamp(G.gobernadores[p.id].rel + 5, 0, 100);
    return { ok: true };
  };

  // Conteo real: cada banca vota según la probabilidad de su bloque (sin consecuencias).
  con.contarVotos = function (s, ley) {
    const res = { camaras: {}, aprobada: true };
    for (const camara of ['diputados', 'senado']) {
      const comp = R.composicion(s, camara);
      const votos = [];
      let si = 0;
      for (const [id, n] of Object.entries(comp)) {
        const p = con.apoyo(s, ley, id);
        for (let i = 0; i < n; i++) {
          const v = R.rand(s) < p;
          if (v) si++;
          votos.push({ id, si: v });
        }
      }
      const nec = con.necesarios(ley, camara);
      const pasa = si >= nec;
      res.camaras[camara] = { si, no: R.TOTAL_BANCAS[camara] - si, necesarios: nec, pasa, votos };
      if (!pasa) { res.aprobada = false; break; } // si no pasa Diputados, el Senado no la trata
    }
    return res;
  };

  // Votar una ley: cuesta ⭐ y, si sale, se promulga.
  con.votar = function (s, ley) {
    const G = s.gob;
    G.pc = Math.max(0, G.pc - con.COSTO_PRESENTAR);
    const res = con.contarVotos(s, ley);
    if (res.aprobada) res.aplicado = con.promulgar(s, ley, 'aprobada');
    else {
      G.leyesEstado[ley.id] = { estado: 'rechazada', mes: s.mes };
      res.aplicado = R.gob.aplicarEfectos(s, { pc: -1 });

    }

    G.leyesEstado[ley.id] = { estado: como, mes: s.mes };
    G.leyes[ley.id] = true;
    const ef = Object.assign({}, ley.ef || {});
    if (ley.costo && ley.costo.gasto) ef.gastoExtra = ley.costo.gasto;
    if (ley.perm) {
      const p = ley.perm;
      if (p.bonusEmpleo) G.bonusEmpleo = (G.bonusEmpleo || 0) + p.bonusEmpleo;
      if (p.bonusCrec) G.bonusCrec = (G.bonusCrec || 0) + p.bonusCrec;
      if (p.bonusExpo) G.bonusExpo = (G.bonusExpo || 0) + p.bonusExpo;
      if (p.bonusRecauda) G.bonusRecauda = (G.bonusRecauda || 0) + p.bonusRecauda;
      if (p.bonusCalidad) { G.bonusCalidad = G.bonusCalidad || {}; for (const [k, v] of Object.entries(p.bonusCalidad)) G.bonusCalidad[k] = (G.bonusCalidad[k] || 0) + v; }
      if (p.bonusGrupo) { G.bonusGrupo = G.bonusGrupo || {}; for (const [k, v] of Object.entries(p.bonusGrupo)) G.bonusGrupo[k] = (G.bonusGrupo[k] || 0) + v; }

    for (const b of BLOQUES) G.rel[b] = R.clamp(G.rel[b] + (Math.abs(ley.ideo - ideoDe(s, b)) < 0.5 ? 2 : -2), 0, 100);
    R.diario(s, ley.emoji, (como === 'dnu' ? 'Decreto: ' : 'Nueva ley: ') + ley.nombre, 'ley');
    return R.gob.aplicarEfectos(s, ef);
  };

  // Decreto (DNU): sin Congreso, pero cuesta y puede caerse.
  con.COSTO_DNU = 4;
  con.dnu = function (s, ley) {

    if (G.pc < con.COSTO_DNU) return { error: 'Falta capital político ⭐' };
    G.pc -= con.COSTO_DNU;
    const aplicado = con.promulgar(s, ley, 'dnu').concat(R.gob.aplicarEfectos(s, { media: -4, escandalo: 1 }));
    G.dnuPendientes = (G.dnuPendientes || []).concat([{ ley: ley.id, mes: s.mes }]);
    return { ok: true, aplicado };
  };

  // ── Gobernadores ──
  con.ACC_PROV = [
    { id: 'obras', emoji: '🏗️', nombre: 'Obra pública', costo: { gasto: 1 }, rel: 15, ef: { infra: 1, trabajadores: 1 } },

    { id: 'visita', emoji: '🤝', nombre: 'Visitarlo', costo: { pc: 1 }, rel: 8, ef: {} },

  con.bloqueoProv = function (s, provId, acc) {

    s.camp.presencia[provId] = R.clamp((s.camp.presencia[provId] || 0) + (accId === 'visita' ? 12 : 6), 0, 100);
    const ef = Object.assign({}, acc.ef);

    if (acc.costo.pc) ef.pc = -acc.costo.pc;

  // Cada mes los gobernadores se olvidan un poco de los favores.

    R.RIVALES.forEach((id) => (nac[id] = 0));
    const prov = {};
    // El opositor más fuerte junta el voto enojado.
    const opositor = R.RIVALES.slice().sort((a, b) => R.PARTIDOS[b].base - R.PARTIDOS[a].base)[0];
    for (const p of R.PROVINCIAS) {
      const af = R.camp.afinidad(s, p);

      let yo = (6 + 0.62 * G.aprob) * Math.sqrt(af);
      if (gob && gob.partido === 'YO') yo *= 1.12;
      else if (gob && gob.rel > 70) yo *= 1.04;

      yo = R.clamp(yo, 3, 80);

      for (const id of R.RIVALES) {

        ws[id] = w;
        tot += w;
      }
      const res = { YO: yo };
      for (const id of R.RIVALES) res[id] = ((100 - yo) * ws[id]) / tot;
      prov[p.id] = res;

    for (const camara of ['diputados', 'senado']) {

      let si = 0;

        const p = con.pApoyoJuicio(s, id);
        for (let i = 0; i < n; i++) { const v = R.rand(s) < p; if (v) si++; votos.push({ id, si: v }); }

      const nec = Math.ceil((R.TOTAL_BANCAS[camara] * 2) / 3);
      res.camaras[camara] = { si, no: R.TOTAL_BANCAS[camara] - si, necesarios: nec, pasa: si >= nec, votos };

    s.gob.juicioFondos = 0;

      res.aplicado = R.gob.aplicarEfectos(s, { pc: 2, todos: 2 });

      res.aplicado = [];
      R.diario(s, '⚖️', 'El Congreso te destituyó', 'fin');
    }
    return res;
  };

(function (R) {
  'use strict';

  const mun = (R.mundo = {});

  mun.iniciar = function (s) {
    const paises = {};

      paises[p.id] = { rel: R.clamp(Math.round(p.rel + afin), 0, 100), tratado: false, alianza: false, sancion: false, anexado: false, enfr: {} };
    }

  };

  // ⚔️ Poder militar propio (sale de la calidad de Defensa, leyes y compras).
  mun.poder = (s) => Math.round(15 + s.eco.calidad.defensa * 0.7 + (s.mundo.poderExtra || 0));

  mun.aliados = (s) => R.PAISES.filter((p) => s.mundo.paises[p.id].alianza && !s.mundo.paises[p.id].anexado);

  // Fuerza total en una guerra contra «enemigo»: tu poder + aliados que se suman; el enemigo + su bloque.
  mun.fuerzas = function (s, enemigo) {
    const E = R.PAIS[enemigo];
    let yo = mun.poder(s);
    const misAliados = [];
    for (const a of mun.aliados(s)) {
      if (a.id === enemigo || (E.bloque && a.bloque === E.bloque) || s.mundo.paises[a.id].rel < 50) continue;
      yo += a.poder * 0.35;
      misAliados.push(a.id);
    }
    let el = E.poder;
    const susAliados = [];
    if (E.bloque) {
      for (const p of R.PAISES) {
        if (p.id === enemigo || p.bloque !== E.bloque || s.mundo.paises[p.id].anexado || misAliados.includes(p.id)) continue;
        el += p.poder * 0.35;
        susAliados.push(p.id);
      }
    }

  };

  mun.ACCIONES = [
    { id: 'visita', emoji: '✈️', nombre: 'Visita oficial', costo: { pc: 1 }, enfr: 4, si: (s, p, st) => !st.anexado && !mun.enGuerraCon(s, p.id),
      hacer: (s, p, st) => { st.rel = R.clamp(st.rel + 10, 0, 100); return { txt: 'Foto con el gobierno de ' + p.nombre + ' 🤝', ef: {} }; } },

          if (rivales) s.mundo.paises[q.id].rel = R.clamp(s.mundo.paises[q.id].rel - 12, 0, 100);
        }
        return { txt: '🛡️ Alianza militar con ' + p.nombre, ef: { media: 1 } };
      } },
    { id: 'sancion', emoji: '🚫', nombre: 'Sanciones', costo: { pc: 1 }, si: (s, p, st) => !st.sancion && !st.anexado,
      hacer: (s, p, st) => {
        st.sancion = true;
        st.rel = R.clamp(st.rel - 30, 0, 100);
        if (st.tratado) { st.tratado = false; s.gob.bonusExpo = (s.gob.bonusExpo || 0) - p.expo; }
        return { txt: 'Sanciones a ' + p.nombre + ' 🚫', ef: p.id === 'GBR' ? { todos: 2 } : { empresarios: -2 } };
      } },
    { id: 'guerra', emoji: '⚔️', nombre: 'Declarar la guerra', costo: { pc: 5 }, si: (s, p, st) => p.conquistable && !st.anexado && !s.mundo.guerra,
      hacer: (s, p) => mun.empezarGuerra(s, p.id, 'anexar') },
  ];
  mun.ACC = Object.fromEntries(mun.ACCIONES.map((a) => [a.id, a]));
  mun.enGuerraCon = (s, id) => !!(s.mundo.guerra && s.mundo.guerra.pais === id);

  mun.bloqueo = function (s, paisId, accId) {
    const a = mun.ACC[accId];
    const p = R.PAIS[paisId];
    const st = s.mundo.paises[paisId];
    if (a.si && !a.si(s, p, st)) return 'No aplica';
    if (a.req && st.rel < a.req) return 'Necesitás mejor relación (' + a.req + ')';
    if (a.enfr && st.enfr[accId] !== undefined && s.mes - st.enfr[accId] < a.enfr) return 'De nuevo en ' + (a.enfr - (s.mes - st.enfr[accId])) + ' meses';
    if (a.costo.pc && s.gob.pc < a.costo.pc) return 'Falta ⭐';
    return null;
  };

  mun.hacer = function (s, paisId, accId) {
    const b = mun.bloqueo(s, paisId, accId);
    if (b) return { error: b };
    const a = mun.ACC[accId];
    const p = R.PAIS[paisId];
    const st = s.mundo.paises[paisId];
    s.gob.pc -= a.costo.pc || 0;
    st.enfr[accId] = s.mes;
    const antes = s.gob.aprob;
    const r = a.hacer(s, p, st);
    const aplicado = R.gob.aplicarEfectos(s, r.ef || {});
    R.diario(s, a.emoji, a.nombre + ': ' + p.nombre, 'mundo');
    return { txt: r.txt, bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // Comprar armamento.
  mun.COMPRA = { costo: { pc: 1, gasto: 4 }, poder: 10, enfr: 12 };
  mun.comprarArmas = function (s, proveedor) {
    const k = 'armas';
    if (s.gob.enfr[k] !== undefined && s.mes - s.gob.enfr[k] < mun.COMPRA.enfr) return { error: 'De nuevo en ' + (mun.COMPRA.enfr - (s.mes - s.gob.enfr[k])) + ' meses' };
    if (s.gob.pc < 1) return { error: 'Falta ⭐' };
    s.gob.pc -= 1;
    s.gob.enfr[k] = s.mes;
    s.mundo.poderExtra = (s.mundo.poderExtra || 0) + mun.COMPRA.poder;
    s.mundo.paises[proveedor].rel = R.clamp(s.mundo.paises[proveedor].rel + 8, 0, 100);
    const antes = s.gob.aprob;
    const aplicado = R.gob.aplicarEfectos(s, { gastoExtra: mun.COMPRA.costo.gasto, defensa: 3 });
    R.diario(s, '🛩️', 'Compraste aviones a ' + R.PAIS[proveedor].nombre, 'mundo');
    return { txt: '🛩️ Llegan aviones de ' + R.PAIS[proveedor].nombre + ': poder militar ▲', bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // ── Malvinas ──
  mun.MALVINAS = [
    { id: 'onu', emoji: '🇺🇳', nombre: 'Reclamo en la ONU', costo: { pc: 2 }, enfr: 6,
      avance: (s) => 6 + Math.max(0, (s.mundo.paises.USA.rel - 50) / 10) + Math.max(0, (s.mundo.paises.CHN.rel - 50) / 10) },
    { id: 'negociar', emoji: '🤝', nombre: 'Negociar con el Reino Unido', costo: { pc: 4 }, enfr: 6, req: 50,
      avance: (s) => 10 + (s.mundo.paises.GBR.rel - 50) / 4 },
  ];
  mun.bloqueoMalvinas = function (s, id) {
    const a = mun.MALVINAS.find((x) => x.id === id);
    const M = s.mundo.malvinas;
    if (M.recuperadas) return 'Ya son argentinas 🇦🇷';
    if (a.req && s.mundo.paises.GBR.rel < a.req) return 'El Reino Unido no quiere hablar (relación ' + a.req + ')';
    const k = 'mlv_' + id;
    if (s.gob.enfr[k] !== undefined && s.mes - s.gob.enfr[k] < a.enfr) return 'De nuevo en ' + (a.enfr - (s.mes - s.gob.enfr[k])) + ' meses';
    if (s.gob.pc < a.costo.pc) return 'Falta ⭐';
    return null;
  };
  mun.malvinas = function (s, id) {
    const b = mun.bloqueoMalvinas(s, id);
    if (b) return { error: b };
    const a = mun.MALVINAS.find((x) => x.id === id);
    s.gob.pc -= a.costo.pc;
    s.gob.enfr['mlv_' + id] = s.mes;
    const M = s.mundo.malvinas;
    const av = Math.round(R.clamp(a.avance(s), 2, 25));
    M.soberania = Math.min(100, M.soberania + av);
    if (id === 'negociar') s.mundo.paises.GBR.rel = R.clamp(s.mundo.paises.GBR.rel - 3, 0, 100);
    const antes = s.gob.aprob;
    let ef = { todos: 1 };
    let txt = a.emoji + ' La soberanía avanza: ' + M.soberania + '%';
    if (M.soberania >= 100) {
      M.recuperadas = true;
      ef = { todos: 15 };
      txt = '🇦🇷 ¡LAS MALVINAS SON ARGENTINAS! Acuerdo histórico';
      R.diario(s, '🇦🇷', '¡Recuperaste las Malvinas por la vía diplomática!', 'mundo');
    }
    const aplicado = R.gob.aplicarEfectos(s, ef);
    return { txt, bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob, especial: M.recuperadas };
  };

  // ── Guerra ──
  mun.empezarGuerra = function (s, paisId, objetivo) {
    const W = { pais: paisId, objetivo, frente: 50, meses: 0 };
    s.mundo.guerra = W;
    for (const p of R.PAISES) {
      const st = s.mundo.paises[p.id];
      if (p.id === paisId) { st.rel = 0; st.alianza = false; if (st.tratado) { st.tratado = false; s.gob.bonusExpo = (s.gob.bonusExpo || 0) - p.expo; } continue; }
      if (!st.alianza) st.rel = R.clamp(st.rel - 12, 0, 100);
    }
    R.diario(s, '⚔️', '¡Guerra contra ' + R.PAIS[paisId].nombre + '!', 'mundo');
    return { txt: '⚔️ ¡Empezó la guerra contra ' + R.PAIS[paisId].nombre + '!', ef: { todos: 6, riesgo: 300, crec: -1.5 } };
  };
  mun.recuperarMalvinas = function (s) {
    if (s.mundo.guerra || s.mundo.malvinas.recuperadas) return { error: 'No se puede ahora' };
    if (s.gob.pc < 5) return { error: 'Falta ⭐' };
    s.gob.pc -= 5;
    const antes = s.gob.aprob;
    const r = mun.empezarGuerra(s, 'GBR', 'malvinas');
    const aplicado = R.gob.aplicarEfectos(s, r.ef);
    return { txt: '⚓ La flota zarpa hacia Malvinas', bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  mun.ORDENES = [
    { id: 'ofensiva', emoji: '⚔️', nombre: 'Ofensiva', desc: 'Avanzás fuerte', costo: { gasto: 3 } },
    { id: 'defender', emoji: '🛡️', nombre: 'Defender', desc: 'Aguantás y gastás poco', costo: { gasto: 1 } },
    { id: 'paz', emoji: '🕊️', nombre: 'Pedir la paz', desc: 'Termina la guerra', costo: {} },
  ];

  // Una orden de guerra (se da cada mes). Devuelve { txt, delta, fin?, aplicado }.
  mun.orden = function (s, id) {
    const W = s.mundo.guerra;
    const F = mun.fuerzas(s, W.pais);
    const P = R.PAIS[W.pais];
    let delta = 0;
    let ef = {};
    W.meses++;
    if (id === 'paz') return mun.terminarGuerra(s, W.frente >= 55 ? 'paz_buena' : 'paz_mala');
    if (id === 'ofensiva') { delta = 15 * (F.ratio - 0.85) + R.gauss(s) * 7; ef = { gastoExtra: 3 }; }
    else { delta = 6 * (F.ratio - 1.05) + R.gauss(s) * 4; ef = { gastoExtra: 1 }; }
    W.frente = R.clamp(W.frente + delta, 0, 100);
    ef.crec = -1;
    ef.todos = W.meses <= 2 ? 2 : -2; // al principio patriotismo, después cansancio
    if (delta < -6) ef.todos -= 2;
    const aplicado = R.gob.aplicarEfectos(s, ef);
    let txt = delta > 4 ? '¡Avanzamos en el frente! 🎖️' : delta < -4 ? 'Retrocedemos… ' + P.nombre + ' contraataca 😰' : 'El frente casi no se mueve';
    if (W.frente >= 100) return Object.assign(mun.terminarGuerra(s, 'victoria'), { delta });
    if (W.frente <= 0) return Object.assign(mun.terminarGuerra(s, 'derrota'), { delta });
    return { txt, delta, aplicado, bueno: delta >= 0 };
  };

  mun.terminarGuerra = function (s, como) {
    const W = s.mundo.guerra;
    const P = R.PAIS[W.pais];
    const st = s.mundo.paises[W.pais];
    s.mundo.guerra = null;
    let ef = {};
    let txt = '';
    if (como === 'victoria') {
      if (W.objetivo === 'malvinas') {
        s.mundo.malvinas.recuperadas = true;
        s.mundo.malvinas.soberania = 100;
        ef = { todos: 18, riesgo: 200 };
        txt = '🇦🇷 ¡RECUPERAMOS LAS MALVINAS!';
      } else {
        st.anexado = true;
        s.eco.pbi *= 1 + P.tam;
        s.mundo.resistencia = (s.mundo.resistencia || 0) + 12;
        for (const q of R.PAISES) if (q.id !== P.id && !s.mundo.paises[q.id].alianza) s.mundo.paises[q.id].rel = R.clamp(s.mundo.paises[q.id].rel - 15, 0, 100);
        ef = { todos: 10, reservas: 4 + P.tam * 10, riesgo: 250 };
        txt = '🏴 ¡Ganaste la guerra! ' + P.nombre + ' ahora es parte de la Argentina';
      }
    } else if (como === 'derrota') {
      ef = { todos: -22, reservas: -8, deuda: 5, riesgo: 500, escandalo: 3 };
      txt = '💀 Perdiste la guerra contra ' + P.nombre;
      st.rel = 10;
    } else if (como === 'paz_buena') {
      ef = { todos: 4, reservas: 3 };
      txt = '🕊️ Paz con ventaja: ' + P.nombre + ' paga una indemnización';
      st.rel = 20;
    } else {
      ef = { todos: -6, reservas: -4 };
      txt = '🕊️ Paz con derrota: pagás una indemnización a ' + P.nombre;
      st.rel = 25;
    }
    R.diario(s, como === 'victoria' ? '🎖️' : '🕊️', txt, 'mundo');
    const aplicado = R.gob.aplicarEfectos(s, ef);
    return { txt, aplicado, fin: como, bueno: como === 'victoria' || como === 'paz_buena' };
  };

  // Cada mes: la guerra pide una orden, la resistencia de lo anexado y las relaciones se acomodan.
  mun.mes = function (s, momentos) {
    if (!s.mundo) return;
    if (s.mundo.guerra) momentos.push({ tipo: 'guerra' });
    if (s.mundo.resistencia > 0) {
      s.mundo.resistencia--;
      R.gob.aplicarEfectos(s, { todos: -0.4 });
    }
    for (const p of R.PAISES) {
      const st = s.mundo.paises[p.id];
      if (st.anexado) continue;
      const meta = st.alianza ? 70 : R.clamp(p.rel + 18 * (0.5 - Math.abs(p.ideo - s.partido.ideo)), 0, 100);
      st.rel = R.clamp(st.rel + (meta - st.rel) * 0.02, 0, 100);
    }
  };

  // Fichas extra para el mapa (países anexados).
  mun.fichasMapa = function (s) {
    if (!s.mundo) return [];
    const out = [];
    for (const p of R.PAISES) if (s.mundo.paises[p.id].anexado && p.fichas) for (const f of p.fichas) out.push({ id: f.id, hex: f.hex, abrev: f.abrev, nombre: p.nombre + ' (anexado)', pais: p.id });
    return out;
  };
})(globalThis.R = globalThis.R || {});

</script>

// Logros (se guardan en el dispositivo) y legado final con título.
(function (R) {

  R.LOGROS = [
    { id: 'primera_vuelta', emoji: '🥇', nombre: 'Ganaste en primera vuelta', si: (s) => s.flags.ganoEn === 'primera' },
    { id: 'ballotage', emoji: '⚔️', nombre: 'Ganaste un ballotage', si: (s) => s.flags.ganoEn === 'ballotage' },
    { id: 'manos_limpias', emoji: '🧼', nombre: 'Presidente sin plata de empresarios', si: (s) => s.fase === 'gobierno' && !s.flags.plataEmpresas },
    { id: 'bancada', emoji: '🏛️', nombre: 'Más de 50 diputados propios', si: (s) => (R.composicion(s, 'diputados').YO || 0) > 50 },
    { id: 'mayoria', emoji: '🏛️', nombre: 'Mayoría propia en el Congreso', si: (s) => s.gob && R.congreso.mayoria(s) },
    { id: 'medio_termino', emoji: '🗳️', nombre: 'Ganaste un medio término', si: (s) => s.elecciones.legislativa && s.elecciones.legislativa.ganador === 'YO' },
    { id: 'reelecto', emoji: '🏆', nombre: 'Reelecto/a', si: (s) => s.gob && s.gob.mandato >= 2 },
    { id: 'tres_mandatos', emoji: '👑', nombre: 'Tercer mandato', si: (s) => s.gob && s.gob.mandato >= 3 },
    { id: 'un_digito', emoji: '🎯', nombre: 'Inflación de un dígito', si: (s) => enGob(s) && s.gob.meses >= 12 && s.eco.inflAnual < 10 },
    { id: 'superavit', emoji: '⚖️', nombre: 'Superávit fiscal', si: (s) => enGob(s) && R.eco.resultado(s) > 0 },
    { id: 'pobreza_20', emoji: '🏠', nombre: 'Pobreza por debajo del 20 %', si: (s) => enGob(s) && s.eco.pobreza < 20 },
    { id: 'pleno_empleo', emoji: '👷', nombre: 'Desempleo por debajo del 5 %', si: (s) => enGob(s) && s.eco.desempleo < 5 },
    { id: 'reservas_100', emoji: '🏦', nombre: 'Más de US$ 100 mil M de reservas', si: (s) => enGob(s) && s.eco.reservas > 100 },
    { id: 'aprob_70', emoji: '😍', nombre: 'Aprobación de más del 70 %', si: (s) => enGob(s) && s.gob.aprob > 70 },
    { id: 'todos_contentos', emoji: '🥳', nombre: 'Los 6 grupos contentos a la vez', si: (s) => enGob(s) && R.GRUPOS.every((g) => s.gob.grupos[g.id].humor >= 60) },
    { id: 'crece_4', emoji: '🚀', nombre: 'La economía crece más del 4 %', si: (s) => enGob(s) && s.eco.crec > 4 },
    { id: 'diez_leyes', emoji: '📜', nombre: '10 leyes aprobadas', si: (s) => s.gob && Object.values(s.gob.leyesEstado || {}).filter((x) => x.estado === 'aprobada').length >= 10 },
    { id: 'decretazo', emoji: '✍️', nombre: '3 decretos firmados', si: (s) => s.gob && Object.values(s.gob.leyesEstado || {}).filter((x) => x.estado === 'dnu').length >= 3 },
    { id: 'gobernadores', emoji: '🗺️', nombre: '12 gobernadores aliados', si: (s) => s.gob && s.gob.gobernadores && R.PROVINCIAS.filter((p) => s.gob.gobernadores[p.id].rel >= 70).length >= 12 },
    { id: 'cinco_tratados', emoji: '📦', nombre: '5 tratados comerciales', si: (s) => s.mundo && R.PAISES.filter((p) => s.mundo.paises[p.id].tratado).length >= 5 },
    { id: 'aliado_eeuu', emoji: '🦅', nombre: 'Alianza con Estados Unidos', si: (s) => s.mundo && s.mundo.paises.USA.alianza },
    { id: 'aliado_china', emoji: '🐉', nombre: 'Alianza con China', si: (s) => s.mundo && s.mundo.paises.CHN.alianza },
    { id: 'malvinas_paz', emoji: '🕊️', nombre: 'Malvinas por la diplomacia', si: (s) => s.mundo && s.mundo.malvinas.recuperadas && !contar(s, 'mundo', /RECUPERAMOS/) },
    { id: 'malvinas_guerra', emoji: '⚓', nombre: 'Malvinas por la fuerza', si: (s) => s.mundo && s.mundo.malvinas.recuperadas && contar(s, 'mundo', /RECUPERAMOS/) > 0 },
    { id: 'conquistador', emoji: '🏴', nombre: 'Anexaste un país', si: (s) => s.mundo && R.PAISES.some((p) => s.mundo.paises[p.id].anexado) },
    { id: 'imperio', emoji: '👑', nombre: 'Anexaste 3 países', si: (s) => s.mundo && R.PAISES.filter((p) => s.mundo.paises[p.id].anexado).length >= 3 },
    { id: 'campeon', emoji: '⚽', nombre: 'Campeones del mundo en tu gobierno', si: (s) => !!s.flags.campeon },
    { id: 'mandato_completo', emoji: '🏁', nombre: 'Terminaste un mandato', si: (s) => s.gob && (s.gob.mandato >= 2 || (s.fin && s.fin.motivo === 'mandato')) },
    { id: 'oposicion', emoji: '🔄', nombre: 'Ganaste desde la oposición', si: (s) => s.fase === 'gobierno' && !!s.flags.vinoDeOposicion },
    { id: 'hiper', emoji: '💸', nombre: 'Hiperinflación (más de 1000 %)', malo: true, si: (s) => enGob(s) && s.eco.inflAnual > 1000 },
    { id: 'helicoptero', emoji: '🚁', nombre: 'Te fuiste en helicóptero', malo: true, si: (s) => s.fin && (s.fin.motivo === 'helicoptero' || s.fin.motivo === 'estallido') },
    { id: 'juicio', emoji: '🛡️', nombre: 'Sobreviviste a un juicio político', si: (s) => s.diario.some((d) => d.txt === 'Sobreviviste al juicio político') },
  ];

  const CLAVE = 'logros';
  R.logrosGuardados = () => R.pref(CLAVE) || {};

  // Revisa logros nuevos. Devuelve la lista de los que se desbloquearon ahora.
  R.revisarLogros = function (s) {
    const guardados = R.logrosGuardados();
    s.logros = s.logros || {};
    const nuevos = [];
    for (const l of R.LOGROS) {
      if (s.logros[l.id]) continue;
      let ok = false;
      try { ok = !!l.si(s); } catch (e) { ok = false; }
      if (!ok) continue;
      s.logros[l.id] = s.mes;
      if (!guardados[l.id]) { guardados[l.id] = Date.now(); nuevos.push(l); }
    }
    if (nuevos.length) R.pref(CLAVE, guardados);
    return nuevos;
  };

  // ── Legado al terminar ──
  R.legado = function (s) {
    if (!s.gob) return null;
    const e = s.eco;
    const ini = s.gob.historia[0] || { inflAnual: 27, pobreza: 34, desempleo: 7.8, aprob: 55 };
    let p = 50;
    p += (s.gob.aprob - 50) * 0.35;
    p += R.clamp((ini.inflAnual - e.inflAnual) * 0.25, -20, 12);
    p += (ini.pobreza - e.pobreza) * 0.9;
    p += (ini.desempleo - e.desempleo) * 1.5;
    p += R.clamp((e.pbi - 100) * 0.4, -15, 15);
    p += Object.values(s.gob.leyesEstado || {}).filter((x) => x.estado === 'aprobada').length * 0.6;
    p += (s.gob.mandato - 1) * 6;
    const anex = s.mundo ? R.PAISES.filter((x) => s.mundo.paises[x.id].anexado).length : 0;
    const malvinas = s.mundo && s.mundo.malvinas.recuperadas;
    p += anex * 4 + (malvinas ? 15 : 0);
    if (s.fin && ['helicoptero', 'estallido', 'juicio'].includes(s.fin.motivo)) p -= 25;
    const puntos = Math.round(R.clamp(p, 0, 100));
    const estrellas = puntos >= 85 ? 5 : puntos >= 68 ? 4 : puntos >= 50 ? 3 : puntos >= 32 ? 2 : 1;
    let titulo = ['Un desastre nacional', 'Una gestión olvidable', 'Una gestión correcta', 'Una gran presidencia', 'Prócer de la Patria'][estrellas - 1];
    if (s.fin && s.fin.motivo === 'helicoptero') titulo = 'La del helicóptero';
    else if (e.inflAnual > 1000) titulo = 'La de la hiperinflación';
    else if (malvinas) titulo = 'La que recuperó Malvinas';
    else if (anex >= 2) titulo = 'Conquista del Cono Sur';
    else if (s.diario.some((d) => d.txt === 'Motosierra') && estrellas >= 3) titulo = 'Motosierra de oro';
    return { puntos, estrellas, titulo };
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/ui/dom.js ──
// Ayudantes de interfaz: crear nodos, ventanas, avisos, chips de efectos y animaciones.
(function (R) {
  'use strict';

  const ui = (R.ui = R.ui || {});

  // h('div', {class: 'x', onclick: fn, style: {...}}, hijos...)
  const h = (R.h = function (tag, props, ...hijos) {
    const el = document.createElementNS(tag === 'svg' || props?.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false || k === 'svg') continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else el.setAttribute(k === 'className' ? 'class' : k, v === true ? '' : v);
      }
    }
    agregar(el, hijos);
    return el;
  });
  function agregar(el, hijos) {
    for (const c of hijos) {
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) agregar(el, c);
      else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
  }
  // SVG: s('circle', {...})
  R.svg = (tag, props, ...hijos) => h(tag, Object.assign({ svg: true }, props), ...hijos);

  ui.montar = function (nodo, ancha) {
    const app = document.getElementById('app');
    const scroll = window.scrollY;
    app.className = 'app' + (ancha ? ' ancha' : '');
    app.replaceChildren(nodo);
    return scroll;
  };

  // ── Ventanas encima (hoja que sube desde abajo en el celu, centrada en la PC) ──
  let capaAbierta = null;
  ui.hayCapa = () => !!capaAbierta;
  ui.abrirCapa = function (contenido, opts) {
    opts = opts || {};
    ui.cerrarCapa(true);
    if (!opts.dejarAvisos) document.getElementById('avisos').replaceChildren();
    const capa = document.getElementById('capa');
    capa.className = 'capa' + (opts.oscura ? ' oscura' : '');
    const hoja = opts.oscura ? contenido : h('div', { class: 'hoja ' + (opts.clase || ''), role: 'dialog', 'aria-modal': 'true' },
      opts.cerrable ? h('button', { class: 'boton mini sec cerrar', onclick: () => ui.cerrarCapa(), 'aria-label': 'Cerrar' }, '✕') : null,
      contenido);
    capa.replaceChildren(hoja);
    capa.hidden = false;
    capaAbierta = { opts };
    if (opts.cerrable) {
      capa.onclick = (e) => { if (e.target === capa) ui.cerrarCapa(); };
    } else capa.onclick = null;
    const foco = hoja.querySelector('[autofocus]') || hoja.querySelector('button:not(.cerrar)');
    if (foco && !opts.sinFoco) setTimeout(() => foco.focus({ preventScroll: true }), 30);
    hoja.scrollTop = 0;
    return hoja;
  };
  ui.cerrarCapa = function (silencioso) {
    const capa = document.getElementById('capa');
    if (!capaAbierta) return;
    const opts = capaAbierta.opts;
    capaAbierta = null;
    capa.hidden = true;
    capa.replaceChildren();
    if (!silencioso && opts.alCerrar) opts.alCerrar();
  };

  // ── Avisos cortos arriba (resultado de una acción) ──
  ui.aviso = function (txt, opts) {
    opts = opts || {};
    const caja = document.getElementById('avisos');
    const el = h('div', { class: 'aviso ' + (opts.tipo || '') },
      h('div', { class: 'txt' }, txt),
      opts.efectos && opts.efectos.length ? ui.chipsEfectos(opts.efectos) : null,
      opts.extra || null);
    caja.appendChild(el);
    while (caja.children.length > 2) caja.firstChild.remove();
    const dur = opts.dur || 2600 + (opts.efectos ? opts.efectos.length * 250 : 0);
    setTimeout(() => {
      el.classList.add('saliendo');
      setTimeout(() => el.remove(), 320);
    }, dur);
    el.addEventListener('click', () => el.remove());
    return el;
  };

  // Chips de efectos: [{emoji, nombre, flechas, sube, bueno}] → «👁️ Te conocen ▲▲»
  ui.chipsEfectos = function (lista, opts) {
    opts = opts || {};
    return h('div', { class: 'efectos' }, opts.antes || null, lista.map((e) => {
      const fl = (e.sube ? '▲' : '▼').repeat(e.flechas);

<script>
// ── js/ui/eleccion.js ──
// Noche de elecciones: escrutinio animado, mapa que se pinta y el Congreso que queda.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  ui.eleccion = function (s, clave, alTerminar) {
    const res = s.elecciones[clave];
    if (!res) return alTerminar();
    const lista = res.lista.slice(0, clave === 'ballotage' ? 2 : 6);
    const lentos = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const DUR = lentos ? 6500 : 300;

    // Orden en que «terminan» de contar las provincias (las chicas primero, como en la tele).
    const orden = R.PROVINCIAS.slice().sort((a, b) => a.padron - b.padron + (Math.random() - 0.5) * 3);
    const terminadas = new Set();

    const pctEl = h('span', null, '0');
    const barraEsc = h('i', { style: { width: '0%' } });
    const lineas = lista.map((x) => {
      const p = R.partidoInfo(s, x.id);
      const pista = h('i', { style: { width: '0%', background: p.color } });
      const num = h('div', { class: 'pct' }, '0,0');
      const av = x.id === 'YO' ? R.ui.avatar(s.lider.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) })
        : R.ui.avatar(R.PARTIDOS[x.id].candidato.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) });
      const el = h('div', { class: 'linea' + (x.id === 'YO' ? ' yo' : '') }, av,
        h('div', { class: 'nombre' }, R.elec.nombre(s, x.id), h('small', null, p.simbolo + ' ' + p.sigla), h('div', { class: 'pista' }, pista)), num);
      return { x, el, pista, num };
    });
    const mapaCaja = h('div');
    const pintarMapa = () => mapaCaja.replaceChildren(R.ui.mapa({
      sinMalvinas: true,
      colorDe: (id) => (terminadas.has(id) ? R.elec.color(s, res.ganadores[id]) : '#2a3b5e'),
    }));
    pintarMapa();
    const veredicto = h('div');
    const despues = h('div', { class: 'pila' });
    const saltar = h('button', { class: 'boton mini sec', onclick: () => { t0 = -1e9; } }, '⏩ Ver resultado');
    const cont = h('div', { class: 'noche' },
      h('h2', null, '🗳️ ' + res.titulo),
      h('div', { class: 'escrutinio' }, 'Mesas escrutadas: ', pctEl, '%'),
      h('div', { class: 'barra gorda' }, barraEsc),
      h('div', { class: 'noche-cuerpo' },
        h('div', { class: 'carrera' }, lineas.map((l) => l.el)),
        h('div', { class: 'mapa-noche' }, mapaCaja)),
      h('div', { class: 'centro' }, saltar),
      veredicto, despues);
    ui.abrirCapa(cont, { oscura: true });
    R.son.tambor();

    let t0 = performance.now();
    let ultimoTic = 0;
    const max = Math.max(...lista.map((x) => x.v));
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / DUR);
      const e = 1 - Math.pow(1 - k, 2);
      pctEl.textContent = R.fmt(e * 100, 1);
      barraEsc.style.width = e * 100 + '%';
      // Al principio los números bailan (cuentan primero ciertas mesas) y se acomodan al final.
      lineas.forEach((l, i) => {
        const ruido = Math.sin(t / 380 + i * 1.7) * 3.2 * (1 - e);
        const v = Math.max(0, l.x.v + ruido) * Math.min(1, e * 1.6);
        l.num.textContent = R.fmt(v, 1);
        l.pista.style.width = (Math.max(0, v) / (max * 1.08)) * 100 + '%';
      });
      const nTerm = Math.floor(e * orden.length);
      if (nTerm > terminadas.size) {
        for (let i = terminadas.size; i < nTerm; i++) terminadas.add(orden[i].id);
        pintarMapa();
      }
      if (t - ultimoTic > 160 && k < 1) { R.son.tic(); ultimoTic = t; }
      if (k < 1) requestAnimationFrame(paso);
      else terminar();
    };
    requestAnimationFrame(paso);

    function terminar() {
      orden.forEach((p) => terminadas.add(p.id));
      pintarMapa();
      lineas.forEach((l) => { l.num.textContent = R.fmt(l.x.v, 1); l.pista.style.width = (l.x.v / (max * 1.08)) * 100 + '%'; });
      saltar.remove();
      const yo = res.lista.find((x) => x.id === 'YO');
      const puesto = res.lista.indexOf(yo) + 1;
      let txt;
      let gana = true;
      const gobernando = !!s.gob;
      if (clave === 'paso') {
        gana = res.pasa;
        txt = res.pasa ? (puesto === 1 ? '¡Ganaste las PASO! 🥇' : '¡Pasaste a las generales! Saliste ' + puesto + '.º') : 'Quedaste afuera… no llegaste al 1,5 %';
      } else if (clave === 'legislativa') {
        gana = res.ganador === 'YO';
        txt = gana ? '¡Ganaste el medio término con ' + R.fmt(yo.v, 1) + '%! 🗳️' : 'Perdiste el medio término: sacaste ' + R.fmt(yo.v, 1) + '%';
      } else if (clave === 'general') {
        if (res.ganador === 'YO') txt = gobernando ? '¡REELECTO/A EN PRIMERA VUELTA! 🏆' : '¡GANASTE EN PRIMERA VUELTA! 🏆';
        else if (res.ballotage && res.ballotage.includes('YO')) txt = '¡Vamos al ballotage contra ' + R.elec.nombre(s, res.ballotage.find((x) => x !== 'YO')) + '! ⚔️';
        else { gana = false; txt = (gobernando ? 'Perdiste la reelección. ' : 'Perdiste. ') + 'Saliste ' + puesto + '.º'; }
      } else {
        gana = res.ganador === 'YO';
        txt = gana ? (gobernando ? '¡REELECTO/A EN EL BALLOTAGE! 🏆' : '¡GANASTE EL BALLOTAGE! 🏆') : 'Perdiste el ballotage por ' + R.fmt(res.lista[0].v - res.lista[1].v, 1) + ' puntos';
      }
      veredicto.replaceChildren(h('div', { class: 'veredicto ' + (gana ? 'gana' : 'pierde') }, txt));
      if (gana) {
        R.son.aplausos();
        if ((clave === 'general' && res.ganador === 'YO') || clave === 'ballotage' || clave === 'legislativa') { ui.confeti(); R.son.genial(); }
      } else R.son.abucheo();

      const extras = [];
      if (res.perdidos > 0.3) extras.push(h('div', { class: 'tarjeta chico' }, '⚠️ Te faltaron fiscales: perdiste ' + R.fmt(res.perdidos, 1) + ' puntos en las mesas.'));
      if (res.bancas) extras.push(congresoNuevo(s, res));
      extras.push(h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, 'Seguir ▶'));
      despues.replaceChildren(...extras);
      const btn = despues.querySelector('.boton');
      if (btn) setTimeout(() => btn.focus({ preventScroll: true }), 50);
    }
  };

  function congresoNuevo(s, res) {
    const dip = R.composicion(s, 'diputados');
    const sen = R.composicion(s, 'senado');
    const misDip = res.bancas.dip.YO || 0;
    const misSen = res.bancas.sen.YO || 0;
    const camara = (nombre, comp, mias, total) => h('div', { class: 'tarjeta pila', style: { gap: '4px', padding: '10px' } },
      h('div', { class: 'etiqueta centro' }, nombre),
      R.ui.hemiciclo(R.ui.gruposCamara(s, comp), { centro: comp.YO || 0, sub: 'de ' + total, resaltar: 'YO' }),
      h('div', { class: 'centro chico' }, mias ? '+' + mias + ' bancas nuevas' : 'Sin bancas nuevas'));
    return h('div', { class: 'pila' },
      h('div', { class: 'centro', style: { fontWeight: 900 } }, '🏛️ Así queda el Congreso'),
      h('div', { class: 'bancas-ganadas' },
        camara('Diputados', dip, misDip, 257),
        camara('Senado', sen, misSen, 72)),
      h('div', { class: 'leyenda', style: { color: '#fff' } }, R.ui.gruposCamara(s, dip).map((g) => {
        const p = R.partidoInfo(s, g.id);
        return h('span', { class: 'chip', style: { background: p.color, color: '#fff', borderColor: '#fff' } }, p.sigla);
      })));
  }
})(globalThis.R = globalThis.R || {});

</script>

        partes.push(h('div', { class: 'estilos' }, Object.entries(E).map(([id, e]) =>

// Pantalla de campaña: tu número, acciones del mes, mapa, encuesta y diario.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  const PESTANAS = [
    { id: 'acciones', emoji: '🎯', nombre: 'Acciones' },
    { id: 'mapa', emoji: '🗺️', nombre: 'Mapa' },
    { id: 'encuesta', emoji: '📊', nombre: 'Encuesta', soloCelu: true },
    { id: 'diario', emoji: '📰', nombre: 'Diario' },
  ];

  ui.esPC = () => window.matchMedia && window.matchMedia('(min-width: 900px)').matches;

  ui.pantallaCampana = function (s) {
    const pc = ui.esPC();
    let tab = (ui.vista && ui.vista.tab) || 'acciones';
    if (pc && tab === 'encuesta') tab = 'acciones';
    const contenido = {
      acciones: () => [pc ? null : resumen(s), tarjetaAcciones(s)],
      mapa: () => tarjetaMapa(s),
      encuesta: () => tarjetaEncuesta(s),
      diario: () => h('section', { class: 'tarjeta pila' }, h('div', { class: 'titulo-seccion' }, '📰 Lo que pasó'), ui.historial(s)),
    }[tab]();
    const cuerpo = pc
      ? h('div', { class: 'columnas' }, h('div', { class: 'col-izq pila' }, resumen(s), tarjetaEncuesta(s)), h('div', { class: 'pila' }, contenido))
      : h('div', { class: 'pila' }, contenido);
    const guia = tab === 'acciones' && s.mes <= 2 && !s.gobRival ? ui.guia('campana', 'Cómo hacer campaña', [
      ['🎯', 'Usá tus acciones del mes', 'Cada carta muestra qué te da: 👁️ que te conozcan, ❤️ caer bien, 🏴 militancia.'],
      ['🗺️', 'Hacé actos donde te quieren', 'Las provincias grandes pesan más: Buenos Aires es casi 4 de cada 10 votos.'],
      ['▶', 'Pasá el mes', 'Llegan noticias, se mueve la encuesta y se acercan las PASO de agosto.'],
    ]) : null;
    const scroll = ui.montar(h('div', null, ui.barraCampana(s), guia, cuerpo), pc);
    if (ui.vista && ui.vista.mantenerScroll) window.scrollTo(0, scroll);
    const b = R.turno.botonPasar(s);
    ui.navInferior(PESTANAS.filter((p) => !(pc && p.soloCelu)), tab, (id) => { R.son.toque(); ui.vista = { tab: id }; ui.render(); window.scrollTo(0, 0); },
      h('button', { class: 'boton grande ancho', id: 'btn-pasar', onclick: () => ui.pasarMes() },
        b.emoji + ' ' + b.txt, s.camp.agenda > 0 ? h('span', { class: 'chip', style: { fontFamily: 'var(--f-texto)', fontSize: '12px' } }, 'te quedan ' + s.camp.agenda) : null));
  };

  // ── Resumen: cuenta regresiva y tus números ──
  function resumen(s) {
    const c = s.camp;

          dato('🏚️', 'Pobreza', ini.pobreza ?? 34, e.pobreza, (v) => R.fmt(v) + '%', true),
          dato('🚪', 'Desempleo', ini.desempleo ?? 7.8, e.desempleo, (v) => R.fmt(v, 1) + '%', true),
          dato('🏦', 'Reservas', ini.reservas ?? 28, e.reservas, (v) => R.fmt(v)),
          dato('💳', 'Deuda', ini.deuda ?? 78, e.deuda, (v) => R.fmt(v) + '%', true))));
    } else {
      const g = s.elecciones.general;
      const yoGen = g ? g.lista.find((x) => x.id === 'YO') : null;
      const mejor = Math.max(...s.encuestas.map((e) => e.YO));
      filas.push(h('div', { class: 'mis-numeros' },
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '📈'), h('div', { class: 'val' }, R.fmt(mejor, 1) + '%'), h('div', { class: 'nom' }, 'mejor encuesta')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🗳️'), h('div', { class: 'val' }, yoGen ? R.fmt(yoGen.v, 1) + '%' : '–'), h('div', { class: 'nom' }, 'en las generales')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🏛️'), h('div', { class: 'val' }, g ? (g.bancas.dip.YO || 0) + (g.bancas.sen.YO || 0) : 0), h('div', { class: 'nom' }, 'bancas ganadas'))));
    }
    const leg = R.legado(s);
    const logrosPartida = R.LOGROS.filter((l) => s.logros && s.logros[l.id]);
    ui.montar(h('main', { class: 'pila', style: { paddingTop: '16px' } },
      h('section', { class: 'tarjeta pila centro' },
        h('div', { style: { fontSize: '60px' } }, m.em),
        s.gob ? h('div', { class: 'fila', style: { justifyContent: 'center' } }, R.ui.avatar(s.lider.avatar, { size: 90, humor: f.motivo === 'mandato' ? 'feliz' : 'triste', banda: f.motivo === 'mandato' })) : null,
        h('h2', { style: { fontSize: '30px' } }, m.t),
        h('p', null, m.d),
        leg ? h('div', { class: 'legado' }, h('div', { class: 'estrellas', 'aria-label': leg.estrellas + ' de 5 estrellas' }, '★'.repeat(leg.estrellas) + '☆'.repeat(5 - leg.estrellas)),
          h('div', { class: 'titulo-legado' }, '«' + leg.titulo + '»'), h('div', { class: 'chico suave' }, 'Legado: ' + leg.puntos + '/100')) : null),
      R.oposicion && R.oposicion.puede(s) ? h('section', { class: 'tarjeta pila centro', style: { background: 'var(--sol-claro)' } },
        h('b', null, '🔄 ¿Seguís en la oposición?'),
        h('p', { class: 'chico' }, 'Tu partido ya existe y tiene ' + ((R.composicion(s, 'diputados').YO || 0)) + ' diputados. Medio término en 2029 y presidenciales en 2031.'),
        h('button', { class: 'boton grande ancho', onclick: () => { R.oposicion.iniciar(s); R.guardar(s); ui.vista = { tab: 'acciones' }; R.son.genial(); ui.render(); window.scrollTo(0, 0); } }, '🗳️ Seguir en la oposición')) : null,
      filas,
      logrosPartida.length ? h('section', { class: 'tarjeta pila' }, h('div', { class: 'titulo-seccion' }, '🏅 Logros de esta partida'),
        h('div', { class: 'vitrina' }, logrosPartida.map((l) => h('div', { class: 'medalla chica' + (l.malo ? ' mala' : '') }, h('span', { class: 'em' }, l.emoji), h('span', null, l.nombre))))) : null,
      h('button', { class: 'boton grande ancho', onclick: () => { R.borrarPartida(); ui.s = null; ui.crear(); } }, '🏴 Fundar otro partido'),
      h('button', { class: 'boton sec ancho', onclick: () => { R.borrarPartida(); ui.s = null; ui.irPortada(); } }, '🏠 Portada'),
      h('section', { class: 'tarjeta pila' }, h('div', { class: 'titulo-seccion' }, '📰 Tu camino'), ui.historial(s, 25))));
  };
})(globalThis.R = globalThis.R || {});

<script>
// ── js/main.js ──
// Arranque y «director de orquesta»: qué pantalla se ve y en qué orden aparecen noticias y elecciones.
(function (R) {
  'use strict';
  const ui = R.ui;
  const h = R.h;

  ui.s = null;
  ui.vista = { tab: 'acciones' };

  ui.irPortada = function () {
    ui.cerrarCapa(true);
    ui.s = null;
    ui.portada();
    window.scrollTo(0, 0);
  };

  ui.continuar = function (s) {
    ui.s = s;
    ui.vista = { tab: s.fase === 'gobierno' ? 'inicio' : 'acciones' };
    ui.render();
    window.scrollTo(0, 0);
    ui.procesarCola();
  };

  ui.render = function () {
    const s = ui.s;
    if (!s) return ui.portada();
    if (s.fase === 'campana') return ui.pantallaCampana(s);
    if (s.fase === 'gobierno' && ui.pantallaGobierno) return ui.pantallaGobierno(s);
    if (s.fase === 'fin') return ui.pantallaFin(s);
    return ui.pantallaElecto(s);
  };

  // Mientras se arma el gobierno: pantalla de presidente electo.
  ui.pantallaElecto = function (s) {
    ui.ocultarNav();
    ui.montar(h('main', { class: 'pila', style: { paddingTop: '16px' } },
      h('section', { class: 'tarjeta pila centro' },
        R.ui.avatar(s.lider.avatar, { size: 110, humor: 'feliz', banda: true }),
        h('h2', null, '¡' + s.lider.nombre + ' ganó la elección!'),
        h('p', null, 'Preparando la asunción…'))));
  };

  // Muestra de a uno los momentos pendientes (noticias, elecciones, debates…).
  ui.procesarCola = function () {
    const s = ui.s;
    if (!s || ui.procesando || ui.hayCapa()) return;
    const m = s.cola[0];
    if (!m) {
      if (ui.mostrarLogros) ui.mostrarLogros(s);
      return;
    }
    ui.procesando = true;
    const listo = () => {
      if (s.cola[0] === m) s.cola.shift();
      if (s.fase === 'fin') s.cola = [];
      R.guardar(s);
      ui.procesando = false;
      ui.render();
      ui.procesarCola();
    };
    switch (m.tipo) {
      case 'noticia': return ui.noticia(s, m, listo);
      case 'eleccion': return ui.eleccion(s, m.clave, listo);
      case 'debate': return ui.debate(s, m, listo);
      case 'asuncion': return ui.asuncion(s, () => { if (R.gob && R.gob.iniciar) R.gob.iniciar(s); listo(); });
      default:
        if (ui.momentos && ui.momentos[m.tipo]) return ui.momentos[m.tipo](s, m, listo);
        return listo();
    }
  };

  // Enter = pasar el mes (en la PC).
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || ui.hayCapa() || !ui.s) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
    if (ui.s.fase === 'campana' || ui.s.fase === 'gobierno') ui.pasarMes();
  });

  // Al cruzar el ancho de PC/celu se redibuja (cambia el diseño de columnas).
  let eraPC = null;
  window.addEventListener('resize', () => {
    const pc = ui.esPC ? ui.esPC() : false;
    if (eraPC !== null && pc !== eraPC && ui.s) ui.render();
    eraPC = pc;
  });

  function arrancar(data) {
    eraPC = ui.esPC ? ui.esPC() : false;
    if (data && data.s && data.s.v === R.VERSION) {
      ui.continuar(data.s);
      return;
    }
    ui.portada();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ s: ui.s }));
  if (hot && hot.ready) hot.ready(arrancar);
  else arrancar((hot && hot.data) || {});
})(globalThis.R = globalThis.R || {});

</script>
