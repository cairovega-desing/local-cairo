<script>
// ── js/motor/gobierno.js ──
// Gobierno: la gente (humor de cada grupo), aprobación, capital político, crisis y el paso del mes.
(function (R) {
  'use strict';

  const gob = (R.gob = {});

  R.MINISTROS = {
    ortodoxo: {
      emoji: '📉', tipo: 'Ortodoxo', nombre: 'Bruno Lagos', desc: 'Baja la inflación, pero enfría la economía',
      ancla: 0.22, riesgo: -90, crec: -0.4, impacto: { trabajadores: -6, humildes: -4, empresarios: 7 },
      avatar: { piel: 0, pelo: 1, colorPelo: 4, anteojos: 2, barba: 0, ropa: 1 },
    },
    heterodoxo: {
      emoji: '📈', tipo: 'Heterodoxo', nombre: 'Marina Paz', desc: 'Empuja el consumo, pero sube la inflación',
      ancla: -0.15, riesgo: 80, crec: 0.6, impacto: { trabajadores: 6, humildes: 5, empresarios: -6 },
      avatar: { piel: 2, pelo: 2, colorPelo: 0, anteojos: 1, barba: 0, ropa: 2 },
    },
    pragmatico: {
      emoji: '🤝', tipo: 'Pragmático', nombre: 'Jorge Ibarra', desc: 'Ni frío ni calor: negocia bien (+1 ⭐ por mes)',
      pcExtra: 1, impacto: {},
      avatar: { piel: 1, pelo: 5, colorPelo: 1, anteojos: 0, barba: 1, ropa: 0 },
    },
  };

  // Elecciones del mandato (mes 0 = enero 2027).
  gob.MES_MEDIO_TERMINO = R.mesNum(2029, 9);
  gob.MES_PRESIDENCIAL = R.mesNum(2031, 9);

  gob.iniciar = function (s) {
    s.fase = 'gobierno';
    s.mes = R.mesNum(R.anio(s.mes), 11);
    s.eco = R.eco.inicial();
    const grupos = {};
    for (const g of R.GRUPOS) {
      const h = R.simpatiaInicialGrupo(g, s.partido.ideo) + 6;
      grupos[g.id] = { humor: h, antes: h, partes: [], partesAntes: [] };
    }
    s.gob = {
      inicio: s.mes, mandato: 1, pc: 8, pcMax: 20, aprob: 55, lunaMiel: 12, ministro: null, grupos,
      leyes: {}, enfr: {}, meses: 0, crisisMeses: 0, escandalo: 0, historia: [], llamas: [],
    };
    gob.actualizarAprob(s);
    if (R.congreso) R.congreso.iniciar(s);
    if (R.mundo) R.mundo.iniciar(s);
    if (R.prod) R.prod.asegurar(s);
    if (R.metas) { R.metas.asegurar(s); s.metas.ofrecido = true; }
    s.gob.historia.push(R.eco.foto(s));
    R.diario(s, '🎖️', 'Asumís la Presidencia', 'gobierno');
    s.cola.push({ tipo: 'escenario' });
    s.cola.push({ tipo: 'ministro' });
    if (R.metas) s.cola.push({ tipo: 'legado' });
  };

  // ── ¿Qué país recibís? (escenario de inicio) ──
  // Cambia cómo arranca la economía. dificultad: 1 a 3 (para mostrar). datos: lo que se ve en la tarjeta.
  const inflacionMensual = (e, mes) => {
    e.inflMes = mes;
    e.inflHist = Array.from({ length: 12 }, () => mes);
    e.inflAnual = R.eco.inflAnualDe(e.inflHist);
  };
  gob.ESCENARIOS = [
    { id: 'normal', emoji: '🇦🇷', nombre: 'Un país normal', desc: 'Ni crisis ni bonanza', dificultad: 1, aplicar: () => {} },
    { id: 'viento', emoji: '🌾', nombre: 'Viento de cola', desc: 'Soja cara y dólares, pero la gente espera mucho', dificultad: 1,
      aplicar: (s) => {
        const e = s.eco;
        inflacionMensual(e, 1.3);
        Object.assign(e, { reservas: 40, riesgo: 550, deuda: 70 });
        if (s.mundo) {
          R.prod.asegurar(s);
          Object.assign(s.mundo.precios, { granos: 1.3, energia: 1.15 });
          s.mundo.ciclos.activos.push({ id: 'boom', quedan: 10, mitiga: 0 });
          s.mundo.ciclos.ultimo = s.mes;
        }
        for (const g of R.GRUPOS) s.gob.grupos[g.id].espera = 10; // la vara arranca alta
      } },
    { id: 'herencia', emoji: '🔥', nombre: 'Herencia pesada', desc: 'Inflación alta, cepo y sin reservas', dificultad: 2,
      aplicar: (s) => {
        const e = s.eco;
        inflacionMensual(e, 6);
        Object.assign(e, { reservas: 6, riesgo: 1800, deuda: 92, cepo: true, brecha: 80, pobreza: 42, desempleo: 9.5, salarioReal: 88 });
        s.gob.pc += 4; // en la crisis te dan más margen al principio
        s.gob.lunaMiel += 6;
        if (s.prod) s.prod.sec.industria.nivel = 5;
      } },
    { id: 'default', emoji: '💥', nombre: 'Default', desc: 'No pagás la deuda y nadie te presta', dificultad: 3,
      aplicar: (s) => {
        const e = s.eco;
        inflacionMensual(e, 4);
        Object.assign(e, { reservas: 3, riesgo: 2800, deuda: 110, pobreza: 40, desempleo: 11, salarioReal: 85, crec: -2 });
        s.gob.pc += 3;
        s.gob.lunaMiel += 4;
        if (s.prod) s.prod.sec.tecno.nivel = 2;
      } },
  ];
  gob.ESCENARIO = Object.fromEntries(gob.ESCENARIOS.map((x) => [x.id, x]));
  gob.elegirEscenario = function (s, id) {
    const X = gob.ESCENARIO[id] || gob.ESCENARIO.normal;
    X.aplicar(s);
    s.escenario = X.id;
    s.eco.nivelesInicioMes = Object.assign({}, s.eco.niveles);
    for (const g of R.GRUPOS) {
      const st = s.gob.grupos[g.id];
      st.objetivo = gob.objetivoGrupo(s, g.id).obj;
    }
    gob.actualizarAprob(s);
    s.gob.historia = [R.eco.foto(s)];
    R.diario(s, X.emoji, 'Recibís el país: ' + X.nombre.toLowerCase(), 'gobierno');
  };

  gob.elegirMinistro = function (s, id) {
    const antes = s.gob.ministro;
    s.gob.ministro = id;
    const imp = R.MINISTROS[id].impacto || {};
    const aplicado = gob.aplicarEfectos(s, imp);
    R.diario(s, R.MINISTROS[id].emoji, 'Ministro/a de Economía: ' + R.MINISTROS[id].nombre + (antes ? ' (cambio de gabinete)' : ''), 'gobierno');
    return aplicado;
  };

  gob.pesoIdeas = (s) => 0.4 + 0.6 * Math.exp(-((s.gob && s.gob.meses) || 0) / 18);

  // ── Lo que quiere cada grupo ──
  // Devuelve { obj, partes: [{k, v}] } — cada parte es una razón de su humor (sirve para las frases y el «¿por qué?»).
  gob.objetivoGrupo = function (s, id) {
    const e = s.eco;
    const m = e.niveles;
    const g = R.GRUPO[id];
    const ideoGob = s.partido.ideo;
    const Pinf = R.clamp((e.inflAnual - 15) / 2, 0, 45);
    const Pdes = (e.desempleo - 7.5) * 2.2;
    const S = (e.salarioReal - 100) * 0.7;
    const Gr = (e.crec - 1.5) * 2;
    const q = e.calidad;
    // Plata real: el gasto está en % del PBI; si el país creció, el mismo % es más plata (y si se achicó, menos).
    const torta = R.eco.torta(s);
    const p = [];
    const add = (k, v) => p.push({ k, v });
    // Tus ideas pesan mucho al principio; con el tiempo la gente te juzga más por los resultados que por la ideología
    // (al año pesan ~70 %, a los dos años ~55 %, nunca menos del 40 %). Vale para el rechazo y para el apoyo.
    add('ideas', 12 * (0.45 - Math.abs(g.ideo - ideoGob)) * gob.pesoIdeas(s));
    switch (id) {
      case 'trabajadores':
        add('salario', S * 1.2); add('empleo', -Pdes * 1.3); add('inflacion', -Pinf * 0.5); add('obras', 12 * (m.obras - 1));
        break;
      case 'campo':
        add('retenciones', -10 * (e.retenciones - 1.5)); add('cepo', e.cepo ? -10 : 0); add('crecimiento', Gr * 0.6);
        add('inflacion', -Pinf * 0.25); add('rutas', (q.infra - 50) * 0.25);
        break;
      case 'empresarios':
        add('impuestos', -7 * (e.impuestos - 2)); add('riesgo', -(e.riesgo - 650) / 35); add('cepo', e.cepo ? -10 : 0);
        add('crecimiento', Gr * 1.3); add('inflacion', -Pinf * 0.35);
        break;
      case 'media':
        add('inflacion', -Pinf * 0.85); add('seguridad', (q.seguridad - 50) * 0.3); add('educacion', (q.educacion - 50) * 0.2);
        add('salud', (q.salud - 50) * 0.15); add('impuestos', -5 * (e.impuestos - 2)); add('crecimiento', Gr * 0.7);
        add('social', -12 * Math.max(0, m.social - 1.2));
        break;
      case 'humildes':
        add('inflacion', -Pinf * 0.7); add('empleo', -Pdes * 0.8); add('social', 25 * (m.social * torta - 1)); add('subsidios', 10 * (m.subsidios - 1));
        add('salud', (q.salud - 50) * 0.2); add('pobreza', -(e.pobreza - 30) * 0.4);
        break;
      case 'jubilados':
        add('jubilaciones', 35 * (m.jubilaciones * torta - 1)); add('inflacion', -Pinf * 0.95); add('salud', (q.salud - 50) * 0.3); add('subsidios', 6 * (m.subsidios - 1));
        break;
    }
    const bonus = s.gob && s.gob.bonusGrupo ? s.gob.bonusGrupo[id] || 0 : 0;
    if (bonus) add('leyes', bonus);
    // La vara sube: la gente se acostumbra a lo bueno. Lo que ganó pasa a ser «lo normal» y pide más.
    const st = s.gob && s.gob.grupos[id];
    if (st && st.espera > 0.5) add('vara', -gob.VARA * st.espera);
    const obj = R.clamp(50 + R.sum(p.map((x) => x.v)), 3, 97);
    return { obj, partes: p };
  };
  // Cuánto de lo bueno se «normaliza» y qué tan rápido (sube ~3,5 %/mes: a los 2 años ya se acostumbró a más de la mitad;
  // baja más lento: después de una bonanza, la gente se acuerda de lo bien que estaba).
  gob.VARA = 0.7;
  gob.actualizarEspera = function (s, id) {
    const st = s.gob.grupos[id];
    const { partes } = gob.objetivoGrupo(s, id);
    const meta = Math.max(0, R.sum(partes.filter((x) => x.k !== 'ideas' && x.k !== 'vara').map((x) => x.v)));
    const e = st.espera || 0;
    st.espera = e + (meta - e) * (meta > e ? 0.035 : 0.02);
  };

  gob.actualizarAprob = function (s) {
    const G = s.gob;
    let tot = 0;
    let w = 0;
    for (const g of R.GRUPOS) {
      tot += G.grupos[g.id].humor * g.peso;
      w += g.peso;
    }
    // Desgaste del poder: cada mes gobernando cuesta un poco (y más en el segundo mandato).
    const desgaste = Math.min(15, G.meses * 0.18) + (G.mandato >= 2 ? 3 : 0);
    const dif = { facil: 5, normal: 0, dificil: -5 }[s.dif] || 0;
    G.aprob = R.clamp(tot / w + G.lunaMiel - desgaste - G.escandalo * 0.6 + dif, 2, 96);
    return G.aprob;
  };

  // Capital político por mes.
  gob.ingresoPC = function (s) {
    const G = s.gob;
    let pc = 2 + Math.round((G.aprob - 40) / 15);
    if (G.ministro && R.MINISTROS[G.ministro].pcExtra) pc += R.MINISTROS[G.ministro].pcExtra;
    if (R.congreso && R.congreso.mayoria && R.congreso.mayoria(s)) pc += 1;
    if (s.mundo && (s.mundo.prestigio || 0) >= 50) pc += 1; // con prestigio, te escuchan más
    return Math.max(1, pc);
  };

  // 🔥 Termómetro de crisis: cada problema grave es una llamita.
  gob.LLAMAS = [
    { id: 'hiper', emoji: '🛒', txt: 'Inflación descontrolada', si: (s) => s.eco.inflAnual > 100, doble: (s) => s.eco.inflAnual > 300, arreglo: 'Bajá el déficit o dejá de emitir' },
    { id: 'pobreza', emoji: '🏚️', txt: 'Pobreza muy alta', si: (s) => s.eco.pobreza > 45, arreglo: 'Más ayuda social y empleo' },
    { id: 'desempleo', emoji: '🚪', txt: 'Mucho desempleo', si: (s) => s.eco.desempleo > 13, arreglo: 'Obra pública y crecimiento' },
    { id: 'reservas', emoji: '🏦', txt: 'Sin dólares en el Banco Central', si: (s) => s.eco.reservas < 5, arreglo: 'Exportá más, pedí un préstamo o poné cepo' },
    { id: 'riesgo', emoji: '📊', txt: 'Riesgo país por las nubes', si: (s) => s.eco.riesgo > 2000, arreglo: 'Ordená las cuentas' },
    { id: 'recesion', emoji: '📉', txt: 'Recesión fuerte', si: (s) => s.eco.crec < -3, arreglo: 'Bajá impuestos o más obra pública' },
    { id: 'aprob', emoji: '👎', txt: 'Nadie te banca', si: (s) => s.gob.aprob < 25, doble: (s) => s.gob.aprob < 15, arreglo: 'Contentá a los grupos más enojados' },
    { id: 'cgt', emoji: '✊', txt: 'Paro general permanente', si: (s) => s.gob.grupos.trabajadores.humor < 18, arreglo: 'Mesa con la CGT y salarios' },
    { id: 'barrios', emoji: '🔥', txt: 'Estallido en los barrios', si: (s) => s.gob.grupos.humildes.humor < 18, arreglo: 'Ayuda social y comida' },
    { id: 'deficit', emoji: '💸', txt: 'Déficit enorme', si: (s) => R.eco.resultado(s) < -6, arreglo: 'Recortá gastos o subí impuestos' },
    { id: 'guerra', emoji: '⚔️', txt: 'Vamos perdiendo la guerra', si: (s) => !!(s.mundo && s.mundo.guerra && s.mundo.guerra.frente < 30), arreglo: 'Pedí la paz o conseguí aliados' },
  ];
  gob.llamas = function (s) {
    const out = [];
    for (const l of gob.LLAMAS) {
      if (l.si(s)) {
        out.push(l);
        if (l.doble && l.doble(s)) out.push(l);
      }
    }
    return out;
  };

  // ── Efectos del gobierno ──
  R.EF_GOB = {
    trabajadores: { emoji: '👷', nombre: 'Trabajadores', paso: 4, grupo: true },
    campo: { emoji: '🌾', nombre: 'Campo', paso: 4, grupo: true },
    empresarios: { emoji: '💼', nombre: 'Empresarios', paso: 4, grupo: true },
    media: { emoji: '🏙️', nombre: 'Clase media', paso: 4, grupo: true },
    humildes: { emoji: '🏘️', nombre: 'Humildes', paso: 4, grupo: true },
    jubilados: { emoji: '👵', nombre: 'Jubilados', paso: 4, grupo: true },
    todos: { emoji: '👥', nombre: 'Todos', paso: 3, grupo: true },
    pc: { emoji: '⭐', nombre: 'Capital político', paso: 1, numero: true },
    gastoExtra: { emoji: '💸', nombre: 'del presupuesto', paso: 1, inverso: true, pct: true },
    inflacion: { emoji: '🛒', nombre: 'Inflación', paso: 0.4, inverso: true },
    crec: { emoji: '📈', nombre: 'Economía', paso: 0.6 },
    expo: { emoji: '🚢', nombre: 'Exportaciones', paso: 0.04 },
    reservas: { emoji: '🏦', nombre: 'Reservas', paso: 2 },
    deuda: { emoji: '💳', nombre: 'Deuda', paso: 2, inverso: true },
    riesgo: { emoji: '📊', nombre: 'Riesgo país', paso: 80, inverso: true },
    desempleo: { emoji: '🚪', nombre: 'Desempleo', paso: 0.4, inverso: true },
    pobreza: { emoji: '🏚️', nombre: 'Pobreza', paso: 1, inverso: true },
    dolar: { emoji: '💵', nombre: 'Dólar', paso: 6, inverso: true },
    escandalo: { emoji: '🕵️', nombre: 'Escándalo', paso: 1, inverso: true },
    salud: { emoji: '🏥', nombre: 'Hospitales', paso: 3 },
    educacion: { emoji: '🎓', nombre: 'Escuelas', paso: 3 },
    seguridad: { emoji: '👮', nombre: 'Seguridad', paso: 3 },
    defensa: { emoji: '🪖', nombre: 'Fuerzas Armadas', paso: 3 },
    infra: { emoji: '🛣️', nombre: 'Rutas', paso: 3 },
    ciencia: { emoji: '🔬', nombre: 'Ciencia', paso: 3 },
    soberania: { emoji: '🏝️', nombre: 'Malvinas', paso: 4 },
    prestigio: { emoji: '✨', nombre: 'Prestigio', paso: 5 },
  };
  const CALIDADES = ['salud', 'educacion', 'seguridad', 'defensa', 'infra', 'ciencia'];
  const MESES_SHOCK = { crec: 6, expo: 8, riesgo: 4 };

  gob.expandir = function (s, ef) {
    const out = [];
    for (const [k, v] of Object.entries(ef || {})) {
      if (!v) continue;
      if (k === 'calidad' && typeof v === 'object') {
        for (const [c, n] of Object.entries(v)) out.push({ k: c, v: n });
      } else if (k === 'rel' && typeof v === 'object') {
        for (const [c, n] of Object.entries(v)) out.push({ k: 'rel', v: n, sub: c });
      } else if (R.EF_GOB[k]) out.push({ k, v });
    }
    return out;
  };

  gob.aplicarEfectos = function (s, ef) {
    const lista = gob.expandir(s, ef);
    const G = s.gob;
    const e = s.eco;
    for (const { k, v, sub } of lista) {
      if (k === 'rel') { if (s.mundo && s.mundo.paises[sub]) s.mundo.paises[sub].rel = R.clamp(s.mundo.paises[sub].rel + v, 0, 100); continue; }
      if (k === 'soberania') { if (s.mundo) s.mundo.malvinas.soberania = R.clamp(s.mundo.malvinas.soberania + v, 0, 99); continue; }
      if (k === 'prestigio') { if (s.mundo) s.mundo.prestigio = R.clamp((s.mundo.prestigio || 0) + v, 0, 200); continue; }
      if (R.GRUPO[k]) G.grupos[k].humor = R.clamp(G.grupos[k].humor + v, 0, 100);
      else if (k === 'todos') R.GRUPOS.forEach((g) => (G.grupos[g.id].humor = R.clamp(G.grupos[g.id].humor + v, 0, 100)));
      else if (k === 'pc') G.pc = R.clamp(G.pc + v, 0, G.pcMax);
      else if (k === 'gastoExtra') {
        const pbi = R.eco.gastoComoPBI(s, v);
        e.gastoExtraMes += pbi;
        e.gastoExtraAnio += pbi;
      } else if (k === 'inflacion') e.shocks.push({ k: 'infl', v, meses: 1 });
      else if (MESES_SHOCK[k]) e.shocks.push({ k, v, meses: MESES_SHOCK[k] });
      else if (k === 'reservas') e.reservas = Math.max(-5, e.reservas + v);
      else if (k === 'deuda') e.deuda = Math.max(5, e.deuda + v);
      else if (k === 'desempleo') e.desempleo = R.clamp(e.desempleo + v, 2, 35);
      else if (k === 'pobreza') e.pobreza = R.clamp(e.pobreza + v, 3, 75);
      else if (k === 'dolar') {
        e.dolar *= 1 + v / 100;
        e.shocks.push({ k: 'infl', v: v * 0.12, meses: 3 });
      } else if (k === 'escandalo') G.escandalo = Math.max(0, G.escandalo + v);
      else if (CALIDADES.includes(k)) e.calidad[k] = R.clamp(e.calidad[k] + v, 0, 100);
    }
    gob.actualizarAprob(s);
    return lista;
  };

  gob.describirAplicado = function (s, lista) {
    return lista.map(({ k, v, sub }) => {
      const meta = k === 'rel' ? { emoji: '🤝', nombre: R.PAIS[sub] ? R.PAIS[sub].nombre : sub, paso: 5 } : R.EF_GOB[k];
      if (!meta) return null;
      const sube = v > 0;
      return {
        k, v, sube, bueno: meta.inverso ? !sube : sube, emoji: meta.emoji, nombre: meta.nombre, numero: meta.numero || meta.pct,
        pct: meta.pct, flechas: Math.min(3, Math.max(1, Math.ceil(Math.abs(v) / meta.paso - 0.15))),
      };
    }).filter(Boolean);
  };
  gob.describirEfectos = (s, ef) => gob.describirAplicado(s, gob.expandir(s, ef));

  // ── Qué hace una ley, en pocos carteles y solo lo que toca directo ──
  // { ya: [...], luego: [...] } — «ya» = al firmarla; «luego» = lo que llega con el tiempo (madura en 1-2 años).
  // Sale de la definición de la ley (ef, perm y lo que cambia en el presupuesto), no de efectos indirectos.
  // [emoji, nombre, paso de una flecha, signo: +1 si que suba es bueno, −1 si es malo, 0 neutro]
  const PERM_META = {
    bonusCrec: ['📈', 'Economía', 0.3, 1],
    bonusEmpleo: ['🚪', 'Desempleo', 0.45, -1], // positivo = baja el desempleo
    bonusExpo: ['🚢', 'Exportaciones', 0.035, 1],
    bonusImpo: ['📦', 'Importaciones', 0.035, 0],
    bonusRecauda: ['🧾', 'Recaudación', 0.2, 1],
    bonusPrecios: ['🛒', 'Inflación', 0.03, -1],
    bonusSalario: ['💰', 'Sueldos', 0.02, 1],
    bonusRiesgo: ['📊', 'Riesgo país', 22, -1],
  };
  // Lo que cambia el `hacer` de una ley en el presupuesto y en las perillas (sin tocar la partida).
  gob.impactoHacer = function (s, ley) {
    const r = { areas: [], dRec: 0, dGasto: 0, dExpo: 0, dCrec: 0, dReservas: 0 };
    if (!ley.hacer || !s.eco) return r;
    const c = Object.assign({}, s, { eco: JSON.parse(JSON.stringify(s.eco)) });
    ley.hacer(c);
    const a = s.eco;
    const b = c.eco;
    for (const ar of R.AREAS) {
      const d = R.round(b.niveles[ar.id] - a.niveles[ar.id], 2);
      if (d) { r.areas.push({ id: ar.id, d }); r.dGasto += d * ar.base; }
    }
    r.dRec = R.eco.recaudacion(c) - R.eco.recaudacion(s);
    r.dReservas = b.reservas - a.reservas;
    // Con el tiempo: menos retenciones = más exportaciones; menos impuestos = más inversión; obras y educación empujan.
    r.dExpo = (a.retenciones - b.retenciones) * 0.06;
    r.dCrec = 0.7 * (a.impuestos - b.impuestos) + 0.3 * (a.retenciones - b.retenciones) + r.dExpo * 6;
    for (const { id, d } of r.areas) {
      if (id === 'obras') r.dCrec += 2.2 * d;
      if (id === 'educacion' || id === 'ciencia') r.dCrec += (48 * d) / 45;
    }
    return r;
  };
  // Plata que deja (+) o se come (−) la ley en las cuentas, en % del PBI, cuando ya dio todo.
  gob.fiscalLey = function (s, ley) {
    const im = gob.impactoHacer(s, ley);
    return im.dRec + ((ley.recaudaYa || 0) + ((ley.perm && ley.perm.bonusRecauda) || 0)) * R.eco.RITMO.impacto - im.dGasto;
  };
  gob.efectosLey = function (s, ley, max) {
    max = max || 3;
    const ya = {};
    const luego = {};
    const add = (dest, k, emoji, nombre, v, paso, signo) => {
      if (!v) return;
      const x = dest[k] || (dest[k] = { k, emoji, nombre, v: 0, paso, signo });
      x.v += v;
    };
    const p = ley.perm || {};
    const im = gob.impactoHacer(s, ley);
    // Al firmar: cómo reacciona cada grupo y los golpes a la economía.
    for (const [k, v] of Object.entries(ley.ef || {})) {
      const m = R.EF_GOB[k];
      if (!m || k === 'pc') continue;
      add(ya, k, m.emoji, m.grupo ? R.GRUPO[k] ? R.GRUPO[k].nombre : m.nombre : m.nombre, v, m.paso, m.inverso ? -1 : 1);
    }
    for (const [g, v] of Object.entries(p.bonusGrupo || {})) add(ya, g, R.GRUPO[g].emoji, R.GRUPO[g].nombre, v, 4, 1);
    for (const { id, d } of im.areas) add(ya, 'area_' + id, R.AREA[id].emoji, R.AREA[id].nombre, d, 0.05, 1);
    const recYa = im.dRec + (ley.recaudaYa || 0) * R.eco.RITMO.impacto;
    if (Math.abs(recYa) > 0.05) add(ya, 'recauda', '🧾', 'Recaudación', recYa, 0.3, 1);
    if (Math.abs(im.dReservas) > 0.5) add(ya, 'reservas', '🏦', 'Reservas', im.dReservas, 2, 1);
    // Con el tiempo: lo que la ley cambia en el motor.
    for (const [k, [em, nom, paso, signo]] of Object.entries(PERM_META)) {
      let v = (p[k] || 0) * R.eco.RITMO.impacto;
      if (k === 'bonusEmpleo') v = -v; // se muestra como «Desempleo ▼»
      if (k === 'bonusCrec') v += im.dCrec;
      if (k === 'bonusExpo') v += im.dExpo;
      add(luego, k, em, nom, v, paso, signo);
    }
    for (const [c, v] of Object.entries(p.bonusCalidad || {})) add(luego, c, R.EF_GOB[c].emoji, R.EF_GOB[c].nombre, v * R.eco.RITMO.impacto, 5, 1);
    const lista = (obj) => Object.values(obj)
      .filter((x) => Math.abs(x.v) >= x.paso * (R.GRUPO[x.k] ? 0.85 : 0.4))
      .map((x) => ({
        k: x.k, emoji: x.emoji, nombre: x.nombre, v: x.v, sube: x.v > 0, neutro: x.signo === 0,
        bueno: x.signo === 0 ? true : (x.v > 0) === (x.signo > 0),
        flechas: Math.min(3, Math.max(1, Math.round(Math.abs(x.v) / x.paso))),
        grupo: !!R.GRUPO[x.k],
      }))
      .sort((a, b) => b.flechas - a.flechas || a.grupo - b.grupo)
      .slice(0, max);
    return { ya: lista(ya), luego: lista(luego) };
  };
  gob.describirPerm = (s, ley) => gob.efectosLey(s, ley, 4).luego;

  // Un cambio permanente en el motor que llega de a poco (lo usan las noticias que dejan huella).
  gob.bono = function (s, k, v, meses, sub) {
    const G = s.gob;
    v *= R.eco.RITMO.impacto;
    if (meses) meses = R.eco.mesesMadura(meses);
    if (sub) { G[k] = G[k] || {}; G[k][sub] = (G[k][sub] || 0) + v; } else G[k] = (G[k] || 0) + v;
    if (meses) { G.madurando = G.madurando || []; G.madurando.push({ ley: 'noticia', k, v, sub, desde: s.mes, meses }); }
  };

  gob.bloqueoCosto = function (s, costo) {
    if (!s.gob) return null;
    if (costo.pc && costo.pc > s.gob.pc) return 'Falta capital político ⭐';
    return null;
  };

  // ── Acciones de gobierno (cuestan ⭐) ──
  gob.ACCIONES = [
    { id: 'cadena', emoji: '📺', nombre: 'Cadena nacional', desc: 'Explicás tu plan', pc: 2, enfr: 2,
      ef: { todos: 2.5 }, azar: { p: 0.25, ef: { media: -5 }, txt: 'Cortaste la novela: la gente se enojó 😒' }, res: 'Te escucharon en todo el país 📺' },
    { id: 'cgt', emoji: '✊', nombre: 'Mesa con la CGT', desc: 'Calmás a los gremios', pc: 2, enfr: 3,
      ef: { trabajadores: 8, empresarios: -2 }, res: 'Foto con los gremios 🤝' },
    { id: 'campo', emoji: '🌾', nombre: 'Reunión con el campo', desc: 'Escuchás a los productores', pc: 2, enfr: 3,
      ef: { campo: 9 }, res: 'Mate en la estancia 🧉' },
    { id: 'inversores', emoji: '💼', nombre: 'Foro de inversiones', desc: 'Traés empresas', pc: 2, enfr: 3,
      ef: { empresarios: 8, riesgo: -40 }, res: 'Los inversores sonríen 💼' },
    { id: 'barrios', emoji: '🏘️', nombre: 'Recorrer los barrios', desc: 'Escuchás a los vecinos', pc: 2, enfr: 3,
      ef: { humildes: 8, media: 1 }, res: 'Abrazos en el barrio 🫂' },
    { id: 'remedios', emoji: '💊', nombre: 'Remedios gratis', desc: 'Para jubilados', pc: 1, gasto: 1.5, enfr: 4,
      ef: { jubilados: 10 }, res: 'Doña Marta ya tiene sus pastillas 💊' },
    { id: 'bono', emoji: '💵', nombre: 'Bono', desc: 'Plata extra a todos', pc: 1, gasto: 3, enfr: 6,
      ef: { trabajadores: 6, humildes: 7, jubilados: 6, inflacion: 0.3 }, res: 'El bono llegó 💵' },
    { id: 'precios', emoji: '🏷️', nombre: 'Acuerdo de precios', desc: 'Frenás los aumentos', pc: 3, enfr: 6,
      ef: { inflacion: -0.6, empresarios: -6, media: 3 }, azar: { p: 0.3, ef: { inflacion: 0.6 }, txt: 'Nadie respetó el acuerdo 🙄' }, res: 'Precios congelados 🏷️' },
    { id: 'feriado', emoji: '🏖️', nombre: 'Feriado largo', desc: 'Fin de semana XL', pc: 1, enfr: 4,
      ef: { media: 4, trabajadores: 3, empresarios: -4, crec: -0.3 }, res: '¡A la costa! 🏖️' },
  ];
  gob.ACC = Object.fromEntries(gob.ACCIONES.map((a) => [a.id, a]));

  gob.bloqueoAccion = function (s, a) {
    const G = s.gob;
    if (s.fase !== 'gobierno') return 'No es momento';
    if (G.enfr[a.id] && s.mes - G.enfr[a.id] < a.enfr) return 'De nuevo en ' + (a.enfr - (s.mes - G.enfr[a.id])) + (a.enfr - (s.mes - G.enfr[a.id]) === 1 ? ' mes' : ' meses');
    if (a.pc > G.pc) return 'Falta ⭐';
    return null;
  };

  gob.efectosAccion = (s, a) => Object.assign({}, a.ef, a.gasto ? { gastoExtra: a.gasto } : {}, { pc: -a.pc });

  gob.hacer = function (s, id) {
    const a = gob.ACC[id];
    const b = gob.bloqueoAccion(s, a);
    if (b) return { error: b };
    let ef = gob.efectosAccion(s, a);
    let txt = a.res;
    let bueno = true;
    if (a.azar && R.chance(s, a.azar.p)) {
      ef = R.sumarEfectos(ef, a.azar.ef);
      txt = a.azar.txt;
      bueno = false;
    }
    const antes = s.gob.aprob;
    const aplicado = gob.aplicarEfectos(s, ef);
    s.gob.enfr[id] = s.mes;
    R.diario(s, a.emoji, a.nombre, 'accion');
    return { txt, bueno, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // ── Medidas económicas fuertes ──
  gob.MEDIDAS = [
    { id: 'devaluar', emoji: '💱', nombre: 'Devaluar', desc: 'Dólar 30 % más caro', enfr: 12,
      ef: { dolar: 30, expo: 0.12, campo: 8, empresarios: 3, trabajadores: -8, media: -7, humildes: -5, jubilados: -5 },
      res: 'El dólar saltó: más exportaciones, pero suben los precios 💱' },
    { id: 'cepo', emoji: '🔒', nombre: 'Poner cepo', desc: 'Nadie compra dólares', enfr: 6, si: (s) => !s.eco.cepo,
      ef: { empresarios: -10, campo: -6, media: -5 }, hacer: (s) => { s.eco.cepo = true; s.eco.brecha = 15; },
      res: 'Cepo al dólar: cuidás las reservas, pero aparece el blue 🔒' },
    { id: 'sincepo', emoji: '🔓', nombre: 'Sacar el cepo', desc: 'Dólar libre', enfr: 6, si: (s) => s.eco.cepo,
      ef: (s) => ({ empresarios: 10, campo: 7, dolar: Math.round(Math.max(5, s.eco.brecha * 0.6 + (s.eco.reservas < 15 ? 20 : 0))), media: -2 }),
      hacer: (s) => { s.eco.cepo = false; s.eco.brecha = 0; }, res: 'Chau cepo: el dólar se acomoda 🔓' },
    { id: 'pagar_deuda', emoji: '🏦', nombre: 'Pagar deuda con reservas', desc: 'Usás US$ 10 mil M', enfr: 12, si: (s) => s.eco.reservas >= 20,
      ef: (s) => ({ reservas: -10, deuda: -R.round((10 / R.eco.pbiUSD(s)) * 100, 1), empresarios: 2 }),
      res: 'Pagaste deuda con reservas: debés menos, pero tenés menos colchón 🏦' },
    { id: 'motosierra', emoji: '🪚', nombre: 'Motosierra', desc: 'Recorte del 15 % en todo', enfr: 12,
      ef: { empresarios: 6, riesgo: -150 },
      hacer: (s) => { for (const a of R.AREAS) s.eco.niveles[a.id] = Math.max(R.eco.NIVEL_MIN, R.round(s.eco.niveles[a.id] - 0.15, 2)); },
      res: '¡Motosierra! El gasto se achica. A fin de mes reacciona la gente 🪚' },
  ];
  gob.MED = Object.fromEntries(gob.MEDIDAS.map((m) => [m.id, m]));
  gob.efectoMedida = (s, m) => (typeof m.ef === 'function' ? m.ef(s) : m.ef);
  gob.bloqueoMedida = function (s, m) {
    if (m.si && !m.si(s)) return 'No aplica';
    const k = 'med_' + m.id;
    if (s.gob.enfr[k] && s.mes - s.gob.enfr[k] < m.enfr) return 'De nuevo en ' + (m.enfr - (s.mes - s.gob.enfr[k])) + ' meses';
    return null;
  };
  gob.medida = function (s, id) {
    const m = gob.MED[id];
    const b = gob.bloqueoMedida(s, m);
    if (b) return { error: b };
    const antes = s.gob.aprob;
    const aplicado = gob.aplicarEfectos(s, gob.efectoMedida(s, m));
    if (m.hacer) m.hacer(s);
    s.gob.enfr['med_' + id] = s.mes;
    R.diario(s, m.emoji, m.nombre, 'medida');
    return { txt: m.res, bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // ── Cambios de presupuesto: la gente reacciona a fin de mes ──
  const AREA_GRUPOS = {
    jubilaciones: { jubilados: 1 },
    social: { humildes: 1, media: -0.25 },
    salud: { jubilados: 0.4, humildes: 0.4, media: 0.3 },
    educacion: { media: 0.6 },
    seguridad: { media: 0.5 },
    defensa: {},
    obras: { trabajadores: 0.6 },
    subsidios: { trabajadores: 0.35, media: 0.35, humildes: 0.5, jubilados: 0.5 },
    ciencia: { media: 0.25 },
  };
  // Reacción inmediata (anuncio) a los cambios del mes, comparando con cómo arrancó el mes.
  gob.reaccionPresupuesto = function (s) {
    const e = s.eco;
    const ef = {};
    const sumar = (k, v) => (ef[k] = (ef[k] || 0) + v);
    for (const a of R.AREAS) {
      const d = e.niveles[a.id] - e.nivelesInicioMes[a.id];
      if (Math.abs(d) < 0.01) continue;
      const fuerza = d < 0 ? 22 : 11; // perder duele el doble que ganar
      for (const [g, w] of Object.entries(AREA_GRUPOS[a.id])) sumar(g, d * fuerza * w * (a.id === 'jubilaciones' || a.id === 'social' ? 1.4 : 1));
    }
    const di = e.impuestos - e.impuestosInicioMes;
    if (di) { sumar('empresarios', di > 0 ? -7 * di : -4 * di); sumar('media', di > 0 ? -5 * di : -3 * di); }
    const dr = e.retenciones - e.retencionesInicioMes;
    if (dr) sumar('campo', dr > 0 ? -9 * dr : -6 * dr);
    for (const k in ef) ef[k] = R.round(ef[k], 1);
    return ef;
  };

  // ── El mes del gobierno ──
  gob.pasarMes = function (s, momentos) {
    const G = s.gob;
    const e = s.eco;
    const antes = R.eco.foto(s);
    const humorAntes = Object.fromEntries(R.GRUPOS.map((g) => [g.id, G.grupos[g.id].humor]));
    const aprobAntes = G.aprob;

    // Reacción a los cambios de presupuesto e impuestos del mes
    const reaccion = gob.reaccionPresupuesto(s);
    if (Object.keys(reaccion).length) gob.aplicarEfectos(s, reaccion);

    R.eco.mes(s);
    // Producción: obras, inversión privada, precios del mundo y ciclos (pueden avisar una crisis; se muestra después del resumen).
    const avisos = [];
    if (R.prod) R.prod.mes(s, avisos);

    // La gente se acomoda de a poco a cómo le va
    for (const g of R.GRUPOS) {
      const st = G.grupos[g.id];
      const { obj, partes } = gob.objetivoGrupo(s, g.id);
      st.partesAntes = st.partes;
      st.partes = partes;
      st.objetivo = obj;
      st.antes = humorAntes[g.id];
      st.humor = R.clamp(st.humor + (obj - st.humor) * 0.28 + R.gauss(s) * 0.6, 0, 100);
      gob.actualizarEspera(s, g.id);
    }
    G.lunaMiel *= 0.88;
    G.meses++;
    G.escandalo *= 0.93;
    gob.actualizarAprob(s);
    G.pc = R.clamp(G.pc + gob.ingresoPC(s), 0, G.pcMax);

    // Nuevo mes y año
    s.mes++;
    e.nivelesInicioMes = Object.assign({}, e.niveles);
    e.impuestosInicioMes = e.impuestos;
    e.retencionesInicioMes = e.retenciones;
    if (R.mesDelAnio(s.mes) === 0) {
      e.gastoExtraAnio = 0;
      e.deficitAcumAnio = 0;
    }

    const despues = R.eco.foto(s);
    G.historia.push(despues);
    if (G.historia.length > 120) G.historia.shift();

    // Crisis
    G.llamas = gob.llamas(s).map((l) => l.id);
    G.aprobBajaMeses = G.aprob < 12 ? (G.aprobBajaMeses || 0) + 1 : 0;

    momentos.push({ tipo: 'resumen', antes, despues, aprobAntes, aprobDespues: G.aprob, humorAntes, reaccion, frases: gob.frases(s, humorAntes, 3),
      novedades: s.prod ? s.prod.novedades.slice() : [] });
    momentos.push(...avisos);
    // Los grupos muy enojados salen a la calle; las metas se cumplen o vencen.
    if (R.protestas) R.protestas.mes(s, momentos);
    if (R.metas) R.metas.mes(s, momentos);
    // La Justicia y la oposición pueden voltear tus leyes.
    if (R.justicia) R.justicia.mes(s, momentos);
    if (R.congreso && R.congreso.oposicionMes) R.congreso.oposicionMes(s, momentos);

    if (G.aprobBajaMeses >= 3) {
      gob.terminar(s, momentos, 'helicoptero');
      return;
    }
    if (G.escandalo >= 10 && (!G.juicioMes || s.mes - G.juicioMes > 12)) {
      G.juicioMes = s.mes;
      momentos.push({ tipo: 'juicio' });
    }
    const nLlamas = G.llamas.length;
    if (nLlamas >= 6 && R.chance(s, 0.1 * (nLlamas - 5))) {
      const ev = R.ev.porId('g_estallido');
      if (ev) momentos.push(R.ev.instanciar(s, ev));
    }

    // El mundo (guerra, resistencia) y las elecciones del mandato
    if (R.mundo && R.mundo.mes) R.mundo.mes(s, momentos);
    if (R.gob.elecciones && R.gob.elecciones(s, momentos)) return;

    // Noticia del mes
    if (R.chance(s, 0.85)) {
      const n = R.ev.elegir(s, 'gobierno');
      if (n) momentos.push(n);
    }
  };

  gob.terminar = function (s, momentos, motivo) {
    s.fase = 'fin';
    s.fin = { motivo, mes: s.mes };
    const txt = { helicoptero: 'Renunciaste y te fuiste en helicóptero 🚁', estallido: 'Estallido social: tuviste que renunciar', mandato: 'Terminaste tu mandato', juicio: 'Te destituyó el Congreso' }[motivo] || 'Fin';
    R.diario(s, '🏁', txt, 'fin');
    momentos.push({ tipo: 'fin' });
  };

  // Frase de la gente: elige la razón que más cambió para cada grupo.
  gob.frases = function (s, humorAntes, max) {
    const G = s.gob;
    const out = [];
    for (const g of R.GRUPOS) {
      const st = G.grupos[g.id];
      const d = st.humor - humorAntes[g.id];
      let mejor = null;
      let mejorD = 0;
      for (const p of st.partes) {
        const ant = (st.partesAntes || []).find((x) => x.k === p.k);
        const dd = p.v - (ant ? ant.v : 0);
        if (Math.abs(dd) > Math.abs(mejorD)) { mejor = p.k; mejorD = dd; }
      }
      // Si nada cambió mucho, habla de lo que más le pesa.
      if (!mejor || Math.abs(mejorD) < 0.6) {
        const top = st.partes.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v))[0];
        if (top && Math.abs(top.v) > 4) { mejor = top.k; mejorD = top.v; }
      }
      const clave = mejor ? mejor + (mejorD >= 0 ? '+' : '-') : d >= 0 ? 'bien' : 'mal';
      const banco = (R.FRASES[g.id] && (R.FRASES[g.id][clave] || R.FRASES[g.id][d >= 0 ? 'bien' : 'mal'])) || [];
      if (!banco.length) continue;
      out.push({ grupo: g.id, d, txt: banco[Math.floor(R.rand(s) * banco.length)], bueno: (mejorD || d) >= 0, peso: Math.abs(d) + Math.abs(mejorD) * 0.5 });
    }
    return out.sort((a, b) => b.peso - a.peso).slice(0, max || 3);
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/datos/leyes.js ──
// Leyes que podés mandar al Congreso. ideo: −1 (Estado presente) … +1 (mercado). polemica: 0 … 1.
// cat: tema (para los filtros). ef: lo que pasa al firmarla (la gente reacciona, algún golpe a la economía).
// perm: lo que cambia en el motor para siempre. Lo económico madura de a poco: `madura` meses «de la vida real»
// (18 si no dice), que el juego acelera con R.eco.RITMO (llega en un tercio del tiempo y pega más fuerte):
//   bonusCrec (crecimiento), bonusEmpleo (baja el desempleo), bonusExpo (exportaciones), bonusImpo (importaciones),

      partido, nombre, rel, pide: R.pick(s, Object.keys(R.PEDIDOS)), enfr: -99,

  // Cuánto te bancan los gobernadores de cada partido (promedio ponderado por población).

    const total = R.TOTAL_BANCAS[camara];

  // la ven como un paso en la dirección correcta («no es todo lo que queremos, pero va»): cuenta mucho menos.
  // Así la LLA vota leyes de mercado aunque sean tibias, y la izquierda vota las del Estado presente.
  con.distancia = (leyIdeo, ideo) => {

    if (!G.gobernadores) return;
    for (const p of R.PROVINCIAS) {
      const g = G.gobernadores[p.id];
      const meta = g.partido === 'YO' ? 85 : 45 + G.aprob * 0.2;
      g.rel = R.clamp(g.rel + (meta - g.rel) * 0.03, 0, 100);
    }
    for (const b of BLOQUES) G.rel[b] = R.clamp(G.rel[b] + ((40 + G.aprob * 0.25) - G.rel[b]) * 0.02, 0, 100);
  };

  // ── Votos durante el gobierno: tu aprobación manda ──
  R.elec.votosGobierno = function (s, opts) {
    opts = opts || {};
    const G = s.gob;
    const nac = { YO: 0 };
    R.RIVALES.forEach((id) => (nac[id] = 0));
    const prov = {};
    // El opositor más fuerte junta el voto enojado.
    const opositor = R.RIVALES.slice().sort((a, b) => R.PARTIDOS[b].base - R.PARTIDOS[a].base)[0];
    for (const p of R.PROVINCIAS) {
      const af = R.camp.afinidad(s, p);
      const gob = G.gobernadores ? G.gobernadores[p.id] : null;
      let yo = (6 + 0.62 * G.aprob) * Math.sqrt(af);
      if (gob && gob.partido === 'YO') yo *= 1.12;
      else if (gob && gob.rel > 70) yo *= 1.04;
      yo += (s.camp.presencia[p.id] || 0) * 0.06 + (opts.extraYo || 0);
      yo = R.clamp(yo, 3, 80);
      const ws = {};
      let tot = 0;
      for (const id of R.RIVALES) {
        const r = R.PARTIDOS[id];
        let w = Math.max(0.3, r.base + s.rivales[id]);
        w *= 1 + (r.fuerte[p.id] || 0);
        w *= R.clamp(1 + 0.7 * (0.5 - Math.abs(p.lean - r.ideo)), 0.45, 1.4);
        if (id === opositor) w *= 1 + Math.max(0, 50 - G.aprob) / 60;
        if (opts.ruido) w *= Math.max(0.2, 1 + opts.ruido[p.id + id] * 0.06);
        ws[id] = w;
        tot += w;
      }
      const res = { YO: yo };
      for (const id of R.RIVALES) res[id] = ((100 - yo) * ws[id]) / tot;
      prov[p.id] = res;
      for (const k in res) nac[k] += (res[k] * p.padron) / 100;
    }
    return { nac, prov };
  };

  // Gobernadores nuevos según quién ganó en cada provincia.
  con.renovarGobernadores = function (s, prov) {
    const G = s.gob;
    const cambios = [];
    for (const p of R.PROVINCIAS) {
      const v = prov[p.id];
      const gana = Object.keys(v).reduce((a, b) => (v[a] > v[b] ? a : b));
      if (gana !== G.gobernadores[p.id].partido) {
        G.gobernadores[p.id] = con.nuevoGobernador(s, p.id, gana);
        cambios.push(p.id);
      }

  };

  // Gancho que llama gobierno.pasarMes después de avanzar el mes. Devuelve true si cortó el mes.
  R.gob.elecciones = function (s, momentos) {
    const G = s.gob;
    con.mes(s);
    const anio = R.anio(s.mes);
    const m = R.mesDelAnio(s.mes);
    // Presupuesto anual: lo vota el Congreso cada noviembre.
    if (m === 10) momentos.push({ tipo: 'presupuesto' });
    // Decretos que el Congreso puede voltear (a los 3 meses).
    if (G.dnuPendientes && G.dnuPendientes.length) {
      const vence = G.dnuPendientes.filter((d) => s.mes - d.mes >= 3);
      G.dnuPendientes = G.dnuPendientes.filter((d) => s.mes - d.mes < 3);
      for (const d of vence) {
        const ley = R.LEY[d.ley];
        const p = con.porotos(s, ley);
        if (p.diputados.si < p.diputados.total / 2 - 30 && R.chance(s, 0.5)) momentos.push({ tipo: 'dnu_cae', ley: d.ley });
      }
    }
    if (m !== 10 && m !== 11) return false;
    const esMedio = anio % 4 === 1; // 2029, 2033
    const esPresi = anio % 4 === 3; // 2031, 2035
    if (m === 10 && esMedio) {
      R.elec.legislativa(s);
      momentos.push({ tipo: 'eleccion', clave: 'legislativa' });
      return false;
    }
    if (m === 10 && esPresi) {
      if (G.mandato >= 2 && !G.leyes.re_reeleccion) {
        R.gob.terminar(s, momentos, 'mandato');
        return true;
      }
      const res = R.elec.general(s);
      con.renovarGobernadores(s, res.prov);
      momentos.push({ tipo: 'eleccion', clave: 'general' });
      if (res.ganador === 'YO') { G.mandato++; G.lunaMiel = 8; R.diario(s, '🏆', '¡Reelecto/a!', 'eleccion'); }
      else if (res.ballotage && res.ballotage.includes('YO')) { G.ballotage = res.ballotage; }
      else { R.gob.terminar(s, momentos, 'reeleccion'); return true; }
      return false;
    }
    if (m === 11 && G.ballotage) {
      const res = R.elec.ballotage(s, G.ballotage);
      G.ballotage = null;
      momentos.push({ tipo: 'eleccion', clave: 'ballotage' });
      if (res.ganador === 'YO') { G.mandato++; G.lunaMiel = 8; R.diario(s, '🏆', '¡Reelecto/a en el ballotage!', 'eleccion'); }
      else { R.gob.terminar(s, momentos, 'reeleccion'); return true; }
    }
    return false;
  };

  // Votar el presupuesto anual (no cuesta ⭐). Devuelve { ley, res, ok, aplicado }.
  con.votarPresupuesto = function (s, conFondos) {
    const ley = con.leyPresupuesto(s);
    if (conFondos) con.fondosGobernadores(s, ley);
    const res = con.contarVotos(s, ley);
    delete s.gob.negocia.presupuesto;
    const ok = res.aprobada;

  };

  con.efDnuCae = { pc: -2, media: -3, escandalo: 1 };

  // ⚖️ Juicio político: la oposición necesita 2/3 en Diputados (acusar) y 2/3 en el Senado (destituir).
  con.pApoyoJuicio = function (s, bloque) {
    if (bloque === 'YO') return 0.02;
    const G = s.gob;
    const x = (50 - G.rel[bloque]) / 14 + G.escandalo / 8 - (G.aprob - 35) / 18 - 1.2 + (G.juicioFondos || 0) * -0.6;
    return 1 / (1 + Math.exp(-x));
  };
  con.prediccionJuicio = function (s) {
    const out = {};
    for (const camara of ['diputados', 'senado']) {
      const comp = R.composicion(s, camara);
      let si = 0;
      for (const [id, n] of Object.entries(comp)) si += n * con.pApoyoJuicio(s, id);
      out[camara] = { si: Math.round(si), necesarios: Math.ceil((R.TOTAL_BANCAS[camara] * 2) / 3) };
    }
    return out;
  };
  con.votarJuicio = function (s) {
    const res = { camaras: {}, aprobada: true };
    for (const camara of ['diputados', 'senado']) {
      const comp = R.composicion(s, camara);
      const votos = [];
      let si = 0;
      for (const [id, n] of Object.entries(comp)) {
        const p = con.pApoyoJuicio(s, id);
        for (let i = 0; i < n; i++) { const v = R.rand(s) < p; if (v) si++; votos.push({ id, si: v }); }
      }
      const nec = Math.ceil((R.TOTAL_BANCAS[camara] * 2) / 3);
      res.camaras[camara] = { si, no: R.TOTAL_BANCAS[camara] - si, necesarios: nec, pasa: si >= nec, votos };
      if (si < nec) { res.aprobada = false; break; }
    }
    s.gob.juicioFondos = 0;
    if (!res.aprobada) {
      s.gob.escandalo = Math.max(0, s.gob.escandalo - 5);
      res.aplicado = R.gob.aplicarEfectos(s, { pc: 2, todos: 2 });
      R.diario(s, '⚖️', 'Sobreviviste al juicio político', 'ley');
    } else {
      res.aplicado = [];
      R.diario(s, '⚖️', 'El Congreso te destituyó', 'fin');
    }
    return res;
  };

  // Presupuesto anual: ¿lo aprueba el Congreso?
  con.leyPresupuesto = function (s) {
    const def = -R.eco.resultado(s);
    return { id: 'presupuesto', nombre: 'Presupuesto ' + (R.anio(s.mes) + 1), emoji: '📒', ideo: R.clamp(s.partido.ideo * 0.5 - def * 0.15, -1, 1), polemica: R.clamp(0.15 + Math.max(0, def) * 0.12, 0, 1) };
  };

<script>
// ── js/motor/mundo.js ──
// El mundo: relaciones, tratados, préstamos, alianzas, guerra (frente tira y afloja), anexiones y Malvinas.
(function (R) {
  'use strict';

  const mun = (R.mundo = {});

  mun.iniciar = function (s) {
    const paises = {};
    for (const p of R.PAISES) {
      const afin = 18 * (0.5 - Math.abs(p.ideo - s.partido.ideo));
      paises[p.id] = { rel: R.clamp(Math.round(p.rel + afin), 0, 100), tratado: false, alianza: false, sancion: false, anexado: false, enfr: {} };
    }
    s.mundo = { paises, guerra: null, malvinas: { soberania: 0, recuperadas: false }, poderExtra: 0, resistencia: 0, panico: 0, pactos: [], noticias: [] };
  };

  // ── Comercio por país ──
  // Cuánto de lo que un país compra producís vos (1 = como al asumir). Si importás energía, no tenés para venderle.
  const SECTOR_DE = { granos: 'campo', energia: 'energia', manufacturas: 'industria', software: 'tecno' };
  mun.mezcla = function (s, id) {
    const compra = R.COMPRA[id] || [];
    if (!compra.length || !s.prod || !R.prod) return 1;
    const v = compra.map((k) => {
      const sec = SECTOR_DE[k];
      let f = (R.prod.nivel(s, sec) / R.SECTOR[sec].nivel0) * R.prod.precio(s, k);
      const saldo = R.prod.energia(s).saldo;
      if (k === 'energia' && saldo < 0) f *= R.clamp(1 + saldo * 0.25, 0.5, 1);
      return f;
    });
    return R.sum(v) / v.length;
  };
  // Lo que suman (o restan) tus tratados según cuánto les vendés de lo que compran (se suma a eco.factorExpo).
  mun.extraComercio = function (s) {
    if (!s.mundo) return 0;
    let f = 0;
    for (const p of R.PAISES) {
      const st = s.mundo.paises[p.id];
      if (!st.tratado || st.anexado) continue;
      f += p.expo * R.clamp(mun.mezcla(s, p.id) - 1, -0.5, 1.5);
    }
    return f;
  };

  // ── Ranking de potencias ──
  // Puntos = economía (raíz del PBI en dólares) + poder militar + prestigio. Los anexados ya no cuentan.
  mun.puntos = function (s, id) {
    if (id === 'ARG') return Math.round(Math.sqrt(R.eco.pbiUSD(s)) * 2 + mun.poder(s) + (s.mundo.prestigio || 0));
    return Math.round(Math.sqrt(R.PBI_PAIS[id] || 50) * 2 + R.PAIS[id].poder);
  };
  mun.ranking = function (s, soloSudamerica) {
    const ids = ['ARG'].concat(R.PAISES.filter((p) => !s.mundo.paises[p.id].anexado && (!soloSudamerica || R.SUDAMERICA.includes(p.id))).map((p) => p.id));
    return ids.map((id) => ({ id, puntos: mun.puntos(s, id) })).sort((a, b) => b.puntos - a.puntos);
  };
  mun.puesto = (s, soloSudamerica) => mun.ranking(s, soloSudamerica).findIndex((x) => x.id === 'ARG') + 1;
  // Tus puntos contra el más fuerte de Sudamérica (1 = sos el primero).
  mun.ventajaRegional = function (s) {
    const otros = mun.ranking(s, true).filter((x) => x.id !== 'ARG');
    return otros.length ? mun.puntos(s, 'ARG') / otros[0].puntos : 2;
  };

  // ── Relaciones entre los otros países ──
  // Pactos de defensa entre países (además de los bloques fijos). Se arman y se rompen solos.
  mun.tienePacto = (s, a, b) => (s.mundo.pactos || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  // Amigos de un país: su bloque, sus pactos y los que piensan parecido.
  mun.amistad = function (s, a, b) {
    const A = R.PAIS[a];
    const B = R.PAIS[b];

  mun.amigosDe = (s, id) => R.PAISES.filter((q) => q.id !== id && !s.mundo.paises[q.id].anexado && mun.amistad(s, id, q.id) >= 30).map((q) => q.id);

  // ── Inclinar la guerra (cuestan ⭐) ──

  const mejorApoyo = (s, W) => R.PAISES.filter((p) => p.id !== W.pais && !s.mundo.paises[p.id].anexado && !s.mundo.paises[p.id].alianza
    && !(W.apoyos || []).includes(p.id) && s.mundo.paises[p.id].rel >= 60 && !mun.amigosDe(s, W.pais).includes(p.id)).sort((a, b) => b.poder - a.poder)[0];
  const apoyoDelEnemigo = (s, W) => mun.fuerzas(s, W.pais).susAliados.filter((id) => s.mundo.paises[id].rel >= 40).sort((a, b) => R.PAIS[b].poder - R.PAIS[a].poder)[0];
  mun.ACC_GUERRA = [

      pc: (s, W) => { const id = apoyoDelEnemigo(s, W); return 2 + Math.round((id ? R.PAIS[id].poder : 0) / 30); }, // más caro cuanto más fuerte es

  mun.avance = (ratio, orden) => {
    const lr = Math.log2(Math.max(0.05, ratio));
    return orden === 'ofensiva' ? { media: 12 * lr, desvio: 2.5 } : { media: 5 * lr - 1, desvio: 1.5 };
  };
  // Chances de ganar atacando todos los meses (simulación rápida con su propio azar: no toca la partida).
  mun.chances = function (s, paisId, desde) {
    const F = mun.fuerzas(s, paisId);
    const { media, desvio } = mun.avance(F.ratio, 'ofensiva');
    let semilla = 12345;
    const azar = () => {
      semilla = (semilla + 0x6d2b79f5) | 0;
      let x = Math.imul(semilla ^ (semilla >>> 15), semilla | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
    const gauss = () => (azar() + azar() + azar() + azar() - 2) * 1.73;
    let ganadas = 0;
    let perdidas = 0;
    let meses = 0;
    const N = 300;
    for (let i = 0; i < N; i++) {
      let f = desde ?? 50;
      let m = 0;
      while (f > 0 && f < 100 && m < 36) { f += media + gauss() * desvio; m++; }
      if (f >= 100) { ganadas++; meses += m; } else if (f <= 0) perdidas++;
    }
    return { gana: ganadas / N, pierde: perdidas / N, meses: ganadas ? Math.round(meses / ganadas) : null, F };
  };

  // Una orden de guerra (se da cada mes). Devuelve { txt, delta, fin?, aplicado }.
  mun.orden = function (s, id) {
    const W = s.mundo.guerra;
    const F = mun.fuerzas(s, W.pais);
    const P = R.PAIS[W.pais];
    let delta = 0;
    let ef = {};
    W.meses++;
    if (id === 'paz') return mun.terminarGuerra(s, W.frente >= 55 ? 'paz_buena' : 'paz_mala');
    const av = mun.avance(F.ratio, id);
    delta = av.media + R.gauss(s) * av.desvio;
    ef = { gastoExtra: id === 'ofensiva' ? 3 : 1 };
    W.frente = R.clamp(W.frente + delta, 0, 100);
    ef.crec = -0.6;
    ef.todos = W.meses <= 2 ? 2 : -2; // al principio patriotismo, después cansancio
    if (delta < -6) ef.todos -= 2;
    const aplicado = R.gob.aplicarEfectos(s, ef);
    let txt = delta > 4 ? '¡Avanzamos en el frente! 🎖️' : delta < -4 ? 'Retrocedemos… ' + P.nombre + ' contraataca 😰' : 'El frente casi no se mueve';
    if (W.frente >= 100) return Object.assign(mun.terminarGuerra(s, 'victoria'), { delta });
    if (W.frente <= 0) return Object.assign(mun.terminarGuerra(s, 'derrota'), { delta });
    return { txt, delta, aplicado, bueno: delta >= 0 };
  };

  mun.terminarGuerra = function (s, como) {
    const W = s.mundo.guerra;
    const P = R.PAIS[W.pais];
    const st = s.mundo.paises[W.pais];
    s.mundo.guerra = null;
    let ef = {};
    let txt = '';
    if (como === 'victoria' && W.objetivo === 'defensa') {
      ef = { todos: 12, reservas: 4, prestigio: 12 };
      txt = '🛡️ ¡Rechazamos el ataque de ' + P.nombre + '!';
      st.rel = 25;
    } else if (como === 'derrota' && W.objetivo === 'defensa') {
      ef = { todos: -20, reservas: -10, deuda: 6, riesgo: 400, prestigio: -15 };
      txt = '💀 ' + P.nombre + ' nos ganó: hay que pagarle';
      st.rel = 15;
    } else if (como === 'victoria') {
      if (W.objetivo === 'malvinas') {
        s.mundo.malvinas.recuperadas = true;
        s.mundo.malvinas.soberania = 100;
        ef = { todos: 18, riesgo: 200, prestigio: 25 };
        txt = '🇦🇷 ¡RECUPERAMOS LAS MALVINAS!';
      } else {
        const amigos = mun.amigosDe(s, P.id);
        st.anexado = true;
        s.eco.pbi *= 1 + (P.tam || 0.1);
        s.mundo.resistencia = (s.mundo.resistencia || 0) + Math.round(12 + 8 * Math.min(3, P.tam || 0.1));
        for (const q of R.PAISES) {
          const sq = s.mundo.paises[q.id];
          if (q.id === P.id || sq.anexado) continue;
          sq.rel = R.clamp(sq.rel - (amigos.includes(q.id) ? 20 : sq.alianza ? 4 : 10), 0, 100);
        }
        mun.sumarPanico(s, 25 + 10 * Math.min(3, P.tam || 0.1));
        mun.noticia(s, '🏴', 'Argentina anexó a ' + P.nombre + ': pánico en el mundo');
        ef = { todos: 10, reservas: 4 + (P.tam || 0.1) * 10, riesgo: 250, prestigio: 15 };
        txt = '🏴 ¡Ganaste la guerra! ' + P.nombre + ' ahora es parte de la Argentina';
      }
    } else if (como === 'derrota') {
      ef = { todos: -22, reservas: -8, deuda: 5, riesgo: 500, escandalo: 3, prestigio: -20 };
      txt = '💀 Perdiste la guerra contra ' + P.nombre;
      st.rel = 10;
    } else if (como === 'paz_buena') {
      ef = { todos: 4, reservas: 3, prestigio: 5 };
      txt = '🕊️ Paz con ventaja: ' + P.nombre + ' paga una indemnización';
      st.rel = 20;
    } else {
      ef = { todos: -6, reservas: -4, prestigio: -8 };
      txt = '🕊️ Paz con derrota: pagás una indemnización a ' + P.nombre;
      st.rel = 25;
    }
    R.diario(s, como === 'victoria' ? '🎖️' : '🕊️', txt, 'mundo');
    const aplicado = R.gob.aplicarEfectos(s, ef);
    return { txt, aplicado, fin: como, bueno: como === 'victoria' || como === 'paz_buena' };
  };

  // Cada mes: la guerra pide una orden, la resistencia de lo anexado y las relaciones se acomodan.
  mun.mes = function (s, momentos) {
    if (!s.mundo) return;
    if (s.mundo.guerra) momentos.push({ tipo: 'guerra' });
    if (s.mundo.crisis && !s.mundo.guerra) momentos.push({ tipo: 'crisis' });
    if (s.mundo.resistencia > 0) {
      s.mundo.resistencia--;
      R.gob.aplicarEfectos(s, { todos: -0.4 });
    }
    const panico = s.mundo.panico || 0;
    for (const p of R.PAISES) {
      const st = s.mundo.paises[p.id];
      if (st.anexado) continue;
      const base = st.alianza ? 70 : R.clamp(p.rel + 18 * (0.5 - Math.abs(p.ideo - s.partido.ideo)), 0, 100);
      const meta = base - panico * (st.alianza ? 0.15 : 0.4) + Math.min(10, (s.mundo.prestigio || 0) * 0.08);
      st.rel = R.clamp(st.rel + (meta - st.rel) * 0.03, 0, 100);
    }
    mun.mundoSeMueve(s);
    // El pánico baja solo (a la mitad en ~10 meses).
    s.mundo.panico = Math.max(0, panico * 0.93 - 0.3);
    // Un vecino que te odia y es bastante más fuerte te puede atacar (más si hay pánico por tus guerras).
    if (!s.mundo.guerra && s.gob && s.gob.meses >= 6) {
      for (const id of R.VECINOS) {
        const st = s.mundo.paises[id];
        if (st.anexado || st.alianza || st.rel >= 15) continue;
        if (mun.fuerzas(s, id).ratio > 0.8) continue;
        if (R.chance(s, 0.015 + (s.mundo.panico || 0) / 2000)) {
          mun.serAtacado(s, id, momentos);
          break;
        }
      }
    }
  };

  // ── Reclamo (jugada diplomática antes de la guerra) ──
  // Le exigís a un país que pague y te abra su mercado. Dura hasta 3 meses: cada mes puede ceder (más si sos mucho
  // más fuerte), sus amigos se enojan y sube el pánico. Al final: guerra o retroceder (perdés prestigio).
  mun.CRISIS_MESES = 3;
  mun.chanceCeder = function (s, paisId, presion) {
    const r = mun.fuerzas(s, paisId).ratio;
    const base = r >= 2 ? 0.55 : r >= 1.5 ? 0.35 : r >= 1.2 ? 0.18 : r >= 1 ? 0.08 : 0.02;
    return R.clamp(base * (presion ? 1.6 : 1), 0, 0.85);
  };
  mun.premioCrisis = (p) => ({ reservas: R.round(2 + Math.min(8, (p.tam || 0.1) * 20), 1), prestigio: 8 });
  mun.empezarCrisis = function (s, paisId) {
    const P = R.PAIS[paisId];
    s.mundo.crisis = { pais: paisId, meses: 0, presiones: 0 };
    const st = s.mundo.paises[paisId];
    st.rel = R.clamp(st.rel - 20, 0, 100);
    for (const id of mun.amigosDe(s, paisId)) s.mundo.paises[id].rel = R.clamp(s.mundo.paises[id].rel - 6, 0, 100);
    mun.sumarPanico(s, 5);
    mun.noticia(s, '😤', 'Argentina le exige a ' + P.nombre + ' que pague');
    return { txt: '😤 Le exigiste a ' + P.nombre + ' que pague. Tiene ' + mun.CRISIS_MESES + ' meses para responder', ef: { todos: 2 } };
  };
  // Cada mes del reclamo: presionar (⭐1, más chance), esperar, ir a la guerra o retroceder.
  mun.OPC_CRISIS = [
    { id: 'presionar', emoji: '😤', nombre: 'Presionar más', costo: { pc: 1 } },
    { id: 'esperar', emoji: '⏳', nombre: 'Esperar su respuesta', costo: {} },
    { id: 'guerra', emoji: '⚔️', nombre: 'Ir a la guerra', costo: {} },
    { id: 'retroceder', emoji: '🕊️', nombre: 'Retroceder', costo: {} },
  ];
  mun.bloqueoCrisis = function (s, id) {
    const C = s.mundo.crisis;
    if (!C) return 'No hay reclamo';
    const ultimo = C.meses >= mun.CRISIS_MESES - 1;
    if ((id === 'presionar' || id === 'esperar') && ultimo) return 'Se acabó el plazo';
    if (id === 'presionar' && s.gob.pc < 1) return 'Falta ⭐';
    return null;
  };
  mun.crisisOrden = function (s, id) {
    const b = mun.bloqueoCrisis(s, id);
    if (b) return { error: b };
    const C = s.mundo.crisis;
    const P = R.PAIS[C.pais];
    const st = s.mundo.paises[C.pais];
    const antes = s.gob.aprob;
    C.meses++;
    if (id === 'guerra') {
      s.mundo.crisis = null;
      const r = mun.empezarGuerra(s, C.pais, 'anexar');
      const aplicado = R.gob.aplicarEfectos(s, r.ef);
      return { txt: r.txt, bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob, fin: 'guerra' };
    }
    if (id === 'retroceder') {
      s.mundo.crisis = null;
      st.rel = R.clamp(st.rel + 5, 0, 100);
      const aplicado = R.gob.aplicarEfectos(s, { prestigio: -5, todos: -2 });
      R.diario(s, '🕊️', 'Retrocediste en el reclamo a ' + P.nombre, 'mundo');
      return { txt: '🕊️ Retrocediste: ' + P.nombre + ' no paga nada', bueno: false, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob, fin: 'retroceder' };
    }
    const presion = id === 'presionar';
    if (presion) {
      s.gob.pc -= 1;
      C.presiones++;
      mun.sumarPanico(s, 3);
      for (const a of mun.amigosDe(s, C.pais)) s.mundo.paises[a].rel = R.clamp(s.mundo.paises[a].rel - 3, 0, 100);
    }
    if (R.chance(s, mun.chanceCeder(s, C.pais, presion))) {
      s.mundo.crisis = null;
      const ef = mun.premioCrisis(P);
      if (!st.tratado) { st.tratado = true; s.gob.bonusExpo = (s.gob.bonusExpo || 0) + P.expo; }
      st.rel = R.clamp(st.rel - 10, 0, 100);
      mun.sumarPanico(s, 5);
      mun.noticia(s, '💰', P.nombre + ' cede ante la Argentina');
      R.diario(s, '💰', '¡' + P.nombre + ' cedió! Paga y abre su mercado', 'mundo');
      const aplicado = R.gob.aplicarEfectos(s, Object.assign({ todos: 3 }, ef));
      return { txt: '💰 ¡' + P.nombre + ' cedió! Paga y te abre su mercado', bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob, fin: 'cedio' };
    }
    return { txt: P.nombre + ' no cede… por ahora', bueno: false, aplicado: [], aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // Te atacan: guerra para defenderte (si ganás, cobrás; si perdés, pagás).
  mun.serAtacado = function (s, paisId, momentos) {
    const P = R.PAIS[paisId];
    s.mundo.guerra = { pais: paisId, objetivo: 'defensa', frente: 50, meses: 0 };
    s.mundo.paises[paisId].rel = 0;
    mun.sumarPanico(s, 10);
    mun.noticia(s, '🚨', P.nombre + ' atacó a la Argentina');
    R.diario(s, '🚨', '¡' + P.nombre + ' nos atacó!', 'mundo');
    const aplicado = R.gob.aplicarEfectos(s, { todos: 8, riesgo: 250, crec: -1 });
    if (momentos) momentos.push({ tipo: 'atacado', pais: paisId, aplicado });
  };

  // Los otros países también juegan: firman y rompen pactos, piden protección si hay pánico y te ofrecen alianzas.
  mun.mundoSeMueve = function (s) {
    const M = s.mundo;
    M.pactos = M.pactos || [];
    const vivos = R.PAISES.filter((p) => !M.paises[p.id].anexado);
    const nombre = (id) => R.PAIS[id].nombre;
    // 1) Pactos nuevos entre países que piensan parecido (y no están ya juntos).
    if (R.chance(s, 0.06) && vivos.length > 2) {
      const a = R.pick(s, vivos);
      const cand = vivos.filter((b) => b.id !== a.id && !mun.tienePacto(s, a.id, b.id) && !(a.bloque && a.bloque === b.bloque) && Math.abs(a.ideo - b.ideo) <= 0.5);
      if (cand.length) {
        const b = R.pick(s, cand);
        M.pactos.push([a.id, b.id]);
        mun.noticia(s, '🤝', nombre(a.id) + ' y ' + nombre(b.id) + ' firman una alianza');
      }
    }
    // 2) A veces un pacto se rompe.
    if (M.pactos.length && R.chance(s, 0.03)) {
      const i = Math.floor(R.rand(s) * M.pactos.length);
      const [a, b] = M.pactos.splice(i, 1)[0];
      mun.noticia(s, '💢', nombre(a) + ' y ' + nombre(b) + ' rompen su alianza');
    }
    // 3) Con pánico, los vecinos chicos piden protección a una potencia amiga.
    if ((M.panico || 0) >= 20) {
      for (const p of vivos) {
        if (p.potencia || M.paises[p.id].alianza || M.paises[p.id].rel >= 55) continue;
        if (!R.chance(s, M.panico / 250)) continue;
        const protector = vivos.filter((q) => q.id !== p.id && q.poder >= 55 && !M.paises[q.id].alianza && !mun.tienePacto(s, p.id, q.id))
          .sort((x, y) => Math.abs(x.ideo - p.ideo) - Math.abs(y.ideo - p.ideo))[0];
        if (!protector) continue;
        M.pactos.push([p.id, protector.id]);
        mun.noticia(s, '🛡️', nombre(p.id) + ' pide protección a ' + nombre(protector.id));
      }
    }
    // 4) Los que te quieren mucho te ofrecen una alianza.
    for (const p of vivos) {
      const st = M.paises[p.id];
      if (st.alianza || st.rel < 72 || mun.ofreceAlianza(s, p.id) || mun.enGuerraCon(s, p.id) || !R.chance(s, 0.05)) continue;
      st.oferta = s.mes;
      mun.noticia(s, '🤝', nombre(p.id) + ' te ofrece una alianza');
    }
  };

  // Fichas extra para el mapa (países anexados).
  mun.fichasMapa = function (s) {
    if (!s.mundo) return [];
    const out = [];
    for (const p of R.PAISES) if (s.mundo.paises[p.id].anexado && p.fichas) for (const f of p.fichas) out.push({ id: f.id, hex: f.hex, abrev: f.abrev, nombre: p.nombre + ' (anexado)', pais: p.id });
    return out;
  };
})(globalThis.R = globalThis.R || {});

</script>

<script>
// ── js/motor/produccion.js ──
// Producción: sectores con nivel, obras del Estado, inversión privada, energía, precios del mundo y ciclos
// (crisis y bonanzas que se avisan antes). Motor sin DOM.
(function (R) {
  'use strict';

  const prod = (R.prod = {});

  // Crea lo que falta (partidas nuevas y guardadas antes de que existiera la producción).
  prod.asegurar = function (s) {
    if (!s.prod) {
      s.prod = { sec: {}, obras: [], novedades: [], invertido: 0 };
      for (const x of R.SECTORES) s.prod.sec[x.id] = { nivel: x.nivel0 };
    }
    if (s.mundo) {
      if (!s.mundo.precios) {
        s.mundo.precios = {};
        s.mundo.preciosAntes = {};
        for (const k of Object.keys(R.PRODUCTOS)) { s.mundo.precios[k] = 1; s.mundo.preciosAntes[k] = 1; }
      }
      if (!s.mundo.ciclos) s.mundo.ciclos = { proximo: null, activos: [], ultimo: s.mes };
    }
    return s.prod;
  };

  prod.nivel = (s, id) => (s.prod ? s.prod.sec[id].nivel : R.SECTOR[id].nivel0);
  prod.precio = (s, producto) => (s.mundo && s.mundo.precios ? s.mundo.precios[producto] : 1);

  // ── Ciclos del mundo ──
  // precios: cuánto se mueve el precio de cada producto. shocks: golpes mientras dura (crec en puntos por año,
  // riesgo en puntos, reservas por mes). sector: cuánto produce un sector (−0,45 = 45 % menos).
  // prep: lo que podés hacer cuando te avisan (mitiga = parte del golpe que te ahorrás; atrae = más inversión privada).
  prod.CICLOS = [
    { id: 'recesion', emoji: '📉', nombre: 'Recesión mundial', peso: 3, aviso: 2, dura: [8, 12],
      precios: { granos: -0.18, energia: -0.3, manufacturas: -0.25, software: -0.12 }, shocks: { crec: -1.4, riesgo: 120 },
      prep: { txt: 'Ahorrar para el golpe', costo: { pc: 2 }, mitiga: 0.5 } },
    { id: 'boom', emoji: '🚀', nombre: 'Boom de materias primas', peso: 2, bueno: true, aviso: 2, dura: [8, 14],
      precios: { granos: 0.3, energia: 0.35 }, shocks: { crec: 0.6 },
      prep: { txt: 'Atraer inversiones', costo: { pc: 2 }, atrae: { campo: 0.6, energia: 0.6 } } },
    { id: 'sequia', emoji: '🌵', nombre: 'Sequía', peso: 2, aviso: 1, dura: [5, 8],
      sector: { campo: -0.45 }, shocks: { crec: -0.8 }, grupos: { campo: -6 },
      prep: { txt: 'Seguro agrícola', costo: { pc: 1, gasto: 2 }, mitiga: 0.5 } },
    { id: 'fed', emoji: '🏦', nombre: 'Suben las tasas en EE.UU.', peso: 2, aviso: 2, dura: [8, 10],
      shocks: { riesgo: 220, reservas: -0.5 },
      prep: { txt: 'Pedir prestado antes', costo: { pc: 1 }, ef: { reservas: 5, deuda: 1.5 }, mitiga: 0.35 } },
    { id: 'brasil', emoji: '🦜', nombre: 'Crisis en Brasil', peso: 2, aviso: 1, dura: [6, 9],
      precios: { manufacturas: -0.35 }, shocks: { crec: -0.7 }, grupos: { trabajadores: -3 },
      prep: { txt: 'Proteger la industria', costo: { pc: 1 }, ef: { rel: { BRA: -5 } }, mitiga: 0.5 } },
    { id: 'petroleo', emoji: '🛢️', nombre: 'El petróleo se dispara', peso: 2, aviso: 1, dura: [6, 10],
      precios: { energia: 0.55 }, shocks: { infl: 0.15 },
      prep: { txt: 'Más pozos ya', costo: { pc: 2 }, atrae: { energia: 0.9 }, mitiga: 0.5 } },
    { id: 'chips', emoji: '🤖', nombre: 'Fiebre tecnológica', peso: 1, bueno: true, aviso: 2, dura: [8, 12],
      precios: { software: 0.45 }, shocks: { crec: 0.3 },
      prep: { txt: 'Atraer empresas', costo: { pc: 2 }, atrae: { tecno: 0.9 } } },
  ];
  prod.CICLO = Object.fromEntries(prod.CICLOS.map((c) => [c.id, c]));

  const activos = (s) => (s.mundo && s.mundo.ciclos ? s.mundo.ciclos.activos : []);
  // Cuánto produce un sector ahora (1 = normal; una sequía lo baja).
  prod.mult = function (s, id) {
    let m = 1;
    for (const c of activos(s)) {
      const X = prod.CICLO[c.id];
      if (X.sector && X.sector[id]) m *= 1 + X.sector[id] * (1 - (c.mitiga || 0));
    }
    return m;
  };
  // Inversión extra por haberte preparado para una bonanza.
  prod.bonusCiclo = (s, id) => R.sum(activos(s).map((c) => (c.atrae && c.atrae[id]) || 0));

  // ── ⚡ Energía ──
  // La producen los pozos y las represas; la consumen la industria, la tecnología y un país que crece.
  // Si falta se importa (se van dólares y la industria frena); si sobra se exporta.
  prod.energia = function (s) {
    const P = s.prod.sec;
    const oferta = P.energia.nivel;
    const demanda = 2 + P.industria.nivel * 0.35 + P.tecno.nivel * 0.1 + Math.max(0, (s.eco.pbi - 100) / 40);
    return { oferta, demanda, saldo: oferta - demanda };
  };
  prod.costoEnergia = function (s) {
    if (!s.prod) return 0;
    const en = prod.energia(s);
    return en.saldo < 0 ? en.saldo * 0.3 * prod.precio(s, 'energia') : 0; // miles de millones de dólares por mes
  };

  // Lo que los sectores suman a las exportaciones (se suma a eco.factorExpo). Al asumir da 0.
  prod.expoExtra = function (s) {
    if (!s.prod) return 0;
    let f = 0;
    for (const x of R.SECTORES) {
      if (x.id === 'energia') continue;
      const nivel = s.prod.sec[x.id].nivel * prod.mult(s, x.id);
      f += x.expo * (nivel * prod.precio(s, x.producto) - x.nivel0);
    }
    const en = prod.energia(s);
    if (en.saldo > 0) f += R.SECTOR.energia.expo * en.saldo * prod.precio(s, 'energia');
    return R.clamp(f, -0.35, 0.6);
  };
  // Lo que suman al crecimiento: la tecnología empuja la productividad; la falta de energía frena.
  prod.crecExtra = function (s) {
    if (!s.prod) return 0;
    const en = prod.energia(s);
    return (s.prod.sec.tecno.nivel - R.SECTOR.tecno.nivel0) * 0.12 + (en.saldo < 0 ? Math.max(-1.5, en.saldo * 0.35) : 0);
  };

  // ── Inversión privada ──
  // El clima general (riesgo país, impuestos, cepo, inflación, estabilidad) y lo propio de cada sector
  // (precio del mundo, tus leyes, retenciones, energía, talento). Da la chance por mes de que un privado suba un nivel.
  prod.clima = function (s) {
    const e = s.eco;
    return [
      { k: 'riesgo', v: -(e.riesgo - 600) / 1200 },
      { k: 'impuestos', v: -0.12 * ((e.impEf ?? e.impuestos) - 2) },
      { k: 'cepo', v: e.cepo ? -0.25 : 0 },
      { k: 'inflacion', v: -Math.max(0, e.inflAnual - 40) / 150 },
      { k: 'estabilidad', v: s.gob ? (s.gob.aprob - 50) / 250 : 0 },
    ];
  };
  prod.atractivo = function (s, id) {
    const x = R.SECTOR[id];
    const e = s.eco;
    const partes = prod.clima(s);
    partes.push({ k: 'precio', v: (prod.precio(s, x.producto) - 1) * 1.2 });
    let leyes = 0;
    for (const [ley, v] of Object.entries(x.leyes)) if (s.gob && s.gob.leyes[ley]) leyes += v;
    partes.push({ k: 'leyes', v: leyes });
    if (id === 'campo') partes.push({ k: 'retenciones', v: -0.15 * ((e.retEf ?? e.retenciones) - 1.5) });
    if (id === 'industria') { const en = prod.energia(s); partes.push({ k: 'energia', v: en.saldo < 0 ? Math.max(-0.5, en.saldo * 0.25) : 0.1 }); }
    if (id === 'tecno') partes.push({ k: 'talento', v: (e.calidad.educacion - 50) / 110 + (e.calidad.ciencia - 50) / 160 });
    partes.push({ k: 'mundo', v: prod.bonusCiclo(s, id) });
    // Cuanto más grande es el sector, más le cuesta crecer (ya se hicieron las inversiones fáciles).
    partes.push({ k: 'tamano', v: -Math.max(0, s.prod.sec[id].nivel - x.nivel0) * 0.09 });
    const total = R.sum(partes.map((p) => p.v));
    const chance = R.clamp(0.035 * (1 + total), 0, 0.12);
    const cierre = total < -0.5 ? R.clamp((-0.5 - total) * 0.04, 0, 0.06) : 0;
    return { partes, total, chance, cierre };
  };
  R.CAUSAS_INVERSION = {
    riesgo: ['📊', 'Riesgo país'], impuestos: ['🧾', 'Impuestos'], cepo: ['🔒', 'Cepo'], inflacion: ['🛒', 'Inflación'],
    estabilidad: ['👍', 'Aprobación'], precio: ['🌍', 'Precio en el mundo'], leyes: ['📜', 'Tus leyes'], retenciones: ['🌾', 'Retenciones'],
    energia: ['⚡', 'Energía'], talento: ['🎓', 'Gente preparada'], mundo: ['🚀', 'Bonanza'], tamano: ['📏', 'Ya es grande'],
  };

  // ── Obras del Estado ──
  // Cada nivel nuevo cuesta un poco más y tarda un poco más que el anterior (lo fácil ya se hizo).
  prod.COSTO_PC = 2;
  prod.extra = (s, id) => Math.max(0, s.prod.sec[id].nivel - R.SECTOR[id].nivel0);
  // ── 🏗️ Cuadrillas: cuántas obras podés tener a la vez ──
  // 1 fija + las que dan las rutas (calidad 40, 55 y 70) + las que contratás (plata todos los meses).
  prod.UMBRALES_RUTAS = [40, 55, 70];
  prod.CUADRILLA = { pc: 2, gastoMes: 0.3, max: 3 }; // contratar: ⭐ una vez + % del presupuesto por mes, para siempre
  prod.cuadrillasRutas = (s) => prod.UMBRALES_RUTAS.filter((u) => s.eco.calidad.infra >= u).length;
  prod.cuadrillasContratadas = (s) => (s.prod && s.prod.contratadas) || 0;
  prod.cuadrillas = (s) => 1 + prod.cuadrillasRutas(s) + prod.cuadrillasContratadas(s);
  // Hacia dónde van las rutas con el presupuesto de obra pública de hoy (la misma cuenta que la calidad de cada área).
  prod.rutasObjetivo = function (s) {
    const e = s.eco;
    return R.clamp(50 + 48 * (e.niveles.obras * R.eco.torta(s) - 1) - Math.max(0, e.inflAnual - 40) * 0.08 + R.eco.bonus(s, 'bonusCalidad', 'infra'), 5, 97);
  };
  // La próxima cuadrilla que dan las rutas: a qué calidad, cuánto falta y en cuántos meses llega (o null si no llega).
  prod.proximaPorRutas = function (s) {
    const infra = s.eco.calidad.infra;
    const umbral = prod.UMBRALES_RUTAS.find((u) => infra < u);
    if (umbral === undefined) return null;
    const obj = prod.rutasObjetivo(s);
    let meses = null;
    if (obj > umbral + 0.5) {
      const paso = Math.min(0.6, 0.06 * R.eco.RITMO.reaccion); // lo que se acerca por mes
      meses = Math.max(1, Math.ceil(Math.log((obj - umbral) / (obj - infra)) / Math.log(1 - paso)));
    }
    return { umbral, falta: umbral - infra, obj, meses };
  };
  prod.bloqueoContratar = function (s) {
    if (prod.cuadrillasContratadas(s) >= prod.CUADRILLA.max) return 'Ya contrataste las ' + prod.CUADRILLA.max;
    if (s.gob.pc < prod.CUADRILLA.pc) return 'Falta ⭐';
    return null;
  };
  prod.contratarCuadrilla = function (s) {
    prod.asegurar(s);
    const b = prod.bloqueoContratar(s);
    if (b) return { error: b };
    s.gob.pc -= prod.CUADRILLA.pc;
    s.prod.contratadas = prod.cuadrillasContratadas(s) + 1;
    const antes = s.gob.aprob;
    const aplicado = R.gob.aplicarEfectos(s, { trabajadores: 2 });
    R.diario(s, '👷', 'Contrataste una cuadrilla de obra', 'gobierno');
    return { txt: '👷 Nueva cuadrilla: ya podés tener ' + prod.cuadrillas(s) + ' obras a la vez', bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };
  prod.despedirCuadrilla = function (s) {
    if (!prod.cuadrillasContratadas(s)) return { error: 'No hay cuadrillas contratadas' };
    s.prod.contratadas--;
    const antes = s.gob.aprob;
    const aplicado = R.gob.aplicarEfectos(s, { trabajadores: -3 });
    R.diario(s, '👷', 'Despediste una cuadrilla de obra', 'gobierno');
    return { txt: '👷 Despediste una cuadrilla: gastás menos', bueno: false, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };
  prod.mesesObra = (s, id) => Math.max(2, Math.round(R.SECTOR[id].meses * (1.25 - s.eco.calidad.infra / 200) * (1 + 0.08 * prod.extra(s, id))));
  prod.gastoObra = (s, id) => R.round(R.SECTOR[id].gasto * (1 + 0.12 * prod.extra(s, id)), 2); // % del presupuesto por mes
  // Lo que suma cada nivel al PBI baja a medida que el sector crece.
  prod.pbiNivel = (s, id) => R.SECTOR[id].pbi * Math.sqrt(R.SECTOR[id].nivel0 / Math.max(R.SECTOR[id].nivel0, s.prod.sec[id].nivel));
  prod.bloqueoConstruir = function (s, id) {
    const P = s.prod;
    if (P.sec[id].nivel + P.obras.filter((o) => o.id === id).length >= R.NIVEL_MAX_SECTOR) return 'Ya está al máximo';
    if (P.obras.length >= prod.cuadrillas(s)) return 'No hay cuadrillas libres';
    if (s.gob.pc < prod.COSTO_PC) return 'Falta ⭐';
    return null;
  };
  prod.construir = function (s, id) {
    prod.asegurar(s);
    const b = prod.bloqueoConstruir(s, id);
    if (b) return { error: b };
    const x = R.SECTOR[id];
    s.gob.pc -= prod.COSTO_PC;
    const meses = prod.mesesObra(s, id);
    s.prod.obras.push({ id, meses, total: meses, gasto: prod.gastoObra(s, id) });
    R.diario(s, '🔨', 'Arrancó una obra: ' + x.obra.toLowerCase(), 'gobierno');
    return { txt: '🔨 Arrancó la obra: ' + x.emoji + ' ' + x.nombre + ' en ' + meses + ' meses', bueno: true, aplicado: [], aprobAntes: s.gob.aprob, aprobDespues: s.gob.aprob };
  };

  // Un sector sube o baja un nivel.
  prod.subir = function (s, id, quien) {
    const x = R.SECTOR[id];
    const st = s.prod.sec[id];
    if (st.nivel >= R.NIVEL_MAX_SECTOR) return false;
    const pbi = prod.pbiNivel(s, id);
    st.nivel++;
    st.pbiSumado = (st.pbiSumado || []).concat(pbi);
    s.eco.pbi *= 1 + pbi / 100;
    s.eco.shocks.push({ k: 'crec', v: 0.4, meses: 3 });
    if (s.gob) {
      s.gob.bonusEmpleo = (s.gob.bonusEmpleo || 0) + x.empleo;
      const g = s.gob.grupos[x.grupo];
      if (g) g.humor = R.clamp(g.humor + 2, 0, 100);
    }
    const txt = quien === 'estado' ? 'Terminó la obra' : quien === 'privado' ? 'Inversión privada' : 'Inversión extranjera';
    R.diario(s, x.emoji, txt + ': ' + x.nombre + ' sube a nivel ' + st.nivel, 'gobierno');
    s.prod.novedades.push({ id, sube: true, quien });
    return true;
  };
  prod.bajar = function (s, id) {
    const x = R.SECTOR[id];
    const st = s.prod.sec[id];
    if (st.nivel <= 1) return false;
    st.nivel--;
    const pbi = (st.pbiSumado && st.pbiSumado.length ? st.pbiSumado.pop() : x.pbi);
    s.eco.pbi /= 1 + pbi / 100;
    if (s.gob) {
      s.gob.bonusEmpleo = (s.gob.bonusEmpleo || 0) - x.empleo;
      const g = s.gob.grupos[x.grupo];
      if (g) g.humor = R.clamp(g.humor - 3, 0, 100);
    }
    R.diario(s, '🏚️', x.nombre + ': cierran empresas, baja a nivel ' + st.nivel, 'gobierno');
    s.prod.novedades.push({ id, sube: false });
    return true;
  };

  // ── Precios del mundo ──
  prod.precios = function (s) {
    const M = s.mundo;
    for (const k of Object.keys(R.PRODUCTOS)) {
      M.preciosAntes[k] = M.precios[k];
      let meta = 1;
      for (const c of M.ciclos.activos) {
        const X = prod.CICLO[c.id];
        if (X.precios && X.precios[k]) meta += X.precios[k];
      }
      M.precios[k] = R.clamp(M.precios[k] + (meta - M.precios[k]) * 0.18 + R.gauss(s) * 0.025, 0.45, 1.9);
    }
  };

  // ── Ciclos: se avisan, se preparan, pegan y terminan ──
  prod.ciclos = function (s, momentos) {
    const C = s.mundo.ciclos;
    for (const c of C.activos) c.quedan--;
    for (const c of C.activos.filter((x) => x.quedan <= 0)) {
      R.diario(s, '✅', prod.CICLO[c.id].nombre + ': ya pasó', 'mundo');
      s.prod.novedades.push({ ciclo: c.id, fin: true });
    }
    C.activos = C.activos.filter((c) => c.quedan > 0);
    if (C.proximo) {
      C.proximo.en--;
      if (C.proximo.en <= 0) {
        prod.activarCiclo(s, C.proximo);
        C.proximo = null;
      }
    } else if (s.mes - C.ultimo >= 7 && R.chance(s, 0.14)) {
      const op = prod.CICLOS.filter((x) => !C.activos.some((a) => a.id === x.id));
      let r = R.rand(s) * R.sum(op.map((x) => x.peso));
      let elegido = op[0];
      for (const x of op) { r -= x.peso; if (r <= 0) { elegido = x; break; } }
      C.proximo = { id: elegido.id, en: elegido.aviso, prep: false };
      C.ultimo = s.mes;
      R.diario(s, '📡', 'Se viene: ' + elegido.nombre, 'mundo');
      if (momentos) momentos.push({ tipo: 'aviso_mundo', id: elegido.id });
    }
  };
  prod.bloqueoPreparar = function (s) {
    const C = s.mundo && s.mundo.ciclos;
    if (!C || !C.proximo) return 'No hay nada que preparar';
    if (C.proximo.prep) return 'Ya te preparaste';
    const X = prod.CICLO[C.proximo.id];
    if (s.gob.pc < (X.prep.costo.pc || 0)) return 'Falta ⭐';
    return null;
  };
  prod.preparar = function (s) {
    const b = prod.bloqueoPreparar(s);
    if (b) return { error: b };
    const C = s.mundo.ciclos;
    const X = prod.CICLO[C.proximo.id];
    C.proximo.prep = true;
    s.gob.pc -= X.prep.costo.pc || 0;
    const ef = Object.assign({}, X.prep.ef || {}, X.prep.costo.gasto ? { gastoExtra: X.prep.costo.gasto } : {});
    const antes = s.gob.aprob;
    const aplicado = R.gob.aplicarEfectos(s, ef);
    R.diario(s, X.emoji, 'Te preparaste: ' + X.prep.txt.toLowerCase(), 'mundo');
    return { txt: X.prep.txt + ' ✅', bueno: true, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };
  prod.activarCiclo = function (s, prox) {
    const X = prod.CICLO[prox.id];
    const mitiga = prox.prep ? X.prep.mitiga || 0 : 0;
    const dura = X.dura[0] + Math.floor(R.rand(s) * (X.dura[1] - X.dura[0] + 1));
    s.mundo.ciclos.activos.push({ id: X.id, quedan: dura, mitiga, atrae: prox.prep ? X.prep.atrae || null : null });
    for (const [k, v] of Object.entries(X.shocks || {})) s.eco.shocks.push({ k, v: v * (X.bueno ? 1 : 1 - mitiga), meses: dura });
    if (X.grupos) {
      const ef = {};
      for (const [g, v] of Object.entries(X.grupos)) ef[g] = v * (1 - mitiga);
      R.gob.aplicarEfectos(s, ef);
    }
    R.diario(s, X.emoji, X.nombre + (mitiga ? ' (te preparaste: pega menos)' : ''), 'mundo');
    s.prod.novedades.push({ ciclo: X.id, empieza: true });
  };
  // Para mostrar: qué hace un ciclo (precios y golpes), en chips de efectos.
  prod.efectosCiclo = function (X) {
    const precios = Object.entries(X.precios || {}).map(([k, v]) => ({ k, v }));
    const ef = {};
    if (X.shocks) {
      if (X.shocks.crec) ef.crec = X.shocks.crec;
      if (X.shocks.riesgo) ef.riesgo = X.shocks.riesgo;
      if (X.shocks.reservas) ef.reservas = X.shocks.reservas * 6;
      if (X.shocks.infl) ef.inflacion = X.shocks.infl * 4;
    }
    Object.assign(ef, X.grupos || {});
    if (X.sector && X.sector.campo) ef.expo = -0.1;
    return { precios, ef };
  };

  // ── El mes de la producción ──
  prod.mes = function (s, momentos) {
    prod.asegurar(s);
    const P = s.prod;
    const e = s.eco;
    P.novedades = [];
    // 1) Obras: cuestan plata cada mes; al terminar, el sector sube.
    for (const o of P.obras) {
      const pct = o.gasto ?? R.SECTOR[o.id].gasto;
      const g = R.eco.gastoComoPBI(s, pct);
      e.gastoExtraMes += g;
      e.gastoExtraAnio += g;
      P.invertido = (P.invertido || 0) + pct;
      o.meses--;
      if (o.meses <= 0) prod.subir(s, o.id, 'estado');
    }
    P.obras = P.obras.filter((o) => o.meses > 0);
    // Las cuadrillas contratadas cobran todos los meses, haya obra o no.
    if (prod.cuadrillasContratadas(s)) {
      const g = R.eco.gastoComoPBI(s, prod.CUADRILLA.gastoMes * prod.cuadrillasContratadas(s));
      e.gastoExtraMes += g;
      e.gastoExtraAnio += g;
    }
    // 2) Inversión privada (y cierres si el clima es muy malo).
    for (const x of R.SECTORES) {
      const a = prod.atractivo(s, x.id);
      if (R.chance(s, a.chance)) prod.subir(s, x.id, 'privado');
      else if (a.cierre && R.chance(s, a.cierre)) prod.bajar(s, x.id);
    }
    // 3) El mundo: precios y ciclos.
    if (s.mundo) {
      prod.precios(s);
      prod.ciclos(s, momentos);
    }
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/motor/protestas.js ──
// Grupos con poder: cada grupo tiene 💪 poder (cuánto puede presionar, no cuántos votos tiene) y, si está muy enojado,
// junta 😡 bronca hasta que arma su jugada (paro, tractorazo, fuga de capitales…). Vos elegís: ceder, negociar o aguantar.
(function (R) {
  'use strict';

  const pro = (R.protestas = {});

  // 💪 Poder: lo cambian los sectores (más industria = sindicatos más fuertes, más campo = el campo pesa más) y algunas leyes.
  pro.poder = function (s) {
    const n = (id) => (R.prod && s.prod ? R.prod.nivel(s, id) : R.SECTOR[id].nivel0);
    const L = (id) => !!(s.gob && s.gob.leyes[id]);
    const e = s.eco;
    const crudo = {
      trabajadores: 16 + n('industria') * 1.6 - (L('reforma_sindical') ? 8 : 0) + (L('reforma_laboral') ? -3 : 0),
      campo: 7 + n('campo') * 1.5,
      empresarios: 7 + n('energia') * 1.0 + n('industria') * 0.5 + n('tecno') * 0.6,
      media: 15 + n('tecno') * 1.2,
      humildes: 9 + Math.max(0, e.pobreza - 20) * 0.35,
      jubilados: 9,
    };
    const tot = R.sum(Object.values(crudo));
    return Object.fromEntries(Object.entries(crudo).map(([k, v]) => [k, (v / tot) * 100]));
  };
  // Qué tan fuerte pega una protesta de ese grupo (0,6 a ~1,9).
  pro.fuerza = (s, id) => 0.6 + pro.poder(s)[id] / 25;

  pro.UMBRAL = 36; // por debajo de este humor el grupo empieza a juntar bronca
