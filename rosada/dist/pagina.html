  };

  // ── Acciones de gobierno (cuestan ⭐) ──
  gob.ACCIONES = [
    { id: 'cadena', emoji: '📺', nombre: 'Cadena nacional', desc: 'Explicás tu plan', pc: 2, enfr: 2,
      ef: { todos: 2.5 }, azar: { p: 0.25, ef: { media: -5 }, txt: 'Cortaste la novela: la gente se enojó 😒' }, res: 'Te escucharon en todo el país 📺' },
    { id: 'cgt', emoji: '✊', nombre: 'Mesa con la CGT', desc: 'Calmás a los gremios', pc: 2, enfr: 3,
      ef: { trabajadores: 8, empresarios: -2 }, res: 'Foto con los gremios 🤝' },
    { id: 'campo', emoji: '🌾', nombre: 'Reunión con el campo', desc: 'Escuchás a los productores', pc: 2, enfr: 3,
      ef: { campo: 9 }, res: 'Mate en la estancia 🧉' },
    { id: 'inversores', emoji: '💼', nombre: 'Foro de inversiones', desc: 'Traés empresas', pc: 2, enfr: 3,
      ef: { empresarios: 8, riesgo: -40 }, res: 'Los inversores sonríen 💼' },
    { id: 'barrios', emoji: '🏘️', nombre: 'Recorrer los barrios', desc: 'Escuchás a los vecinos', pc: 2, enfr: 3,
      ef: { humildes: 8, media: 1 }, res: 'Abrazos en el barrio 🫂' },
    { id: 'remedios', emoji: '💊', nombre: 'Remedios gratis', desc: 'Para jubilados', pc: 1, gasto: 1.5, enfr: 4,
      ef: { jubilados: 10 }, res: 'Doña Marta ya tiene sus pastillas 💊' },
    { id: 'bono', emoji: '💵', nombre: 'Bono', desc: 'Plata extra a todos', pc: 1, gasto: 3, enfr: 6,
      ef: { trabajadores: 6, humildes: 7, jubilados: 6, inflacion: 0.3 }, res: 'El bono llegó 💵' },
    { id: 'precios', emoji: '🏷️', nombre: 'Acuerdo de precios', desc: 'Frenás los aumentos', pc: 3, enfr: 6,
      ef: { inflacion: -0.6, empresarios: -6, media: 3 }, azar: { p: 0.3, ef: { inflacion: 0.6 }, txt: 'Nadie respetó el acuerdo 🙄' }, res: 'Precios congelados 🏷️' },
    { id: 'feriado', emoji: '🏖️', nombre: 'Feriado largo', desc: 'Fin de semana XL', pc: 1, enfr: 4,
      ef: { media: 4, trabajadores: 3, empresarios: -4, crec: -0.3 }, res: '¡A la costa! 🏖️' },
  ];
  gob.ACC = Object.fromEntries(gob.ACCIONES.map((a) => [a.id, a]));

  gob.bloqueoAccion = function (s, a) {
    const G = s.gob;
    if (s.fase !== 'gobierno') return 'No es momento';
    if (G.enfr[a.id] && s.mes - G.enfr[a.id] < a.enfr) return 'De nuevo en ' + (a.enfr - (s.mes - G.enfr[a.id])) + (a.enfr - (s.mes - G.enfr[a.id]) === 1 ? ' mes' : ' meses');
    if (a.pc > G.pc) return 'Falta ⭐';
    return null;
  };

  gob.efectosAccion = (s, a) => Object.assign({}, a.ef, a.gasto ? { gastoExtra: a.gasto } : {}, { pc: -a.pc });

  gob.hacer = function (s, id) {
    const a = gob.ACC[id];
    const b = gob.bloqueoAccion(s, a);
    if (b) return { error: b };
    let ef = gob.efectosAccion(s, a);
    let txt = a.res;
    let bueno = true;
    if (a.azar && R.chance(s, a.azar.p)) {
      ef = R.sumarEfectos(ef, a.azar.ef);
      txt = a.azar.txt;
      bueno = false;
    }
    const antes = s.gob.aprob;
    const aplicado = gob.aplicarEfectos(s, ef);
    s.gob.enfr[id] = s.mes;
    R.diario(s, a.emoji, a.nombre, 'accion');
    return { txt, bueno, aplicado, aprobAntes: antes, aprobDespues: s.gob.aprob };
  };

  // ── Medidas económicas fuertes ──
  gob.MEDIDAS = [
    { id: 'devaluar', emoji: '💱', nombre: 'Devaluar', desc: 'Dólar 30 % más caro', enfr: 12,
      ef: { dolar: 30, expo: 0.12, campo: 8, empresarios: 3, trabajadores: -8, media: -7, humildes: -5, jubilados: -5 },
      res: 'El dólar saltó: más exportaciones, pero suben los precios 💱' },
    { id: 'cepo', emoji: '🔒', nombre: 'Poner cepo', desc: 'Nadie compra dólares', enfr: 6, si: (s) => !s.eco.cepo,
      ef: { empresarios: -10, campo: -6, media: -5 }, hacer: (s) => { s.eco.cepo = true; s.eco.brecha = 15; },
      res: 'Cepo al dólar: cuidás las reservas, pero aparece el blue 🔒' },
    { id: 'sincepo', emoji: '🔓', nombre: 'Sacar el cepo', desc: 'Dólar libre', enfr: 6, si: (s) => s.eco.cepo,
      ef: (s) => ({ empresarios: 10, campo: 7, dolar: Math.round(Math.max(5, s.eco.brecha * 0.6 + (s.eco.reservas < 15 ? 20 : 0))), media: -2 }),
      hacer: (s) => { s.eco.cepo = false; s.eco.brecha = 0; }, res: 'Chau cepo: el dólar se acomoda 🔓' },
    { id: 'motosierra', emoji: '🪚', nombre: 'Motosierra', desc: 'Recorte del 15 % en todo', enfr: 12,
      ef: { empresarios: 6, riesgo: -150 },
      hacer: (s) => { for (const a of R.AREAS) s.eco.niveles[a.id] = Math.max(R.eco.NIVEL_MIN, R.round(s.eco.niveles[a.id] - 0.15, 2)); },

  ];
  gob.MED = Object.fromEntries(gob.MEDIDAS.map((m) => [m.id, m]));
  gob.efectoMedida = (s, m) => (typeof m.ef === 'function' ? m.ef(s) : m.ef);
  gob.bloqueoMedida = function (s, m) {
    if (m.si && !m.si(s)) return 'No aplica';

    if (s.gob.enfr[k] && s.mes - s.gob.enfr[k] < m.enfr) return 'De nuevo en ' + (m.enfr - (s.mes - s.gob.enfr[k])) + ' meses';

  gob.medida = function (s, id) {
    const m = gob.MED[id];

    salud: { jubilados: 0.4, humildes: 0.4, media: 0.3 },

  };
  // Reacción inmediata (anuncio) a los cambios del mes, comparando con cómo arrancó el mes.
  gob.reaccionPresupuesto = function (s) {
    const e = s.eco;
    const ef = {};
    const sumar = (k, v) => (ef[k] = (ef[k] || 0) + v);
    for (const a of R.AREAS) {
      const d = e.niveles[a.id] - e.nivelesInicioMes[a.id];
      if (Math.abs(d) < 0.01) continue;
      const fuerza = d < 0 ? 22 : 11; // perder duele el doble que ganar
      for (const [g, w] of Object.entries(AREA_GRUPOS[a.id])) sumar(g, d * fuerza * w * (a.id === 'jubilaciones' || a.id === 'social' ? 1.4 : 1));
    }
    const di = e.impuestos - e.impuestosInicioMes;
    if (di) { sumar('empresarios', di > 0 ? -7 * di : -4 * di); sumar('media', di > 0 ? -5 * di : -3 * di); }
    const dr = e.retenciones - e.retencionesInicioMes;
    if (dr) sumar('campo', dr > 0 ? -9 * dr : -6 * dr);
    for (const k in ef) ef[k] = R.round(ef[k], 1);
    return ef;
  };

  // ── El mes del gobierno ──
  gob.pasarMes = function (s, momentos) {
    const G = s.gob;
    const e = s.eco;
    const antes = R.eco.foto(s);
    const humorAntes = Object.fromEntries(R.GRUPOS.map((g) => [g.id, G.grupos[g.id].humor]));
    const aprobAntes = G.aprob;

    // Reacción a los cambios de presupuesto e impuestos del mes
    const reaccion = gob.reaccionPresupuesto(s);
    if (Object.keys(reaccion).length) gob.aplicarEfectos(s, reaccion);

    R.eco.mes(s);

    // La gente se acomoda de a poco a cómo le va
    for (const g of R.GRUPOS) {
      const st = G.grupos[g.id];
      const { obj, partes } = gob.objetivoGrupo(s, g.id);
      st.partesAntes = st.partes;
      st.partes = partes;
      st.objetivo = obj;
      st.antes = humorAntes[g.id];
      st.humor = R.clamp(st.humor + (obj - st.humor) * 0.2 + R.gauss(s) * 0.6, 0, 100);
    }
    G.lunaMiel *= 0.88;
    G.meses++;
    G.escandalo *= 0.93;
    gob.actualizarAprob(s);
    G.pc = R.clamp(G.pc + gob.ingresoPC(s), 0, G.pcMax);

    // Nuevo mes y año
    s.mes++;
    e.nivelesInicioMes = Object.assign({}, e.niveles);
    e.impuestosInicioMes = e.impuestos;
    e.retencionesInicioMes = e.retenciones;
    if (R.mesDelAnio(s.mes) === 0) {
      e.gastoExtraAnio = 0;
      e.deficitAcumAnio = 0;
    }

    const despues = R.eco.foto(s);
    G.historia.push(despues);
    if (G.historia.length > 120) G.historia.shift();

    // Crisis
    G.llamas = gob.llamas(s).map((l) => l.id);
    G.aprobBajaMeses = G.aprob < 12 ? (G.aprobBajaMeses || 0) + 1 : 0;

    momentos.push({ tipo: 'resumen', antes, despues, aprobAntes, aprobDespues: G.aprob, humorAntes, reaccion, frases: gob.frases(s, humorAntes, 3) });

    if (G.aprobBajaMeses >= 3) {
      gob.terminar(s, momentos, 'helicoptero');
      return;
    }
    const nLlamas = G.llamas.length;
    if (nLlamas >= 6 && R.chance(s, 0.1 * (nLlamas - 5))) {
      const ev = R.ev.porId('g_estallido');
      if (ev) momentos.push(R.ev.instanciar(s, ev));
    }

    // Elecciones y fin de mandato (las elecciones completas se agregan en otra vuelta)
    if (R.gob.elecciones && R.gob.elecciones(s, momentos)) return;

    // Noticia del mes
    if (R.chance(s, 0.85)) {
      const n = R.ev.elegir(s, 'gobierno');
      if (n) momentos.push(n);
    }
  };

  gob.terminar = function (s, momentos, motivo) {
    s.fase = 'fin';
    s.fin = { motivo, mes: s.mes };
    const txt = { helicoptero: 'Renunciaste y te fuiste en helicóptero 🚁', estallido: 'Estallido social: tuviste que renunciar', mandato: 'Terminaste tu mandato' }[motivo] || 'Fin';
    R.diario(s, '🏁', txt, 'fin');
    momentos.push({ tipo: 'fin' });
  };

  // Frase de la gente: elige la razón que más cambió para cada grupo.
  gob.frases = function (s, humorAntes, max) {
    const G = s.gob;
    const out = [];
    for (const g of R.GRUPOS) {
      const st = G.grupos[g.id];
      const d = st.humor - humorAntes[g.id];
      let mejor = null;
      let mejorD = 0;
      for (const p of st.partes) {
        const ant = (st.partesAntes || []).find((x) => x.k === p.k);
        const dd = p.v - (ant ? ant.v : 0);
        if (Math.abs(dd) > Math.abs(mejorD)) { mejor = p.k; mejorD = dd; }
      }
      // Si nada cambió mucho, habla de lo que más le pesa.
      if (!mejor || Math.abs(mejorD) < 0.6) {
        const top = st.partes.slice().sort((a, b) => Math.abs(b.v) - Math.abs(a.v))[0];
        if (top && Math.abs(top.v) > 4) { mejor = top.k; mejorD = top.v; }
      }
      const clave = mejor ? mejor + (mejorD >= 0 ? '+' : '-') : d >= 0 ? 'bien' : 'mal';
      const banco = (R.FRASES[g.id] && (R.FRASES[g.id][clave] || R.FRASES[g.id][d >= 0 ? 'bien' : 'mal'])) || [];
      if (!banco.length) continue;
      out.push({ grupo: g.id, d, txt: banco[Math.floor(R.rand(s) * banco.length)], bueno: (mejorD || d) >= 0, peso: Math.abs(d) + Math.abs(mejorD) * 0.5 });
    }
    return out.sort((a, b) => b.peso - a.peso).slice(0, max || 3);
  };
})(globalThis.R = globalThis.R || {});

<script>
// ── js/ui/dom.js ──
// Ayudantes de interfaz: crear nodos, ventanas, avisos, chips de efectos y animaciones.
(function (R) {
  'use strict';

  const ui = (R.ui = R.ui || {});

  // h('div', {class: 'x', onclick: fn, style: {...}}, hijos...)
  const h = (R.h = function (tag, props, ...hijos) {
    const el = document.createElementNS(tag === 'svg' || props?.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false || k === 'svg') continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else el.setAttribute(k === 'className' ? 'class' : k, v === true ? '' : v);
      }
    }
    agregar(el, hijos);
    return el;
  });
  function agregar(el, hijos) {
    for (const c of hijos) {
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) agregar(el, c);
      else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
  }
  // SVG: s('circle', {...})
  R.svg = (tag, props, ...hijos) => h(tag, Object.assign({ svg: true }, props), ...hijos);

  ui.montar = function (nodo, ancha) {
    const app = document.getElementById('app');
    const scroll = window.scrollY;
    app.className = 'app' + (ancha ? ' ancha' : '');
    app.replaceChildren(nodo);
    return scroll;
  };

  // ── Ventanas encima (hoja que sube desde abajo en el celu, centrada en la PC) ──
  let capaAbierta = null;
  ui.hayCapa = () => !!capaAbierta;
  ui.abrirCapa = function (contenido, opts) {
    opts = opts || {};
    ui.cerrarCapa(true);
    if (!opts.dejarAvisos) document.getElementById('avisos').replaceChildren();
    const capa = document.getElementById('capa');
    capa.className = 'capa' + (opts.oscura ? ' oscura' : '');
    const hoja = opts.oscura ? contenido : h('div', { class: 'hoja ' + (opts.clase || ''), role: 'dialog', 'aria-modal': 'true' },
      opts.cerrable ? h('button', { class: 'boton mini sec cerrar', onclick: () => ui.cerrarCapa(), 'aria-label': 'Cerrar' }, '✕') : null,
      contenido);
    capa.replaceChildren(hoja);
    capa.hidden = false;
    capaAbierta = { opts };
    if (opts.cerrable) {
      capa.onclick = (e) => { if (e.target === capa) ui.cerrarCapa(); };
    } else capa.onclick = null;
    const foco = hoja.querySelector('[autofocus]') || hoja.querySelector('button:not(.cerrar)');
    if (foco && !opts.sinFoco) setTimeout(() => foco.focus({ preventScroll: true }), 30);
    hoja.scrollTop = 0;
    return hoja;
  };
  ui.cerrarCapa = function (silencioso) {
    const capa = document.getElementById('capa');
    if (!capaAbierta) return;
    const opts = capaAbierta.opts;
    capaAbierta = null;
    capa.hidden = true;
    capa.replaceChildren();
    if (!silencioso && opts.alCerrar) opts.alCerrar();
  };

  // ── Avisos cortos arriba (resultado de una acción) ──
  ui.aviso = function (txt, opts) {
    opts = opts || {};
    const caja = document.getElementById('avisos');
    const el = h('div', { class: 'aviso ' + (opts.tipo || '') },
      h('div', { class: 'txt' }, txt),
      opts.efectos && opts.efectos.length ? ui.chipsEfectos(opts.efectos) : null,

// Noche de elecciones: escrutinio animado, mapa que se pinta y el Congreso que queda.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  ui.eleccion = function (s, clave, alTerminar) {
    const res = s.elecciones[clave];
    if (!res) return alTerminar();
    const lista = res.lista.slice(0, clave === 'ballotage' ? 2 : 6);
    const lentos = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const DUR = lentos ? 6500 : 300;

    // Orden en que «terminan» de contar las provincias (las chicas primero, como en la tele).
    const orden = R.PROVINCIAS.slice().sort((a, b) => a.padron - b.padron + (Math.random() - 0.5) * 3);
    const terminadas = new Set();

    const pctEl = h('span', null, '0');
    const barraEsc = h('i', { style: { width: '0%' } });
    const lineas = lista.map((x) => {
      const p = R.partidoInfo(s, x.id);
      const pista = h('i', { style: { width: '0%', background: p.color } });
      const num = h('div', { class: 'pct' }, '0,0');
      const av = x.id === 'YO' ? R.ui.avatar(s.lider.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) })
        : R.ui.avatar(R.PARTIDOS[x.id].candidato.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) });
      const el = h('div', { class: 'linea' + (x.id === 'YO' ? ' yo' : '') }, av,
        h('div', { class: 'nombre' }, R.elec.nombre(s, x.id), h('small', null, p.simbolo + ' ' + p.sigla), h('div', { class: 'pista' }, pista)), num);
      return { x, el, pista, num };
    });
    const mapaCaja = h('div');
    const pintarMapa = () => mapaCaja.replaceChildren(R.ui.mapa({
      sinMalvinas: true,
      colorDe: (id) => (terminadas.has(id) ? R.elec.color(s, res.ganadores[id]) : '#2a3b5e'),
    }));
    pintarMapa();
    const veredicto = h('div');
    const despues = h('div', { class: 'pila' });
    const saltar = h('button', { class: 'boton mini sec', onclick: () => { t0 = -1e9; } }, '⏩ Ver resultado');
    const cont = h('div', { class: 'noche' },
      h('h2', null, '🗳️ ' + res.titulo),
      h('div', { class: 'escrutinio' }, 'Mesas escrutadas: ', pctEl, '%'),
      h('div', { class: 'barra gorda' }, barraEsc),
      h('div', { class: 'noche-cuerpo' },
        h('div', { class: 'carrera' }, lineas.map((l) => l.el)),
        h('div', { class: 'mapa-noche' }, mapaCaja)),
      h('div', { class: 'centro' }, saltar),
      veredicto, despues);
    ui.abrirCapa(cont, { oscura: true });
    R.son.tambor();

    let t0 = performance.now();
    let ultimoTic = 0;
    const max = Math.max(...lista.map((x) => x.v));
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / DUR);
      const e = 1 - Math.pow(1 - k, 2);
      pctEl.textContent = R.fmt(e * 100, 1);
      barraEsc.style.width = e * 100 + '%';
      // Al principio los números bailan (cuentan primero ciertas mesas) y se acomodan al final.
      lineas.forEach((l, i) => {
        const ruido = Math.sin(t / 380 + i * 1.7) * 3.2 * (1 - e);
        const v = Math.max(0, l.x.v + ruido) * Math.min(1, e * 1.6);
        l.num.textContent = R.fmt(v, 1);
        l.pista.style.width = (Math.max(0, v) / (max * 1.08)) * 100 + '%';
      });
      const nTerm = Math.floor(e * orden.length);
      if (nTerm > terminadas.size) {
        for (let i = terminadas.size; i < nTerm; i++) terminadas.add(orden[i].id);
        pintarMapa();
      }
      if (t - ultimoTic > 160 && k < 1) { R.son.tic(); ultimoTic = t; }
      if (k < 1) requestAnimationFrame(paso);
      else terminar();
    };
    requestAnimationFrame(paso);

    function terminar() {
      orden.forEach((p) => terminadas.add(p.id));
      pintarMapa();
      lineas.forEach((l) => { l.num.textContent = R.fmt(l.x.v, 1); l.pista.style.width = (l.x.v / (max * 1.08)) * 100 + '%'; });
      saltar.remove();
      const yo = res.lista.find((x) => x.id === 'YO');
      const puesto = res.lista.indexOf(yo) + 1;
      let txt;
      let gana = true;
      if (clave === 'paso') {
        gana = res.pasa;
        txt = res.pasa ? (puesto === 1 ? '¡Ganaste las PASO! 🥇' : '¡Pasaste a las generales! Saliste ' + puesto + '.º') : 'Quedaste afuera… no llegaste al 1,5 %';
      } else if (clave === 'general') {
        if (res.ganador === 'YO') txt = '¡GANASTE EN PRIMERA VUELTA! 🏆';
        else if (res.ballotage && res.ballotage.includes('YO')) txt = '¡Vamos al ballotage contra ' + R.elec.nombre(s, res.ballotage.find((x) => x !== 'YO')) + '! ⚔️';
        else { gana = false; txt = 'Perdiste. Saliste ' + puesto + '.º'; }
      } else {
        gana = res.ganador === 'YO';
        txt = gana ? '¡GANASTE EL BALLOTAGE! 🏆' : 'Perdiste el ballotage por ' + R.fmt(res.lista[0].v - res.lista[1].v, 1) + ' puntos';
      }
      veredicto.replaceChildren(h('div', { class: 'veredicto ' + (gana ? 'gana' : 'pierde') }, txt));
      if (gana) {
        R.son.aplausos();
        if ((clave === 'general' && res.ganador === 'YO') || clave === 'ballotage') { ui.confeti(); R.son.genial(); }
      } else R.son.abucheo();

      const extras = [];
      if (res.perdidos > 0.3) extras.push(h('div', { class: 'tarjeta chico' }, '⚠️ Te faltaron fiscales: perdiste ' + R.fmt(res.perdidos, 1) + ' puntos en las mesas.'));
      if (res.bancas) extras.push(congresoNuevo(s, res));
      extras.push(h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, 'Seguir ▶'));
      despues.replaceChildren(...extras);
      const btn = despues.querySelector('.boton');
      if (btn) setTimeout(() => btn.focus({ preventScroll: true }), 50);
    }
  };

  function congresoNuevo(s, res) {
    const dip = R.composicion(s, 'diputados');
    const sen = R.composicion(s, 'senado');
    const misDip = res.bancas.dip.YO || 0;
    const misSen = res.bancas.sen.YO || 0;
    const camara = (nombre, comp, mias, total) => h('div', { class: 'tarjeta pila', style: { gap: '4px', padding: '10px' } },
      h('div', { class: 'etiqueta centro' }, nombre),
      R.ui.hemiciclo(R.ui.gruposCamara(s, comp), { centro: comp.YO || 0, sub: 'de ' + total, resaltar: 'YO' }),
      h('div', { class: 'centro chico' }, mias ? '+' + mias + ' bancas nuevas' : 'Sin bancas nuevas'));
    return h('div', { class: 'pila' },
      h('div', { class: 'centro', style: { fontWeight: 900 } }, '🏛️ Así queda el Congreso'),
      h('div', { class: 'bancas-ganadas' },
        camara('Diputados', dip, misDip, 257),
        camara('Senado', sen, misSen, 72)),
      h('div', { class: 'leyenda', style: { color: '#fff' } }, R.ui.gruposCamara(s, dip).map((g) => {
        const p = R.partidoInfo(s, g.id);
        return h('span', { class: 'chip', style: { background: p.color, color: '#fff', borderColor: '#fff' } }, p.sigla);
      })));
  }
})(globalThis.R = globalThis.R || {});

<script>
// ── js/main.js ──
// Arranque y «director de orquesta»: qué pantalla se ve y en qué orden aparecen noticias y elecciones.
(function (R) {
  'use strict';
  const ui = R.ui;
  const h = R.h;

  ui.s = null;
  ui.vista = { tab: 'acciones' };

  ui.irPortada = function () {
    ui.cerrarCapa(true);
    ui.s = null;
    ui.portada();
    window.scrollTo(0, 0);
  };

  ui.continuar = function (s) {
    ui.s = s;
    ui.vista = { tab: s.fase === 'gobierno' ? 'inicio' : 'acciones' };
    ui.render();
    window.scrollTo(0, 0);
    ui.procesarCola();
  };

  ui.render = function () {
    const s = ui.s;
    if (!s) return ui.portada();
    if (s.fase === 'campana') return ui.pantallaCampana(s);
    if (s.fase === 'gobierno' && ui.pantallaGobierno) return ui.pantallaGobierno(s);
    if (s.fase === 'fin') return ui.pantallaFin(s);
    return ui.pantallaElecto(s);
  };

  // Mientras se arma el gobierno: pantalla de presidente electo.
  ui.pantallaElecto = function (s) {
    ui.ocultarNav();
    ui.montar(h('main', { class: 'pila', style: { paddingTop: '16px' } },
      h('section', { class: 'tarjeta pila centro' },
        R.ui.avatar(s.lider.avatar, { size: 110, humor: 'feliz', banda: true }),
        h('h2', null, s.lider.nombre + ', presidente electo'),
        h('p', null, 'El gobierno se arma en la próxima versión del juego.')),
      h('button', { class: 'boton ancho', onclick: () => ui.irPortada() }, '🏠 Portada')));
  };

  // Muestra de a uno los momentos pendientes (noticias, elecciones, debates…).
  ui.procesarCola = function () {
    const s = ui.s;
    if (!s || ui.procesando || ui.hayCapa()) return;
    const m = s.cola[0];
    if (!m) return;
    ui.procesando = true;
    const listo = () => {
      if (s.cola[0] === m) s.cola.shift();
      if (s.fase === 'fin') s.cola = [];
      R.guardar(s);
      ui.procesando = false;
      ui.render();
      ui.procesarCola();
    };
    switch (m.tipo) {
      case 'noticia': return ui.noticia(s, m, listo);
      case 'eleccion': return ui.eleccion(s, m.clave, listo);
      case 'debate': return ui.debate(s, m, listo);
      case 'asuncion': return ui.asuncion(s, () => { if (R.gob && R.gob.iniciar) R.gob.iniciar(s); listo(); });
      default:
        if (ui.momentos && ui.momentos[m.tipo]) return ui.momentos[m.tipo](s, m, listo);
        return listo();
    }
  };

  // Enter = pasar el mes (en la PC).
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || ui.hayCapa() || !ui.s) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
