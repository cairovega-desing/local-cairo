<script>
// ── js/motor/metas.js ──
// Motor de metas: el gran objetivo del mandato y las metas que aparecen solas, con barra, plazo, premio y castigo.
(function (R) {
  'use strict';

  const met = (R.metas = {});

  met.asegurar = function (s) {
    if (!s.metas) s.metas = { grande: null, activas: [], hechas: {}, fallidas: {} };
    return s.metas;
  };

  // Tu ideología decide qué grandes objetivos te ofrecen.
  met.ideaDe = (s) => (s.partido.ideo <= -0.2 ? 'estado' : s.partido.ideo >= 0.2 ? 'mercado' : 'centro');
  met.opcionesGrandes = (s) => R.METAS_GRANDES.filter((m) => m.idea === met.ideaDe(s));

  met.FIN_GRANDE = 44; // meses desde que asumís: se define antes de la elección

  met.elegirGrande = function (s, id) {
    met.asegurar(s);
    const M = R.META[id];
    s.metas.grande = id;
    s.metas.activas = s.metas.activas.filter((a) => !R.META[a.id].grande);
    s.metas.activas.unshift({ id, desde: s.mes, hasta: s.gob.inicio + met.FIN_GRANDE, base: M.dato(s) });
    R.diario(s, '👑', 'Tu gran objetivo: ' + M.nombre, 'gobierno');
  };

  // 0 a 1: cuánto del camino recorriste desde que apareció la meta.
  met.progreso = function (s, a) {
    const M = R.META[a.id];
    const v = M.dato(s);
    const desde = a.base;
    const hasta = M.objetivo;
    if (met.cumplida(s, a.id)) return 1;
    const tramo = hasta - desde;
    if (Math.abs(tramo) < 1e-9) return 0;
    return R.clamp((v - desde) / tramo, 0, 1);
  };
  met.cumplida = function (s, id) {
    const M = R.META[id];
    const v = M.dato(s);
    return M.baja ? v <= M.objetivo : v >= M.objetivo;
  };
  met.quedan = (s, a) => Math.max(0, a.hasta - s.mes);

  // Cuánto falta y cómo llegar. Para las metas de un sector: niveles que faltan (contando las obras en marcha)
  // y cuántos meses tardarías con tus cuadrillas si construís sin parar.
  met.camino = function (s, a) {
    const M = R.META[a.id];
    const v = M.dato(s);
    const out = { hoy: M.fmt(v), meta: M.fmt(M.objetivo), como: M.como || [] };
    if (M.sector && s.prod) {
      const enObra = s.prod.obras.filter((o) => o.id === M.sector).length;
      const faltan = Math.max(0, Math.ceil(M.objetivo - v) - enObra);
      out.sector = M.sector;
      out.faltan = faltan;
      out.enObra = enObra;
      const c = R.prod.cuadrillas(s);
      out.meses = faltan ? Math.ceil(faltan / c) * R.prod.mesesObra(s, M.sector) : 0;
      out.cuadrillas = c;
    }
    return out;
  };
  // La meta activa que apunta a un sector (para mostrarla en la hoja del sector).
  met.deSector = (s, id) => (s.metas ? s.metas.activas.find((a) => R.META[a.id].sector === id) : null);

  // Cada mes: se cumplen, vencen o aparecen metas. Devuelve los momentos para mostrar.
  met.mes = function (s, momentos) {
    met.asegurar(s);
    const S = s.metas;
    // Partidas guardadas antes de que existieran las metas: se ofrece el gran objetivo una vez.
    if (!S.grande && !S.ofrecido) { S.ofrecido = true; momentos.push({ tipo: 'legado' }); }
    const seguir = [];
    for (const a of S.activas) {
      const M = R.META[a.id];
      if (met.cumplida(s, a.id)) {
        const aplicado = R.gob.aplicarEfectos(s, M.premio);
        S.hechas[a.id] = s.mes;
        R.diario(s, '🎯', '¡Meta cumplida! ' + M.nombre, 'gobierno');
        momentos.push({ tipo: 'meta', id: a.id, ok: true, aplicado });
      } else if (s.mes >= a.hasta) {
        const aplicado = R.gob.aplicarEfectos(s, M.castigo || {});
        S.fallidas[a.id] = s.mes;
        R.diario(s, '⌛', 'No llegaste: ' + M.nombre, 'gobierno');
        momentos.push({ tipo: 'meta', id: a.id, ok: false, aplicado });
      } else seguir.push(a);
    }
    S.activas = seguir;
    // Nuevas (como mucho 3 a la vez, además del gran objetivo; la misma no vuelve antes de 2 años).
    const chicas = () => S.activas.filter((a) => !R.META[a.id].grande).length;
    for (const M of R.METAS) {
      if (chicas() >= 3) break;
      if (S.activas.some((a) => a.id === M.id)) continue;
      const ultima = Math.max(S.hechas[M.id] ?? -99, S.fallidas[M.id] ?? -99);
      if (s.mes - ultima < 24) continue;
      let ok = false;
      try { ok = M.si(s); } catch (err) { ok = false; }
      if (!ok || met.cumplida(s, M.id)) continue;
      S.activas.push({ id: M.id, desde: s.mes, hasta: s.mes + M.plazo, base: M.dato(s) });
      R.diario(s, '🎯', 'Nueva meta: ' + M.nombre, 'gobierno');

<script>
// ── js/motor/justicia.js ──
// La Justicia: una ley polémica puede terminar en la Corte, que la frena. Vos elegís acatar, apelar (con %) o desobedecer.
(function (R) {
  'use strict';

  const jus = (R.justicia = {});

  // Chance por mes de que la Corte frene una ley: crece con la polémica; los decretos (DNU) caen el doble.
  jus.chance = function (s, ley) {
    const st = s.gob.leyesEstado[ley.id];
    let c = Math.max(0, ley.polemica - 0.45) * 0.15;
    if (st && st.estado === 'dnu') c *= 2;
    if (s.gob.leyes.transparencia) c *= 0.7; // con transparencia los jueces tienen menos de dónde agarrarse
    return c;
  };
  // Chance de ganar la apelación: mejor si la gente te banca.
  jus.chanceApelar = (s) => R.clamp(0.45 + (s.gob.aprob - 50) / 200, 0.2, 0.8);

  jus.mes = function (s, momentos) {
    const G = s.gob;
    G.revisadas = G.revisadas || {};
    if (s.mes - (G.corteMes ?? -99) < 6) return;
    for (const id of Object.keys(G.leyes)) {
      const ley = R.LEY[id];
      const st = G.leyesEstado[id];
      if (!ley || !st || G.revisadas[id] || ley.polemica < 0.55) continue;
      const meses = s.mes - st.mes;
      if (meses < 1) continue;
      if (meses > 10) { G.revisadas[id] = true; continue; }
      if (R.chance(s, jus.chance(s, ley))) {
        G.revisadas[id] = true;
        G.corteMes = s.mes;
        momentos.push({ tipo: 'justicia', ley: id });
        return;
      }
    }
  };

  jus.OPCIONES = [
    { id: 'acatar', emoji: '⚖️', txt: 'Acatar el fallo', costo: {}, ef: { media: 2 } },
    { id: 'apelar', emoji: '📜', txt: 'Apelar', costo: { pc: 2 }, ef: {} },
    { id: 'desobedecer', emoji: '😤', txt: 'No acatar', costo: {}, ef: { escandalo: 3, media: -4, riesgo: 80 } },
  ];
  jus.resolver = function (s, m, id) {
    const op = jus.OPCIONES.find((o) => o.id === id);
    const G = s.gob;
    const ley = R.LEY[m.ley];
    if (op.costo.pc && G.pc < op.costo.pc) return { error: 'Falta ⭐' };
    if (op.costo.pc) G.pc -= op.costo.pc;
    const antes = G.aprob;
    let txt;
    let bueno = true;
    let aplicado = R.gob.aplicarEfectos(s, op.ef);
    if (id === 'acatar') {
      R.congreso.derogar(s, ley.id, 'corte');
      txt = '⚖️ Acataste: ' + ley.nombre + ' queda frenada';
      bueno = false;
    } else if (id === 'apelar') {
      if (R.chance(s, jus.chanceApelar(s))) {
        txt = '📜 ¡Ganaste la apelación! ' + ley.nombre + ' sigue';
        R.diario(s, '📜', 'Ganaste la apelación: ' + ley.nombre, 'ley');
      } else {
        R.congreso.derogar(s, ley.id, 'corte');
        aplicado = aplicado.concat(R.gob.aplicarEfectos(s, { media: -1 }));
        txt = '📜 Perdiste la apelación: ' + ley.nombre + ' cae';
        bueno = false;
      }
    } else {
      txt = '😤 No acataste: ' + ley.nombre + ' sigue, pero hay escándalo';
      R.diario(s, '😤', 'No acataste a la Corte por ' + ley.nombre, 'ley');
      bueno = false;
    }
    return { txt, bueno, aplicado, aprobAntes: antes, aprobDespues: G.aprob };
  };
})(globalThis.R = globalThis.R || {});

</script>

// Oposición: si perdiste en 2027, seguís construyendo hasta el medio término de 2029 y las presidenciales de 2031.
(function (R) {
  'use strict';

  const op = (R.oposicion = {});

  op.puede = (s) => s.fase === 'fin' && s.fin && ['paso', 'general', 'ballotage'].includes(s.fin.motivo) && !s.gob && !s.gobRival && R.anio(s.mes) === 2027;

  op.iniciar = function (s) {
    let ganador = null;
    if (s.elecciones.ballotage) ganador = s.elecciones.ballotage.ganador;
    else if (s.elecciones.general) ganador = s.elecciones.general.ganador || s.elecciones.general.lista.find((x) => x.id !== 'YO').id;
    else if (s.elecciones.paso) ganador = s.elecciones.paso.lista.find((x) => x.id !== 'YO').id;
    if (!ganador || ganador === 'YO') ganador = 'PL';
    s.gobRival = { partido: ganador, aprob: 55 };
    s.fase = 'campana';
    s.fin = null;
    s.mes = R.mesNum(2027, 11);
    s.calendario = { medio: R.mesNum(2029, 9), paso: R.mesNum(2031, 7), general: R.mesNum(2031, 9), ballotage: R.mesNum(2031, 10) };
    s.ballotage = null;
    s.cola = [];
    s.flags.vinoDeOposicion = true;
    const c = s.camp;
    c.agenda = c.agendaMax;
    c.usadasMes = {};
    c.alianza = null;
    c.fondos += 40;
    R.diario(s, '🔄', 'Seguís en la oposición. Gobierna ' + R.elec.nombre(s, ganador), 'oposicion');
    s.encuestas.push(R.camp.encuesta(s));
  };

  // El gobierno rival se desgasta (o no) mes a mes.
  op.mes = function (s) {
    const G = s.gobRival;
    if (!G) return;
    G.aprob = R.clamp(G.aprob + R.gauss(s) * 2.4 - 0.12, 15, 80);
  };

  // Peso extra del partido que gobierna según su aprobación (lo usa R.camp.votos).
  op.factor = (s, id) => (s.gobRival && s.gobRival.partido === id ? 0.7 + (s.gobRival.aprob / 100) * 1.0 : 1);

    else if (e.inflAnual > 1000) titulo = 'La de la hiperinflación';
    else if (malvinas) titulo = 'La que recuperó Malvinas';
    else if (anex >= 2) titulo = 'Conquista del Cono Sur';

    return { puntos, estrellas, titulo };

// ── js/ui/dom.js ──
// Ayudantes de interfaz: crear nodos, ventanas, avisos, chips de efectos y animaciones.
(function (R) {
  'use strict';

  const ui = (R.ui = R.ui || {});

  // h('div', {class: 'x', onclick: fn, style: {...}}, hijos...)
  const h = (R.h = function (tag, props, ...hijos) {
    const el = document.createElementNS(tag === 'svg' || props?.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false || k === 'svg') continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else el.setAttribute(k === 'className' ? 'class' : k, v === true ? '' : v);
      }
    }
    agregar(el, hijos);
    return el;
  });
  function agregar(el, hijos) {
    for (const c of hijos) {
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) agregar(el, c);
      else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
  }
  // SVG: s('circle', {...})
  R.svg = (tag, props, ...hijos) => h(tag, Object.assign({ svg: true }, props), ...hijos);

  ui.montar = function (nodo, ancha) {
    const app = document.getElementById('app');
    const scroll = window.scrollY;
    app.className = 'app' + (ancha ? ' ancha' : '');
    app.replaceChildren(nodo);
    return scroll;
  };

  // ── Ventanas encima (hoja que sube desde abajo en el celu, centrada en la PC) ──
  let capaAbierta = null;
  ui.hayCapa = () => !!capaAbierta;
  ui.abrirCapa = function (contenido, opts) {
    opts = opts || {};
    ui.cerrarCapa(true);
    if (!opts.dejarAvisos) document.getElementById('avisos').replaceChildren();
    const capa = document.getElementById('capa');
    capa.className = 'capa' + (opts.oscura ? ' oscura' : '');
    const hoja = opts.oscura ? contenido : h('div', { class: 'hoja ' + (opts.clase || ''), role: 'dialog', 'aria-modal': 'true' },
      opts.cerrable ? h('button', { class: 'boton mini sec cerrar', onclick: () => ui.cerrarCapa(), 'aria-label': 'Cerrar' }, '✕') : null,
      contenido);
    capa.replaceChildren(hoja);
    capa.hidden = false;
    capaAbierta = { opts };
    if (opts.cerrable) {
      capa.onclick = (e) => { if (e.target === capa) ui.cerrarCapa(); };
    } else capa.onclick = null;
    const foco = hoja.querySelector('[autofocus]') || hoja.querySelector('button:not(.cerrar)');
    if (foco && !opts.sinFoco) setTimeout(() => foco.focus({ preventScroll: true }), 30);

  ui.cerrarCapa = function (silencioso) {

    if (!capaAbierta) return;
    const opts = capaAbierta.opts;
    capaAbierta = null;
    capa.hidden = true;
    capa.replaceChildren();
    if (!silencioso && opts.alCerrar) opts.alCerrar();
  };

  // ── Avisos cortos arriba (resultado de una acción) ──
  ui.aviso = function (txt, opts) {
    opts = opts || {};
    const caja = document.getElementById('avisos');
    const el = h('div', { class: 'aviso ' + (opts.tipo || '') },
      h('div', { class: 'txt' }, txt),
      opts.efectos && opts.efectos.length ? ui.chipsEfectos(opts.efectos) : null,
      opts.extra || null);
    caja.appendChild(el);
    while (caja.children.length > 2) caja.firstChild.remove();
    const dur = opts.dur || 2600 + (opts.efectos ? opts.efectos.length * 250 : 0);
    setTimeout(() => {
      el.classList.add('saliendo');
      setTimeout(() => el.remove(), 320);
    }, dur);
    el.addEventListener('click', () => el.remove());
    return el;
  };

  // Chips de efectos: [{emoji, nombre, flechas, sube, bueno}] → «👁️ Te conocen ▲▲»
  ui.chipsEfectos = function (lista, opts) {
    opts = opts || {};
    return h('div', { class: 'efectos' }, opts.antes || null, lista.map((e) => {
      const fl = (e.sube ? '▲' : '▼').repeat(e.flechas);
      const etiqueta = e.pct ? R.fmt(Math.abs(e.v), 1) + '%' : e.numero ? R.signo(e.v, 0) : fl;
      return h('span', { class: 'ef ' + (e.neutro ? 'neutro' : e.bueno ? 'bien' : 'mal'), title: e.nombre + (e.sube ? ' sube' : ' baja') },
        h('span', { class: 'em' }, e.emoji),
        opts.conNombre !== false && !opts.compacto ? h('span', { class: 'nom' }, e.nombre) : null,
        h('span', { class: e.numero ? '' : 'fl' }, etiqueta));
    }));
  };

  // Número que cuenta de a poco.
  ui.contar = function (el, desde, hasta, dur, fmt) {
    fmt = fmt || ((x) => R.fmt(x, 1));
    const t0 = performance.now();
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(desde + (hasta - desde) * e);
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  };

  ui.temblor = function (el) {
    el = el || document.getElementById('app');
    el.classList.remove('temblor');
    void el.offsetWidth;
    el.classList.add('temblor');
  };

  ui.confeti = function (colores) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    colores = colores || ['#f6b40e', '#6cb4ea', '#ffffff', '#ff8a80', '#5bd38c'];
    const c = h('canvas', { class: 'confeti' });

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = innerWidth * dpr;
    c.height = innerHeight * dpr;
    const ctx = c.getContext('2d');
    const ps = Array.from({ length: 140 }, () => ({
      x: Math.random() * c.width, y: -Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 4 * dpr,
      vy: (2 + Math.random() * 4) * dpr, r: (4 + Math.random() * 5) * dpr, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3,
      col: colores[Math.floor(Math.random() * colores.length)],
    }));
    const t0 = performance.now();
    const paso = (t) => {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      }
      if (t - t0 < 3200) requestAnimationFrame(paso);
      else c.remove();
    };
    requestAnimationFrame(paso);
  };

  // Bandera del partido (tu diseño o la de cada rival) con la sigla abajo.
  ui.escudo = function (p, grande) {
    const b = R.BANDERA.de(p);
    return h('div', { class: 'escudo-bandera' + (grande ? ' grande' : '') },
      R.ui.banderaPartido(b, { ancho: grande ? 132 : 46, sigla: p.sigla }),
      grande ? h('span', { class: 'sig' }, p.sigla) : null);
  };
  ui.miniEscudo = (p) => h('div', { class: 'mini-bandera', title: p.nombre }, R.ui.banderaPartido(R.BANDERA.de(p), { ancho: 30, sigla: p.sigla }));

  // Mezcla un color con blanco (0 = color, 1 = blanco).
  ui.aclarar = function (hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

  };

// Sonidos generados en el momento con WebAudio (no hay archivos). Arranca después del primer toque.
(function (R) {
  'use strict';

  const son = (R.son = {});
  let ctx = null;
  son.activo = R.pref('sonido') !== false;

  function audio() {
    if (!son.activo) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tono(frec, dur, opts) {
    const a = audio();
    if (!a) return;
    opts = opts || {};
    const t = a.currentTime + (opts.retraso || 0);
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = opts.tipo || 'sine';
    o.frequency.setValueAtTime(frec, t);
    if (opts.hasta) o.frequency.exponentialRampToValueAtTime(opts.hasta, t + dur);
    const vol = opts.vol ?? 0.18;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  function ruido(dur, opts) {
    const a = audio();
    if (!a) return;
    opts = opts || {};
    const t = a.currentTime + (opts.retraso || 0);
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (opts.crepitar ? (Math.random() < 0.08 ? 1 : 0.2) : 1);
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = opts.filtro || 'bandpass';
    f.frequency.value = opts.frec || 1800;
    f.Q.value = opts.q || 0.8;
    const g = a.createGain();
    const vol = opts.vol ?? 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (opts.ataque || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(a.destination);
    src.start(t);
  }

  son.toque = () => tono(660, 0.07, { tipo: 'triangle', vol: 0.12 });
  son.bien = () => { tono(660, 0.12, { tipo: 'triangle' }); tono(990, 0.18, { tipo: 'triangle', retraso: 0.09 }); };
  son.genial = () => [523, 659, 784, 1046].forEach((f, i) => tono(f, 0.2, { tipo: 'triangle', retraso: i * 0.08, vol: 0.16 }));
  son.mal = () => { tono(220, 0.22, { tipo: 'sawtooth', vol: 0.08, hasta: 150 }); };
  son.moneda = () => { tono(988, 0.08, { tipo: 'square', vol: 0.06 }); tono(1318, 0.22, { tipo: 'square', vol: 0.06, retraso: 0.07 }); };
  son.diario = () => { for (let i = 0; i < 5; i++) ruido(0.03, { retraso: i * 0.07, frec: 3000, vol: 0.12, q: 2 }); };
  son.tambor = () => { tono(110, 0.25, { vol: 0.3, hasta: 50 }); ruido(0.12, { frec: 400, vol: 0.15 }); };
  son.aplausos = (dur) => ruido(dur || 1.6, { crepitar: true, frec: 2400, q: 0.6, vol: 0.3, ataque: 0.15 });
  son.abucheo = () => { tono(180, 0.7, { tipo: 'sawtooth', vol: 0.06, hasta: 120 }); tono(150, 0.7, { tipo: 'sawtooth', vol: 0.05, hasta: 100 }); };

  son.alternar = function () {
    son.activo = !son.activo;
    R.pref('sonido', son.activo);
    if (son.activo) son.bien();
    return son.activo;
  };

// Hemiciclo del Congreso: una banca = un puntito, coloreado por partido (de izquierda a derecha).
(function (R) {
  'use strict';

  // grupos: [{id, n, color, borde?}] ya ordenados; opts: {filas, centro, sub, resaltar}
  R.ui.hemiciclo = function (grupos, opts) {
    opts = opts || {};
    const S = R.svg;
    const N = grupos.reduce((a, g) => a + g.n, 0);
    const filas = opts.filas || (N > 150 ? 9 : N > 60 ? 5 : 4);
    const r0 = 42;
    const r1 = 98;
    const radios = Array.from({ length: filas }, (_, i) => (filas === 1 ? r1 : r0 + ((r1 - r0) * i) / (filas - 1)));
    const sumaR = R.sum(radios);
    const porFila = radios.map((r) => Math.round((N * r) / sumaR));
    let dif = N - R.sum(porFila);
    for (let i = filas - 1; dif !== 0; i = (i - 1 + filas) % filas) {
      porFila[i] += Math.sign(dif);
      dif -= Math.sign(dif);
    }
    const pos = [];
    radios.forEach((r, i) => {
      const n = porFila[i];
      for (let j = 0; j < n; j++) {
        const a = n === 1 ? Math.PI / 2 : Math.PI * (1 - j / (n - 1));
        pos.push({ a, r, x: Math.cos(a) * r, y: -Math.sin(a) * r });
      }
    });
    pos.sort((p, q) => q.a - p.a || p.r - q.r);
    const radioPunto = Math.min(((r1 - r0) / Math.max(1, filas - 1)) * 0.42, (Math.PI * r0) / Math.max(1, porFila[0]) * 0.45, 6);
    const puntos = [];
    let k = 0;
    for (const g of grupos) {
      for (let i = 0; i < g.n; i++, k++) {
        const p = pos[k];
        if (!p) continue;
        puntos.push(S('circle', {
          cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: radioPunto.toFixed(2), fill: g.color,
          stroke: g.borde || '#13284a', 'stroke-width': opts.resaltar && opts.resaltar !== g.id ? 0.4 : 0.9,
          opacity: opts.resaltar && opts.resaltar !== g.id ? 0.55 : 1,

    }
    const textos = [];
    if (opts.centro !== undefined) textos.push(S('text', { x: 0, y: -8, 'text-anchor': 'middle', style: 'font-family: var(--f-titulo); font-size: 26px; fill: currentColor' }, String(opts.centro)));
    if (opts.sub) textos.push(S('text', { x: 0, y: 6, 'text-anchor': 'middle', style: 'font-size: 10px; font-weight: 900; fill: currentColor; opacity: .75' }, opts.sub));

  R.ui.gruposCamara = function (s, comp) {

      .filter(([, n]) => n > 0)
      .map(([id, n]) => {

    if ((b.slot || 0) >= patron.n) b.slot = 0;

      if (e === 'ninguno') return h('span', { style: { fontSize: '11px', fontWeight: 900 } }, 'Sin');

    const b = ui.borrador;

    const refrescar = () => {
      const fit = (p) => R.clamp(1 + 0.6 * (0.55 - Math.abs(p.lean - b.ideo / 2)), 0.6, 1.35);

  function pasoCandidato() {
    const b = ui.borrador;

    return h('section', { class: 'tarjeta pila' },
      h('h2', null, 'Tu candidato/a'),

        h('div', { class: 'fila' },
          h('input', { type: 'text', id: 'in-lider', maxlength: 30, value: b.lider, autocomplete: 'off', oninput: (e) => { b.lider = e.target.value; refrescarBoton(); } }),

      h('div', { class: 'editor-avatar' }, vista,
        h('div', { class: 'controles' },
          ciclo('piel', '🎨 Piel', R.AV.piel.length), ciclo('pelo', '💇 Pelo', R.AV.pelo.length),
          ciclo('colorPelo', '🖌️ Color', R.AV.colorPelo.length), ciclo('anteojos', '👓 Lentes', 3),
          ciclo('barba', '🧔 Barba', 3), ciclo('ropa', '👔 Ropa', R.AV.ropa.length))),
      h('div', { class: 'etiqueta' }, 'Dificultad'),
      h('div', { class: 'dificultades' }, Object.entries(R.DIFICULTADES).map(([id, d]) =>
        h('button', { class: 'opcion' + (b.dificultad === id ? ' elegida' : ''), onclick: () => { b.dificultad = id; R.son.toque(); pintar(); } },
          h('div', null, d.emoji), d.nombre))));
  }

  function refrescarEscudo() {
    const b = ui.borrador;
    const viejo = document.querySelector('.escudo-bandera.grande');
    if (viejo) viejo.replaceWith(ui.escudo(infoBorrador(b), true));
  }
  function refrescarBoton() {
    const btn = document.querySelector('main .boton.grande');
    if (btn) btn.disabled = !valido(ui.borrador);
  }

  function fundar() {
    const b = ui.borrador;
    const s = R.nuevaPartida({
      dificultad: b.dificultad,
      partido: { nombre: b.nombre.trim(), sigla: b.sigla.trim(), color: R.BANDERA.principal(b.bandera), simbolo: R.BANDERA.simbolo(b.bandera), bandera: b.bandera, ideo: b.ideo / 2, estilo: b.estilo / 2 },
      lider: { nombre: b.lider.trim(), avatar: b.avatar },
    });
    ui.s = s;
    R.guardar(s);
    R.son.genial();
    ui.confeti([R.BANDERA.principal(b.bandera)].concat(b.bandera.colores, ['#f6b40e']));
    ui.vista = { tab: 'acciones' };
    ui.render();
    ui.abrirCapa(h('div', { class: 'pila centro' },
      ui.escudo(s.partido, true),
      h('h2', { style: { marginTop: '10px' } }, '¡Nace ' + s.partido.nombre + '!'),
      h('div', { class: 'mis-numeros' },
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '👁️'), h('div', { class: 'val' }, R.fmt(s.camp.conocen) + '%'), h('div', { class: 'nom' }, 'conocimiento')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🗳️'), h('div', { class: 'val' }, R.fmt(R.camp.votos(s).nac.YO, 1) + '%'), h('div', { class: 'nom' }, 'te vota')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🗓️'), h('div', { class: 'val' }, R.turno.cal(s).paso - s.mes), h('div', { class: 'nom' }, 'meses a las PASO'))),
      h('p', null, 'Arrancás de abajo. Cada mes tenés ', h('b', null, s.camp.agendaMax + ' acciones'), '. ¡A recorrer el país!'),
      h('button', { class: 'boton grande ancho', onclick: () => ui.cerrarCapa() }, '¡Vamos! 💪')));
  }
})(globalThis.R = globalThis.R || {});

// ── js/ui/noticia.js ──
// La noticia del mes: tarjeta tipo diario con 2-3 opciones que muestran a quién le pegan.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  ui.costoChips = function (costo) {
    const out = [];
    if (costo.fondos) out.push(h('span', { class: 'chip sol' }, '💰 ' + costo.fondos));
    if (costo.agenda) out.push(h('span', { class: 'chip sol' }, '⏱️ ' + costo.agenda));
    if (costo.pc) out.push(h('span', { class: 'chip sol' }, '⭐ ' + costo.pc));
    if (costo.gasto) out.push(h('span', { class: 'chip sol' }, '💸 ' + R.fmt(costo.gasto, 1) + '% presup.'));
    return out;
  };

  ui.noticia = function (s, inst, alTerminar) {
    const d = R.ev.datos(s, inst);
    if (!d) return alTerminar();
    R.son.diario();
    let listo = false;
    const elegir = (o) => {
      if (listo || o.bloqueo) return;
      listo = true;
      document.removeEventListener('keydown', teclas);
      const res = R.ev.resolver(s, inst, o.i);
      R.guardar(s);
      const efectos = R.describirAplicado(s, res.aplicado);
      if (res.bueno) R.son.bien(); else R.son.mal();
      if (!res.bueno) ui.temblor(document.querySelector('.hoja'));
      ui.abrirCapa(h('div', { class: 'resultado-grande' },
        h('div', { class: 'em' }, res.bueno ? '👍' : '😬'),
        h('div', { class: 'txt' }, res.txt || o.txt),
        efectos.length ? ui.chipsEfectos(efectos) : h('p', { class: 'suave' }, 'No cambió nada importante.'),
        h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, 'Seguir ▶')), { clase: 'diario-hoja' });
    };
    const teclas = (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= d.opciones.length) elegir(d.opciones[n - 1]);
    };
    document.addEventListener('keydown', teclas);
    ui.abrirCapa(h('article', { class: 'pila', style: { gap: '4px' } },
      h('div', { class: 'diario-cab' }, h('span', { class: 'marca' }, '📰 EL CAMINO'), h('span', { class: 'chico suave' }, R.fechaTxt(s.mes))),
      h('div', { class: 'dibujo-noticia', 'aria-hidden': 'true' }, d.dibujo),
      h('h2', { class: 'titular' }, d.titular),
      d.bajada ? h('p', { class: 'bajada' }, d.bajada) : null,
      h('div', { class: 'opciones-noticia' }, d.opciones.map((o, idx) => {
        const efectos = R.describirEfectosFase(s, o.ef);
        return h('button', { class: 'opcion-noticia', disabled: o.bloqueo ? true : null, onclick: () => elegir(o) },
          h('div', { class: 'cab' }, h('span', { class: 'txt' }, o.txt), h('span', { class: 'fila', style: { gap: '4px' } }, ui.costoChips(o.costo), h('span', { class: 'tecla solo-pc' }, String(idx + 1)))),
          efectos.length ? ui.chipsEfectos(efectos) : h('span', { class: 'chico suave' }, 'Sin efectos grandes'),
          o.azar ? ui.riesgos(s, [{ p: o.azar.p, bueno: o.azar.bueno, txt: o.azar.bueno ? 'Puede salir mejor' : 'Puede salir mal', ef: o.azar.ef }]) : null,
          o.bloqueo ? h('span', { class: 'chico', style: { color: 'var(--mal)' } }, '🚫 ' + o.bloqueo) : null);
      }))), { clase: 'diario-hoja' });
  };
})(globalThis.R = globalThis.R || {});

<script>
// ── js/ui/eleccion.js ──
// Noche de elecciones: escrutinio animado, mapa que se pinta y el Congreso que queda.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  ui.eleccion = function (s, clave, alTerminar) {
    const res = s.elecciones[clave];
    if (!res) return alTerminar();
    const lista = res.lista.slice(0, clave === 'ballotage' ? 2 : 6);
    const lentos = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const DUR = lentos ? 6500 : 300;

    // Orden en que «terminan» de contar las provincias (las chicas primero, como en la tele).
    const orden = R.PROVINCIAS.slice().sort((a, b) => a.padron - b.padron + (Math.random() - 0.5) * 3);
    const terminadas = new Set();

    const pctEl = h('span', null, '0');
    const barraEsc = h('i', { style: { width: '0%' } });
    const lineas = lista.map((x) => {
      const p = R.partidoInfo(s, x.id);
      const pista = h('i', { style: { width: '0%', background: p.color } });
      const num = h('div', { class: 'pct' }, '0,0');
      const av = x.id === 'YO' ? R.ui.avatar(s.lider.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) })
        : R.ui.avatar(R.PARTIDOS[x.id].candidato.avatar, { size: 40, fondo: ui.aclarar(p.color, 0.6) });
      const el = h('div', { class: 'linea' + (x.id === 'YO' ? ' yo' : '') }, av,
        h('div', { class: 'nombre' }, R.elec.nombre(s, x.id), h('small', null, p.simbolo + ' ' + p.sigla), h('div', { class: 'pista' }, pista)), num);
      return { x, el, pista, num };
    });
    const mapaCaja = h('div');
    const pintarMapa = () => mapaCaja.replaceChildren(R.ui.mapa({
      sinMalvinas: true,
      colorDe: (id) => (terminadas.has(id) ? R.elec.color(s, res.ganadores[id]) : '#2a3b5e'),
    }));
    pintarMapa();
    const veredicto = h('div');
    const despues = h('div', { class: 'pila' });
    const saltar = h('button', { class: 'boton mini sec', onclick: () => { t0 = -1e9; } }, '⏩ Ver resultado');
    const cont = h('div', { class: 'noche' },
      h('h2', null, '🗳️ ' + res.titulo),
      h('div', { class: 'escrutinio' }, 'Mesas escrutadas: ', pctEl, '%'),
      h('div', { class: 'barra gorda' }, barraEsc),
      h('div', { class: 'noche-cuerpo' },
        h('div', { class: 'carrera' }, lineas.map((l) => l.el)),
        h('div', { class: 'mapa-noche' }, mapaCaja)),
      h('div', { class: 'centro' }, saltar),
      veredicto, despues);
    ui.abrirCapa(cont, { oscura: true });
    R.son.tambor();

    let t0 = performance.now();
    let ultimoTic = 0;
    const max = Math.max(...lista.map((x) => x.v));
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / DUR);
      const e = 1 - Math.pow(1 - k, 2);
      pctEl.textContent = R.fmt(e * 100, 1);
      barraEsc.style.width = e * 100 + '%';
      // Al principio los números bailan (cuentan primero ciertas mesas) y se acomodan al final.
      lineas.forEach((l, i) => {
        const ruido = Math.sin(t / 380 + i * 1.7) * 3.2 * (1 - e);
        const v = Math.max(0, l.x.v + ruido) * Math.min(1, e * 1.6);
        l.num.textContent = R.fmt(v, 1);
        l.pista.style.width = (Math.max(0, v) / (max * 1.08)) * 100 + '%';
      });
      const nTerm = Math.floor(e * orden.length);
      if (nTerm > terminadas.size) {
        for (let i = terminadas.size; i < nTerm; i++) terminadas.add(orden[i].id);
        pintarMapa();
      }
      if (t - ultimoTic > 160 && k < 1) { R.son.tic(); ultimoTic = t; }
      if (k < 1) requestAnimationFrame(paso);
      else terminar();
    };
    requestAnimationFrame(paso);

    function terminar() {
      orden.forEach((p) => terminadas.add(p.id));
      pintarMapa();
      lineas.forEach((l) => { l.num.textContent = R.fmt(l.x.v, 1); l.pista.style.width = (l.x.v / (max * 1.08)) * 100 + '%'; });
      saltar.remove();
      const yo = res.lista.find((x) => x.id === 'YO');
      const puesto = res.lista.indexOf(yo) + 1;
      let txt;
      let gana = true;
      const gobernando = !!s.gob;
      if (clave === 'paso') {
        gana = res.pasa;
        txt = res.pasa ? (puesto === 1 ? '¡Ganaste las PASO! 🥇' : '¡Pasaste a las generales! Saliste ' + puesto + '.º') : 'Quedaste afuera… no llegaste al 1,5 %';
      } else if (clave === 'legislativa') {
        gana = res.ganador === 'YO';
        txt = gana ? '¡Ganaste el medio término con ' + R.fmt(yo.v, 1) + '%! 🗳️' : 'Perdiste el medio término: sacaste ' + R.fmt(yo.v, 1) + '%';
      } else if (clave === 'general') {
        if (res.ganador === 'YO') txt = gobernando ? '¡REELECTO/A EN PRIMERA VUELTA! 🏆' : '¡GANASTE EN PRIMERA VUELTA! 🏆';
        else if (res.ballotage && res.ballotage.includes('YO')) txt = '¡Vamos al ballotage contra ' + R.elec.nombre(s, res.ballotage.find((x) => x !== 'YO')) + '! ⚔️';
        else { gana = false; txt = (gobernando ? 'Perdiste la reelección. ' : 'Perdiste. ') + 'Saliste ' + puesto + '.º'; }
      } else {
        gana = res.ganador === 'YO';
        txt = gana ? (gobernando ? '¡REELECTO/A EN EL BALLOTAGE! 🏆' : '¡GANASTE EL BALLOTAGE! 🏆') : 'Perdiste el ballotage por ' + R.fmt(res.lista[0].v - res.lista[1].v, 1) + ' puntos';
      }
      veredicto.replaceChildren(h('div', { class: 'veredicto ' + (gana ? 'gana' : 'pierde') }, txt));
      if (gana) {
        R.son.aplausos();
        if ((clave === 'general' && res.ganador === 'YO') || clave === 'ballotage' || clave === 'legislativa') { ui.confeti(); R.son.genial(); }
      } else R.son.abucheo();

      const extras = [];
      if (res.perdidos > 0.3) extras.push(h('div', { class: 'tarjeta chico' }, '⚠️ Te faltaron fiscales: perdiste ' + R.fmt(res.perdidos, 1) + ' puntos en las mesas.'));
      if (res.bancas) extras.push(congresoNuevo(s, res));
      extras.push(h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, 'Seguir ▶'));
      despues.replaceChildren(...extras);
      const btn = despues.querySelector('.boton');
      if (btn) setTimeout(() => btn.focus({ preventScroll: true }), 50);
    }
  };

  function congresoNuevo(s, res) {
    const dip = R.composicion(s, 'diputados');
    const sen = R.composicion(s, 'senado');
    const misDip = res.bancas.dip.YO || 0;
    const misSen = res.bancas.sen.YO || 0;
    const camara = (nombre, comp, mias, total) => h('div', { class: 'tarjeta pila', style: { gap: '4px', padding: '10px' } },

      h('div', { class: 'fila entre' }, h('div', { class: 'titulo-seccion' }, '👥 La gente'), h('span', { class: 'chico suave' }, h('span', { class: 'critico-mini' }, '🛒'), ' lo que más lo enoja')),
      h('div', { class: 'gente' }, R.GRUPOS.map((g) => {
        const st = G.grupos[g.id];

  // Lo que más lo enoja (si de verdad lo enoja). «Tus ideas» no cuenta: es fijo, no es algo que pase.

    const { partes } = R.gob.objetivoGrupo(s, id);
    const peor = partes.filter((p) => p.k !== 'ideas').sort((a, b) => a.v - b.v)[0];
    return peor && peor.v <= -4 ? peor : null;
  }
  const humorTxt = (v) => (v >= 70 ? 'Contento' : v >= 56 ? 'Conforme' : v >= 42 ? 'Ni fu ni fa' : v >= 28 ? 'Enojado' : 'Furioso');

  // El dato concreto detrás de cada motivo («34 % al año», «8 de cada 100 sin trabajo»…).
  function datoRazon(s, id, k) {
    const e = s.eco;
    const q = e.calidad;
    const m = e.niveles;
    const nivel = (a) => R.eco.nivelTxt(m[a]);
    const calidad = (x) => 'calidad ' + Math.round(x) + '/100';
    const real = (a) => {
      const d = (m[a] * R.eco.torta(s) - 1) * 100;
      return Math.abs(d) < 0.5 ? 'igual que al asumir' : R.fmt(Math.abs(d), 0) + '% ' + (d > 0 ? 'más' : 'menos') + ' que al asumir';
    };
    switch (k) {
      case 'inflacion': return R.fmt(e.inflAnual) + '% al año';
      case 'empleo': return R.fmt(e.desempleo, 1) + '% sin trabajo';
      case 'salario': { const d = e.salarioReal - 100; return Math.abs(d) < 0.5 ? 'rinde igual que al asumir' : 'rinde ' + R.fmt(Math.abs(d), 0) + '% ' + (d > 0 ? 'más' : 'menos') + ' que al asumir'; }
      case 'obras': return nivel('obras');
      case 'retenciones': return R.eco.RETENCIONES[e.retenciones].nombre;
      case 'cepo': return e.cepo ? 'hay cepo al dólar' : 'sin cepo';
      case 'crecimiento': return (e.crec >= 0 ? 'crece ' : 'cae ') + R.fmt(Math.abs(e.crec), 1) + '% por año';
      case 'rutas': return calidad(q.infra);
      case 'impuestos': return 'impuestos ' + R.eco.IMPUESTOS[e.impuestos].nombre.toLowerCase();
      case 'riesgo': return 'riesgo país ' + R.fmt(e.riesgo);
      case 'seguridad': return calidad(q.seguridad);
      case 'educacion': return calidad(q.educacion);
      case 'salud': return calidad(q.salud);
      case 'social': return id === 'humildes' ? 'plata real: ' + real('social') : nivel('social');
      case 'subsidios': return nivel('subsidios');
      case 'jubilaciones': return 'plata real: ' + real('jubilaciones');
      case 'pobreza': return R.fmt(e.pobreza) + '% de pobres';
      case 'ideas': { const d = Math.abs(R.GRUPO[id].ideo - s.partido.ideo); return d < 0.3 ? 'piensa parecido a vos' : d < 0.7 ? 'piensa algo distinto a vos' : 'piensa muy distinto a vos'; }
      case 'leyes': return 'por leyes que pasaste';
      case 'vara': return 'lo bueno ya es lo normal: pide más';
      default: return '';
    }
  }

  // Ficha de un grupo: cómo está, a dónde va, lo que más lo enoja y, motivo por motivo, cuánto le suma o le resta
  // (barra que sale del centro: a la izquierda en rojo le resta, a la derecha en verde le suma), con el dato real.
  function verGrupo(s, id) {
    const g = R.GRUPO[id];
    const st = s.gob.grupos[id];
    const { obj, partes } = R.gob.objetivoGrupo(s, id);
    const ESCALA = 16; // puntos de humor que llenan media barra (raíz: las chicas también se ven)
    const ideas = partes.find((p) => p.k === 'ideas');
    const resta = partes.filter((p) => p.v <= -1).sort((a, b) => a.v - b.v);
    const suma = partes.filter((p) => p.v >= 1).sort((a, b) => b.v - a.v);
    const igual = partes.filter((p) => Math.abs(p.v) < 1 && p.k !== 'ideas');
    const fila = (p) => {
      const r = RAZON(p.k);
      const ancho = Math.min(50, Math.sqrt(Math.abs(p.v) / ESCALA) * 50);
      return h('div', { class: 'motivo' },
        h('span', { class: 'em' }, r[0]),
        h('span', { class: 'txt' }, h('b', null, r[1], p.k === 'ideas' ? h('span', { class: 'fijo' }, 'pesa ' + Math.round(R.gob.pesoIdeas(s) * 100) + '%') : null), h('small', null, datoRazon(s, id, p.k))),
        h('span', { class: 'balanza-motivo', title: (p.v > 0 ? 'Le suma ' : 'Le resta ') + Math.round(Math.abs(p.v)) },
          h('i', { class: p.v > 0 ? 'suma' : 'resta', style: p.v > 0 ? { left: '50%', width: ancho + '%' } : { right: '50%', width: ancho + '%' } })));
    };
    const va = obj - st.humor;
    const peores = resta.filter((p) => p.v <= -3 && p.k !== 'ideas').slice(0, 2);
    const porIdeas = !peores.length && ideas && ideas.v <= -3;
    ui.abrirCapa(h('div', { class: 'pila' },
      h('div', { class: 'fila', style: { alignItems: 'center' } }, R.ui.avatar(g.avatar, { size: 76, humor: R.humorAvatar(st.humor), fondo: colorHumor(st.humor) }),
        h('div', { style: { minWidth: 0, flex: 1 } }, h('h2', { style: { margin: 0 } }, g.personaje), h('div', { class: 'chico suave' }, g.emoji + ' ' + g.oficio + ' · ' + g.nombre),
          h('div', { class: 'humor-medidor' },
            h('span', { class: 'barra' }, h('i', { style: { width: st.humor + '%', background: colorHumorFuerte(st.humor) } }), h('b', { class: 'marca-va', style: { left: R.clamp(obj, 0, 100) + '%' }, title: 'Hacia dónde va' })),
            h('span', { class: 'chico', style: { fontWeight: 900 } }, R.cara(st.humor) + ' ' + humorTxt(st.humor))),
          h('div', { class: 'chico', style: { fontWeight: 800, color: va > 2 ? 'var(--bien)' : va < -2 ? 'var(--mal)' : 'var(--tinta-suave)' } },
            va > 2 ? '📈 Va a mejorar' : va < -2 ? '📉 Va a empeorar' : '➡️ Se mantiene'))),
      R.protestas ? h('div', { class: 'fila envolver', style: { gap: '6px' } },
        h('span', { class: 'chip' }, '💪 Poder ' + Math.round(R.protestas.poder(s)[id]) + '%'),
        (st.bronca || 0) >= 1 ? h('span', { class: 'chip ' + (st.bronca >= 6 ? 'mal' : 'sol') }, '😡 Bronca ' + Math.min(100, Math.round((st.bronca / R.protestas.LIMITE) * 100)) + '%') : null) : null,
      peores.length ? h('div', { class: 'critico-caja' }, h('b', null, '😠 Lo que más lo enoja'),
        h('div', null, peores.map((p) => h('span', { class: 'chip mal' }, RAZON(p.k)[0] + ' ' + RAZON(p.k)[1] + ': ' + datoRazon(s, id, p.k)))))
        : porIdeas ? h('div', { class: 'critico-caja' }, h('b', null, '💭 Lo que más le resta: no le gustan tus ideas'), h('span', { class: 'chico' }, 'Con el tiempo pesa menos y mira más los resultados.'))
          : h('div', { class: 'critico-caja bien' }, h('b', null, '🙂 No tiene quejas grandes')),
      resta.length ? h('div', { class: 'etiqueta' }, '😠 Le resta') : null,
      resta.length ? h('div', { class: 'motivos' }, resta.map(fila)) : null,
      suma.length ? h('div', { class: 'etiqueta' }, '🙂 Le suma') : null,
      suma.length ? h('div', { class: 'motivos' }, suma.map(fila)) : null,
      igual.length ? h('p', { class: 'chico suave' }, '😐 Por ahora no le pesan: ' + igual.map((p) => RAZON(p.k).join(' ')).join(' · ')) : null,
      h('p', { class: 'chico suave' }, '🗳️ Pesa ' + g.peso + ' de cada 100 votos.')), { cerrable: true });
  }



  // ── El país en 6 tarjetas tangibles ──
  ui.indicadores = function (s) {
    const e = s.eco;
    const hist = s.gob.historia;
    const ant = hist.length >= 2 ? hist[hist.length - 2] : null;
    const dif = (k) => (ant ? e[k] - ant[k] : 0);
    const pobres = Math.round(e.pobreza / 10);
    return [
      { id: 'inflacion', emoji: '🛒', nombre: 'Changuito', valor: '$ ' + R.fmt(e.changuito), sub: '+' + R.fmt(e.inflMes, 1) + '% este mes · ' + R.fmt(e.inflAnual) + '% al año', d: e.inflMes - (ant ? (s.gob.historia[hist.length - 2].inflMes) : e.inflMes), malo: true, umbral: 0.05 },
      { id: 'crecimiento', emoji: e.crec >= 0 ? '📈' : '📉', nombre: 'Economía', valor: (e.crec >= 0 ? 'Crece ' : 'Cae ') + R.fmt(Math.abs(e.crec), 1) + '%', sub: 'PBI US$ ' + R.fmt(R.eco.pbiUSD(s), 0) + ' mil M', d: dif('crec'), umbral: 0.1 },
      { id: 'desempleo', emoji: '🚪', nombre: 'Trabajo', valor: Math.round(e.desempleo) + ' de cada 100', sub: 'no consiguen trabajo', d: dif('desempleo'), malo: true, umbral: 0.1 },
      { id: 'pobreza', emoji: '🏚️', nombre: 'Pobreza', valor: pobres + ' de cada 10', sub: 'son pobres (' + R.fmt(e.pobreza) + '%)', d: dif('pobreza'), malo: true, umbral: 0.2,
        extra: h('div', { class: 'munecos', 'aria-hidden': 'true' }, Array.from({ length: 10 }, (_, i) => h('span', { class: i < pobres ? 'pobre' : '' }, '🧍'))) },
      { id: 'dolar', emoji: '💵', nombre: 'Dólar', valor: '$ ' + R.fmt(e.dolar), sub: e.cepo ? '🔒 Blue: $ ' + R.fmt(e.dolar * (1 + e.brecha / 100)) : 'libre', d: ant ? ((e.dolar / ant.dolar - 1) * 100) - e.inflMes : 0, malo: true, umbral: 1 },
      { id: 'reservas', emoji: '🏦', nombre: 'Reservas', valor: 'US$ ' + R.fmt(Math.max(0, e.reservas), 0) + ' mil M', sub: e.reservas < 10 ? '⚠️ ¡casi vacías!' : 'en el Banco Central', d: dif('reservas'), umbral: 0.3,
        extra: h('div', { class: 'barra', style: { height: '8px' } }, h('i', { style: { width: R.clamp(e.reservas / 60 * 100, 0, 100) + '%', background: e.reservas < 10 ? 'var(--mal)' : 'var(--bien)' } })) },
    ];
  };

  function tarjetaPais(s) {
    const e = s.eco;
    return h('section', { class: 'tarjeta pila' },
      h('div', { class: 'titulo-seccion' }, '🇦🇷 El país'),
      h('div', { class: 'pais' }, ui.indicadores(s).map((x) => {

          h('div', { class: 'fila entre' }, h('span', { class: 'em' }, x.emoji), mejora ? h('span', { class: 'chip bien' }, '▲ mejora') : empeora ? h('span', { class: 'chip mal' }, '▼ empeora') : null),
          h('div', { class: 'nom' }, x.nombre),
          h('div', { class: 'val' }, x.valor),

      })),
      h('div', { class: 'fila envolver chico', style: { gap: '6px' } },
        h('button', { class: 'chip toque', onclick: () => ui.porQue(s, 'deuda') }, '💳 Deuda ' + R.fmt(e.deuda) + '% del PBI', tendencia(s, 'deuda', true, 0.05)),
        h('button', { class: 'chip toque', onclick: () => ui.porQue(s, 'riesgo') }, '📊 Riesgo país ' + R.fmt(e.riesgo), tendencia(s, 'riesgo', true, 3)),
        h('button', { class: 'chip toque ' + (R.eco.resultado(s) >= 0 ? 'bien' : 'mal'), onclick: () => ui.porQue(s, 'deuda') }, '⚖️ ' + (R.eco.resultado(s) >= 0 ? 'Superávit ' : 'Déficit ') + R.fmt(Math.abs(R.eco.resultado(s)), 1) + '%', tendencia(s, 'resultado', false, 0.03))));
  }

  // Flechita: si subió o bajó contra el mes pasado (verde si es bueno, rojo si es malo).
  function tendencia(s, k, subirEsMalo, umbral) {
    const hist = s.gob.historia;
    if (hist.length < 2) return null;
    const ant = hist[hist.length - 2][k];
    const hoy = k === 'resultado' ? R.eco.resultado(s) : s.eco[k];
    if (ant === undefined || ant === null) return null;
    const d = hoy - ant;
    if (Math.abs(d) < umbral) return null;
    const bueno = subirEsMalo ? d < 0 : d > 0;
    return h('b', { class: 'flechita', style: { color: bueno ? 'var(--bien)' : 'var(--mal)' }, title: d > 0 ? 'Subió' : 'Bajó' }, d > 0 ? ' ▲' : ' ▼');
  }

  // «¿Por qué?»: las causas de cada indicador, con barras.
  ui.porQue = function (s, id) {
    const e = s.eco;
    const C = e.causas || {};
    const bloques = {
      inflacion: { t: '🛒 ¿Por qué suben los precios?', lista: C.inflacion, dic: R.CAUSAS.inflacion, malo: true, nota: 'Lo que más baja la inflación: no tener déficit, no emitir y tener reservas.' },
      crecimiento: { t: '📈 ¿Por qué crece (o no) la economía?', lista: C.crecimiento, dic: R.CAUSAS.crecimiento, nota: 'El país produce US$ ' + R.fmt(R.eco.pbiUSD(s), 0) + ' mil M por año: US$ ' + R.fmt(R.eco.pbiPorHabitante(s), 0) + ' por persona. Obra pública, impuestos bajos, confianza y exportaciones lo empujan.' },
      desempleo: { t: '🚪 ¿Por qué hay (o no) trabajo?', lista: C.crecimiento, dic: R.CAUSAS.crecimiento, nota: 'El empleo sigue a la economía: si crece, se contrata gente.' },
      pobreza: { t: '🏚️ ¿Por qué hay pobreza?', lista: C.pobreza, dic: R.CAUSAS.pobreza, malo: true, nota: 'Trabajo, sueldos que le ganen a los precios y ayuda social la bajan.' },
      reservas: { t: '🏦 ¿Por qué entran o salen dólares?', lista: C.reservas, dic: R.CAUSAS.reservas, nota: 'Exportar más (retenciones bajas, campo contento) y no tener fuga.' },
      riesgo: { t: '📊 ¿Por qué el riesgo país está así?', lista: C.riesgo, dic: R.CAUSAS.riesgo, malo: true,
        nota: 'Pagás ' + R.fmt(R.eco.tasaPagada(e), 1) + '% de interés por año (con este riesgo, la deuda nueva sale ' + R.fmt(R.eco.tasa(e), 1) + '%): ' + R.fmt(R.eco.intereses(e), 1) + '% del PBI se va en intereses. Si bajara 200 puntos, ahorrarías ' + R.fmt(e.deuda * 0.002, 1) + '% del PBI por año.' },
      deuda: { t: '💳 ¿Por qué sube o baja la deuda?', lista: C.deuda, dic: R.CAUSAS.deuda, malo: true,
        nota: 'Debés US$ ' + R.fmt(R.eco.deudaUSD(s), 0) + ' mil M (' + R.fmt(e.deuda) + '% del PBI). Con superávit se paga sola, y si la economía crece pesa menos aunque no pagues nada.' },
      dolar: { t: '💵 ¿Por qué se mueve el dólar?', lista: [{ k: 'inercia', v: e.inflMes }, { k: 'dolar', v: (C.inflacion || []).find((x) => x.k === 'dolar')?.v || 0 }], dic: { inercia: ['🛒', 'Acompaña a la inflación'], dolar: ['🏦', 'Faltan reservas o hay desconfianza'] }, malo: true, nota: e.cepo ? 'Con cepo aparece el dólar blue: la brecha crece si hay inflación y faltan reservas.' : 'Sin cepo, si falta confianza la gente compra dólares y se van las reservas.' },
    };
    const b = bloques[id];
    if (!b) return;
    const lista = (b.lista || []).filter((x) => Math.abs(x.v) >= 0.02).sort((a, c) => Math.abs(c.v) - Math.abs(a.v));
    const max = Math.max(0.1, ...lista.map((x) => Math.abs(x.v)));
    ui.abrirCapa(h('div', { class: 'pila' },
      h('h2', null, b.t),
      lista.length ? h('div', { class: 'razones' }, lista.map((x) => {
        const [em, txt] = b.dic[x.k] || ['•', x.k];
        const bueno = b.malo ? x.v < 0 : x.v > 0;
        return h('div', { class: 'razon' }, h('span', { class: 'em' }, em), h('span', null, txt),
          h('span', { class: 'barrita' }, h('i', { style: { width: (Math.abs(x.v) / max) * 100 + '%', background: bueno ? 'var(--bien)' : 'var(--mal)' } })),
          h('span', { style: { fontWeight: 900, color: bueno ? 'var(--bien)' : 'var(--mal)' } }, x.v > 0 ? '▲' : '▼'));
      })) : h('p', { class: 'suave' }, 'Pasá un mes para ver las causas.'),
      h('p', { class: 'chico tarjeta plana suave' }, '💡 ' + b.nota),
      h('div', { class: 'etiqueta' }, 'Últimos meses'),
      ui.sparkline(s.gob.historia.map((x) => ({ inflacion: x.inflMes, crecimiento: x.crec, desempleo: x.desempleo, pobreza: x.pobreza, reservas: x.reservas, dolar: x.dolar, riesgo: x.riesgo, deuda: x.deuda }[id])), { color: 'var(--tinta)', alto: 60 })), { cerrable: true });
  };

  // ── Acciones de gobierno (⭐) ──
  function tarjetaAcciones(s) {
    return h('section', { class: 'pila' },
      h('div', { class: 'fila entre' }, h('div', { class: 'titulo-seccion' }, '⭐ Acciones de gobierno'), h('span', { class: 'chip sol' }, '⭐ ' + s.gob.pc + ' disponibles')),
      h('div', { class: 'acciones' }, R.gob.ACCIONES.map((a) => {

  function hacerAccion(s, id) {

  // Aviso de resultado con efectos y cambio de aprobación.
  ui.mostrarResultado = function (s, res) {

  // Mini gráfico de línea.
  ui.sparkline = function (vals, opts) {
    opts = opts || {};
    const S = R.svg;
    vals = vals.filter((v) => typeof v === 'number' && isFinite(v));
    if (vals.length < 2) return h('p', { class: 'chico suave' }, 'Todavía no hay historia.');
    const W = 300;
    const H = opts.alto || 60;
    const min = opts.min ?? Math.min(0, ...vals);
    const max = opts.max ?? Math.max(...vals) * 1.1 + 0.01;
    const x = (i) => 8 + (i * (W - 16)) / (vals.length - 1);
    const y = (v) => H - 6 - ((v - min) / (max - min || 1)) * (H - 14);
    const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const ult = vals[vals.length - 1];
    return S('svg', { viewBox: '0 0 ' + W + ' ' + H, style: 'width:100%;height:auto;display:block', role: 'img', 'aria-label': 'Evolución' },
      opts.max === 100 ? S('line', { x1: 8, x2: W - 8, y1: y(50), y2: y(50), stroke: '#c9d6e6', 'stroke-dasharray': '4 4' }) : null,
      S('path', { d: d + ' L' + x(vals.length - 1) + ' ' + (H - 6) + ' L' + x(0) + ' ' + (H - 6) + ' Z', fill: 'rgba(108,180,234,0.18)' }),
      S('path', { d, fill: 'none', stroke: opts.color || 'var(--tinta)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
      S('circle', { cx: x(vals.length - 1), cy: y(ult), r: 4.5, fill: opts.color || 'var(--tinta)', stroke: '#13284a', 'stroke-width': 2 }));
  };

    const flecha = p - antes > 0.01 ? ' ▲' : p - antes < -0.01 ? ' ▼' : '';

    return h('span', { class: 'chip ' + clase }, P.emoji + (conNombre ? ' ' + P.nombre : '') + ' ' + (Math.abs(p - 1) < 0.02 ? 'normal' : pct(p - 1)) + flecha);
  }
  ui.chipPrecio = chipPrecio;

  function chipEnergia(s) {
    const en = R.prod.energia(s);
    if (en.saldo < -0.15) return h('span', { class: 'chip mal' }, '⚡ Falta energía');
    if (en.saldo > 0.15) return h('span', { class: 'chip bien' }, '⚡ Sobra energía');
    return h('span', { class: 'chip' }, '⚡ Energía justa');
  }

  // ── Tarjeta de la pestaña Economía ──
  ui.tarjetaProduccion = function (s) {
    R.prod.asegurar(s);
    const P = s.prod;
    const C = s.mundo && s.mundo.ciclos;
    return h('section', { class: 'tarjeta pila' },
      h('div', { class: 'fila entre' }, h('div', { class: 'titulo-seccion' }, '🏭 Producción'), chipEnergia(s)),
      h('div', { class: 'sectores' }, R.SECTORES.map((x) => {
        const st = P.sec[x.id];
        const obra = P.obras.find((o) => o.id === x.id);
        const a = R.prod.atractivo(s, x.id);
        return h('button', { class: 'sector-carta toque', onclick: () => verSector(s, x.id) },
          h('div', { class: 'fila', style: { gap: '6px' } }, h('span', { class: 'em' }, x.emoji), h('b', { class: 'nom' }, x.nombre)),
          h('div', { class: 'fila', style: { gap: '6px' } },
            h('span', { class: 'barra', style: { height: '8px', flex: 1 } }, h('i', { style: { width: (st.nivel / R.NIVEL_MAX_SECTOR) * 100 + '%', background: 'var(--celeste-fuerte, #3d8fd6)' } })),
            h('span', { class: 'nivel numero' }, st.nivel)),
          h('div', { class: 'fila envolver', style: { gap: '4px' } },
            chipPrecio(s, x.producto),
            obra ? h('span', { class: 'chip sol' }, '🔨 ' + obra.meses + ' m') : h('span', { class: 'chip ' + (a.chance >= 0.05 ? 'bien' : a.chance < 0.02 ? 'mal' : ''), title: 'Chance de inversión privada por mes' }, '🏦 ' + Math.round(a.chance * 100) + '%/mes')));
      })),
      h('div', { class: 'fila envolver', style: { gap: '6px' } },
        h('button', { class: 'chip toque ' + (P.obras.length >= R.prod.cuadrillas(s) ? 'sol' : ''), onclick: () => verCuadrillas(s) }, '🏗️ Cuadrillas ' + P.obras.length + '/' + R.prod.cuadrillas(s) + ' ›'),
        s.mundo ? h('button', { class: 'chip toque', onclick: () => verPrecios(s) }, '🌍 Precios del mundo ›') : null),
      C && C.proximo ? bannerProximo(s) : null);
  };

  function bannerProximo(s) {
    const C = s.mundo.ciclos;
    const X = R.prod.CICLO[C.proximo.id];
    return h('button', { class: 'banner-aviso ' + (X.bueno ? 'bueno' : 'malo'), onclick: () => verPrecios(s) },
      h('span', { class: 'em' }, '📡'), h('span', null, h('b', null, 'Se viene: ' + X.emoji + ' ' + X.nombre), h('small', null, C.proximo.en <= 1 ? 'el mes que viene' : 'en ' + C.proximo.en + ' meses')),
      C.proximo.prep ? h('span', { class: 'chip bien' }, '✅ Preparado') : null);
  }
  // Para Inicio: solo si se viene algo.
  ui.bannerMundo = (s) => (s.mundo && s.mundo.ciclos && s.mundo.ciclos.proximo ? bannerProximo(s) : null);

  // ── Hoja de un sector ──
  function verSector(s, id) {
    R.son.toque();
    const x = R.SECTOR[id];
    const P = s.prod;
    const st = P.sec[id];
    const a = R.prod.atractivo(s, id);
    const b = R.prod.bloqueoConstruir(s, id);
    const obras = P.obras.filter((o) => o.id === id);
    const razones = a.partes.filter((p) => Math.abs(p.v) >= 0.05).sort((p, q) => Math.abs(q.v) - Math.abs(p.v)).slice(0, 4);
    const en = id === 'energia' || id === 'industria' ? R.prod.energia(s) : null;
    const meta = R.metas && R.metas.deSector(s, id);
    const camino = meta ? R.metas.camino(s, meta) : null;
    const suma = [h('span', { class: 'chip bien' }, '📈 PBI +' + R.fmt(R.prod.pbiNivel(s, id), 1) + '%'), h('span', { class: 'chip bien' }, '🚪 Desempleo ▼')];
    if (id !== 'energia') suma.push(h('span', { class: 'chip bien' }, '🚢 Exportaciones ▲'));
    else suma.push(h('span', { class: 'chip bien' }, '⚡ Energía ▲'));
    suma.push(h('span', { class: 'chip bien' }, R.GRUPO[x.grupo].emoji + ' ▲'));
    ui.abrirCapa(h('div', { class: 'pila' },
      h('div', { class: 'fila', style: { paddingRight: '44px' } }, h('span', { style: { fontSize: '44px', lineHeight: 1 } }, x.emoji),
        h('div', { style: { flex: 1, minWidth: 0 } }, h('h2', { style: { margin: 0 } }, x.nombre), h('div', { class: 'chico suave' }, x.obra))),
      h('div', { class: 'fila', style: { gap: '8px' } },
        h('span', { class: 'barra', style: { flex: 1 } }, h('i', { style: { width: (st.nivel / R.NIVEL_MAX_SECTOR) * 100 + '%', background: 'var(--celeste-fuerte, #3d8fd6)' } })),
        h('b', { class: 'numero' }, 'Nivel ' + st.nivel + ' de ' + R.NIVEL_MAX_SECTOR)),
      camino ? h('div', { class: 'meta-sector' }, h('span', null, '🎯'), h('span', null, h('b', null, R.META[meta.id].nombre),
        h('small', null, camino.faltan ? 'Faltan ' + camino.faltan + (camino.faltan === 1 ? ' nivel' : ' niveles') + ' · ⏳ ~' + camino.meses + ' meses con ' + camino.cuadrillas + ' cuadrillas' : '¡Ya casi! Las obras en marcha alcanzan'))) : null,
      h('div', { class: 'etiqueta' }, 'Cada nivel suma'),
      h('div', { class: 'fila envolver', style: { gap: '4px' } }, suma),
      h('div', { class: 'fila envolver', style: { gap: '6px' } }, h('span', { class: 'chico' }, '🌍 Precio en el mundo:'), chipPrecio(s, x.producto, true)),
      en ? h('div', { class: 'chico' }, '⚡ Producís ' + R.fmt(en.oferta, 1) + ' · el país usa ' + R.fmt(en.demanda, 1) + ' → ',
        h('b', { style: { color: en.saldo < 0 ? 'var(--mal)' : 'var(--bien)' } }, en.saldo < 0 ? 'se compra afuera (🏦 ▼)' : 'sobra y se exporta')) : null,
      h('div', { class: 'etiqueta' }, '🏦 Inversión privada: ' + Math.round(a.chance * 100) + '% por mes'),
      razones.length ? h('div', { class: 'fila envolver', style: { gap: '4px' } }, razones.map((p) => {
        const r = R.CAUSAS_INVERSION[p.k] || ['•', p.k];
        return h('span', { class: 'chip ' + (p.v > 0 ? 'bien' : 'mal') }, r[0] + ' ' + r[1] + (p.v > 0 ? ' ▲' : ' ▼'));
      })) : null,
      a.cierre ? h('div', { class: 'chico', style: { color: 'var(--mal)', fontWeight: 800 } }, '🏚️ Con este clima pueden cerrar empresas (' + Math.round(a.cierre * 100) + '% por mes)') : null,
      obras.length ? h('div', { class: 'pila', style: { gap: '4px' } }, obras.map((o) => h('div', { class: 'fila', style: { gap: '8px' } }, h('span', null, '🔨'),
        h('span', { class: 'barra', style: { flex: 1, height: '10px' } }, h('i', { style: { width: ((o.total - o.meses) / o.total) * 100 + '%', background: 'var(--sol)' } })),
        h('b', { class: 'chico' }, 'faltan ' + o.meses + ' m')))) : null,
      h('button', { class: 'boton ancho', disabled: b ? true : null, onclick: () => {
        const r = R.prod.construir(s, id);
        if (r.error) { R.son.mal(); ui.aviso('🚫 ' + r.error, { tipo: 'mal' }); return; }
        R.guardar(s);
        R.son.bien();
        ui.cerrarCapa();
        ui.aviso(r.txt, { tipo: 'bien' });
        ui.refrescar();
      } }, '🔨 Construir ⭐' + R.prod.COSTO_PC),
      h('div', { class: 'fila envolver', style: { gap: '4px', justifyContent: 'center' } },
        h('span', { class: 'chip mal' }, '💸 ' + R.fmt(R.prod.gastoObra(s, id), 1) + '%/mes del presupuesto'), h('span', { class: 'chip' }, '⏳ ' + R.prod.mesesObra(s, id) + ' meses')),
      b ? h('div', { class: 'chico centro', style: { color: 'var(--mal)', fontWeight: 800 } }, '🚫 ' + b) : null,
      b === 'No hay cuadrillas libres' ? h('button', { class: 'boton sec ancho', onclick: () => verCuadrillas(s, () => verSector(s, id)) }, '🏗️ Conseguir más cuadrillas') : null), { cerrable: true });
  }
  ui.verSector = verSector;

  // ── 🏗️ Cuadrillas: dónde poner plata para construir más a la vez ──
  function verCuadrillas(s, volver) {
    R.son.toque();
    const P = s.prod;
    const e = s.eco;
    const total = R.prod.cuadrillas(s);
    const prox = R.prod.proximaPorRutas(s);
    const infra = e.calidad.infra;
    const bC = R.prod.bloqueoContratar(s);
    const contratadas = R.prod.cuadrillasContratadas(s);
    const reabrir = () => verCuadrillas(s, volver);
    // Subir la obra pública desde acá (lo mismo que el «+» del presupuesto).
    const subirObras = () => {
      const nuevo = R.round(R.clamp(e.niveles.obras + 0.1, R.eco.NIVEL_MIN, R.eco.NIVEL_MAX), 2);
      if (nuevo === e.niveles.obras) return;
      const antes = R.eco.resultado(s);
      e.niveles.obras = nuevo;
      R.son.toque();
      R.guardar(s);
      reabrir();
      ui.aviso('🏗️ Obra pública: más plata', { tipo: 'bien', dur: 2200, extra: h('div', { class: 'chico', style: { fontWeight: 900 } }, '⚖️ Resultado ' + R.fmt(antes, 2) + '% → ', h('span', { style: { color: 'var(--mal)' } }, R.fmt(R.eco.resultado(s), 2) + '%')) });
      ui.refrescar();
    };
    const marcas = R.prod.UMBRALES_RUTAS.map((u) => h('b', { class: 'marca-umbral' + (infra >= u ? ' ok' : ''), style: { left: u + '%' } }, '👷'));
    ui.abrirCapa(h('div', { class: 'pila' },
      h('h2', null, '🏗️ Cuadrillas de obra'),
      h('div', { class: 'cuadrillas-fila' }, Array.from({ length: Math.max(total, 1) }, (_, i) => {
        const o = P.obras[i];
        return h('div', { class: 'cuadrilla' + (o ? ' ocupada' : '') }, h('span', { class: 'em' }, o ? R.SECTOR[o.id].emoji : '👷'), h('small', null, o ? o.meses + ' m' : 'libre'));
      })),
      h('div', { class: 'chico suave' }, 'Cada cuadrilla hace una obra a la vez. Tenés ' + total + ': 1 fija + ' + R.prod.cuadrillasRutas(s) + ' por las rutas + ' + contratadas + ' contratadas.'),
      // 1) Rutas
      h('div', { class: 'tarjeta plana pila', style: { gap: '6px' } },
        h('b', null, '🛣️ Rutas: ' + Math.round(infra) + '/100 · 👷 a 40, 55 y 70'),
        h('div', { class: 'barra rutas' }, h('i', { style: { width: infra + '%', background: 'var(--celeste-fuerte, #3d8fd6)' } }), h('b', { class: 'marca-va', style: { left: R.clamp(prox ? prox.obj : infra, 0, 100) + '%' }, title: 'Hacia dónde van' }), marcas),
        prox ? h('div', { class: 'chico', style: { fontWeight: 800 } }, 'Próxima cuadrilla con rutas ' + prox.umbral + ' (faltan ' + Math.ceil(prox.falta) + ') → ',
          prox.meses ? h('span', { style: { color: 'var(--bien)' } }, '⏳ ~' + prox.meses + ' meses') : h('span', { style: { color: 'var(--mal)' } }, 'con esta plata no llega')) : h('div', { class: 'chico', style: { fontWeight: 800, color: 'var(--bien)' } }, '✅ Ya tenés todas las cuadrillas de las rutas'),
        h('div', { class: 'chico suave' }, 'Las rutas mejoran con 🏗️ Obra pública: ' + R.eco.nivelTxt(e.niveles.obras).toLowerCase() + '.'),
        h('button', { class: 'boton sec ancho', disabled: e.niveles.obras >= R.eco.NIVEL_MAX ? true : null, onclick: subirObras }, '🏗️ +10 % obra pública'),
        h('div', { class: 'fila envolver', style: { gap: '4px', justifyContent: 'center' } }, h('span', { class: 'chip mal' }, '💸 ' + R.fmt(R.AREA.obras.base * 0.1, 2) + '% PBI/año'), h('span', { class: 'chip bien' }, '📈 ▲▲'), h('span', { class: 'chip bien' }, '👷 ▲▲'))),
      // 2) Contratar
      h('div', { class: 'tarjeta plana pila', style: { gap: '6px' } },
        h('b', null, '👷 Contratar una cuadrilla (' + contratadas + ' de ' + R.prod.CUADRILLA.max + ')'),
        h('div', { class: 'fila envolver', style: { gap: '4px' } }, h('span', { class: 'chip sol' }, '⭐ ' + R.prod.CUADRILLA.pc + ' una vez'), h('span', { class: 'chip mal' }, '💸 ' + R.fmt(R.prod.CUADRILLA.gastoMes, 1) + '%/mes siempre'), h('span', { class: 'chip bien' }, '👷 ▲')),
        h('button', { class: 'boton ancho', disabled: bC ? true : null, onclick: () => {
          const r = R.prod.contratarCuadrilla(s);
          if (r.error) { R.son.mal(); ui.aviso('🚫 ' + r.error, { tipo: 'mal' }); return; }
          R.guardar(s);
          R.son.bien();
          reabrir();
          ui.aviso(r.txt, { tipo: 'bien', efectos: R.describirAplicado(s, r.aplicado) });
          ui.refrescar();
        } }, '👷 Contratar · ⭐' + R.prod.CUADRILLA.pc),
        bC ? h('div', { class: 'chico centro', style: { color: 'var(--mal)', fontWeight: 800 } }, '🚫 ' + bC) : null,
        contratadas ? h('button', { class: 'boton mini sec', onclick: () => {
          const r = R.prod.despedirCuadrilla(s);
          if (r.error) return;
          R.guardar(s);
          reabrir();
          ui.aviso(r.txt, { tipo: 'mal', efectos: R.describirAplicado(s, r.aplicado) });
          ui.refrescar();
        } }, 'Despedir una (ahorrás plata)') : null),
      volver ? h('button', { class: 'boton sec ancho', onclick: volver }, '◀ Volver') : null), { cerrable: true });
  }
  ui.verCuadrillas = verCuadrillas;

  // ── Precios del mundo y lo que pasa (y lo que se viene) ──
  function verPrecios(s) {
    R.son.toque();
    const C = s.mundo.ciclos;
    ui.abrirCapa(h('div', { class: 'pila' },
      h('h2', null, '🌍 Precios del mundo'),
      h('div', { class: 'pila', style: { gap: '6px' } }, Object.keys(R.PRODUCTOS).map((k) => {
        const p = R.prod.precio(s, k);
        const ancho = Math.min(50, Math.abs(p - 1) * 100);
        return h('div', { class: 'precio-fila' }, h('span', { class: 'em' }, R.PRODUCTOS[k].emoji), h('b', null, R.PRODUCTOS[k].nombre),
          h('span', { class: 'balanza-motivo' }, h('i', { class: p >= 1 ? 'suma' : 'resta', style: p >= 1 ? { left: '50%', width: ancho + '%' } : { right: '50%', width: ancho + '%' } })),
          h('span', { class: 'chico numero', style: { fontWeight: 900, color: p >= 1.02 ? 'var(--bien)' : p <= 0.98 ? 'var(--mal)' : 'inherit' } }, Math.abs(p - 1) < 0.02 ? '=' : pct(p - 1)));
      })),
      C.activos.length ? h('div', { class: 'etiqueta' }, 'Pasando ahora') : null,
      C.activos.length ? h('div', { class: 'fila envolver', style: { gap: '6px' } }, C.activos.map((c) => {
        const X = R.prod.CICLO[c.id];
        return h('span', { class: 'chip ' + (X.bueno ? 'bien' : 'mal') }, X.emoji + ' ' + X.nombre + ' · ' + c.quedan + ' m');
      })) : null,
      C.proximo ? bannerProximo(s) : null,
      !C.activos.length && !C.proximo ? h('p', { class: 'chico suave' }, '🌤️ El mundo está tranquilo. Por ahora.') : null), { cerrable: true });
  }
  ui.verPrecios = verPrecios;

  // ── Momento: se viene una crisis o una bonanza ──
  ui.momentos.aviso_mundo = function (s, m, listo) {
    const C = s.mundo.ciclos;
    if (!C.proximo || C.proximo.id !== m.id) return listo();
    const X = R.prod.CICLO[m.id];
    const { precios, ef } = R.prod.efectosCiclo(X);
    const b = R.prod.bloqueoPreparar(s);
    const costo = [];
    if (X.prep.costo.pc) costo.push('⭐ ' + X.prep.costo.pc);
    if (X.prep.costo.gasto) costo.push('💸 ' + X.prep.costo.gasto + '%');
    const queHace = X.prep.mitiga && !X.bueno ? 'Te pega ' + Math.round(X.prep.mitiga * 100) + '% menos'
      : X.prep.atrae ? 'Más inversión en ' + Object.keys(X.prep.atrae).map((k) => R.SECTOR[k].emoji).join(' ') : '';
    if (X.bueno) R.son.bien(); else R.son.mal();
    ui.abrirCapa(h('div', { class: 'pila' },
      h('div', { class: 'centro', style: { fontSize: '54px', lineHeight: 1 } }, X.emoji),
      h('div', { class: 'centro etiqueta' }, '📡 Se viene ' + (C.proximo.en <= 1 ? 'el mes que viene' : 'en ' + C.proximo.en + ' meses')),
      h('h2', { class: 'centro', style: { margin: 0 } }, X.nombre),
      h('div', { class: 'fila envolver', style: { gap: '4px', justifyContent: 'center' } },
        precios.map((p) => h('span', { class: 'chip ' + (p.v > 0 ? 'bien' : 'mal') }, R.PRODUCTOS[p.k].emoji + ' precio ' + (p.v > 0 ? '▲' : '▼'))),
        ui.chipsEfectos(R.gob.describirEfectos(s, ef), { compacto: true })),
      h('div', { class: 'lista-elegir' },
        h('button', { class: 'item-elegir', disabled: b ? true : null, onclick: () => {
          const r = R.prod.preparar(s);
          if (r.error) { R.son.mal(); ui.aviso('🚫 ' + r.error, { tipo: 'mal' }); return; }
          R.guardar(s);
          ui.cerrarCapa();
          R.son.bien();
          listo();
          ui.aviso(r.txt, { tipo: 'bien', efectos: R.describirAplicado(s, r.aplicado) });
        } }, h('span', { class: 'ic' }, X.bueno ? '🚀' : '🛡️'),
          h('div', { class: 'pila', style: { gap: '3px', minWidth: 0 } }, h('b', null, X.prep.txt), queHace ? h('span', { class: 'chico suave' }, queHace) : null,
            b && b !== 'Falta ⭐' ? null : b ? h('span', { class: 'chico', style: { color: 'var(--mal)' } }, b) : null),
          h('span', { class: 'chip sol' }, costo.join(' · '))),
        h('button', { class: 'item-elegir', onclick: () => { ui.cerrarCapa(); listo(); } },
          h('span', { class: 'ic' }, '➡️'), h('div', null, h('b', null, 'Seguir igual')), h('span', { class: 'chip' }, 'gratis')))));
  };

  // ── Novedades de la producción para el resumen del mes ──
  ui.novedades = function (s, lista) {
    if (!lista || !lista.length) return null;
    const filas = lista.map((n) => {
      if (n.ciclo) {
        const X = R.prod.CICLO[n.ciclo];
        return h('div', { class: 'novedad' }, h('span', null, n.fin ? '✅' : X.emoji), h('span', null, (n.fin ? 'Terminó: ' : 'Empezó: ') + X.nombre));
      }
      const x = R.SECTOR[n.id];
      const quien = n.quien === 'estado' ? '🔨 obra terminada' : n.quien === 'privado' ? '🏦 inversión privada' : n.quien ? '🌎 inversión extranjera' : '🏚️ cierran empresas';
      return h('div', { class: 'novedad ' + (n.sube ? 'bien' : 'mal') }, h('span', null, x.emoji), h('span', null, x.nombre + (n.sube ? ' ▲ nivel ' : ' ▼ nivel ') + s.prod.sec[x.id].nivel), h('small', null, quien));
    });
    return h('div', { class: 'pila', style: { gap: '4px' } }, h('div', { class: 'etiqueta' }, '🏗️ Novedades'), filas);
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/ui/metas.js ──
// Interfaz de metas (tarjeta en Inicio, elegir el gran objetivo, meta cumplida o vencida), protestas de los grupos,
// ataque de un vecino y ranking de potencias.
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;
  ui.momentos = ui.momentos || {};

  // Chips cortos de un premio (⭐ +5, 👥 ▲, ✨ +15).
  const chipsPremio = (s, ef) => ui.chipsEfectos(R.gob.describirEfectos(s, ef || {}), { compacto: true });

  // ── 🎯 Metas (Inicio) ──
  ui.tarjetaMetas = function (s) {
    R.metas.asegurar(s);
    const A = s.metas.activas;
    if (!A.length) return null;
    return h('section', { class: 'tarjeta pila' },
      h('div', { class: 'titulo-seccion' }, '🎯 Metas'),
      h('div', { class: 'pila', style: { gap: '8px' } }, A.map((a) => {
        const M = R.META[a.id];
        const p = R.metas.progreso(s, a);
        const q = R.metas.quedan(s, a);
        const c = R.metas.camino(s, a);

  function filaLey(s, ley) {
    const G = s.gob;

    const b = con.bloqueoLey(s, ley);
    const hecha = G.leyes[ley.id];
    const ef = R.gob.efectosLey(s, ley, 2);

    if (hecha) estado = h('span', { class: 'estado bien' }, st && st.estado === 'dnu' ? '📜' : '✅');

  // Leyes (mejor de la misma ideología) que dejan plata en las cuentas: para tapar el agujero de otra.
  function compensan(s, ley) {
    const G = s.gob;
    return R.LEYES.filter((l) => l.id !== ley.id && !G.leyes[l.id] && !con.bloqueoLey(s, l))
      .map((l) => ({ l, c: R.gob.fiscalLey(s, l), misma: R.ideaLey(l) === R.ideaLey(ley) }))
      .filter((x) => x.c > 0.2)
      .sort((a, b) => (b.misma - a.misma) || (b.c - a.c))
      .slice(0, 2).map((x) => x.l);
  }

        return h('div', { class: 'item-elegir', style: { cursor: 'default', gridTemplateColumns: '34px minmax(0,1fr) auto' } },
          ui.miniEscudo(info),
          h('div', { style: { minWidth: 0 } }, h('b', null, info.sigla), ' ', h('span', { class: 'chip ' + cls }, em + ' ' + txt),
            motivo ? h('div', { class: 'chico suave motivo-voto' }, motivo) : null),
          b.postura === 'si' ? h('span', { class: 'chico suave' }, Math.round(b.p * 100) + '%')
            : h('button', { class: 'boton mini sec', disabled: G.pc < costo ? true : null, onclick: () => {
              const r = con.negociar(s, ley, b.id);

  ui.animarVotacion = function (s, titulo, res, alTerminar, opts) {
    opts = opts || {};
    const cont = h('div', { class: 'pila' });
    const camaras = Object.keys(res.camaras);
    let i = 0;
    const lentos = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const siguiente = () => {
      if (i >= camaras.length) return final();
      const nombre = camaras[i++];
      const c = res.camaras[nombre];
      const comp = R.composicion(s, nombre);
      const grupos = R.ui.gruposCamara(s, comp);
      const svg = R.ui.hemiciclo(grupos, {});
      const siPor = {};
      for (const v of c.votos) if (v.si) siPor[v.id] = (siPor[v.id] || 0) + 1;
      const cuenta = h('div', { class: 'conteo' + (opts.invertir ? ' invertido' : '') }, h('span', { class: 'si' }, '✅ 0'), h('span', { class: 'no' }, '❌ 0'));
      cont.appendChild(h('div', { class: 'tarjeta plana pila', style: { gap: '4px' } }, h('div', { class: 'etiqueta centro' }, nombre === 'diputados' ? 'Diputados' : 'Senado'), svg, cuenta,
        h('div', { class: 'centro chico suave' }, 'Necesita ' + c.necesarios)));
      const puntos = Array.from(svg.querySelectorAll('circle'));
      const usados = {};
      let si = 0;
      let no = 0;
      let k = 0;
      const porPaso = Math.max(1, Math.ceil(puntos.length / (lentos ? 45 : 1)));
      const paso = () => {
        for (let n = 0; n < porPaso && k < puntos.length; n++, k++) {
          const dot = puntos[k];
          const g = dot.getAttribute('data-g');
          usados[g] = (usados[g] || 0) + 1;
          const vota = usados[g] <= (siPor[g] || 0);
          dot.setAttribute('fill', (vota !== !!opts.invertir) ? '#1c9a50' : '#d5383a');
          if (vota) si++; else no++;
        }
        cuenta.children[0].textContent = (opts.invertir ? '🔨 ' : '✅ ') + si;
        cuenta.children[1].textContent = (opts.invertir ? '🛡️ ' : '❌ ') + no;
        R.son.tic();
        if (k < puntos.length) setTimeout(paso, 40);
        else {
          const bien = opts.invertir ? !c.pasa : c.pasa;
          cont.appendChild(h('div', { class: 'veredicto ' + (bien ? 'gana' : 'pierde'), style: { fontSize: '24px', color: bien ? 'var(--bien)' : 'var(--mal)' } },
            (c.pasa ? 'Aprobado en ' : 'Rechazado en ') + (nombre === 'diputados' ? 'Diputados' : 'el Senado')));
          setTimeout(siguiente, lentos ? 700 : 0);
        }
      };
      paso();
    };
    const final = () => {
      const ok = opts.invertir ? !res.aprobada : res.aprobada;
      if (ok) { R.son.aplausos(); ui.confeti(['#1c9a50', '#ffffff', '#f6b40e']); } else R.son.abucheo();
      cont.appendChild(h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, ok ? '🎉 ¡Seguir!' : 'Seguir'));
      const b = cont.querySelector('.boton');
      if (b) b.focus({ preventScroll: true });
    };
    ui.abrirCapa(h('div', { class: 'pila' }, h('h2', { class: 'centro' }, '🗳️ ' + titulo), cont), { sinFoco: true });
    siguiente();
  };

    { id: 'relacion', emoji: '🤝', nombre: 'Relación' },
    { id: 'bloques', emoji: '🛡️', nombre: 'Bloques' },

  // Colores
  const mezclar = (a, b, t) => {
    const pa = parseInt(a.slice(1), 16);
    const pb = parseInt(b.slice(1), 16);
    const c = [16, 8, 0].map((sh) => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t));

  const caraRel = (r) => (r >= 70 ? '😊' : r >= 40 ? '😐' : r >= 20 ? '😠' : '🤬');

  function colorPais(s, id, lente) {
    const p = R.PAIS[id];

  // Qué va en la insignia de cada bandera según el lente.

    if (s.mundo.guerra && s.mundo.guerra.pais === id) return '⚔️';
