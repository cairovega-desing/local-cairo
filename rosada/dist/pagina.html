    // ── Líneas ──
    const lineas = S('g', { class: 'mm-lineas' });
    const iconos = []; // [x, y, emoji, clase]
    const agregarLinea = (a, b, clase, icono, comba) => {
      const c = curva(a, b, comba);
      lineas.appendChild(S('path', { d: c.d, class: 'mm-linea ' + clase }));
      if (icono) iconos.push([c.medio[0], c.medio[1], icono, clase, Math.hypot(b[0] - a[0], b[1] - a[1])]);
    };
    if (lente === 'bloques') {
      for (const [a, b] of M.pactos || []) if (centros[a] && centros[b] && !M.paises[a].anexado && !M.paises[b].anexado) agregarLinea(centros[a], centros[b], 'pacto', null, 0.12);
    }
    for (const p of R.PAISES) {
      const st = M.paises[p.id];
      if (st.anexado || !centros[p.id]) continue;
      if (st.alianza && lente !== 'poder') agregarLinea(yo, centros[p.id], 'alianza');
      else if (st.tratado && (lente === 'relacion' || lente === 'comercio')) agregarLinea(yo, centros[p.id], 'tratado');
    }
    if (M.guerra && centros[M.guerra.pais]) agregarLinea(yo, M.guerra.objetivo === 'malvinas' ? centros.FLK : centros[M.guerra.pais], 'guerra', '⚔️', 0.1);
    if (M.crisis && centros[M.crisis.pais]) agregarLinea(yo, centros[M.crisis.pais], 'crisis', '😤');

    const capaMarcas = S('g', { class: 'mm-marcas' });
    const panico = S('rect', { class: 'mm-panico', fill: 'url(#mm-panico)', opacity: Math.min(0.55, (M.panico || 0) / 120) });

    const tierra = S('g', { 'clip-path': 'url(#mm-recorte)' }, grilla, resto, ...paises, argentina, malvinas);
    const svg = S('svg', { class: 'mm-svg', role: 'img', 'aria-label': 'Mapa del mundo', preserveAspectRatio: 'xMidYMid meet' },
      defs, oceano, tierra, lineas, panico, capaMarcas);

    // ── Banderas (con prioridad; las que se pisan se esconden) ──
    function prioridad(id) {
      if (id === 'ARG') return 1000;
      if (M.guerra && M.guerra.pais === id) return 900;
      if (M.crisis && M.crisis.pais === id) return 850;
      const st = M.paises[id];
      return (st.alianza ? 300 : 0) + (st.tratado ? 100 : 0) + R.PAIS[id].poder;
    }
    const ids = ['ARG'].concat(R.PAISES.filter((p) => !M.paises[p.id].anexado && centros[p.id]).map((p) => p.id)).sort((a, b) => prioridad(b) - prioridad(a));

    function marcas(px) {
      // px = unidades del mapa por píxel de pantalla (para que las banderas tengan siempre el mismo tamaño).
      capaMarcas.replaceChildren();
      const ancho = (estado.ancho < 600 ? 22 : 26) * px; // de cerca, banderas un poco más chicas para que entren todas
      const alto = ancho * (2 / 3);
      const puestas = [];
      for (const id of ids) {
        const [x, y] = centros[id];
        if (puestas.some(([a, b]) => Math.abs(a - x) < ancho * 1.05 && Math.abs(b - y) < alto * 1.25)) continue;
        puestas.push([x, y]);
        const bandera = R.ui.bandera(id, 26);
        bandera.setAttribute('x', (x - ancho / 2).toFixed(1));
        bandera.setAttribute('y', (y - alto / 2).toFixed(1));
        bandera.setAttribute('width', ancho.toFixed(2));
        bandera.setAttribute('height', alto.toFixed(2));
        bandera.removeAttribute('class');
        const g = S('g', { class: 'mm-marca' + (id === 'ARG' ? ' yo' : ''), 'data-id': id },
          S('rect', { x: (x - ancho / 2 - 1.5 * px).toFixed(1), y: (y - alto / 2 - 1.5 * px).toFixed(1), width: (ancho + 3 * px).toFixed(1), height: (alto + 3 * px).toFixed(1), rx: 3 * px, class: 'mm-marco' }),
          bandera);
        const ins = id === 'ARG' ? '' : insignia(s, id, lente);
        if (ins) {
          const r = 8 * px;
          const cx = x + ancho / 2;
          const cy = y + alto / 2;
          g.appendChild(S('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: r.toFixed(2), class: 'mm-insignia' }));
          g.appendChild(S('text', { x: cx.toFixed(1), y: (cy + r * 0.38).toFixed(1), 'font-size': (/^\d+$/.test(ins) ? 8.5 : 10) * px, 'text-anchor': 'middle', class: 'mm-insignia-txt' }, ins));
        }
        if (opts.alTocar && id !== 'ARG') g.addEventListener('click', (e) => { if (arrastro) { e.preventDefault(); return; } opts.alTocar(id); });
        capaMarcas.appendChild(g);
      }
      // Íconos de las líneas (guerra, reclamo)
      for (const [x, y, em, , largo] of iconos) {
        if (largo / px < 110) continue; // línea corta: el ícono taparía las banderas (ya está en la insignia del país)
        capaMarcas.appendChild(S('circle', { cx: x, cy: y, r: 11 * px, class: 'mm-icono-fondo' }));
        capaMarcas.appendChild(S('text', { x, y: y + 4.5 * px, 'font-size': 13 * px, 'text-anchor': 'middle' }, em));
      }
      // Malvinas: su soberanía
      if (!M.malvinas.recuperadas && centros.FLK && (estado.ancho < 450)) {
        const [x, y] = centros.FLK;
        capaMarcas.appendChild(S('text', { x: x + 9 * px, y: y + 4 * px, 'font-size': 10 * px, class: 'mm-texto' }, '🏝️ ' + M.malvinas.soberania + '%'));
      }
    }

    // ── Vista: centro + ancho → viewBox ──
    let pxAncho = 340;
    function limitar() {
      estado.ancho = R.clamp(estado.ancho, 110, G.ancho);
      const altoVista = estado.ancho / ASPECTO;
      const [cx, cy] = estado.centro;
      const medioX = estado.ancho / 2;
      const medioY = altoVista / 2;
      estado.centro = [R.clamp(cx, Math.min(medioX, G.ancho / 2), Math.max(G.ancho - medioX, G.ancho / 2)), R.clamp(cy, Math.min(medioY, G.alto / 2), Math.max(G.alto - medioY, G.alto / 2))];
    }
    function actualizar() {
      limitar();
      const altoVista = estado.ancho / ASPECTO;
      const x = estado.centro[0] - estado.ancho / 2;
      const y = estado.centro[1] - altoVista / 2;
      svg.setAttribute('viewBox', x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + estado.ancho.toFixed(1) + ' ' + altoVista.toFixed(1));
      panico.setAttribute('x', x); panico.setAttribute('y', y); panico.setAttribute('width', estado.ancho); panico.setAttribute('height', altoVista);
      const r = svg.getBoundingClientRect();
      if (r.width > 0) pxAncho = r.width;
      marcas(estado.ancho / pxAncho);
      botones.forEach(([id, b]) => b.classList.toggle('elegida', estado.preset === id));
    }
    function zoom(f, foco) {
      const antes = estado.ancho;
      estado.ancho = R.clamp(estado.ancho * f, 110, G.ancho);
      if (foco) {
        // Que el punto bajo el dedo/mouse quede quieto.
        const k = 1 - estado.ancho / antes;
        estado.centro = [estado.centro[0] + (foco[0] - estado.centro[0]) * k, estado.centro[1] + (foco[1] - estado.centro[1]) * k];
      }
      estado.preset = null;
      actualizar();
    }
    const aMapa = (ev) => {
      const r = svg.getBoundingClientRect();
      const px = estado.ancho / r.width;
      const altoVista = estado.ancho / ASPECTO;
      return [estado.centro[0] - estado.ancho / 2 + (ev.clientX - r.left) * px, estado.centro[1] - altoVista / 2 + (ev.clientY - r.top) * px];
    };

    // ── Arrastrar, rueda y doble toque ──
    let arrastro = false;
    let inicio = null;
    svg.addEventListener('pointerdown', (ev) => {
      inicio = { x: ev.clientX, y: ev.clientY, centro: estado.centro.slice(), tipo: ev.pointerType };
      arrastro = false;
    });
    svg.addEventListener('pointermove', (ev) => {
      if (!inicio) return;
      const dx = ev.clientX - inicio.x;
      const dy = inicio.tipo === 'mouse' ? ev.clientY - inicio.y : 0; // en el celu, para arriba/abajo se mueve la página
      if (!arrastro && Math.hypot(dx, dy) < 6) return;
      arrastro = true;
      const px = estado.ancho / svg.getBoundingClientRect().width;
      estado.centro = [inicio.centro[0] - dx * px, inicio.centro[1] - dy * px];
      estado.preset = null;
      actualizar();
    });
    const soltar = () => { inicio = null; setTimeout(() => { arrastro = false; }, 0); };
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);
    svg.addEventListener('pointerleave', () => { inicio = null; });
    svg.addEventListener('wheel', (ev) => { ev.preventDefault(); zoom(ev.deltaY > 0 ? 1.25 : 0.8, aMapa(ev)); }, { passive: false });
    svg.addEventListener('dblclick', (ev) => { ev.preventDefault(); zoom(0.55, aMapa(ev)); });

    // ── Controles ──
    const botones = PRESETS.map((v) => [v.id, h('button', { class: 'chip toque' + (estado.preset === v.id ? ' elegida' : ''), onclick: () => { R.son.toque(); irA(v.id); actualizar(); } }, v.emoji + ' ' + v.nombre)]);
    const zoomCtl = h('div', { class: 'mm-zoom' },
      h('button', { class: 'boton mini sec', 'aria-label': 'Acercar', onclick: () => zoom(0.66) }, '＋'),
      h('button', { class: 'boton mini sec', 'aria-label': 'Alejar', onclick: () => zoom(1.5) }, '－'));
    const chipPanico = (M.panico || 0) >= 1 ? h('span', { class: 'chip mal mm-chip-panico' }, '😱 Pánico ' + Math.round(M.panico) + '%') : null;
    const caja = h('div', { class: 'mm-caja', style: { aspectRatio: String(ASPECTO) } }, svg, zoomCtl, chipPanico);

    const lentes = h('div', { class: 'mm-lentes' }, ui.LENTES.map((l) => h('button', { class: 'chip toque' + (lente === l.id ? ' elegida' : ''), onclick: () => { R.son.toque(); estado.lente = l.id; if (opts.alCambiar) opts.alCambiar(); } }, l.emoji + ' ' + l.nombre)));
    const vistas = h('div', { class: 'mm-vistas' }, botones.map(([, b]) => b));

    const raiz = h('div', { class: 'mapamundi' }, lentes, caja, vistas, leyenda(s, lente));
    // Cuando ya está en pantalla, se mide para que las banderas tengan el tamaño justo.
    requestAnimationFrame(actualizar);
    actualizar();
    return raiz;
  };

  function leyenda(s, lente) {
    const item = (color, txt) => h('span', { class: 'mm-ley' }, h('i', { style: { background: color } }), txt);
    const linea = (clase, txt) => h('span', { class: 'mm-ley' }, h('b', { class: 'mm-ley-linea ' + clase }), txt);
    let cosas;
    if (lente === 'bloques') cosas = Object.entries(R.BLOQUES_MUNDO).map(([k, b]) => item(COLOR_BLOQUE[k], b.emoji + ' ' + b.nombre)).concat([linea('pacto', 'Pacto')]);
    else if (lente === 'comercio') cosas = [item('#7fd49a', 'Le vendés mucho'), item('#ffe08a', 'Normal'), item('#f7a596', 'Poco'), h('span', { class: 'mm-ley' }, '📦 Tratado')];
    else if (lente === 'poder') cosas = [item('#f1ebff', 'Débil'), item('#a58cf0', 'Medio'), item('#5b3fd0', 'Potencia'), h('span', { class: 'mm-ley' }, '🔢 = poder militar')];
    else cosas = [item('#7fd49a', '😊 Amigos'), item('#ffd77a', '😐 Neutral'), item('#f28b82', '😠 Mal'), linea('alianza', 'Alianza'), linea('tratado', 'Tratado')];
    if (s.mundo.guerra || s.mundo.crisis) cosas.push(h('span', { class: 'mm-ley' }, s.mundo.guerra ? '⚔️ Guerra' : '😤 Reclamo'));
    if (R.PAISES.some((p) => s.mundo.paises[p.id].anexado)) cosas.push(item('repeating-linear-gradient(45deg,#74acdf 0 3px,#fff 3px 6px)', 'Anexado'));
    return h('div', { class: 'mm-leyenda' }, cosas);
  }

<script>
// ── js/ui/mundo.js ──
// El mundo: tu poder, aliados, Malvinas, países y la guerra (frente tira y afloja).
(function (R) {

  }

  // 🌍 El mapa del mundo
  function tarjetaMapa(s) {

  // Resumen en mosaicos: ranking, poder, prestigio, pánico, aliados y tratados.

      h('span', { class: 'em' }, em), h('b', null, grande), h('small', null, chico));
    return h('section', { class: 'tarjeta pila' },
      h('div', { class: 'titulo-seccion' }, R.ui.bandera('ARG', 30), ' Argentina en el mundo'),
      h('div', { class: 'mosaicos' },
        mosaico('🏆', mun.puesto(s, true) + '° en Sudamérica', mun.puesto(s) + '° del mundo ›', () => ui.verRanking(s)),
        mosaico('⚔️', 'Poder ' + mun.poder(s), '🛩️ Comprar aviones ›', () => elegirProveedor(s)),

        mosaico('😱', 'Pánico ' + panico + '%', panico ? 'Riesgo ▲ · ventas ▼' : 'El mundo está tranquilo', null, panico >= 20 ? 'malo' : ''),
        mosaico('🛡️', aliados.length ? h('span', { class: 'banderitas' }, aliados.map((p) => R.ui.bandera(p.id, 22))) : 'Sin aliados', aliados.length + (aliados.length === 1 ? ' alianza' : ' alianzas')),

  // 📰 Lo que pasa en el mundo (alianzas entre países, pedidos de protección, ofertas).

  }

  // Frente de batalla: barra tira y afloja entre las dos banderas.
  ui.frente = function (s, W) {
    const F = mun.fuerzas(s, W.pais);
    return h('div', { class: 'pila', style: { gap: '6px' } },

  };

  // Chances de ganar desde donde está el frente ahora.
  function chipChances(s, W) {

    const pct = Math.round(ch.gana * 100);

  ui.accionesGuerra = function (s, volver, opts) {
    return h('div', { class: 'pila', style: { gap: '6px' } },
      h('b', null, '⭐ Inclinar la guerra'),
      h('div', { class: 'acc-guerra' }, mun.ACC_GUERRA.map((a) => {
        const b = mun.bloqueoGuerra(s, a.id);
        const pais = a.pais && a.pais(s, s.mundo.guerra);

        return h('button', { class: 'acc-g' + (b ? ' apagada' : ''), onclick: () => detalleAccGuerra(s, a.id, volver, opts) },

  function detalleAccGuerra(s, id, volver, opts) {

    const pc = mun.costoAccGuerra(s, a);
    const pais = a.pais && a.pais(s, W);
    const sePuede = !b || b === 'Falta ⭐';
    const pv = sePuede ? mun.previaGuerra(s, id) : null;
    const efectos = sePuede ? R.gob.describirEfectos(s, mun.efAccGuerra(s, a)) : [];
    const pct = (x) => Math.round(x * 100) + '%';
    ui.abrirCapa(h('div', { class: 'pila' },
      h('div', { class: 'fila' }, h('span', { style: { fontSize: '36px', lineHeight: 1 } }, a.emoji), pais ? R.ui.bandera(pais, 36) : null),
      h('h2', { style: { fontSize: '22px' } }, mun.nombreAccGuerra(s, a)),

  };

// ── js/ui/fin.js ──
// Pantallas de cierre: asunción (ganaste) y fin de la partida (perdiste).
(function (R) {
  'use strict';
  const h = R.h;
  const ui = R.ui;

  ui.asuncion = function (s, alTerminar) {

      h('button', { class: 'boton grande ancho', autofocus: true, onclick: () => { ui.cerrarCapa(); alTerminar(); } }, '🏛️ Entrar a la Rosada')));
  };

  // Pantalla de fin: perder una elección, caer o terminar el mandato.
  ui.pantallaFin = function (s) {
    ui.ocultarNav();
    const f = s.fin || {};
    const motivos = {
      paso: { em: '🥲', t: 'Quedaste afuera en las PASO', d: 'No llegaste al 1,5 %. La próxima, más actos y más tele.' },
      general: { em: '😞', t: 'Perdiste la elección', d: 'No entraste al ballotage. Pero tu partido ya existe.' },
      ballotage: { em: '💔', t: 'Perdiste el ballotage', d: 'Por poco. La próxima es tuya.' },
      helicoptero: { em: '🚁', t: 'Te fuiste en helicóptero', d: 'Tres meses con la aprobación por el piso. Renunciaste.' },
      estallido: { em: '🔥', t: 'Estallido social', d: 'El país explotó y tuviste que renunciar.' },
      reeleccion: { em: '😔', t: 'Perdiste la reelección', d: 'El pueblo eligió otro camino.' },
      mandato: { em: '🏁', t: 'Terminaste tu mandato', d: 'Entregás la banda. La historia te juzgará.' },
      juicio: { em: '⚖️', t: 'Te destituyó el Congreso', d: 'El juicio político salió. Demasiados escándalos.' },
    };
    const m = motivos[f.motivo] || { em: '🏁', t: 'Fin de la partida', d: '' };
    const filas = [];
    if (s.gob) {
      const e = s.eco;
      const ini = s.gob.historia[0] || {};
      const dato = (em, nom, a, b, fmt, malo) => {
        const mejor = malo ? b < a : b > a;
        return h('div', { class: 'fila-resumen' }, h('span', { class: 'em' }, em), h('span', { class: 'nom' }, nom),
          h('span', { class: 'val numero' }, fmt(a) + ' → ' + fmt(b)), h('span', { class: 'chip ' + (mejor ? 'bien' : 'mal') }, mejor ? '▲' : '▼'));
      };
      filas.push(h('section', { class: 'tarjeta pila' },
        h('div', { class: 'titulo-seccion' }, '📊 Cómo dejaste el país'),
        h('p', { class: 'chico suave' }, 'Gobernaste ' + s.gob.meses + ' meses.'),
        h('div', { class: 'resumen-filas' },
          dato('👍', 'Aprobación', ini.aprob ?? 55, s.gob.aprob, (v) => R.fmt(v) + '%'),
          dato('🛒', 'Inflación anual', ini.inflAnual ?? 27, e.inflAnual, (v) => R.fmt(v) + '%', true),
          dato('🏚️', 'Pobreza', ini.pobreza ?? 34, e.pobreza, (v) => R.fmt(v) + '%', true),
          dato('🚪', 'Desempleo', ini.desempleo ?? 7.8, e.desempleo, (v) => R.fmt(v, 1) + '%', true),
          dato('🏦', 'Reservas', ini.reservas ?? 28, e.reservas, (v) => R.fmt(v)),
          dato('💳', 'Deuda', ini.deuda ?? 78, e.deuda, (v) => R.fmt(v) + '%', true))));
    } else {
      const g = s.elecciones.general;
      const yoGen = g ? g.lista.find((x) => x.id === 'YO') : null;
      const mejor = Math.max(...s.encuestas.map((e) => e.YO));
      filas.push(h('div', { class: 'mis-numeros' },
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '📈'), h('div', { class: 'val' }, R.fmt(mejor, 1) + '%'), h('div', { class: 'nom' }, 'mejor encuesta')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🗳️'), h('div', { class: 'val' }, yoGen ? R.fmt(yoGen.v, 1) + '%' : '–'), h('div', { class: 'nom' }, 'en las generales')),
        h('div', { class: 'mi-numero' }, h('div', { class: 'em' }, '🏛️'), h('div', { class: 'val' }, g ? (g.bancas.dip.YO || 0) + (g.bancas.sen.YO || 0) : 0), h('div', { class: 'nom' }, 'bancas ganadas'))));
    }
    const leg = R.legado(s);
    const logrosPartida = R.LOGROS.filter((l) => s.logros && s.logros[l.id]);
    ui.montar(h('main', { class: 'pila', style: { paddingTop: '16px' } },
      h('section', { class: 'tarjeta pila centro' },
        h('div', { style: { fontSize: '60px' } }, m.em),
        s.gob ? h('div', { class: 'fila', style: { justifyContent: 'center' } }, R.ui.avatar(s.lider.avatar, { size: 90, humor: f.motivo === 'mandato' ? 'feliz' : 'triste', banda: f.motivo === 'mandato' })) : null,
        h('h2', { style: { fontSize: '30px' } }, m.t),
        h('p', null, m.d),
        leg ? h('div', { class: 'legado' }, h('div', { class: 'estrellas', 'aria-label': leg.estrellas + ' de 5 estrellas' }, '★'.repeat(leg.estrellas) + '☆'.repeat(5 - leg.estrellas)),
          h('div', { class: 'titulo-legado' }, '«' + leg.titulo + '»'), h('div', { class: 'chico suave' }, 'Legado: ' + leg.puntos + '/100')) : null),
      R.oposicion && R.oposicion.puede(s) ? h('section', { class: 'tarjeta pila centro', style: { background: 'var(--sol-claro)' } },
        h('b', null, '🔄 ¿Seguís en la oposición?'),
        h('p', { class: 'chico' }, 'Tu partido ya existe y tiene ' + ((R.composicion(s, 'diputados').YO || 0)) + ' diputados. Medio término en 2029 y presidenciales en 2031.'),
        h('button', { class: 'boton grande ancho', onclick: () => { R.oposicion.iniciar(s); R.guardar(s); ui.vista = { tab: 'acciones' }; R.son.genial(); ui.render(); window.scrollTo(0, 0); } }, '🗳️ Seguir en la oposición')) : null,
      filas,
      logrosPartida.length ? h('section', { class: 'tarjeta pila' }, h('div', { class: 'titulo-seccion' }, '🏅 Logros de esta partida'),
        h('div', { class: 'vitrina' }, logrosPartida.map((l) => h('div', { class: 'medalla chica' + (l.malo ? ' mala' : '') }, h('span', { class: 'em' }, l.emoji), h('span', null, l.nombre))))) : null,
      h('button', { class: 'boton grande ancho', onclick: () => { R.borrarPartida(); ui.s = null; ui.crear(); } }, '🏴 Fundar otro partido'),
      h('button', { class: 'boton sec ancho', onclick: () => { R.borrarPartida(); ui.s = null; ui.irPortada(); } }, '🏠 Portada'),
      h('section', { class: 'tarjeta pila' }, h('div', { class: 'titulo-seccion' }, '📰 Tu camino'), ui.historial(s, 25))));
  };
})(globalThis.R = globalThis.R || {});

</script>
<script>
// ── js/main.js ──
// Arranque y «director de orquesta»: qué pantalla se ve y en qué orden aparecen noticias y elecciones.
(function (R) {
  'use strict';
  const ui = R.ui;
  const h = R.h;

  ui.s = null;
  ui.vista = { tab: 'acciones' };

  ui.irPortada = function () {
    ui.cerrarCapa(true);
    ui.s = null;
    ui.portada();
    window.scrollTo(0, 0);
  };

  ui.continuar = function (s) {
    ui.s = s;
    if (R.camp && R.camp.completarHistoria && R.camp.completarHistoria(s)) R.guardar(s);
    ui.vista = { tab: s.fase === 'gobierno' ? 'inicio' : 'acciones' };
    ui.render();
    window.scrollTo(0, 0);
    ui.procesarCola();
  };

  ui.render = function () {
    const s = ui.s;
    if (!s) return ui.portada();
    if (s.fase === 'campana') return ui.pantallaCampana(s);
    if (s.fase === 'gobierno' && ui.pantallaGobierno) return ui.pantallaGobierno(s);
    if (s.fase === 'fin') return ui.pantallaFin(s);
    return ui.pantallaElecto(s);
  };

  // Mientras se arma el gobierno: pantalla de presidente electo.
  ui.pantallaElecto = function (s) {
    ui.ocultarNav();
    ui.montar(h('main', { class: 'pila', style: { paddingTop: '16px' } },
      h('section', { class: 'tarjeta pila centro' },
        R.ui.avatar(s.lider.avatar, { size: 110, humor: 'feliz', banda: true }),
        h('h2', null, '¡' + s.lider.nombre + ' ganó la elección!'),
        h('p', null, 'Preparando la asunción…'))));
  };

  // Muestra de a uno los momentos pendientes (noticias, elecciones, debates…).
  ui.procesarCola = function () {
    const s = ui.s;
    if (!s || ui.procesando || ui.hayCapa()) return;
    const m = s.cola[0];
    if (!m) {
      if (ui.mostrarLogros) ui.mostrarLogros(s);
      return;
    }
    ui.procesando = true;
    const listo = () => {
      if (s.cola[0] === m) s.cola.shift();
      if (s.fase === 'fin') s.cola = [];
      R.guardar(s);
      ui.procesando = false;
      ui.render();
      ui.procesarCola();
    };
    switch (m.tipo) {
      case 'noticia': return ui.noticia(s, m, listo);
      case 'eleccion': return ui.eleccion(s, m.clave, listo);
      case 'debate': return ui.debate(s, m, listo);
      case 'asuncion': return ui.asuncion(s, () => { if (R.gob && R.gob.iniciar) R.gob.iniciar(s); listo(); });
      default:
        if (ui.momentos && ui.momentos[m.tipo]) return ui.momentos[m.tipo](s, m, listo);
        return listo();
    }
  };

  // Enter = pasar el mes (en la PC).
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || ui.hayCapa() || !ui.s) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
    if (ui.s.fase === 'campana' || ui.s.fase === 'gobierno') ui.pasarMes();
  });

  // Al cruzar el ancho de PC/celu se redibuja (cambia el diseño de columnas).
  let eraPC = null;
  window.addEventListener('resize', () => {
    const pc = ui.esPC ? ui.esPC() : false;
    if (eraPC !== null && pc !== eraPC && ui.s) ui.render();
    eraPC = pc;
  });

  function arrancar(data) {
    eraPC = ui.esPC ? ui.esPC() : false;
    if (data && data.s && data.s.v === R.VERSION) {
      ui.continuar(data.s);
      return;
    }
    ui.portada();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ s: ui.s }));
  if (hot && hot.ready) hot.ready(arrancar);
  else arrancar((hot && hot.data) || {});
})(globalThis.R = globalThis.R || {});

</script>
