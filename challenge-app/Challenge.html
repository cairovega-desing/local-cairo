function vDamas(c){
  const st = c.play, mine = !st.done && st.turn === 'me';
  const ms = mine ? DM.moves(st.b, 'me') : [], must = ms.length && ms[0].caps.length;
  const movable = new Set(ms.map(m => m.f)), tg = dmSel !== null ? ms.filter(m => m.f === dmSel) : [];
  const crown = '<svg viewBox="0 0 24 20" fill="currentColor" aria-hidden="true"><path d="M2 6l5 4 5-8 5 8 5-4-2 12H4z"/></svg>';
  let sq = '';
  for (let i = 0; i < 64; i++){
    const r = i >> 3, f = i & 7, p = st.b[i], dark = (r + f) % 2 === 1, t = tg.find(m => m.t === i);
    const cls = ['sq', dark ? 'd' : 'l', st.last && st.last.includes(i) ? 'last' : '', i === dmSel ? 'sel' : '', t ? 'hint' : '', mine && must && movable.has(i) && dmSel === null ? 'must' : ''].filter(Boolean).join(' ');
    const lbl = p ? (DM.own(p, 'me') ? 'tu ficha' : 'ficha rival') + (DM.king(p) ? ' (dama)' : '') : 'casilla';
    sq += `<button class="${cls}" data-a="dm-sq" data-i="${i}" aria-label="${lbl}" ${dark ? '' : 'disabled'}>${p ? `<span class="pc ck ${DM.own(p, 'me') ? 'me' : 'ai'} ${DM.king(p) ? 'k' : ''}">${DM.king(p) ? crown : ''}</span>` : ''}</button>`;

}

const FR_SUIT = ['♠', '♥', '♦', '♣'], FR_NAME = ['picas', 'corazones', 'diamantes', 'tréboles'];
const rlbl = r => ({ 11:'J', 12:'Q', 13:'K', 14:'A' })[r] || String(r);
const carta = (cd, size = '') => `<span class="carta ${size} ${cd.s === 1 || cd.s === 2 ? 'red' : ''}" aria-label="${rlbl(cd.r)} de ${FR_NAME[cd.s]}"><span class="cr">${rlbl(cd.r)}<i>${FR_SUIT[cd.s]}︎</i></span><span class="cs">${FR_SUIT[cd.s]}︎</span></span>`;
function vPoker(c){
  const t = c.play, h = t.h, need = PK.needs(t), mine = !t.done && need === 'me', R = '@' + esc(c.rival);
  const [sb, bb] = PK.blinds(t.hand), key = t.hand + ':' + h.board.length, anim = key !== pkAnim; pkAnim = key;
  const bub = w => t.bubble && t.bubble.who === w && !h.over ? t.bubble.text : '';
  const bet = w => h.bets[w] ? `<span class="chipbet ${w}">${fmt(h.bets[w])}</span>` : '';
  const stackTxt = w => `<span class="small muted num">${fmt(t.stacks[w])} fichas${t.button === w ? ' · <b class="dealer">D</b>' : ''}</span>`;
  const board = [0,1,2,3,4].map(i => h.board[i] ? carta(h.board[i], 'sm' + (anim && i >= (h.board.length === 3 ? 0 : h.board.length - 1) ? ' flip' : '')) : '<span class="carta sm slot"></span>').join('');
  const aiCards = h.show ? h.hole.ai.map(x => carta(x, 'sm')).join('') : '<span class="carta sm back"></span><span class="carta sm back"></span>';
  let acts = '';
  if (t.done) acts = gameEnd(c);
  else if (h.over) acts = `<div class="g-status">${h.winner === 'me' ? 'Ganaste la mano' : h.winner === 'ai' ? R + ' ganó la mano' : 'Pozo repartido'} · repartiendo…</div>`;
  else if (mine){
    const call = PK.toCall(t, 'me'), pot = PK.potTotal(t), opp = h.bets.ai, mx = PK.maxTo(t, 'me');
    let raises = '';
    if (PK.canRaise(t, 'me')){
      const opts = [...new Set([PK.minTo(t, 'me'), opp + Math.round((pot + call) / 2), opp + pot + call, mx].map(x => Math.min(x, mx)).filter(x => x > opp))].sort((a, b) => a - b);
      raises = `<div class="btn-row raises">${opts.map(x => `<button class="btn ${x === mx ? 'danger' : ''}" data-a="pk-act" data-t="raise" data-v="${x}">${x === mx ? 'All-in' : (call ? 'Resubir a ' : 'Subir a ') + fmt(x)}</button>`).join('')}</div>`;
    }
    acts = `<div class="g-status">Tu turno${call ? ` · para seguir tenés que poner ${fmt(Math.min(call, t.stacks.me))}` : ''}</div>
      <div class="btn-row">${call ? '<button class="btn" data-a="pk-act" data-t="fold">Retirarse</button>' : ''}<button class="btn primary" data-a="pk-act" data-t="call">${call ? (call >= t.stacks.me ? 'Igualar all-in' : 'Igualar ' + fmt(call)) : 'Pasar'}</button></div>${raises}`;
  } else acts = `<div class="g-status ai">${R} está pensando…</div>`;
  if (!t.done) acts += `<div class="btn-row">${resignBtns('abandono')}</div>`;
  return `<div class="game" role="dialog" aria-label="Póker">${gameTop(c, 'Póker · mano a mano')}<div class="g-body">
    ${seat(c, 'ai', need === 'ai', stackTxt('ai'), bub('ai'))}
    <div class="mesa poker">
      <div class="hole">${aiCards}${bet('ai')}</div>
      <div class="pozo"><span class="lbl">Pozo</span><b class="num">${fmt(PK.potTotal(t))}</b></div>
      <div class="boardc">${board}</div>
      <div class="hole">${h.hole.me.map(x => carta(x, '')).join('')}${bet('me')}</div>
    </div>
    ${h.names ? `<div class="tlog"><span>Vos: ${h.names.me} · ${R}: ${h.names.ai}</span></div>` : `<div class="tlog">${t.log.slice(-2).map(l => `<span>${txtR(l, c)}</span>`).join('')}</div>`}
    ${seat(c, 'me', mine, stackTxt('me'), bub('me'))}
    <div class="moves"><span>Mano ${t.hand} de ${t.max} · ciegas ${sb}/${bb}</span></div>
    ${acts}
  </div></div>`;
}

function rivalId(u, p){
  const base = u.replace(/[^a-z0-9]/gi, ''), n = fakeElo(u + p) * 7919;
  const digits = k => String(n * 104729).padEnd(k, '7').slice(0, k);
  if (p === 'riot') return `${base}#LAS`;
  if (p === 'activision') return `${base}#${digits(7)}`;
  if (p === 'supercell') return '#' + digits(8).split('').map(d => '0289PYLQGR'[+d]).join('');
  if (p === 'garena') return digits(10);
  if (p === 'miniclip') return digits(9).replace(/(\d{3})(\d{3})(\d{3})/, '$1-$2-$3');
  return base;
}

/* ---------- matchmaking ---------- */
let mmTimer;
function tickMM(){
  const mm = S.mm; if (mm.status !== 'buscando') return;
  const secs = Math.floor((Date.now() - mm.startedAt)/1000);
  const w = Math.min(400, 100 + 50*Math.floor(secs/2));
  const g = mm.game || 'lichess', e = S.ratings[g];
  const t = $('mm-time'); if (t) t.textContent = Math.floor(secs/60) + ':' + String(secs%60).padStart(2,'0');
  const r = $('mm-range'); if (r) r.textContent = '±' + w;
  const b = $('mm-bar'); if (b){ const p = 50 - (w/400)*45; b.style.left = p + '%'; b.style.right = p + '%'; }
  const h = $('mm-hint'); if (h) h.textContent = `${e-w} a ${e+w}. ${w < 400 ? 'Se amplía mientras esperás.' : 'Llegó al máximo.'}`;
  const q = $('mm-queue'); if (q) q.textContent = 12 + (secs % 5);
  if (secs >= mm.matchAt){
    const cands = Object.entries(S.players).filter(([,p]) => !p.friend && Math.abs(p.r[g] - e) <= w);
    const pick = (cands.length ? cands : Object.entries(S.players).filter(([,p]) => !p.friend))
      .sort((a,b) => Math.abs(a[1].r[g] - e) - Math.abs(b[1].r[g] - e))[0][0];
    clearInterval(mmTimer);
    const c = { id: uid('c'), game:g, stake: mm.stake, rival: pick, mine:true, origin:'matchmaking', status:'aceptado', created: Date.now(), myLocked:true, lichessId: Math.random().toString(36).slice(2,10), events:[] };
    ev(c, `Matchmaking: te emparejamos con @${pick} (ELO ${S.players[pick].r[g]}) en ${secs} s`);
    ev(c, `Las ${fmt(mm.stake)} monedas retenidas pasaron al pozo. @${pick} bloqueó las suyas`);
    ev(c, `Se creó la partida ${c.lichessId} en la app`);
    // la retención de la cola pasa al escrow del desafío
    S.ledger.push({ id: uid('m'), type:'devolucion_cola', amount: mm.stake, ts: Date.now() });
    S.ledger.push({ id: uid('m'), type:'bloqueo', amount: -mm.stake, ref: c.id, ts: Date.now() });
    S.challenges.push(c);
    notify(`Encontramos rival: @${pick}. Tu partida en la app está lista`, c.id);
    S.mm = { status:'idle', stake: mm.stake, game: g };
    toast(`¡Rival encontrado: @${pick}!`, 'good');
    c.status = 'en_juego'; ev(c, 'La partida empezó en la app');
    S.nav = { tab:'desafios', sub:{ type:'detalle', id:c.id } };
    save(); render(); openGame(c);
  }
}
function startMMTimer(){ clearInterval(mmTimer); mmTimer = setInterval(() => { if (S.nav.tab === 'jugar' && !S.nav.sub) tickMM(); else if (S.mm.status === 'buscando') tickMMBackground(); }, 500); }
function tickMMBackground(){ const secs = Math.floor((Date.now() - S.mm.startedAt)/1000); if (secs >= S.mm.matchAt) tickMM(); }

/* ---------- acciones ---------- */
let wizTimer;
function wizAdvance(to){ clearTimeout(wizTimer); wizTimer = setTimeout(() => { if (S.nav.sub && S.nav.sub.type === 'nuevo'){ S.draft.step = to; save(); render(); $('view').scrollTop = 0; } }, 220); }
function act(a, d, el){
  const cur = S.nav.sub && S.nav.sub.type === 'detalle' ? find(S.nav.sub.id) : null;
  switch (a){
    case 'tab': S.nav = { tab: d.t, sub:null }; S.confirmReset = false; save(); render(); $('view').scrollTop = 0; break;
    case 'back': go(null); break;
    case 'open': go({ type:'detalle', id:d.id }); break;
    case 'new': S.draft.rival = S.draft.rival || null; S.draft.step = 0; go({ type:'nuevo' }); break;
    case 'filter': S.filter = d.f; save(); render(); break;
    case 'rank-game': S.rankGame = d.g; save(); render(); break;
    case 'rank-cat': S.rankGame = GAME_IDS.find(id => GAMES[id].cat === d.c); save(); render(); break;
    case 'notifs': openNotifs(); S.notifs.forEach(n => n.read = true); save(); break;
    case 'open-notif': { const n = S.notifs.find(x => x.id === d.id); $('sheet').innerHTML = ''; render(); if (n && n.ref && find(n.ref)) go({ type:'detalle', id:n.ref }); break; }
    case 'sheet-close': signCtx = null; clearInterval(adTimer); $('sheet').innerHTML = ''; render(); break;
    case 'sheet-bg': signCtx = null; $('sheet').innerHTML = ''; render(); break;

    case 'bonus':
      if (S.lastBonusDay === today()) return;
      { const prev = new Date(now() - DAY).toISOString().slice(0,10);
        S.loginStreak = S.lastBonusDay === prev ? (S.loginStreak || 0) + 1 : 1;
        const pts = 10 + 2*Math.min(S.loginStreak, 7);
        post('bonus_diario', 100); addPoints(pts, `Bonus diario · racha de ${S.loginStreak} ${S.loginStreak === 1 ? 'día' : 'días'}`);
        S.lastBonusDay = today(); save(); render(); toast(`+100 monedas y +${pts} puntos · racha de ${S.loginStreak}`, 'good'); }
      break;
    case 'next-day': S.dayOffset++; save(); render(); toast('Pasó un día: el bonus está disponible otra vez'); break;
    case 'ad': openAd(); break;
    case 'ad-claim': clearInterval(adTimer); post('video', 20); addPoints(5, 'Video con recompensa'); S.ads.count++; $('sheet').innerHTML = ''; save(); render(); toast('+20 monedas y +5 puntos por ver el video', 'good'); break;
    case 'ad-close': clearInterval(adTimer); $('sheet').innerHTML = ''; break;

    case 'sig-method': signCtx.method = d.m; S.signMethod = d.m; signCtx.err = ''; renderSign(); break;
    case 'bio-scan':
      if (signCtx.state !== 'idle') return;
      signCtx.state = 'scan'; renderSign();
      setTimeout(() => { if (!signCtx) return; signCtx.state = 'ok'; renderSign(); setTimeout(() => signCtx && signDone('Huella'), 450); }, 900);
      break;
    case 'pin-ok': {
      const v = $('pin-in').value;
      if (v === '1234'){ S.pinFails = 0; signDone('PIN de la app'); }
      else { S.pinFails++; signCtx.err = S.pinFails >= 5 ? 'PIN bloqueado por 15 minutos.' : `PIN incorrecto. Te quedan ${5 - S.pinFails} intentos.`; save(); renderSign(); }
      break;
    }

    case 'd-cat': { S.draft.cat = d.c; const first = avail(d.c)[0]; S.draft.game = first; S.draft.fmt = GAMES[first].modes[0]; render(); break; }
    case 'd-game': S.draft.game = d.g; S.draft.fmt = GAMES[d.g].modes[0]; render(); wizAdvance(1); break;
    case 'd-fmt': S.draft.fmt = d.f; render(); break;
    case 'd-stake': S.draft.stake = +d.s; render(); break;
    case 'd-rival': S.draft.rival = d.u; render(); wizAdvance(2); break;
    case 'd-next': S.draft.step = Math.min(3, (S.draft.step || 0) + 1); save(); render(); $('view').scrollTop = 0; break;
    case 'd-prev': clearTimeout(wizTimer); S.draft.step = Math.max(0, (S.draft.step || 0) - 1); save(); render(); $('view').scrollTop = 0; break;
    case 'd-goto': clearTimeout(wizTimer); S.draft.step = +d.s; save(); render(); $('view').scrollTop = 0; break;
    case 'challenge-friend': S.draft.rival = d.u; S.draft.step = 0; go({ type:'nuevo' }); break;
    case 'create': {
      const dr = { ...S.draft };
      if (idMissing(dr.game)){ toast(`Primero vinculá tu ${PLAT[GAMES[dr.game].idp].name}`, 'bad'); return; }
      sign('Crear desafío', `${GAMES[dr.game].name}${dr.fmt !== '1v1' ? ' ' + dr.fmt : ''} · ${fmt(dr.stake)} monedas vs @${dr.rival}`, () => {
        const c = { id: uid('c'), game: dr.game, fmt: dr.fmt, stake: dr.stake, rival: dr.rival, hot: !!dr.hot, mine:true, origin:'amigo', status:'pendiente', created: Date.now(), myLocked:true, events:[] };
        post('bloqueo', -dr.stake, c.id);
        ev(c, `Creaste el desafío y bloqueaste ${fmt(dr.stake)} monedas`);
        S.challenges.push(c); S.draft.rival = null; S.draft.step = 0;
        S.nav = { tab:'desafios', sub:{ type:'detalle', id:c.id } };
        toast(`Reto enviado a @${dr.rival}`, 'good');
      });
      break;
    }
    case 'rematch': S.draft = { cat: GAMES[cur.game].cat, game: cur.game, fmt: cur.fmt || '1v1', stake: Math.min(cur.stake, balance()) || 10, rival: S.players[cur.rival].friend ? cur.rival : null, hot: !!cur.hot }; S.draft.step = S.draft.rival ? 3 : 1; go({ type:'nuevo' }); break;

    case 'accept':
      if (idMissing(cur.game)){ toast(`Primero vinculá tu ${PLAT[GAMES[cur.game].idp].name}`, 'bad'); return; }
      if (balance() < cur.stake){ toast('No te alcanzan las monedas para aceptar', 'bad'); return; }
      sign('Aceptar desafío', `${GAMES[cur.game].name} · ${fmt(cur.stake)} monedas vs @${cur.rival}`, () => {
        post('bloqueo', -cur.stake, cur.id); cur.myLocked = true; cur.status = 'aceptado';
        ev(cur, `Aceptaste y bloqueaste ${fmt(cur.stake)} monedas`);
        if (GAMES[cur.game].inapp){ cur.lichessId = Math.random().toString(36).slice(2,10); ev(cur, `Se creó la partida ${cur.lichessId} en la app`); }
        toast('Desafío aceptado', 'good');
      });
      break;
    case 'reject': cur.status = 'cancelado'; cur.cancelReason = 'Rechazaste el reto'; ev(cur, 'Rechazaste el reto. @' + cur.rival + ' recuperó sus monedas'); save(); render(); break;
    case 'withdraw':
      sign('Retirar desafío', `${GAMES[cur.game].name} · ${fmt(cur.stake)} monedas vs @${cur.rival}`, () => refundCancel(cur, 'Retiraste el reto', `Retiraste el reto y recuperaste ${fmt(cur.stake)} monedas`));
      break;
    case 'sim-accept':
      cur.status = 'aceptado'; ev(cur, `@${cur.rival} aceptó y bloqueó ${fmt(cur.stake)} monedas`);
      if (GAMES[cur.game].inapp){ cur.lichessId = Math.random().toString(36).slice(2,10); ev(cur, `Se creó la partida ${cur.lichessId} en la app`); }
      notify(`@${cur.rival} aceptó tu desafío de ${GAMES[cur.game].name}`, cur.id); save(); render(); break;
    case 'sim-reject': refundCancel(cur, `@${cur.rival} rechazó el reto`, `@${cur.rival} rechazó el reto. Recuperaste ${fmt(cur.stake)} monedas`); notify(`@${cur.rival} rechazó tu reto`, cur.id); save(); render(); break;
    case 'start': cur.status = 'en_juego'; ev(cur, 'Empezaron a jugar'); save(); render(); break;
    case 'sim-lichess':
      if (cur.status === 'aceptado'){ cur.status = 'en_juego'; ev(cur, 'La partida empezó en la app'); }
      if (cur.play && !cur.play.done){ cur.play.done = true; cur.play.final = { res: d.r, why: 'Resultado simulado' }; }
      finalize(cur, d.r, 'Resultado registrado por la app'); save(); render(); toast(d.r === 'gane' ? `¡Ganaste ${fmt(cur.stake*2)} monedas!` : d.r === 'perdi' ? 'Perdiste esta vez' : 'Se devolvieron las monedas', d.r === 'gane' ? 'good' : ''); break;
    case 'report':
      sign('Reportar resultado', `${GAMES[cur.game].name} vs @${cur.rival} · ${OUT[d.r]}`, () => {
        cur.myReport = d.r; cur.status = 'resultado_reportado'; ev(cur, `Reportaste: ${OUT[d.r]}`);
      });
      break;
    case 'sim-report': {
      cur.rivalReport = d.r;
      const agree = ({ gane:'perdi', perdi:'gane', empate:'empate' })[cur.myReport] === d.r;
      ev(cur, `@${cur.rival} reportó: ${OUT[d.r]}`);
      if (agree){ finalize(cur, cur.myReport, 'Los dos reportes coinciden'); toast('Los reportes coinciden: desafío liquidado', 'good'); }
      else { cur.status = 'en_disputa'; ev(cur, 'Los reportes no coinciden: pasó a disputa'); notify(`Tu desafío con @${cur.rival} pasó a disputa`, cur.id); toast('Los reportes no coinciden: desafío en disputa', 'bad'); }
      save(); render(); break;
    }
    case 'sim-timeout': ev(cur, `@${cur.rival} no reportó en 24 h. Su confianza baja 5 puntos`); finalize(cur, cur.myReport, 'Tu reporte quedó firme'); save(); render(); break;
    case 'cancel-req':
      sign('Pedir cancelación', `${GAMES[cur.game].name} vs @${cur.rival}`, () => { cur.cancelReq = { by:ME, at:Date.now() }; ev(cur, 'Pediste cancelar el desafío'); });
      break;
    case 'sim-cancel-ok': refundCancel(cur, 'Cancelado por los dos', `@${cur.rival} confirmó la cancelación. Recuperaste ${fmt(cur.stake)} monedas`); notify(`Se canceló tu desafío con @${cur.rival}`, cur.id); save(); render(); break;
    case 'sim-cancel-expire': cur.cancelReq = null; ev(cur, 'El pedido de cancelación venció sin respuesta. El desafío sigue'); save(); render(); toast('El pedido venció: el desafío sigue'); break;

    case 'go-admin': go({ type:'admin' }); break;

    case 'play':
      if (!cur || !inApp(cur) || !['aceptado','en_juego'].includes(cur.status)) return;
      if (cur.status === 'aceptado'){ cur.status = 'en_juego'; ev(cur, 'La partida empezó en la app'); }
      render(); openGame(cur); break;
    case 'g-close': closeGame(); break;
    case 'link-id': {
      const p = d.p, el = $('gid-' + p), v = el ? el.value.trim() : '';
      if (!PLAT[p].re.test(v)){ toast(`Revisá el formato. Ejemplo: ${PLAT[p].ph}`, 'bad'); return; }
      S.ids[p] = p === 'supercell' ? '#' + v.replace(/^#/, '').toUpperCase() : v;
      editId = null; save(); render(); toast(`${PLAT[p].name} vinculado`, 'good'); break;
    }
    case 'edit-id': editId = editId === d.p ? null : d.p; render(); break;
    case 'unlink-id': delete S.ids[d.p]; save(); render(); break;
    case 'verify': if (!cur) return; cur.verifying = true; ev(cur, `Challenge empezó a buscar la partida en ${PLAT[GAMES[cur.game].idp].src}`); save(); render(); break;
    case 'sim-verify': {
      if (!cur || !cur.verifying) return;
      cur.verifying = false;
      if (d.r === 'none'){ cur.manual = true; ev(cur, 'La partida no apareció en el historial: los dos reportan el resultado'); save(); render(); toast('No apareció la partida: reporten a mano', 'bad'); break; }
      ev(cur, `Se encontró la partida en ${PLAT[GAMES[cur.game].idp].src}`);
      finalize(cur, d.r, 'Verificado con el ID de cada jugador'); save(); render();
      toast(d.r === 'gane' ? `¡Ganaste ${fmt(cur.stake*2)} monedas!` : d.r === 'perdi' ? 'Perdiste esta vez' : 'Empate: se devolvieron las monedas', d.r === 'gane' ? 'good' : ''); break;
    }
    case 'mm-game': S.mm.game = d.g; save(); render(); break;
    case 'c4-col': { const c = find(GAME); if (!c) return; const st = c.play; if (st.done || st.turn !== 'me') return; const n = C4.drop(st, +d.c); if (!n) return; c.play = n; save(); renderGame(); c4Pump(c); break; }
    case 'dm-sq': {
      const c = find(GAME); if (!c) return; const st = c.play; if (st.done || st.turn !== 'me') return;
      const i = +d.i, ms = DM.moves(st.b, 'me');
      if (dmSel !== null){ const opts = ms.filter(m => m.f === dmSel && m.t === i).sort((a, b) => b.caps.length - a.caps.length); if (opts.length){ c.play = DM.play(st, opts[0]); dmSel = null; save(); renderGame(); dmPump(c); return; } }
      dmSel = ms.some(m => m.f === i) && dmSel !== i ? i : null; renderGame(); break;
    }
    case 'gn-roll': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || t.turn !== 'me' || t.rolls >= 3) return; GN.roll(t); save(); renderGame(); gnPump(c); break; }
    case 'gn-hold': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || t.turn !== 'me') return; GN.hold(t, +d.i); save(); renderGame(); break; }
    case 'gn-write': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || t.turn !== 'me' || !t.rolls || !GN.avail(t, 'me').includes(d.k)) return; GN.write(t, d.k); save(); renderGame(); gnPump(c); break; }
    case 'pk-act': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || PK.needs(t) !== 'me') return; PK.act(t, 'me', d.t, +d.v || 0); save(); renderGame(); pkPump(c); break; }
    case 'g-resign': resignAsk = true; renderGame(); break;
    case 'g-resign-no': resignAsk = false; renderGame(); break;
    case 'g-resign-yes': { const c = find(GAME); if (!c || c.play.done) return; finishGame(c, 'perdi', c.play.kind === 'chess' ? 'Te rendiste' : 'Abandonaste la partida'); break; }
    case 'ch-sq': {
      const c = find(GAME); if (!c) return;
      const P = c.play, st = P.st; if (P.done || st.turn !== 'w') return;
      const i = +d.i, moves = CH.legal(st);
      if (chSel !== null){
        const m = moves.find(x => x.f === chSel && x.t === i);
        if (m){ tickClock(); if (P.done) return; const n = CH.play(P.st, m); n.clock.w += 3000; P.st = n; chSel = null; save(); renderGame(); chessAfter(c); return; }
      }
      chSel = st.b[i] && CH.color(st.b[i]) === 'w' && moves.some(x => x.f === i) && chSel !== i ? i : null;
      renderGame(); break;
    }
    case 'ch-draw': {
      const c = find(GAME); if (!c) return;
      const st = c.play.st; if (c.play.done || st.turn !== 'w') return;
      const e = CH.evalFor(st, 'b');
      if (e < -60 || (Math.abs(e) < 40 && st.full >= 25)){ toast(`@${c.rival} aceptó las tablas`); finishGame(c, 'empate', 'Tablas de común acuerdo'); }
      else toast(`@${c.rival} no acepta las tablas`, 'bad');
      break;
    }
    case 'tr-play': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || TR.needs(t) !== 'me' || t.h.pend) return; TR.playCard(t, 'me', +d.i); save(); renderGame(); trucoPump(c); break; }
    case 'tr-call': {
      const c = find(GAME); if (!c) return; const t = c.play;
      if (t.done || TR.needs(t) !== 'me' || (d.k === 'truco' ? !TR.canTruco(t, 'me') : !TR.canEnvido(t, 'me'))) return;
      TR.call(t, 'me', d.k); save(); renderGame(); trucoPump(c); break;
    }
    case 'tr-resp': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || !t.h.pend || t.h.pend.by !== 'ai') return; TR.respond(t, 'me', d.r); save(); renderGame(); trucoPump(c); break; }
    case 'tr-mazo': { const c = find(GAME); if (!c) return; const t = c.play; if (t.done || TR.needs(t) !== 'me' || t.h.pend) return; TR.mazo(t, 'me'); save(); renderGame(); trucoPump(c); break; }
    case 'resolve': {
      const c = find(d.id);
      const label = d.r === 'gane' ? `Gana @${ME}` : d.r === 'perdi' ? `Gana @${c.rival}` : 'Devolver a los dos';
      sign('Resolver disputa', `${GAMES[c.game].name} · ${label}`, () => {
        if (d.r === 'anulado'){ ev(c, 'Un admin resolvió devolver las monedas a los dos'); finalize(c, 'anulado'); }
        else {
          finalize(c, d.r, 'Resuelto por un admin');
          if (c.myReport !== d.r){ S.trust = Math.max(0, S.trust - 15); ev(c, 'Perdiste la disputa: tu confianza bajó 15 puntos'); }
          else ev(c, `@${c.rival} perdió la disputa: su confianza bajó 15 puntos`);
        }
        notify(`Se resolvió la disputa con @${c.rival}`, c.id);
        toast('Disputa resuelta', 'good');
      });
      break;
    }

    case 'mm-stake': S.mm.stake = +d.s; save(); render(); break;
    case 'mm-start': {
      const st = S.mm.stake;
      sign('Entrar al matchmaking', `${GAMES[S.mm.game || 'poker'].name} · ${fmt(st)} monedas`, () => {
        post('retencion_cola', -st);
        S.mm = { status:'buscando', stake: st, game: S.mm.game || 'poker', startedAt: Date.now(), matchAt: 4 + Math.floor(Math.random()*5) };
        startMMTimer();
      });
      break;
    }
    case 'mm-cancel': clearInterval(mmTimer); post('devolucion_cola', S.mm.stake); S.mm = { status:'idle', stake:S.mm.stake, game:S.mm.game }; save(); render(); toast('Saliste de la cola. Recuperaste tus monedas'); break;

    case 'd-hot': S.draft.hot = d.h === '1'; render(); break;
    case 'go-tienda': go({ type:'tienda' }); break;
    case 'go-caja': if (d.t) S.cash.tab = d.t; go({ type:'caja' }); break;
    case 'cash-tab': S.cash.tab = d.t; save(); render(); break;
    case 'kyc': S.cash.kyc = true; save(); render(); toast('Identidad verificada (simulado)', 'good'); break;
    case 'dep-amt': S.cash.dep.amount = +d.s; save(); render(); break;
    case 'dep-method': S.cash.dep.method = d.m; save(); render(); break;
    case 'ret-amt': S.cash.ret.amount = +d.s; save(); render(); break;
    case 'ret-method': S.cash.ret.method = d.m; save(); render(); break;
    case 'cash-limit': {
      const v = +d.s, K = S.cash;
      if (v <= K.limit){ K.limit = v; K.pendingLimit = null; toast(`Límite diario: ${pesos(v)}`); }
      else { K.pendingLimit = v; toast(`Subir el límite a ${pesos(v)} se aplica en 24 h`); }
      save(); render(); break;
    }
    case 'cash-limit-apply': S.cash.limit = S.cash.pendingLimit; S.cash.pendingLimit = null; save(); render(); toast(`Límite diario: ${pesos(S.cash.limit)}`); break;
    case 'dep-go': {
      const K = S.cash;
      if (!K.kyc || K.dep.amount > Math.max(0, K.limit - cashToday())) return;
      openPay(); break;
    }
    case 'pay-ok': {
      const x = { id: uid('d'), amount: S.cash.dep.amount, method: S.cash.dep.method, day: today(), ts: Date.now(), status:'ok' };
      post('deposito', x.amount); S.cash.deposits.unshift(x);
      $('sheet').innerHTML = ''; save(); render(); toast(`Depositaste ${pesos(x.amount)}: +${fmt(x.amount)} monedas (simulado)`, 'good'); break;
    }
    case 'pay-bad':
      S.cash.deposits.unshift({ id: uid('d'), amount: S.cash.dep.amount, method: S.cash.dep.method, day: today(), ts: Date.now(), status:'rechazado' });
      $('sheet').innerHTML = ''; save(); render(); toast('El pago fue rechazado. No se movió plata.', 'bad'); break;
    case 'ret-go': {
      const r = { ...S.cash.ret };
      if (!S.cash.kyc || r.amount > balance()) return;
      sign('Pedir retiro', `${pesos(r.amount)} a ${METHODS[r.method].name} (simulado)`, () => {
        post('retiro', -r.amount);
        S.cash.withdrawals.unshift({ id: uid('w'), amount: r.amount, method: r.method, ts: Date.now(), status:'revision' });
        toast('Retiro pedido: queda en revisión', 'good');
      });
      break;
    }
    case 'ret-ok': { const w = S.cash.withdrawals.find(x => x.id === d.id); if (!w) return; w.status = 'ok'; save(); render(); toast(`Se pagó el retiro de ${pesos(w.amount)} (simulado)`, 'good'); break; }
    case 'ret-bad': { const w = S.cash.withdrawals.find(x => x.id === d.id); if (!w) return; w.status = 'rechazado'; post('devolucion_retiro', w.amount); save(); render(); toast('Retiro rechazado: las monedas volvieron a tu saldo'); break; }
    case 'go-season': go({ type:'temporada' }); break;
    case 'go-inversores': go({ type:'inversores' }); break;
    case 'mode':
      S.mode = d.m; save(); render();
      toast(d.m === 'vision' ? 'Modo visión: concepto que requiere licencia' : 'Modo regulado: la versión para lanzar');
      break;
    case 'checkin':
      sign('Check-in presencial', `${GAMES[cur.game].name} vs @${cur.rival} · QR de la mesa + ubicación`, () => {
        cur.checkin = { ...(cur.checkin || {}), me:true }; ev(cur, 'Hiciste el check-in: QR escaneado y ubicación confirmada');
      });
      break;
    case 'sim-checkin': cur.checkin = { ...(cur.checkin || {}), rival:true }; ev(cur, `@${cur.rival} hizo el check-in en el mismo lugar`); save(); render(); break;
    case 'redeem': {
      const p = STORE.find(x => x.id === d.id), vis = S.mode === 'vision';
      if ((vis ? balance() : S.points) < p.cost){ toast('No te alcanza para este canje', 'bad'); return; }
      sign('Canjear premio', `${p.name} · ${fmt(p.cost)} ${vis ? 'monedas' : 'puntos'}`, () => {
        if (vis) post('canje', -p.cost);
        else { S.points -= p.cost; S.pointsLog.unshift({ ts: Date.now(), amount: -p.cost, text: 'Canje: ' + p.name }); }
        S.vouchers.unshift({ code: 'CH-' + Math.random().toString(36).slice(2,8).toUpperCase(), name: p.name, shop: p.shop, ts: Date.now() });
        toast('Canje listo: tu código está abajo', 'good');
        setTimeout(confetti, 60);
      });
      break;
    }
    case 'sim-friend': {
      S.pendingFriends = (S.pendingFriends || []).filter(u => u !== d.u);
      S.players[d.u] = S.players[d.u] || { name: d.u, friend:true, r: newRatings(d.u), streak:0, sxp:0 };
      S.players[d.u].friend = true; save(); render(); toast(`@${d.u} aceptó tu solicitud`, 'good'); break;
    }
    case 'reset': S.confirmReset = true; render(); break;
    case 'reset-no': S.confirmReset = false; render(); break;
    case 'reset-yes': clearInterval(mmTimer); S = seed(); lastBal = null; save(); render(); toast('Demo reiniciada'); break;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'sheet-bg' && e.target !== el) return;
  act(el.dataset.a, el.dataset, el);
});
document.addEventListener('toggle', e => { const f = e.target.closest && e.target.closest('[data-fold]'); if (f) OPEN[f.dataset.fold] = f.open; }, true);
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="friend"]'); if (!f) return;
  e.preventDefault();
  const v = $('friend-in').value.trim().toLowerCase().replace(/^@/, '');
  if (!/^[a-z0-9_.]{3,20}$/.test(v)){ toast('Usá entre 3 y 20 letras, números, punto o guion bajo', 'bad'); return; }
  if (v === ME || (S.players[v] && S.players[v].friend) || (S.pendingFriends || []).includes(v)){ toast('Ya está en tu lista'); return; }
  S.pendingFriends = (S.pendingFriends || []).concat(v); save(); render(); toast(`Solicitud enviada a @${v}`);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin-in'){ e.preventDefault(); act('pin-ok', {}); } });
document.addEventListener('change', e => {
  if (e.target.id !== 'ev-in' || !e.target.files.length) return;
  const c = find(e.target.dataset.id); const f = e.target.files[0];
  c.evidence = (c.evidence || []).concat(f.name); ev(c, `Adjuntaste evidencia: ${f.name}`); save(); render(); toast('Evidencia adjuntada', 'good');
});

if (S.mm.status === 'buscando') startMMTimer();
render();
})();
</script>
