<title>Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Teko:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: un teléfono centrado en desktop que ocupa toda la pantalla en el celular.
   Dirección: pantalla de "VS" de un juego de pelea / transmisión de esports. Fondo casi negro con grilla de HUD,
   vos en cian y el rival en magenta, la moneda en amarillo. Esquinas cortadas en vez de redondeadas. Es oscura a propósito. */
:root{
  color-scheme:dark;
  --bg:#06050D; --surface:#131126; --surface-2:#0B0A18; --surface-3:#221F40; --ink:#F6F5FF; --muted:#A9A6CC; --line:#2E2A55; --grid:rgba(150,140,255,.07);
  --brand:#00E1FF; --on-brand:#00161B; --brand-soft:#0A2A37;
  --rival:#FF2E7E; --rival-soft:#36102B;
  --coin:#FFCF0F; --coin-hi:#FFE45E; --coin-soft:#2A2208; --coin-ink:#FFD83D; --on-coin:#171000;
  --win:#2BFF8E; --win-soft:#0B2A1B; --on-win:#00180B;
  --loss:#FF3D5A; --loss-soft:#320E18;
  --warn:#FFA41C; --warn-soft:#301D06;
  --demo:#BD95FF; --demo-soft:#1C1438;
  --hero-a:#1B1548; --hero-b:#0D0A22; --hero-ink:#FFFFFF; --hero-muted:#C0BDE2; --hero-line:rgba(255,255,255,.13);
  --sq-l:#DCD7F7; --sq-d:#7B6CDB; --felt-a:#1E5E40; --felt-b:#0F3322; --felt-edge:#4A3420; --paper:#FFFDF6; --paper-2:#EEE5CE; --paper-edge:#D6CBB1;
  --g1:#2F6BFF; --g2:#7B3FF2; --g3:#00A862; --g4:#FF5A1F; --g5:#C026FF;
  --av0:#0A8FB0; --av1:#D81B63; --av2:#6A2FE0; --av3:#D95F00; --av4:#00995A; --av5:#2B5CE6;
  --glow-brand:0 0 0 1.5px var(--brand),0 0 22px -6px var(--brand);
  --shadow:0 24px 70px -24px rgba(0,0,0,.95);
  --cut-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  --cut-lg:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  --para:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  --hex:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  --font-display:'Chakra Petch','Arial Narrow',sans-serif;
  --font-score:'Teko','Arial Narrow',sans-serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
}

html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#1A1145 0%,transparent 65%),var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.btn,.chip,.ch,.big,.gcard,.fcard,.pick,.opt,.earn-btn,.short,.hbtn{transition:transform .08s}
.btn:active,.chip:active,.ch:active,.big:active,.gcard:active,.fcard:active,.pick:active,.opt:active,.earn-btn:active,.short:active,.hbtn:active{transform:scale(.97)}

.stage{height:100%;display:flex;justify-content:center;align-items:center;padding:20px}
.phone{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;background-color:var(--surface-2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;border:1.5px solid var(--line);border-radius:28px;box-shadow:var(--shadow),0 0 60px -30px var(--brand);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:520px){ .stage{padding:0} .phone{max-width:none;max-height:none;border-radius:0;border:0;box-shadow:none} }

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface-2);border-bottom:1.5px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-style:italic;font-size:25px;letter-spacing:.02em;text-transform:uppercase;line-height:1;color:var(--ink)}
.logo span{color:var(--coin)}
.top-title{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:6px;border:0;background:var(--surface-3);display:grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:var(--rival);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.coin-chip{position:relative;display:flex;align-items:center;gap:6px;padding:4px 10px 3px 6px;border-radius:6px;background:var(--coin-soft);border:1.5px solid color-mix(in srgb,var(--coin) 45%,transparent);color:var(--coin-ink);font-family:var(--font-score);font-weight:600;font-size:23px;line-height:1}
.coin-chip .coin{width:18px;height:18px;margin-top:-3px}
.coin-chip.bump{animation:bump .5s ease-out}
.coin-chip .delta{position:absolute;right:6px;top:100%;font-size:18px;font-weight:600;animation:rise 1.3s ease-out forwards;pointer-events:none}
.coin-chip .delta.neg{color:var(--loss)} .coin-chip .delta.pos{color:var(--win)}
@keyframes bump{40%{transform:scale(1.12)}}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(14px)}}
.coin{width:20px;height:20px;flex:none}

/* ---------- contenido ---------- */
.view{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.view>*{flex-shrink:0}
.section{display:flex;flex-direction:column;gap:10px}
.h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h h2{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;text-wrap:balance}
.h h2::before{content:"";width:12px;height:12px;background:var(--coin);clip-path:var(--para);flex:none}
.link{color:var(--brand);font-weight:700;font-size:14px;background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:14px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2)}

/* ---------- billetera ---------- */
.wallet{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);clip-path:var(--cut-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.wallet::after{content:"";position:absolute;inset:0 0 0 55%;background:repeating-linear-gradient(-60deg,color-mix(in srgb,var(--coin) 14%,transparent) 0 10px,transparent 10px 22px);mask-image:linear-gradient(90deg,transparent,#000);-webkit-mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}
.wallet>*{position:relative;z-index:1}
.wallet .label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.wallet .amount{display:flex;align-items:center;gap:10px;font-family:var(--font-score);font-weight:600;font-size:84px;line-height:.78;padding-top:8px;color:var(--coin);text-shadow:0 0 28px color-mix(in srgb,var(--coin) 45%,transparent)}
.wallet .amount .coin{width:40px;height:40px;margin-top:-10px}
.wallet .meta{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;clip-path:var(--para);background:var(--hero-line);font-size:13px;font-weight:600}
.hchip svg{width:14px;height:14px}
.hchip b{font-weight:800}
.wallet details{font-size:12.5px;color:var(--hero-muted)}
.wallet summary{cursor:pointer;font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px}
.wallet summary::-webkit-details-marker{display:none}
.wallet summary svg{width:14px;height:14px}
.wallet details p{margin:6px 0 0}

/* acciones grandes */
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;clip-path:var(--cut);border:0;background:var(--surface-3);text-align:left;font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.big .ic{width:40px;height:40px;clip-path:var(--cut-sm);display:grid;place-items:center;background:var(--brand);color:var(--on-brand)}
.big .ic svg{width:22px;height:22px}
.big small{display:block;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:4px}
.big.gold{background:var(--coin);color:var(--on-coin)}
.big.gold .ic{background:var(--on-coin);color:var(--coin)}
.big.gold small{color:var(--on-coin);opacity:.8}

/* misiones */
.earn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.earn-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface)}
.earn-btn b{font-size:15px}
.earn-btn .plus{display:flex;align-items:center;gap:5px;font-family:var(--font-score);font-weight:600;font-size:36px;line-height:.8;padding-top:4px;color:var(--coin)}
.earn-btn .plus .coin{width:18px;height:18px;margin-top:-4px}
.earn-btn[disabled]{cursor:default;background:var(--surface-2)}
.earn-btn[disabled] .plus{color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:14px;height:7px;clip-path:var(--para);background:var(--surface-3)}
.pips i.on{background:var(--coin)}
.short{display:flex;align-items:center;gap:10px;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.short .em{width:38px;height:38px;clip-path:var(--cut-sm);display:grid;place-items:center;font-size:20px;background:var(--surface-3);flex:none}
.short span{display:flex;flex-direction:column;min-width:0}
.short b{font-size:14.5px}

/* ---------- íconos de juego y avatares ---------- */
.gt{width:44px;height:44px;clip-path:var(--cut-sm);display:grid;place-items:center;font-size:23px;line-height:1;flex:none;color:#fff}
.gt.online{background:linear-gradient(145deg,var(--g1),color-mix(in srgb,var(--g1) 55%,#000))}
.gt.pc{background:linear-gradient(145deg,var(--g2),color-mix(in srgb,var(--g2) 55%,#000))}
.gt.fisico{background:linear-gradient(145deg,var(--g3),color-mix(in srgb,var(--g3) 55%,#000))}
.gt.movil{background:linear-gradient(145deg,var(--g4),color-mix(in srgb,var(--g4) 55%,#000))}
.gt.sm{width:34px;height:34px;font-size:18px}
.gt.lg{width:56px;height:56px;font-size:30px}
.avatar{--avc:var(--av0);width:38px;height:42px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;flex:none;text-transform:uppercase;position:relative;isolation:isolate}
.avatar::before{content:"";position:absolute;inset:0;background:var(--avc);clip-path:var(--hex);z-index:-1}
.av0{--avc:var(--av0)} .av1{--avc:var(--av1)} .av2{--avc:var(--av2)} .av3{--avc:var(--av3)} .av4{--avc:var(--av4)} .av5{--avc:var(--av5)}
.avatar.me{--avc:var(--coin);color:var(--on-coin)}
.avatar.xs{width:20px;height:22px;font-size:9px}
.avatar.lg{width:56px;height:62px;font-size:19px}
.avatar.xl{width:74px;height:82px;font-size:25px}
.flame{position:absolute;right:-6px;bottom:-2px;min-width:20px;height:20px;padding:0 4px;border-radius:4px;background:var(--rival);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}

/* ---------- listas de desafíos ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface)}
.ch-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ch-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-who{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--muted)}
.ch-who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.stake{display:flex;align-items:center;gap:4px;font-family:var(--font-score);font-weight:600;font-size:24px;line-height:.8;padding-top:3px;color:var(--coin-ink)}
.stake .coin{width:16px;height:16px;margin-top:-4px}
.sub-h{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-top:4px}

.warn-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;clip-path:var(--para);background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.warn-tag.bad{background:var(--loss-soft);color:var(--loss)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;clip-path:var(--para);font-family:var(--font-display);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.pill::before{content:"";width:6px;height:6px;background:currentColor}
.pill.pendiente{background:var(--warn-soft);color:var(--warn)}
.pill.en_juego,.pill.aceptado{background:var(--brand-soft);color:var(--brand)}
.pill.resultado_reportado{background:var(--coin-soft);color:var(--coin-ink)}
.pill.finalizado{background:var(--win-soft);color:var(--win)}
.pill.en_disputa{background:var(--loss-soft);color:var(--loss)}
.pill.cancelado{background:var(--surface-3);color:var(--muted)}
.pill.toca{background:var(--coin);color:var(--on-coin)}
.pill.toca::before{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface-3);color:var(--muted)}

/* tarjeta de reto entrante */
.incoming{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:6px;border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--coin),var(--rival)) border-box}
.incoming .top-row{display:flex;align-items:center;gap:12px}
.incoming .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.incoming .txt b{font-size:16px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;clip-path:var(--cut-sm);border:0;background:var(--surface-3);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--coin);color:var(--on-coin)}
.btn.danger{background:var(--loss-soft);color:var(--loss)}
.btn.win{background:var(--win);color:var(--on-win)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.xl{min-height:56px;font-size:17px;clip-path:var(--cut)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 120px}

.seg{display:flex;padding:4px;border-radius:6px;background:var(--surface-2);border:1.5px solid var(--line);gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;clip-path:var(--cut-sm);font-family:var(--font-display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.seg .count{min-width:20px;height:20px;padding:0 6px;border-radius:3px;background:var(--surface-3);color:var(--ink);font-size:11px;display:grid;place-items:center}
.seg button[aria-pressed="true"] .count{background:var(--on-brand);color:var(--brand)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;clip-path:var(--cut-sm);border:0;background:var(--surface-3);font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* ---------- asistente de nuevo desafío ---------- */
.wiz{display:flex;gap:6px}
.wiz button{flex:1;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.wiz button i{display:block;height:6px;clip-path:var(--para);background:var(--surface-3)}
.wiz button.done i{background:var(--brand)} .wiz button.done{color:var(--ink)}
.wiz button.now i{background:var(--coin);box-shadow:0 0 12px var(--coin)} .wiz button.now{color:var(--coin)}
.wiz button[disabled]{cursor:default}
.q{margin:0;font-family:var(--font-display);font-weight:700;font-style:italic;font-size:30px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.foot{display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface-2);border-top:1.5px solid var(--line)}
.foot .btn{flex:1}
.foot .btn.back{flex:0 0 auto}
.foot:empty{display:none}

.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.gcard b{font-size:14.5px;line-height:1.2}
.gcard .small{line-height:1.25}
.gcard[aria-pressed="true"],.fcard[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:var(--glow-brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.check{position:absolute;top:10px;right:10px;width:22px;height:22px;clip-path:var(--cut-sm);background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.check svg{width:13px;height:13px}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);text-align:center;min-width:0}
.fcard b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .check{top:6px;right:6px}

.amount-pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 14px 16px;clip-path:var(--cut);background:var(--coin-soft);color:var(--coin-ink)}
.amount-pick .val{display:flex;align-items:center;gap:8px;font-family:var(--font-score);font-weight:600;font-size:80px;line-height:.78;padding-top:10px;color:var(--coin);text-shadow:0 0 24px color-mix(in srgb,var(--coin) 40%,transparent)}
.amount-pick .val .coin{width:36px;height:36px;margin-top:-10px}
.amount-pick .win-line{font-weight:700;font-size:14px}
.stakes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stakes .chip{justify-content:center;padding:10px 0 6px;font-family:var(--font-score);font-size:28px;font-weight:600;line-height:.9}
.stakes .chip[disabled]{opacity:.3;cursor:not-allowed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface)}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column}
.opt-main .small{line-height:1.3}
.opt.col{flex-direction:column;align-items:flex-start;gap:4px}
.opt.col b{font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.opt.col[data-h="1"] b{color:var(--rival)}

.recap{display:flex;flex-direction:column}
.recap .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1.5px solid var(--line);font-size:14.5px}
.recap .r:last-child{border-bottom:0}
.recap .r span{color:var(--muted)}
.recap .r b{display:flex;align-items:center;gap:8px;text-align:right}

.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;clip-path:var(--cut-sm);background:var(--coin-soft);color:var(--coin-ink);font-weight:700}
.summary b{display:flex;align-items:center;gap:6px;font-family:var(--font-score);font-size:38px;font-weight:600;line-height:.8;padding-top:5px;color:var(--coin)}
.summary b .coin{width:20px;height:20px;margin-top:-5px}
.err{color:var(--loss);font-size:13px;font-weight:700}

/* ---------- tarjeta VS ---------- */
.vs-card{position:relative;overflow:hidden;clip-path:var(--cut-lg);padding:16px 14px 18px;background:linear-gradient(112deg,color-mix(in srgb,var(--brand) 30%,#0A0820) 0 calc(50% - 2px),var(--coin) calc(50% - 2px) calc(50% + 2px),color-mix(in srgb,var(--rival) 30%,#0A0820) calc(50% + 2px) 100%);color:var(--hero-ink);display:flex;flex-direction:column;gap:16px}
.vs-card::before{content:"VS";position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) skewX(-8deg);font-family:var(--font-score);font-weight:700;font-size:190px;line-height:.75;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--coin) 45%,transparent);pointer-events:none}
.vs-top{position:relative;display:flex;align-items:center;gap:10px}
.vs-top .t{flex:1;min-width:0;display:flex;flex-direction:column}
.vs-top .t b{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-top .t span{font-size:12.5px;color:var(--hero-muted)}
.hot{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;clip-path:var(--para);background:var(--rival);color:#fff;font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.vs{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.vs .who{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.vs .who b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.vs .who:first-child b{color:var(--brand)} .vs .who:last-child b{color:var(--rival)}
.pot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px 8px;clip-path:var(--cut-sm);background:rgba(4,3,12,.78)}
.pot .lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.pot .big-n{display:flex;align-items:center;gap:6px;font-family:var(--font-score);font-weight:600;font-size:50px;color:var(--coin);line-height:.78;padding-top:6px;text-shadow:0 0 18px color-mix(in srgb,var(--coin) 50%,transparent)}
.pot .big-n .coin{width:24px;height:24px;margin-top:-6px}
.tier{font-family:var(--font-display);font-size:11px;font-weight:700;padding:2px 9px;clip-path:var(--para);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tier.Bronce{background:#D07A3C;color:#1A0B00} .tier.Plata{background:#CBD5E3;color:#121A24} .tier.Oro{background:#FFC400;color:#1D1400} .tier.Platino{background:#2EE6C8;color:#002019} .tier.Diamante{background:#A387FF;color:#12082E}

/* progreso del desafío */
.track{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.track::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:3px;background:var(--surface-3)}
.track .bar-fill{position:absolute;left:10%;top:13px;height:3px;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.tk{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center}
.tk i{width:29px;height:29px;clip-path:var(--cut-sm);display:grid;place-items:center;background:var(--surface-3);font-style:normal;font-size:13px}
.tk i svg{width:14px;height:14px}
.tk.done i{background:var(--brand);color:var(--on-brand)}
.tk.done{color:var(--ink)}
.tk.now i{background:var(--coin);color:var(--on-coin)}
.tk.now{color:var(--coin)}
.tk.bad i{background:var(--loss);color:#fff}

/* tarjeta "próximo paso" */
.next{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);border-top:4px solid var(--brand)}
.next .eyebrow{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.next .ttl{font-family:var(--font-display);font-weight:700;font-style:italic;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.next p{margin:0;color:var(--muted);font-size:14px}
.next.warn{border-top-color:var(--coin)} .next.warn .eyebrow{color:var(--coin)}
.next.good{border-top-color:var(--win);background:linear-gradient(180deg,var(--win-soft),var(--surface))} .next.good .eyebrow,.next.good .ttl{color:var(--win)}
.next.good .ttl{text-shadow:0 0 22px color-mix(in srgb,var(--win) 45%,transparent)}
.next.bad{border-top-color:var(--loss)} .next.bad .eyebrow{color:var(--loss)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;clip-path:var(--cut-sm);border:0;background:var(--surface-3);font-family:var(--font-display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:16px}
.pick .e{font-size:26px;line-height:1}
.pick.win{background:var(--win);color:var(--on-win)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:var(--surface-2);font-size:14px;font-weight:600}
.checklist .ok-ic{width:22px;height:22px;clip-path:var(--cut-sm);display:grid;place-items:center;background:var(--surface-3);color:transparent;flex:none}
.checklist .ok-ic svg{width:12px;height:12px}
.checklist .yes .ok-ic{background:var(--win);color:var(--on-win)}
.checklist .state{margin-left:auto;font-size:12.5px;color:var(--muted)}
.alert{padding:12px 14px;border-radius:4px;font-size:14px;display:flex;flex-direction:column;gap:4px;border-left:4px solid currentColor}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--loss-soft);color:var(--loss)}
.alert.good{background:var(--win-soft);color:var(--win)}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.alert span{color:var(--ink);opacity:.85}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:4px;border:1.5px dashed var(--brand);background:var(--brand-soft);font-weight:700;color:var(--brand);cursor:pointer}
.drop svg{width:20px;height:20px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border-radius:4px;background:var(--surface-2);border:1.5px solid var(--line)}

/* plegables */
.fold{border-radius:6px;background:var(--surface);border:1.5px solid var(--line)}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:700}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.fold[open]>summary .chev{transform:rotate(180deg)}
.fold>summary .ic{width:30px;height:30px;clip-path:var(--cut-sm);display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.fold>summary .ic svg{width:17px;height:17px}
.fold>summary .aside{font-weight:600;font-size:13px;color:var(--muted)}
.fold .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}

.demo{border:1.5px dashed var(--demo);background:var(--demo-soft);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px}
.demo-t{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--demo)}
.demo .btn{min-height:40px;font-size:13px;background:var(--surface-3);color:var(--ink)}
.timeline{display:flex;flex-direction:column;padding-left:2px}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:12px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl b{width:10px;height:10px;background:var(--brand);margin-top:5px;transform:rotate(45deg)}
.tl:first-child b{background:var(--coin);box-shadow:0 0 10px var(--coin)}
.tl .t{display:flex;flex-direction:column;font-size:14px}

/* ---------- ranking ---------- */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .block{width:100%;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;gap:0}
.pod .block .n{font-family:var(--font-score);font-weight:700;font-size:50px;line-height:.75;padding-top:4px}
.pod .block .v{font-family:var(--font-score);font-weight:500;font-size:22px;line-height:1;opacity:.85}
.pod.p1 .block{height:112px;background:linear-gradient(180deg,var(--coin-hi),var(--coin));color:var(--on-coin)}
.pod.p2 .block{height:86px;background:linear-gradient(180deg,#E3E9F2,#9AA7BA);color:#10161F}
.pod.p3 .block{height:68px;background:linear-gradient(180deg,#E79A5E,#B4652C);color:#1A0B00}
.pod.me b{color:var(--coin)}
.crown{color:var(--coin);height:18px;filter:drop-shadow(0 0 8px var(--coin))}
.crown svg{width:22px;height:18px}
.board{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row.me{background:var(--coin-soft);border-radius:4px;padding-inline:8px;border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--coin)}
.row .pos{font-family:var(--font-score);font-weight:600;font-size:28px;line-height:.8;padding-top:4px;color:var(--muted);text-align:center}
.row .who{display:flex;align-items:center;gap:10px;min-width:0}
.row .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.elo{font-family:var(--font-score);font-weight:600;font-size:30px;line-height:.8;padding-top:4px}
.mypos{display:flex;align-items:center;gap:14px;padding:14px 16px;clip-path:var(--cut);background:var(--brand);color:var(--on-brand)}
.mypos .n{font-family:var(--font-score);font-weight:700;font-size:64px;line-height:.75;padding-top:8px}
.mypos span{display:flex;flex-direction:column;font-size:13.5px;font-weight:600}
.mypos b{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.03em}

/* ---------- matchmaking ---------- */
.radar{position:relative;width:210px;height:210px;margin:4px auto 0;display:grid;place-items:center}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ping 2.4s ease-out infinite;box-shadow:0 0 18px -4px var(--brand)}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar .core{width:100px;height:110px;clip-path:var(--hex);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--font-score);font-weight:600;font-size:42px;line-height:.8;padding-top:6px;position:relative}
@keyframes ping{0%{transform:scale(.45);opacity:.8}100%{transform:scale(1);opacity:0}}
.window{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--brand) 40%,transparent);border-inline:2px solid var(--brand);transition:left .5s,right .5s}
.bar u{position:absolute;top:-2px;bottom:-2px;width:3px;left:50%;background:var(--coin);margin-left:-1px}
.bar.fill i{left:0;border:0;background:var(--coin);box-shadow:0 0 10px var(--coin)}

/* ---------- perfil ---------- */
.me-head{display:flex;gap:14px;align-items:center}
.ring{--p:100;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ring-c,var(--win)) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ring-c,var(--win)) 40%,transparent))}
.ring>span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font-family:var(--font-score);font-size:40px;font-weight:600;line-height:.75;padding-top:5px}
.ring small{font-family:var(--font-display);font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.trust-card{display:flex;align-items:center;gap:14px}
.trust-card .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.trust-card .txt b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line)}
.stat .elo{font-size:42px;line-height:.75;color:var(--brand)}
.stat span{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.rk>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.rk .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .elo{font-size:30px;line-height:.8}
.mov{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1.5px solid var(--line);font-size:14px}
.mov:last-child{border-bottom:0}
.mov .amt{font-weight:800;text-align:right}
.mov .amt.pos{color:var(--win)} .mov .amt.neg{color:var(--loss)}
.mov .small{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{height:48px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%}
.input:focus{border-color:var(--brand);outline:none;box-shadow:var(--glow-brand)}

/* ---------- tienda y temporada ---------- */
.prod{display:flex;flex-direction:column;gap:10px}
.prod .top-row{display:flex;align-items:center;gap:12px}
.prod .em{width:48px;height:48px;clip-path:var(--cut-sm);display:grid;place-items:center;font-size:26px;background:var(--coin-soft);flex:none}
.prod .ch-main b{white-space:normal}
.voucher{border:1.5px dashed var(--coin);background:var(--coin-soft);color:var(--coin-ink);border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.voucher b{font-family:var(--font-display);font-size:20px;letter-spacing:.08em}
.prize{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:18px;clip-path:var(--cut-lg);background:repeating-linear-gradient(-60deg,transparent 0 14px,rgba(0,0,0,.08) 14px 28px),linear-gradient(135deg,var(--coin-hi),var(--coin));color:var(--on-coin)}
.prize .eyebrow{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.prize b{font-family:var(--font-display);font-style:italic;font-size:28px;font-weight:700;line-height:1.05;text-transform:uppercase}
.prize .trophy{position:absolute;right:-8px;bottom:-14px;opacity:.18}
.prize .trophy svg{width:120px;height:120px}
.stage-n{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--coin)}
.banner{padding:10px 12px;border-radius:4px;background:var(--demo-soft);color:var(--demo);border:1.5px dashed var(--demo);display:flex;flex-direction:column;gap:2px;font-size:13px}

/* ---------- barra de pestañas ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-top:1.5px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--muted);font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"]:not(.play)::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:3px;background:var(--coin);color:var(--on-coin);font-size:10px;font-weight:800;display:grid;place-items:center}
.tab.play .disc{width:46px;height:46px;margin:-24px 0 4px;border-radius:6px;transform:rotate(45deg);background:var(--coin);color:var(--on-coin);display:grid;place-items:center;border:4px solid var(--surface-2);box-shadow:0 0 22px -4px var(--coin)}
.tab.play .disc svg{transform:rotate(-45deg)}
.tab.play[aria-current="page"] .disc{background:var(--brand);color:var(--on-brand);box-shadow:0 0 22px -4px var(--brand)}

/* ---------- hoja inferior ---------- */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(3,2,10,.72)}
.panel{background:var(--surface);border-top:3px solid var(--brand);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:up .22s ease-out;box-shadow:0 -10px 40px -10px color-mix(in srgb,var(--brand) 40%,transparent)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.panel h3{margin:0;font-family:var(--font-display);font-weight:700;font-style:italic;font-size:24px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.grab{width:40px;height:4px;background:var(--line);margin:-6px auto 0}
.sigbox{padding:12px 14px;border-radius:4px;background:var(--surface-2);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:14px}
.finger{width:128px;height:128px;margin:4px auto;border-radius:50%;border:2px solid var(--brand);background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);box-shadow:0 0 30px -8px var(--brand)}
.finger svg{width:64px;height:64px}
.finger.scan{animation:scan .9s ease-in-out}
.finger.ok{color:var(--win);border-color:var(--win);background:var(--win-soft);box-shadow:0 0 30px -6px var(--win)}
@keyframes scan{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 50%,transparent)}50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--brand) 0%,transparent)}}

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = $('fx'), cols = ['var(--coin)','var(--coin-hi)','var(--g1)','var(--g3)','var(--g4)','var(--g5)'];
  let html = '';
  for (let i = 0; i < 70; i++){
    html += `<i style="left:${Math.random()*100}%;background:${cols[i % cols.length]};--x:${(Math.random()-.5)*160}px;--r:${360 + Math.random()*540}deg;--d:${1.2 + Math.random()*1.1}s;animation-delay:${Math.random()*.35}s;width:${6 + Math.random()*5}px"></i>`;
  }
  fx.innerHTML = html;
  setTimeout(() => { fx.innerHTML = ''; }, 2900);
}

function eloUpdate(game, rival, score, k = K){
  const ra = S.ratings[game], rb = S.players[rival].r[game];
  const ea = 1/(1 + Math.pow(10, (rb - ra)/400));
  const d = Math.round(k*(score - ea));
  S.ratings[game] = ra + d; S.players[rival].r[game] = rb - d;
  return d;
}

  const R = S.players[c.rival], rs = R.streak || 0;
  if (my === 'gane'){
    S.streak = (S.streak || 0) + 1; R.streak = 0; S.sxp += 30;
    if (rs >= 3){ post('recompensa', bountyOf(rs), c.id); ev(c, `Cortaste la racha de ${rs} victorias de @${c.rival}: cobraste ${fmt(bountyOf(rs))} monedas de recompensa`); }
    if (S.streak >= 3) ev(c, `Racha de ${S.streak} victorias: ahora hay ${fmt(bountyOf(S.streak))} monedas de recompensa para quien te gane`);
  } else if (my === 'perdi'){ S.streak = 0; R.streak = rs + 1; S.sxp += 5; }
  else { S.sxp += 10; }
}
function finalize0(c, my, via){
  if (my === 'gane') post('pago', 2*c.stake, c.id);
  else if (my === 'empate' || my === 'anulado') post('devolucion', c.stake, c.id);
  c.myLocked = false;
  c.result = my;
  if (my === 'anulado'){ c.status = 'cancelado'; c.cancelReason = 'Partida anulada'; ev(c, 'Partida anulada: se devolvieron las monedas a los dos'); return; }
  c.status = 'finalizado';
  const d = eloUpdate(c.game, c.rival, my === 'gane' ? 1 : my === 'empate' ? .5 : 0, c.hot ? K*2 : K);
  c.eloDelta = d;
  const elo = 'ELO ' + (d >= 0 ? '+' : '') + d;
  if (my === 'gane') ev(c, `${via}: ganaste. Cobraste ${fmt(2*c.stake)} monedas · ${elo}`);
  else if (my === 'empate') ev(c, `${via}: empate. Se devolvieron ${fmt(c.stake)} monedas a cada uno · ${elo}`);
  else ev(c, `${via}: ganó @${c.rival} · ${elo}`);
  notify(my === 'gane' ? `Ganaste ${fmt(2*c.stake)} monedas contra @${c.rival}` : my === 'empate' ? `Empate con @${c.rival}: recuperaste tus monedas` : `@${c.rival} ganó el desafío de ${GAMES[c.game].name}`, c.id);
}
function refundCancel(c, reason, text){
  if (c.myLocked) post('devolucion', c.stake, c.id);
  c.myLocked = false; c.status = 'cancelado'; c.cancelReason = reason; c.cancelReq = null;
  ev(c, text);
}

const WIZ = ['Juego', 'Rival', 'Monto', 'Confirmar'];
function vNuevo(){
  const d = S.draft, bal = balance(), vis = S.mode === 'vision';
  const games = avail(d.cat);
  if (!games.includes(d.game)){ d.game = games[0]; d.fmt = GAMES[d.game].modes[0]; }
  if (d.stake > maxStake()) d.stake = maxStake();
  if (d.step == null) d.step = 0;
  const step = d.step, n = teamSize(d.fmt), modes = GAMES[d.game].modes;
  const friends = Object.entries(S.players).filter(([,p]) => p.friend);
  const reach = i => i === 0 || (i === 1) || (i >= 2 && d.rival);
  const wiz = `<div class="wiz" role="list">${WIZ.map((l, i) => `<button role="listitem" class="${i < step ? 'done' : i === step ? 'now' : ''}" data-a="d-goto" data-s="${i}" ${i <= step || reach(i) ? '' : 'disabled'} ${i === step ? 'aria-current="step"' : ''}><i></i>${i+1}. ${l}</button>`).join('')}</div>`;
  let body = '';
  if (step === 0){
    body = `<h2 class="q">¿A qué juegan?</h2>
      <div class="chips scroll">${Object.entries(CATS).map(([k, l]) => `<button class="chip" data-a="d-cat" data-c="${k}" aria-pressed="${d.cat === k}"><span aria-hidden="true">${CAT_ICO[k]}</span>${l}</button>`).join('')}</div>
      <div class="games">${games.map(g => `<button class="gcard" data-a="d-game" data-g="${g}" aria-pressed="${d.game === g}">${d.game === g ? `<span class="check">${ICONS.check}</span>` : ''}${gt(g)}<b>${GAMES[g].name}</b><span class="muted small">${GAMES[g].modes.join(' · ')}${GAMES[g].inapp ? ' · se juega en la app' : ''}</span>${tosTag(g)}</button>`).join('')}</div>
      ${vis ? '' : '<span class="muted small">Valorant, CS2, League of Legends, Fortnite, Clash Royale y Brawl Stars no aparecen porque sus editores prohíben apostar sobre sus partidas. Se ven en el modo visión.</span>'}`;
  } else if (step === 1){
    body = `<h2 class="q">${n > 1 ? '¿Quién es el capitán rival?' : '¿A quién retás?'}</h2>
      <div class="friends">${friends.map(([u,p]) => `<button class="fcard" data-a="d-rival" data-u="${esc(u)}" aria-pressed="${d.rival === u}">${d.rival === u ? `<span class="check">${ICONS.check}</span>` : ''}<span class="avatar ${avc(u)} lg">${initials(u)}${(p.streak || 0) >= 3 ? `<span class="flame">${p.streak}</span>` : ''}</span><b>@${esc(u)}</b><span class="tier ${tierOf(p.r[d.game])}">${tierOf(p.r[d.game])}</span></button>`).join('')}</div>
      ${friends.some(([,p]) => (p.streak || 0) >= 3) ? '<span class="muted small">El número rojo es su racha de victorias: si le ganás, cobrás una recompensa extra.</span>' : ''}`;
  } else if (step === 2){
    body = `<h2 class="q">¿Cuánto ponen?</h2>
      <div class="amount-pick"><span class="small" style="font-weight:700">${n > 1 ? 'Cada jugador pone' : 'Vos ponés'}</span><span class="val num">${coinSvg}${fmt(d.stake)}</span><span class="win-line num">Si ganás te llevás ${fmt(d.stake*2)}</span></div>
      <div class="stakes">${STAKES.map(s => `<button class="chip num" data-a="d-stake" data-s="${s}" aria-pressed="${d.stake === s}" ${s > maxStake() ? 'disabled' : ''}>${s}</button>`).join('')}</div>
      <span class="muted small num">Tenés ${fmt(bal)} monedas disponibles.</span>
      ${maxStake() < 250 ? `<div class="alert warn"><span>Tu confianza es ${S.trust}/100, así que el monto máximo es ${maxStake()}. Sube de nuevo con duelos sin disputas.</span></div>` : ''}
      ${d.stake > bal ? '<div class="err">No te alcanzan las monedas para ese monto.</div>' : ''}
      ${modes.length > 1 ? `<div class="section"><div class="h"><h2>Formato</h2></div><div class="chips">${modes.map(m => `<button class="chip" data-a="d-fmt" data-f="${m}" aria-pressed="${d.fmt === m}">${m}</button>`).join('')}</div></div>` : ''}
      <div class="section"><div class="h"><h2>Intensidad</h2></div>
        <div class="duo">
          <button class="opt col" data-a="d-hot" data-h="0" aria-pressed="${!d.hot}"><b>Normal</b><span class="muted small">El ELO se mueve lo de siempre</span></button>
          <button class="opt col" data-a="d-hot" data-h="1" aria-pressed="${!!d.hot}"><b>Duelo caliente</b><span class="muted small">Ganás o perdés el doble de ELO</span></button>
        </div></div>`;
  } else {
    body = `<h2 class="q">Revisá y enviá</h2>
      ${vsCard({ game:d.game, rival:d.rival, stake:d.stake, fmt:d.fmt, hot:d.hot }, 'Entre amigos · ' + gsub(d.game))}
      <div class="card recap">
        <div class="r"><span>Juego</span><b>${GAMES[d.game].name}${d.fmt !== '1v1' ? ' · ' + d.fmt : ''} <button class="link small" data-a="d-goto" data-s="0">Cambiar</button></b></div>
        <div class="r"><span>Rival</span><b>@${esc(d.rival)} <button class="link small" data-a="d-goto" data-s="1">Cambiar</button></b></div>
        <div class="r"><span>Ponés</span><b class="num">${fmt(d.stake)}${n > 1 ? ' c/u' : ''} · ${d.hot ? 'caliente' : 'normal'} <button class="link small" data-a="d-goto" data-s="2">Cambiar</button></b></div>
      </div>
      ${GAMES[d.game].idp ? (myId(GAMES[d.game].idp) ? `<div class="card recap"><div class="r"><span>Tu ${PLAT[GAMES[d.game].idp].name}</span><b>${esc(myId(GAMES[d.game].idp))} <button class="link small" data-a="unlink-id" data-p="${GAMES[d.game].idp}">Cambiar</button></b></div></div>` : idField(GAMES[d.game].idp)) : ''}
      <div class="summary"><span>Si ganás te llevás</span><b class="num">${coinSvg}${fmt(d.stake*2)}</b></div>
      ${GAMES[d.game].tos === 'no' && S.mode !== 'vision' ? `<div class="alert bad"><b>${GAMES[d.game].pub} prohíbe apostar sobre sus partidas</b><span>Solo visible en el modo visión. Para ofrecerlo de verdad haría falta un acuerdo con el editor.</span></div>` : ''}
      <p class="muted small" style="margin:0">${n > 1 ? `Formato ${d.fmt}: cada uno de los ${n*2} jugadores pone ${fmt(d.stake)} (pozo de ${fmt(d.stake*2*n)}). Cada integrante del equipo ganador se lleva ${fmt(d.stake*2)}. Tus compañeros se suman con un link. ` : ''}Al enviar se bloquean tus ${fmt(d.stake)} monedas. Si no aceptan en 48 h, vuelven a tu saldo. Comisión: 0%.</p>
      ${d.stake > bal ? '<div class="err">No te alcanzan las monedas para ese monto.</div>' : ''}`;
  }
  return wiz + body;
}
function nuevoFoot(){
  const d = S.draft, step = d.step || 0, over = d.stake > balance();
  const back = step > 0 ? `<button class="btn back" data-a="d-prev" aria-label="Paso anterior">${ICONS.back}</button>` : '';
  if (step === 3) return back + `<button class="btn gold xl" data-a="create" ${!d.rival || over || idMissing(d.game) ? 'disabled' : ''}>${idMissing(d.game) ? 'Vinculá tu cuenta para enviar' : 'Firmar y enviar reto'}</button>`;
  const ok = step === 1 ? !!d.rival : step === 2 ? !over : true;
  const label = step === 1 && !d.rival ? 'Elegí un rival' : 'Siguiente';
  return back + `<button class="btn primary xl" data-a="d-next" ${ok ? '' : 'disabled'}>${label}</button>`;
}

function startBlock(c){
  if (!needsCheckin(c)) return `<button class="btn primary block" data-a="start">Empezamos a jugar</button>`;
  const k = c.checkin || {};
  const row = (ok, who) => `<div class="${ok ? 'yes' : ''}"><span class="ok-ic">${ICONS.check}</span>${who}<span class="state">${ok ? 'Listo' : 'Pendiente'}</span></div>`;
  return `<b>Check-in en la mesa</b><span class="muted small">Los dos escanean el QR de la mesa y confirman ubicación antes de empezar.</span>
    <div class="checklist">${row(k.me, 'Vos')}${row(k.rival, '@' + esc(c.rival))}</div>`
    + (k.me ? '' : `<button class="btn primary block" data-a="checkin">Escanear QR y confirmar ubicación</button>`)
    + (k.me ? `<button class="btn primary block" data-a="start" ${k.me && k.rival ? '' : 'disabled'}>${k.rival ? 'Empezamos a jugar' : 'Esperando el check-in de @' + esc(c.rival)}</button>` : '');
}
function evidenceBlock(c){
  const files = (c.evidence || []).map(f => `<div class="file"><span class="tag">Archivo</span><span>${esc(f)}</span></div>`).join('');
  return `${files}<label class="drop" for="ev-in">${ICONS.upload}Subir foto o video del resultado</label>
    <input id="ev-in" class="sr" type="file" accept="image/*,video/*" data-id="${c.id}">`;
}

function vDetalle(c){
  const g = GAMES[c.game];
  const idx = FLOW.indexOf(c.status);
  const reached = c.status === 'en_disputa' ? 3 : c.status === 'cancelado' ? -1 : idx;
  const steps = FLOW.map((s, i) => {
    let cls = '', mark = i + 1;
    if (c.status === 'en_disputa'){ cls = i < 3 ? 'done' : i === 3 ? 'bad' : ''; }
    else if (c.status === 'finalizado'){ cls = 'done'; }
    else cls = i < idx ? 'done' : i === idx ? 'now' : '';
    if (cls === 'done') mark = ICONS.check;
    if (cls === 'bad') mark = '!';
    return `<div class="tk ${cls}"><i>${mark}</i>${STEP_LBL[s]}</div>`;
  }).join('');
  const fillPct = reached <= 0 ? 0 : (reached / 4) * 80;
  const rival = '@' + esc(c.rival);
  let st = { tone:'info', eye:'', title:'', text:'' }, acts = '', demo = '', extra = '';

  if (c.status === 'pendiente' && !c.mine){
    st = { tone:'warn', eye:'Te toca', title:`${rival} te retó`, text:`Si aceptás, se bloquean ${fmt(c.stake)} de tus monedas hasta que termine. Si ganás te llevás ${fmt(c.stake*2)}.` };
    const needP = idMissing(c.game);
    acts = (needP ? idField(g.idp) : '') + `<div class="btn-row"><button class="btn gold xl" data-a="accept" ${needP ? 'disabled' : ''}>Aceptar</button><button class="btn xl" data-a="reject">Rechazar</button></div>`;
  } else if (c.status === 'pendiente'){
    st = { tone:'warn', eye:'Esperando', title:`Esperando que ${rival} acepte`, text:`Tus ${fmt(c.stake)} monedas están bloqueadas. Si no responde en 48 h, vuelven a tu saldo.` };
    acts = `<button class="btn danger block" data-a="withdraw">Retirar el reto</button>`;
    demo = `<div class="btn-row"><button class="btn" data-a="sim-accept">${rival} acepta</button><button class="btn" data-a="sim-reject">${rival} rechaza</button></div>`;
  } else if (c.status === 'aceptado' || c.status === 'en_juego'){
    if (inApp(c)){
      const chess = GAMES[c.game].inapp === 'chess', started = !!c.play;
      st = c.status === 'aceptado'
        ? { tone:'info', eye:'Te toca', title:'¡A jugar!', text:`Se juega acá, dentro de la app: ${g.rules}. El resultado queda registrado solo.` }
        : { tone:'info', eye:'En juego', title: started ? 'Partida en pausa' : 'Partida lista', text: chess ? 'Volvé al tablero cuando quieras: el reloj se frena mientras no estás.' : 'Volvé a la partida cuando quieras: te espera tal cual la dejaste.' };
      acts = `<button class="btn gold block xl" data-a="play">${started ? 'Volver a la partida' : 'Jugar ahora'}</button><span class="small muted" style="text-align:center">En la demo, a ${rival} lo maneja la computadora.</span>`;
      demo = `<span class="small muted">Saltear la partida y simular el resultado:</span><div class="btn-row"><button class="btn" data-a="sim-lichess" data-r="gane">Ganaste</button><button class="btn" data-a="sim-lichess" data-r="perdi">Perdiste</button>${g.draw ? '<button class="btn" data-a="sim-lichess" data-r="empate">Tablas</button>' : ''}<button class="btn" data-a="sim-lichess" data-r="anulado">Abortada</button></div>`;
    } else if (g.idp && !c.manual){
      const P = PLAT[g.idp];
      if (c.status === 'aceptado'){
        st = { tone:'info', eye:'Te toca', title:'¡A jugar!', text:`Jueguen la partida en ${g.name} con estas cuentas. Al terminar, Challenge busca el resultado en ${P.src}: no hace falta reportar nada.` };
        acts = idsCard(c) + (myId(g.idp) ? '' : idField(g.idp)) + `<button class="btn primary block xl" data-a="start" ${myId(g.idp) ? '' : 'disabled'}>Empezamos a jugar</button>`;
      } else if (!c.verifying){
        st = { tone:'info', eye:'En juego', title:'¿Ya terminaron?', text:`Tocá el botón cuando termine la partida y Challenge la busca en ${P.src} con el ID de los dos.` };
        acts = idsCard(c) + `<button class="btn gold block xl" data-a="verify">Buscar el resultado</button>`;
      } else {
        st = { tone:'info', eye:'Verificando', title:'Buscando la partida…', text:`Revisando ${P.src} de ${esc(myId(g.idp))} y ${esc(rivalId(c.rival, g.idp))}. Suele tardar menos de un minuto.` };
        acts = '<div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>' + idsCard(c);
        demo = `<span class="small muted">Resultado que encuentra la verificación:</span><div class="btn-row"><button class="btn" data-a="sim-verify" data-r="gane">Ganaste</button><button class="btn" data-a="sim-verify" data-r="perdi">Perdiste</button>${g.draw ? '<button class="btn" data-a="sim-verify" data-r="empate">Empate</button>' : ''}<button class="btn" data-a="sim-verify" data-r="none">No aparece</button></div>`;
      }
    } else {
      st = c.status === 'aceptado'
        ? { tone:'info', eye:'Te toca', title:'¡A jugar!', text:`Los dos bloquearon ${fmt(c.stake)} monedas. Cuando terminen, cada uno reporta quién ganó.` }
        : { tone:'info', eye:'En juego', title:'¿Cómo salió?', text:'Reportá el resultado. Si los dos coinciden, se liquida al instante.' };
      acts = (c.status === 'aceptado' ? startBlock(c) : '') +
        `<span class="small muted" style="font-weight:700">${c.status === 'aceptado' ? '¿Ya terminaron? Reportá el resultado:' : 'Tocá el resultado (se firma):'}</span><div class="picks">
          <button class="pick win" data-a="report" data-r="gane"><span class="e" aria-hidden="true">🏆</span>Gané</button><button class="pick" data-a="report" data-r="perdi"><span class="e" aria-hidden="true">🫡</span>Perdí</button>${g.draw ? '<button class="pick" data-a="report" data-r="empate"><span class="e" aria-hidden="true">🤝</span>Empate</button>' : ''}</div>`;
    }
    if (needsCheckin(c) && c.status === 'aceptado' && !(c.checkin && c.checkin.rival)) demo += `<button class="btn" data-a="sim-checkin">${rival} hace el check-in</button>`;
    if (c.cancelReq){
      extra = `<div class="alert warn"><b>Pediste cancelar el desafío</b><span>Se cancela solo si ${rival} también lo confirma. Si no responde en 24 h, el pedido vence y el desafío sigue.</span></div>`;
      demo += `<div class="btn-row"><button class="btn" data-a="sim-cancel-ok">${rival} confirma la cancelación</button><button class="btn" data-a="sim-cancel-expire">Pasan 24 h sin respuesta</button></div>`;
    } else {
      acts += `<button class="link" data-a="cancel-req" style="align-self:center">Pedir cancelación</button>`;
    }
  } else if (c.status === 'resultado_reportado'){
    st = { tone:'info', eye:'Esperando', title:`Reportaste: ${OUT[c.myReport]}`, text:`Falta que ${rival} reporte. Si en 24 h no lo hace, tu reporte queda firme. Podés sumar una foto o video como prueba.` };
    acts = evidenceBlock(c);
    const opposite = { gane:'perdi', perdi:'gane', empate:'empate' }[c.myReport];
    demo = `<div class="btn-row"><button class="btn" data-a="sim-report" data-r="${opposite}">${rival} reporta lo mismo</button><button class="btn" data-a="sim-report" data-r="${c.myReport === 'gane' ? 'gane' : 'perdi'}">${rival} reporta otra cosa</button></div><button class="btn" data-a="sim-timeout">Pasan 24 h sin respuesta</button>`;
  } else if (c.status === 'en_disputa'){
    st = { tone:'bad', eye:'En revisión', title:'Desafío en disputa', text:`Vos reportaste "${OUT[c.myReport]}" y ${rival} reportó "${OUT[c.rivalReport]}". Las ${fmt(potOf(c))} monedas del pozo quedan retenidas hasta que un administrador revise la evidencia.` };
    acts = evidenceBlock(c);
    demo = `<button class="btn" data-a="go-admin">Abrir el panel de administración</button>`;
  } else if (c.status === 'finalizado'){
    const d = c.eloDelta || 0, elo = `ELO ${d >= 0 ? '+' : ''}${d} en ${g.name}`;
    st = c.result === 'gane' ? { tone:'good', eye:'Resultado', title:`¡Ganaste ${fmt(c.stake*2)} monedas!`, text:elo }
      : c.result === 'empate' ? { tone:'info', eye:'Resultado', title:'Empate', text:`Recuperaste tus ${fmt(c.stake)} monedas · ${elo}` }
      : { tone:'bad', eye:'Resultado', title:`Ganó ${rival}`, text:`${elo}. La próxima es tuya.` };
    acts = `<button class="btn gold block xl" data-a="rematch">Pedir revancha</button>`;
  } else if (c.status === 'cancelado'){
    st = { tone:'info', eye:'Cancelado', title: esc(c.cancelReason || 'Cancelado'), text:'Las monedas bloqueadas volvieron a cada jugador.' };
  }

  const a = assurance(c);
  const tosWarn = g.tos === 'no' && S.mode !== 'vision' ? `<div class="alert bad"><b>${g.pub} prohíbe apostar sobre sus partidas</b><span>En la app real, este juego quedaría sin monedas o deshabilitado hasta tener permiso del editor.</span></div>` : '';
  return `
  ${vsCard(c, `${c.origin === 'matchmaking' ? 'Matchmaking' : 'Entre amigos'} · ${gsub(c.game)}`)}
  ${c.status !== 'cancelado' ? `<div class="track"><span class="bar-fill" style="width:${fillPct}%"></span>${steps}</div>` : ''}
  ${tosWarn}
  <section class="next ${st.tone}">
    <span class="eyebrow">${st.eye}</span>
    <span class="ttl">${st.title}</span>
    <p>${st.text}</p>
    ${acts}
  </section>
  ${extra}
  ${demo ? `<div class="demo"><span class="demo-t">${ICONS.flask.replace('<svg', '<svg width="14" height="14"')}Simular al rival (solo demo)</span>${demo}</div>` : ''}
  ${fold('garantia', ICONS.shield, 'Garantía del duelo', 'Confianza ' + a.lvl, `<ul class="plain">${a.items.map(i => `<li>${i}</li>`).join('')}</ul><span class="muted small">Challenge custodia el pozo: nadie puede retirar su parte hasta que el resultado quede confirmado.</span>`)}
  ${fold('historial', ICONS.clock, 'Historial', String(c.events.length), `<div class="timeline">${c.events.slice().reverse().map(e => `<div class="tl"><b></b><span class="t"><span>${esc(e.text)}</span><span class="muted small">${ago(e.ts)}</span></span></div>`).join('')}</div>`)}`;
}

function vRanking(){
  const g = S.rankGame, cat = GAMES[g].cat;

  <p class="muted small" style="margin:0">Rangos: Bronce menos de 950 · Plata 950 · Oro 1100 · Platino 1250 · Diamante 1400. Todos arrancan en 1000.</p>`;
}

  const FILES = 'abcdefgh';

  const on = (r, f) => r >= 0 && r < 8 && f >= 0 && f < 8;
  const sqName = i => FILES[i & 7] + (8 - (i >> 3));
  const kingSq = (b, c) => b.indexOf(c === 'w' ? 'K' : 'k');

  function init(){

/* ---------- cuatro en línea (vos con fichas cian, la computadora con magenta) ---------- */
const C4 = (() => {
  const W = 7, H = 6, ORDER = [3, 2, 4, 1, 5, 0, 6];
  const LINES = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const cells = [];
    for (let k = 0; k < 4; k++){ const rr = r + dr*k, cc = c + dc*k; if (rr < 0 || rr >= H || cc < 0 || cc >= W) break; cells.push(rr*W + cc); }
    if (cells.length === 4) LINES.push(cells);
  }
  const init = () => ({ kind:'c4', g:Array(42).fill(0), turn:'me', last:-1, n:0, win:null, result:null });
  const top = (g, c) => { for (let r = H - 1; r >= 0; r--) if (!g[r*W + c]) return r; return -1; };
  function winner(g){ for (const l of LINES){ const v = g[l[0]]; if (v && v === g[l[1]] && v === g[l[2]] && v === g[l[3]]) return { v, cells:l }; } return null; }
  function drop(st, col){
    const r = top(st.g, col); if (r < 0) return null;
    const g = st.g.slice(); g[r*W + col] = st.turn === 'me' ? 1 : 2;
    const n = Object.assign({}, st, { g, last:r*W + col, n:st.n + 1, turn: st.turn === 'me' ? 'ai' : 'me' });
    const w = winner(g);
    if (w){ n.win = w.cells; n.result = w.v === 1 ? 'me' : 'ai'; } else if (g.every(Boolean)) n.result = 'draw';
    return n;
  }
  function score(g, v){
    const o = 3 - v; let s = 0;
    for (let r = 0; r < H; r++){ if (g[r*W + 3] === v) s += 3; else if (g[r*W + 3] === o) s -= 3; }
    for (const l of LINES){
      let a = 0, b = 0; for (const i of l){ if (g[i] === v) a++; else if (g[i] === o) b++; }
      if (a && b) continue;
      if (a === 3) s += 5; else if (a === 2) s += 2;
      if (b === 3) s -= 6; else if (b === 2) s -= 2;
    }
    return s;
  }
  function negamax(g, v, depth, alpha, beta){
    if (winner(g)) return -100000 - depth;   // ganó el que acaba de jugar
    if (g.every(Boolean)) return 0;
    if (!depth) return score(g, v);
    let best = -Infinity;
    for (const c of ORDER){
      const r = top(g, c); if (r < 0) continue;
      g[r*W + c] = v; const s = -negamax(g, 3 - v, depth - 1, -beta, -alpha); g[r*W + c] = 0;
      if (s > best) best = s; if (s > alpha) alpha = s; if (alpha >= beta) break;
    }
    return best;
  }
  function best(st, elo){
    const depth = elo < 1000 ? 3 : elo < 1200 ? 5 : 6, noise = elo < 1000 ? 8 : elo < 1200 ? 3 : 1;
    let bc = 3, bv = -Infinity;
    for (const c of ORDER){
      const r = top(st.g, c); if (r < 0) continue;
      const g = st.g.slice(); g[r*W + c] = 2;
      const v = -negamax(g, 1, depth - 1, -Infinity, Infinity) + Math.random()*noise;
      if (v > bv){ bv = v; bc = c; }
    }
    return bc;
  }
  return { W, H, init, top, drop, best };
})();

/* ---------- damas (reglas clásicas: captura obligatoria, la dama mueve de a una casilla) ---------- */
const DM = (() => {
  const on = (r, f) => r >= 0 && r < 8 && f >= 0 && f < 8;
  const own = (p, s) => !!p && (s === 'me' ? (p === 'm' || p === 'M') : (p === 'a' || p === 'A'));
  const king = p => p === 'M' || p === 'A';
  const other = s => s === 'me' ? 'ai' : 'me';
  const dirs = p => king(p) ? [[-1,-1],[-1,1],[1,-1],[1,1]] : p === 'm' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
  function init(){
    const b = Array(64).fill('');
    for (let i = 0; i < 64; i++){ const r = i >> 3, f = i & 7; if ((r + f) % 2){ if (r < 3) b[i] = 'a'; else if (r > 4) b[i] = 'm'; } }
    return { kind:'damas', b, turn:'me', last:null, n:0, quiet:0, result:null, reason:'' };
  }
  function moves(b, s){
    const caps = [], simple = [], lastRow = s === 'me' ? 0 : 7;
    for (let i = 0; i < 64; i++){
      const p = b[i]; if (!own(p, s)) continue;
      const dfs = (pos, path, taken) => {
        let ext = false;

          if (!on(lr, lf)) continue;
          const mid = (pr + dr)*8 + pf + df, land = lr*8 + lf;
          if (!b[mid] || own(b[mid], s) || taken.includes(mid) || (b[land] && land !== i)) continue;
          ext = true;
          if (!king(p) && lr === lastRow) caps.push({ f:i, t:land, path:path.concat(land), caps:taken.concat(mid) });
          else dfs(land, path.concat(land), taken.concat(mid));
        }
        if (!ext && taken.length) caps.push({ f:i, t:pos, path, caps:taken });
      };
      dfs(i, [], []);
      const r = i >> 3, f = i & 7;
      for (const [dr, df] of dirs(p)) if (on(r + dr, f + df) && !b[(r + dr)*8 + f + df]) simple.push({ f:i, t:(r + dr)*8 + f + df, path:[(r + dr)*8 + f + df], caps:[] });
    }
    return caps.length ? caps : simple;
  }
  function applyB(b, m, s){
    const n = b.slice(), p = n[m.f]; n[m.f] = '';
    for (const c of m.caps) n[c] = '';
    n[m.t] = !king(p) && (m.t >> 3) === (s === 'me' ? 0 : 7) ? p.toUpperCase() : p;
    return n;
  }
  function play(st, m){
    const p = st.b[m.f], b = applyB(st.b, m, st.turn), opp = other(st.turn);
    const quiet = m.caps.length || !king(p) ? 0 : st.quiet + 1;
    const n = Object.assign({}, st, { b, turn:opp, last:[m.f, m.t], n:st.n + 1, quiet, result:null, reason:'' });
    if (!moves(b, opp).length){ n.result = st.turn; n.reason = b.some(x => own(x, opp)) ? 'Se quedó sin movimientos' : 'Se quedó sin fichas'; }

    return n;
  }
  function evalB(b, s){
    let v = 0;
    for (let i = 0; i < 64; i++){
      const p = b[i]; if (!p) continue;
      const r = i >> 3, f = i & 7;
      let x = king(p) ? 175 : 100 + (p === 'm' ? (7 - r) : r) * 4;
      if (f === 0 || f === 7) x += 3;
      v += own(p, s) ? x : -x;
    }
    return v;
  }
  function negamax(b, s, depth, alpha, beta){
    const ms = moves(b, s);
    if (!ms.length) return -100000 - depth;
    if (!depth) return evalB(b, s);
    let best = -Infinity;
    for (const m of ms){
      const v = -negamax(applyB(b, m, s), other(s), depth - 1, -beta, -alpha);
      if (v > best) best = v; if (v > alpha) alpha = v; if (alpha >= beta) break;
    }
    return best;
  }

    const depth = elo < 1000 ? 3 : elo < 1200 ? 5 : 6, noise = elo < 1000 ? 40 : elo < 1200 ? 15 : 4;
    const ms = moves(st.b, 'ai'); let top = ms[0], tv = -Infinity;

      const v = -negamax(applyB(st.b, m, 'ai'), 'me', depth - 1, -Infinity, Infinity) + Math.random()*noise;

    }
    return top;
  }
  return { init, moves, play, best, own, king };
})();

/* ---------- generala (5 dados, 3 tiros por turno, 11 casilleros) ---------- */
const GN = (() => {
  const CATS = ['1','2','3','4','5','6','esc','full','poker','gen','dgen'];
  const LBL = { 1:'Al 1', 2:'Al 2', 3:'Al 3', 4:'Al 4', 5:'Al 5', 6:'Al 6', esc:'Escalera', full:'Full', poker:'Póker', gen:'Generala', dgen:'Doble generala' };
  const other = w => w === 'me' ? 'ai' : 'me';
  const who = w => w === 'me' ? 'Vos' : '{R}';
  const counts = d => { const c = Array(7).fill(0); for (const x of d) c[x]++; return c; };
  function score(d, cat, first, card){
    const c = counts(d);
    if (/^[1-6]$/.test(cat)) return c[+cat] * +cat;
    const s = d.slice().sort().join('');
    if (cat === 'esc') return (s === '12345' || s === '23456' || s === '13456') ? (first ? 25 : 20) : 0;
    if (cat === 'full') return (c.includes(3) && c.includes(2)) ? (first ? 35 : 30) : 0;
    if (cat === 'poker') return c.some(x => x >= 4) ? (first ? 45 : 40) : 0;
    if (cat === 'gen') return c.includes(5) ? 50 : 0;
    if (cat === 'dgen') return c.includes(5) && card.gen === 50 ? 100 : 0;
    return 0;
  }
  const init = () => ({ kind:'generala', turn:'me', dice:[1,2,3,4,5], held:[false,false,false,false,false], rolls:0, n:0, card:{ me:{}, ai:{} }, log:['Empezás vos. Tirá los dados.'], result:null, reason:'' });
  const avail = (t, w) => CATS.filter(c => !(c in t.card[w]));
  const total = card => Object.values(card).reduce((a, b) => a + b, 0);
  function roll(t){
    if (t.rolls >= 3 || t.result) return;
    t.dice = t.dice.map((d, i) => t.held[i] ? d : 1 + Math.floor(Math.random()*6));
    t.rolls++; t.n++;
    if (t.rolls === 1 && new Set(t.dice).size === 1){
      t.result = t.turn; t.reason = `¡Generala servida de ${who(t.turn) === 'Vos' ? 'vos' : '{R}'}!`;
      t.log.push(`${t.turn === 'me' ? '¡Sacaste' : '¡{R} sacó'} generala servida! Gana la partida.`);
    }
  }
  function hold(t, i){ if (t.rolls > 0 && t.rolls < 3 && !t.result) t.held[i] = !t.held[i]; }
  function write(t, cat){
    const w = t.turn, s = score(t.dice, cat, t.rolls === 1, t.card[w]);
    t.card[w][cat] = s;
    t.log.push(s ? `${who(w)} ${w === 'me' ? 'anotaste' : 'anotó'} ${s} ${cat.length > 1 ? 'en ' + LBL[cat].toLowerCase() : LBL[cat].toLowerCase()}.` : `${who(w)} ${w === 'me' ? 'tachaste' : 'tachó'} ${LBL[cat].toLowerCase()}.`);
    if (!avail(t, 'me').length && !avail(t, 'ai').length){
      const a = total(t.card.me), b = total(t.card.ai);
      t.result = a > b ? 'me' : b > a ? 'ai' : 'draw'; t.reason = `Generala ${a} a ${b}`;
      return;
    }
    t.turn = other(w); t.rolls = 0; t.held = [false,false,false,false,false];
  }
  function setHolds(t){
    const c = counts(t.dice), av = avail(t, 'ai'), uniq = [...new Set(t.dice)];
    if (av.includes('esc')){
      for (const run of [[2,3,4,5],[1,2,3,4],[3,4,5,6]]) if (run.every(x => uniq.includes(x))){ const used = new Set(); t.held = t.dice.map(x => run.includes(x) && !used.has(x) ? !!used.add(x) : false); return; }
    }
    const pairs = [1,2,3,4,5,6].filter(f => c[f] === 2);
    if (av.includes('full') && pairs.length === 2){ t.held = t.dice.map(x => pairs.includes(x)); return; }
    let bf = 6, bw = -1;
    for (let f = 6; f >= 1; f--){ const w = c[f] + (av.includes(String(f)) ? .5 : 0) + f/100; if (w > bw){ bw = w; bf = f; } }
    t.held = t.dice.map(x => x === bf);
  }
  function aiStep(t){
    if (t.result) return;
    if (t.rolls === 0) return roll(t);
    const av = avail(t, 'ai'), first = t.rolls === 1;
    const opts = av.map(c => ({ c, s:score(t.dice, c, first, t.card.ai) }));
    const special = opts.filter(o => ['esc','full','poker','gen','dgen'].includes(o.c) && o.s > 0).sort((a, b) => b.s - a.s)[0];
    if (special) return write(t, special.c);
    if (t.rolls < 3){ setHolds(t); return roll(t); }
    const num = opts.filter(o => /^[1-6]$/.test(o.c) && o.s > 0).map(o => Object.assign({ v:o.s - 2.5*(+o.c) }, o)).sort((a, b) => b.v - a.v)[0];
    if (num && num.v >= -4) return write(t, num.c);
    const order = ['dgen','1','gen','2','esc','3','full','poker','4','5','6'];
    const zero = opts.filter(o => o.s === 0);
    if (zero.length) return write(t, order.find(c => zero.some(o => o.c === c)));
    return write(t, opts.sort((a, b) => a.s - b.s)[0].c);
  }
  return { CATS, LBL, init, avail, total, score, roll, hold, write, aiStep };
})();

/* ---------- póker Texas Hold'em mano a mano (1.000 fichas cada uno, 15 manos) ---------- */
const PK = (() => {
  const START = 1000, MAXH = 15;
  const other = w => w === 'me' ? 'ai' : 'me';
  const who = w => w === 'me' ? 'Vos' : '{R}';
  const blinds = h => h <= 4 ? [10, 20] : h <= 8 ? [20, 40] : h <= 12 ? [40, 80] : [75, 150];
  const CAT_ES = ['carta alta','par','doble par','trío','escalera','color','full','póker','escalera de color'];
  const FULL = []; for (let r = 2; r <= 14; r++) for (let s = 0; s < 4; s++) FULL.push({ r, s });
  const shuffle = d => { for (let i = d.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; };
  function eval7(cards){
    const cnt = Array(15).fill(0), bys = [[], [], [], []];
    for (const c of cards){ cnt[c.r]++; bys[c.s].push(c.r); }
    const straight = has => { for (let h = 14; h >= 5; h--){ let ok = true; for (let k = 0; k < 5; k++){ const r = h - k === 1 ? 14 : h - k; if (!has[r]){ ok = false; break; } } if (ok) return h; } return 0; };
    const enc = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v*15 + (ks[i] || 0); return { v, cat, hi:ks[0] }; };
    const fs = bys.find(a => a.length >= 5);
    if (fs){ const has = Array(15).fill(false); fs.forEach(r => { has[r] = true; }); const h = straight(has); if (h) return enc(8, [h]); }
    const groups = []; for (let r = 14; r >= 2; r--) if (cnt[r]) groups.push([cnt[r], r]);
    groups.sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const kick = (excl, n) => [...new Set(cards.map(c => c.r))].filter(r => !excl.includes(r)).sort((a, b) => b - a).slice(0, n);
    if (groups[0][0] === 4) return enc(7, [groups[0][1], ...kick([groups[0][1]], 1)]);
    if (groups[0][0] === 3 && groups[1] && groups[1][0] >= 2) return enc(6, [groups[0][1], groups[1][1]]);
    if (fs) return enc(5, fs.slice().sort((a, b) => b - a).slice(0, 5));
    const has = Array(15).fill(false); cards.forEach(c => { has[c.r] = true; });
    const sh = straight(has); if (sh) return enc(4, [sh]);
    if (groups[0][0] === 3) return enc(3, [groups[0][1], ...kick([groups[0][1]], 2)]);
    if (groups[0][0] === 2 && groups[1] && groups[1][0] === 2) return enc(2, [groups[0][1], groups[1][1], ...kick([groups[0][1], groups[1][1]], 1)]);
    if (groups[0][0] === 2) return enc(1, [groups[0][1], ...kick([groups[0][1]], 3)]);
    return enc(0, kick([], 5));
  }
  const handName = e => e.cat === 8 && e.hi === 14 ? 'escalera real' : CAT_ES[e.cat];
  function equity(hole, board, sims){
    const key = c => c.r*4 + c.s, used = new Set(hole.concat(board).map(key));
    const rest = FULL.filter(c => !used.has(key(c))), need = 5 - board.length;
    let win = 0;
    for (let i = 0; i < sims; i++){
      const d = rest.slice();
      for (let k = 0; k < need + 2; k++){ const j = k + Math.floor(Math.random()*(d.length - k)); [d[k], d[j]] = [d[j], d[k]]; }
      const b = board.concat(d.slice(2, 2 + need));
      const a = eval7(hole.concat(b)).v, o = eval7(d.slice(0, 2).concat(b)).v;
      win += a > o ? 1 : a === o ? .5 : 0;
    }
    return win / sims;
  }
  function post(t, w, amt){ const a = Math.min(amt, t.stacks[w]); t.stacks[w] -= a; t.h.bets[w] += a; }
  const toCall = (t, w) => Math.max(0, t.h.bets[other(w)] - t.h.bets[w]);
  const maxTo = (t, w) => Math.min(t.h.bets[w] + t.stacks[w], t.h.bets[other(w)] + t.stacks[other(w)]);
  const minTo = (t, w) => Math.min(maxTo(t, w), t.h.bets[other(w)] + t.h.lastRaise);
  const canRaise = (t, w) => t.h.raises < 4 && maxTo(t, w) > t.h.bets[other(w)];
  const potTotal = t => t.h.pot + t.h.bets.me + t.h.bets.ai;
  function settle(t){
    const h = t.h;
    for (const w of ['me', 'ai']){ const o = other(w); if (h.bets[w] < h.bets[o] && t.stacks[w] === 0){ t.stacks[o] += h.bets[o] - h.bets[w]; h.bets[o] = h.bets[w]; } }
  }
  function newHand(t){
    t.hand++; t.button = other(t.button);
    const [sb, bb] = blinds(t.hand), d = shuffle(FULL.slice());
    t.h = { deck:d, hole:{ me:[d.pop(), d.pop()], ai:[d.pop(), d.pop()] }, board:[], street:0, pot:0, bets:{ me:0, ai:0 }, acted:{ me:false, ai:false }, raises:0, lastRaise:bb, bb, toAct:t.button, over:false, show:false, winner:null, names:null };
    t.bubble = null;
    post(t, t.button, sb); post(t, other(t.button), bb);
    t.log.push(`Mano ${t.hand} de ${MAXH}: ciegas ${sb}/${bb}.`);
    settle(t);
    if ((t.stacks.me === 0 || t.stacks.ai === 0) && t.h.bets.me === t.h.bets.ai) runout(t);
  }
  function init(){ const t = { kind:'poker', stacks:{ me:START, ai:START }, hand:0, button:'ai', max:MAXH, log:[], result:null, reason:'' }; newHand(t); return t; }
  function award(t, w, why){
    const h = t.h, pot = potTotal(t);
    h.pot = 0; h.bets = { me:0, ai:0 }; h.over = true; h.winner = w;
    if (w === 'split'){ const half = Math.floor(pot / 2); t.stacks.me += half; t.stacks.ai += pot - half; t.log.push(`${why} Se reparte el pozo de ${pot}.`); }
    else { t.stacks[w] += pot; t.log.push(`${why} ${w === 'me' ? 'Ganás' : '{R} gana'} ${pot} fichas.`); }
    if (t.stacks.me === 0 || t.stacks.ai === 0){ t.result = t.stacks.me ? 'me' : 'ai'; t.reason = `${t.stacks.me ? 'Te quedaste con todas las fichas' : '{R} se quedó con todas las fichas'}`; }
    else if (t.hand >= MAXH){ const a = t.stacks.me, b = t.stacks.ai; t.result = a > b ? 'me' : b > a ? 'ai' : 'draw'; t.reason = `Póker: terminaste con ${a} fichas contra ${b}`; }
  }
  function showdown(t){
    const h = t.h; h.show = true;
    const a = eval7(h.hole.me.concat(h.board)), b = eval7(h.hole.ai.concat(h.board));
    h.names = { me:handName(a), ai:handName(b) };
    award(t, a.v > b.v ? 'me' : b.v > a.v ? 'ai' : 'split', `Vos: ${h.names.me}. {R}: ${h.names.ai}.`);
  }
  function runout(t){ const h = t.h; while (h.board.length < 5) h.board.push(h.deck.pop()); h.pot += h.bets.me + h.bets.ai; h.bets = { me:0, ai:0 }; h.street = 3; showdown(t); }
  function nextStreet(t){
    const h = t.h;
    h.pot += h.bets.me + h.bets.ai; h.bets = { me:0, ai:0 }; h.acted = { me:false, ai:false }; h.raises = 0; h.lastRaise = h.bb;
    if (h.street === 3) return showdown(t);
    if (t.stacks.me === 0 || t.stacks.ai === 0) return runout(t);
    h.street++; for (let i = 0; i < (h.street === 1 ? 3 : 1); i++) h.board.push(h.deck.pop());
    h.toAct = other(t.button);
  }
  function act(t, w, type, to){
    const h = t.h, o = other(w);
    if (h.over || h.toAct !== w) return;
    if (type === 'fold'){ t.bubble = { who:w, text:'Me retiro' }; return award(t, o, `${who(w)} ${w === 'me' ? 'te retiraste' : 'se retiró'}.`); }
    if (type === 'raise' && canRaise(t, w)){
      const target = Math.max(minTo(t, w), Math.min(Math.round(to), maxTo(t, w)));
      h.lastRaise = Math.max(h.lastRaise, target - h.bets[o]);
      post(t, w, target - h.bets[w]); h.raises++; h.acted[w] = true; h.acted[o] = false;
      const allin = t.stacks[w] === 0;
      t.bubble = { who:w, text: allin ? '¡All-in!' : `Subo a ${target}` };
      t.log.push(`${who(w)} ${w === 'me' ? 'subiste' : 'subió'} a ${target}${allin ? ' (all-in)' : ''}.`);
    } else {
      const c = toCall(t, w);
      if (c){ post(t, w, c); t.bubble = { who:w, text:'Igualo' }; t.log.push(`${who(w)} ${w === 'me' ? 'igualaste' : 'igualó'}.`); }
      else { t.bubble = { who:w, text:'Paso' }; t.log.push(`${who(w)} ${w === 'me' ? 'pasaste' : 'pasó'}.`); }
      h.acted[w] = true;
    }
    settle(t);
    const even = h.bets.me === h.bets.ai, allIn = t.stacks.me === 0 || t.stacks.ai === 0;
    if (even && ((h.acted.me && h.acted.ai) || (allIn && h.acted[w]))) return nextStreet(t);
    h.toAct = o;
  }
  const needs = t => (t.result || t.h.over) ? null : t.h.toAct;
  function aiStep(t, elo){
    const h = t.h, w = 'ai', c = toCall(t, w), pot = potTotal(t);
    const eq = equity(h.hole.ai, h.board, 260) + (Math.random() - .5) * (elo < 1000 ? .16 : elo < 1200 ? .1 : .05);
    const odds = c / (pot + c || 1);
    if (canRaise(t, w) && (eq > .8 || (eq > .63 && Math.random() < .35) || (h.street > 0 && Math.random() < .06)))
      return act(t, w, 'raise', h.bets.me + Math.round((eq > .85 ? 1 : .55) * (pot + c)));
    if (!c) return act(t, w, 'check');
    if (eq >= odds + .04 || Math.random() < .05) return act(t, w, 'call');
    return act(t, w, 'fold');
  }
  return { init, newHand, act, aiStep, needs, toCall, maxTo, minTo, canRaise, potTotal, blinds, eval7, handName, equity, MAXH };
})();
